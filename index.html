の小林部長には話通 ってるの。\nM：はい、ご相談しました。お礼の電話もしました。京都支店から借りていた分\nは、来週出来上がるので、工場から送ってもらうようにしています。\nF：そう、じゃあ大丈夫そうね。次からは気をつけてね。\nM：はい、すみませんでした。"}, {"k": "2-4", "sec": 2, "q": 4, "f": "audio/B2022G/2-4.mp3", "s": "1.お腹が空いたときに食べる\n2.決まった時間に 3食食べる\n3.手軽で冷たい物を食べる\n4.喉の通りがよい物を食べる\nテレビで医者が話しています。\n夏の熱い時の食事で大切なことは何だと言っていますか？\n毎日こう暑い日が続くと、食欲も 衰 えてしまいますね。\nお腹が空いたら食べるようでは 体 が食事を受け付けるリズムが掴めないの\nで、決まった時間に朝昼晩、毎日食べること。\n私 はこのことが熱い夏を健康に過ごすためには大切なことだと思います。\n暑いときは手軽で冷たいものや、喉の通りがいいものを好んで食べがちですが、\nそのようなものばかり食べていると、胃腸の 働 きが弱まってしまいますよ。"}, {"k": "2-5", "sec": 2, "q": 5, "f": "audio/B2022G/2-5.mp3", "s": "1.さくら駅に取りに行く\n2.森川駅に電話をかける\n3.警察署に問い合わせる\n4.西山駅で宅配便の手続きをする\n電話で、駅の係りの人と 女 の人が話しています。\n女 の人は落し物を受け取るために、どうしますか？\nM：はい、さくら駅、落し物センタ一です。\nF：すいません、昨日大学から帰 る時 に、定期券を森川駅 で落 としてしまった\nみたいなんですけど、落し物センターのあるそちらの桜駅に連絡してほしいっ\nて言われまして、問い合わせ番号は 1904 です。\nM：わかりました。咋日、17日の金曜日ですね。お調べしますので、少々 お待\nちください。はい、確かに、こちらに届 いております。定期券は貴重品 ですの\nで、こちらでは一時的にお預かりするだけで、明日には警察署に落とし物とし\nて届けることになってるんですが、本日お越しになれますか？\nF：え？今日はちょっと。うちから遠いんですよね。あの、ちなみに宅配便で送\nってもらうことも可能だと 伺 ったのですが。最寄り駅は西山駅ですが、宅配便\nの手続きできますか？\nM：はい、可能です。料金は千円程度、お日にちは二日ほどかかりますが。\nF：そうですが、二日もかかるのは困るので。何とか今日中にそちらに 伺 いま\nす。\nM：承知いたしました。"}, {"k": "2-6", "sec": 2, "q": 6, "f": "audio/B2022G/2-6.mp3", "s": "1.防災グッズに関心を持つこと\n2.防災グッズを買いそろえること\n3.防災グッズを使ってみること\n4.防災グッズを定期的に見直すこと\n防災教室で講師が話しています。\n講師は防災グッズに関して一番大切なことは何だと言っていますか？\n年々、人々の防災意識は高まっていると思います。非常食や簡易トイレなど、\n防災グッズにも関心を持つ方が増えているようです。\nそれはとてもいいことですが、防災グッズを買い揃えることが防災だと 考 える\n人が多く、普段の暮らしの中で実際に防災グッズを使ってみようと 考 える人\nは意外に少ないですね。\nでも、防災で一番大切なことは、実はこれで、防災グッズを定期的に見直すこ\nとは皆さん 頭 にあるんですが、災害の際にちゃんと使うことができて、初めて\n意味があることを忘れずにいってもらいたいです。"}, {"k": "3-1", "sec": 3, "q": 1, "f": "audio/B2022G/3-1.mp3", "s": "女の人と 男 の人が子供向けの絵本について話しています。\nF：子供の絵本も電子書籍がたくさん出てるけど、うちはあまり使ってないんだ\nよね。目に悪いかなって思って。吉田さんのうちはどう？\nM：うちは子供のお気に入りの本は紙と電子書籍の両方買ってるよ。病院 や\nレストランで待 ってる時間 とか、長 い移動 の時 は、電子書籍 が必需品 だな。\n何冊でも持っていけるし、紙の本だと重くなるから。あ、でも、家では紙だよ。\nだから全体的に見たら、紙の本を見てる時間のほうが長いんじゃないかな。\nF：うん、そうなんだ。\n男 の人は何について話していますか。\n1.電子書籍が目に与える影響\n2.電子書籍より紙の本のほうがいい理由\n3.子供が好きな電子書籍の特徴\n4.電子書籍と紙の本の使い分け"}, {"k": "3-2", "sec": 3, "q": 2, "f": "audio/B2022G/3-2.mp3", "s": "市民講座でポランティア団体の 男 の人が話しています。\n私 はここ、故郷の南 島 で十年前から海岸の清掃ボランティアを 行 っています。\n海岸にはいろんなゴミが落ちています。べットボトルやビニール 袋 などです。\n私 は、こういうゴミは島の外から流れてきて、ここに打ち上げられているとずっ\nと思っていたのですが、実は島の川から海に流れてきたものがほとんどなんで\nす。\n道端に捨てられたものとか、風で飛んでしまったものが川に落ちて、そして海に。\n多くは地元からっていうのはショックでしたし、皆さんに知ってもらいたいと思い\nます。\n海岸のゴミについて 男 の人が伝いたいことは何ですか？\n1.地元から出たものが多いこと\n2.量 が年々増えていること\n3.ポランティアが掃除していること\n4.種類ごとに分ける作業が大変であること"}, {"k": "3-3", "sec": 3, "q": 3, "f": "audio/B2022G/3-3.mp3", "s": "シンポジウムで専門家が話しています。\nすっかり子供の生活の一部に定着 したコンピュータゲームですが、暴力的な\n内容のものもあり、親としては心配になりますよね。\n確かにそういったゲームへの批判は新聞やテレビなどメディアでも取り上げら\nれますし、対策 を取 ろうという声 もありますが、暴力的 なシーンと子供 の\n攻撃性については、 必 ずしも関連性かあるとは限らないという研究結果も見\nられます。\n長時間一人 でゲームばかりしているのは問題 だと思 いますが、ゲームには\n友達と情報交換をしたり、遊び方 を教え合ったりと、人間関係 やコミュニケー\nション能力を育てる面もあると 考 えられています。\n専門家が伝えたいことは何ですか？\n1.暴力的なゲームを減らすための取り組み\n2.ゲームにはよい側面もあるということ\n3.ゲームをする子供が抱える問題点\n4.子供がゲームに夢中になる理由"}, {"k": "3-4", "sec": 3, "q": 4, "f": "audio/B2022G/3-4.mp3", "s": "ラジオでコックが話しています。\n私 はレストランで 働 きながら、出張料理サーピスにも登録して 働 いています。\n個人 のお客様 から指名 を受 けて、お客様 の家 のキッチンでご希望 に合 わせ\nた料理を作ります。\n店よりお客様との距離が近く、常にお客様から見られていて緊張もしますが、\n刺激的で楽しいです。\nお客様の反応が直にわかるので、レストランだけで 働 いていた頃よりやりが\nいがあります。これからも指名をいただける料理人を目指したいです。\nコックは何について話していますか？\n1.出 張 サービスに登録したきっかけ\n2.出張サービスの料理の店の料理との違い\n3.出張サ一ビスで指名を受ける方法\n4.出張サービスで 働 く魅力"}, {"k": "3-5", "sec": 3, "q": 5, "f": "audio/B2022G/3-5.mp3", "s": "講演会でアナウンサーの 男 の人と専門家が話しています。\nM：人工知能がどんどん発達し、社会に大きく影響すると思われますが、先生\nはどのようにお 考 えですか？\nF：お店 のレジ、ホテルの受付 やスポーツの審判 などはすでに人工知能 を\n活用した機械 がしているものもありますね。今後 、人 に代 わって人工知能 が\n行 う仕事はさらに増えていくでしょう。一方で、人間の仕事を奪うとか人間の\n能力 が下 がるといった不安 の声 を聞 かれますが、 私 が否定的 に 考 えずに\n別の側面を期待しています。\nM：とおっしゃいますと？\nF：例えば、将棋のプロの中には人工知能を利用したコンピュータとの対決を\n通 し、腕 を鍛 え、活躍 が 著 しい人 もいます。将棋 だけではなく、外国語 の\n能力を向上させるプログラムなども今後どんどん開発されるでしょう。能力の\n向上を目指す人はこれらを使わない手はないと思います。\n専門家は人工知能についてどう 考 えていますか？\n1.利点を積極的に活用すべきだ。\n2.人間の仕事を奪う恐れがある。\n3.使いすぎると人の能力が低下する。\n4.開発のスピードをもっと速めるべきだ。"}, {"k": "4-1", "sec": 4, "q": 1, "f": "audio/B2022G/4-1.mp3", "s": "明日、漢字のテストなんだけど、全部は覚え切れてないんだよね。\n1全部覚えたのは、すごいね。\n2 え？一つも覚えてないの？\n3多すぎて覚えるの大変だよね。"}, {"k": "4-2", "sec": 4, "q": 2, "f": "audio/B2022G/4-2.mp3", "s": "森さん、森さん担当の桜川の橋の建設は計画通りにいってないようだね。\n1 それは 順 調 に進んでるってことですね。\n2 はい、雨で工事が遅れまして。\n3 お陰様で、ありがとうございます。"}, {"k": "4-3", "sec": 4, "q": 3, "f": "audio/B2022G/4-3.mp3", "s": "映画館、平日の昼にしては、混んでたね。\n1 そう、いつも込んでるんだね。\n2休日でもないのに、人が多かったね。\n3平日だったら、もっと空いてたかもね。"}, {"k": "4-4", "sec": 4, "q": 4, "f": "audio/B2022G/4-4.mp3", "s": "昨日の休みは、一日だらだらしちゃったよ。\n1一日充実してたんだね。\n2 せっかくの休みなのに、 忙 しかったんだね。\n3 たまには何もしないのもいいんじゃない。"}, {"k": "4-5", "sec": 4, "q": 5, "f": "audio/B2022G/4-5.mp3", "s": "このコース料理、ちょっと物足りなくない？\n1何か追加で注文する？\n2満足したってこと？\n3量 が多くて、食べきれないね。"}, {"k": "4-6", "sec": 4, "q": 6, "f": "audio/B2022G/4-6.mp3", "s": "あ、アパートのエアコン、つけっぱなしで、出てきちゃった。\n1 あ、消してきたんだ。\n2 エアコン、付かなかったの？\n3 え、一度帰って、消してくる？"}, {"k": "4-7", "sec": 4, "q": 7, "f": "audio/B2022G/4-7.mp3", "s": "寒い時の旅行は温泉に限るよね。\n1温泉に行かないの？\n2温泉が一番だよね。\n3温泉は苦手なんだね。"}, {"k": "4-8", "sec": 4, "q": 8, "f": "audio/B2022G/4-8.mp3", "s": "さっきの映画、最後の音楽がすべてを台無しにしてたと思わない？\n1音楽のおかげで、最後まで映画が楽しめたね。\n2最後が、あの音楽じゃ、ちょっとね。\n3最後の音楽だけはよかったよね。"}, {"k": "4-9", "sec": 4, "q": 9, "f": "audio/B2022G/4-9.mp3", "s": "山田 さん、週末 の緑公園 でのイベントですが、雨 だった場合 に備 えて、\n予備日を設定しましょうか？\n1天気のことは 考 えなくていいですか？\n2 あらかじめ決めておくと安心ですね。\n3雨になってから、 考 えればいいんですね。"}, {"k": "4-10", "sec": 4, "q": 10, "f": "audio/B2022G/4-10.mp3", "s": "ここのアルバイトの募集、経験を問わずって書いてあるよ。\n1経験なくていいなら、応募してみようかな？\n2経験がないと、 難 しいんだね。\n3 え、どんな経験が必要？"}, {"k": "4-11", "sec": 4, "q": 11, "f": "audio/B2022G/4-11.mp3", "s": "うちのチームが優勝なんて、できっこないよね。\n1私 達 が勝つはずだって思ってる？\n2優勝できるとは、思わなかったよね。\n3 そんなこと言わないで、頑張ろうよ！"}, {"k": "5-1", "sec": 5, "q": 1, "f": "audio/B2022G/5-1.mp3", "s": "高校で演劇部の生徒二人と先生が話しています。\nM：あのう、先生 、明後日 の公演 の衣装 なんですが、主役 の山田 さんの衣装\nが汚れちゃったんです。\nA：すみません、さっき、ペンキがついちゃって、ここ胸のあたり、少しだけなん\nですが。\nF：茶色のペンキですか。白いドレスだから目立 ちますね。この衣装、主役 が\n最後までずっと着るものですよね。\nA：はい、洗剤で落とせるでしょうか。それか、大きめの花かなんかの飾りを縫\nいつけて、汚れを隠したらどうかと思うんですが。\nF：ああ、そうですね。\nM：この衣装は 諦 めて、去年の劇で使った青いドレスにするのはどうでしょう\nか。\nF：劇 のなかで、衣装 の白 い色 について話 すセリフが何箇所 かありましたよ\nね？今からセリフの変更は、しないほうがいいですねえ。\nM：じゃあ、僕の母、合唱サークルに入ってて、白いドレスも持ってると思うの\nで、聞いてみましょうか。\nA：お母さんのドレス、大事なものなんじゃない？もし汚しちゃったら、申し訳な\nいよ。\nF：そうですよ。やっぱり、ペンキが見えないように、なにか縫い付けるのがい\nいんじゃないですか。洗って、生地がダメになったら、困りますからね。\nA：わかりました、そうします。\n問題を解決するためにどうすることにしましたか？\n1汚れたところを洗剤で洗う 2飾りをつけて汚れを隠す\n3青いドレスに変更する 4 男 の生徒のお母さんのドレスを借りる"}, {"k": "5-2", "sec": 5, "q": 2, "f": "audio/B2022G/5-2.mp3", "s": "団体旅行で旅行会社の人の説明を開いて、男の人と女の人が話しています。\n明日は自由行動です。観光コースも四つご用意していますので、ご希望の方\nはご参加ください。どのコースも半日コースで、一日二回、午前と午後に 行 わ\nれます。\n一番のコースは市内の自然公園のハイキングです。きれいな 湖 の周りをガ\nイドと一緒に歩きます。\n二番のコースは、この街出身の作家の生まれた家や作品に登場する場所を\n自転車で巡ります。\n三番のコースは市内の神社や寺をバスで回り、この地域の歴史に触れるコー\nスです。\n四番のコースは市内 の筆作り工場 に行き、実際 に書道の筆 を作る体験 がで\nきます。\nM：どれも面白そうだね。午前と午後一つずつ選ぼうよ、明日は天気が良さそ\nうだから、外を歩いたり自転車に乗ったりするのにしない？\nF：うん、 湖 のコースはパンフレットに二時間近く歩くって書いてあったよ。ち\nょっと自信ないなあ。作家の家とかを回るほうならいいけど。\nM：じゃあ、午前中はそれにして、午後はどうする？お寺や神社にでも行く？\nF：今読 んでいる歴史小説 、主人公 が書道 の名人 っていう設定 で、筆 とかの\n道具の 話 もよく出てくるんだ。だからすごく興味があって、午後はそれがいい\nなあ。\nM：じゃあ、そうしょう。\n質問 1 明日の午前、二人はどのコースに参加しますか。\n質問 2 明日の午後、二人はどのコースに参加しますか。"}]}, {"id": "B2023G", "name": "2023年7月", "clips": [{"k": "1-1", "sec": 1, "q": 1, "f": "audio/B2023G/1-1.mp3", "s": "1.サークル活動 2.アルバイトの選び方\n3.勉強 の工夫 4.就職 のための準備\n大学で 女 の留学生と先生が話しています。\n女 の留学生は新入生のオリエンテーションで何の 話 を担当しますか。\nF：先生、新入生のオリエンテーションの件で 話 があるって聞きましたが。\nM：あ、ハンさん。そうなんですよ。ハンさん、新入生の時、先輩の留学生がオ\nリエンテーションに何人か来て、自分の体験を話してくれたの覚えてる？\nF：はい、先輩からサークルやアルバイトの 話 を聞いたのを覚えています。\nM：そうですか。で、実はね、優秀な成績だということでハンさんの勉強 の進め\n方やその工夫などについて紹介してほしいんです。アルバイトやサークルで\n忙 しい中でも勉 強 頑張っているみたいだし、新入生にも良い刺激になると思\nうから。\nF：わかりました。私でお役に立てるなら引き受けさせてもらいますが、新入生\nってサークルやアルバイト、それに就職 に興味あるんじゃないかなと思いま\nすけど。\nM：ええ。そのことについては、他の学生が担当してくれることになってるんです。\nF：わかりました。あ、今度、就職 についてご相談したいことがあるんですが、\nよろしいですか？\nM：もちろんです。\n問題一選択肢の設計\n1 已做的 た ている てある もう 済み\n2 要做的(正解) 頼み 命令 てください て てもらえる\n3 之后再做的 あと たら てから 次第\n4 不用做/说话人自己做的 ます型 原型"}, {"k": "1-2", "sec": 1, "q": 2, "f": "audio/B2023G/1-2.mp3", "s": "1.ねぎを収穫する 2.雑草をとる\n3.ほうれんそうの種をまく 4.土を 耕 す\n農家で農家の 女 の人とアルバイトの 男 の人が話しています。\nアルバイトの 男 の人はまずどんな作業をしますか。\nF：中村君、今日からよろしくお願いします。農作業はしたことがありますか？\nM：祖父が庭で野菜を作ってて、土を 耕 したり、種を蒔いたりするのは手伝っ\nたことがあります。\nF：じゃあ、 全 く初めてじゃないんですね。うちはいろんな野菜を栽培してるん\nだけど、今の時期、ネギの収穫をやっているんです。\nM：はい。\nF：ネギの 畑 の雑草を抜く作業やってもらえますか？\n収穫は明日機械でするんだけど、余計な草を抜いとかないと途中で機械に絡\nまっちゃって機械を止めないといけないんです。\nM：そうなんですか。\nF：大変だけど、大事な作業なんでお願いします。これが終わったら 隣 の 畑\nにほうれん草の種を蒔くから 私 と一緒にお願いできます？土を 耕 すのは済\nんでるから。\nM：わかりました。"}, {"k": "1-3", "sec": 1, "q": 3, "f": "audio/B2023G/1-3.mp3", "s": "1.ホームページから申し込む 2.振込み先を確認する\n3.銀行で受講料を支払う 4.クレジットカードを作る\n男 の学生と 女 の学生が話しています。\n男 の学生はこれからまず何をしますか。\nM：ビジネスの立ち上げ方のセミナーの申し込み、もうやった？\nF：うん、ホームページから申し込みしたよ。\nM：そっか。僕も申し込みたいんだけど、受講料の支払いってクレジットカード\nが必要じゃない？まだクレジットカード持ってないから……\nF：ホームページに振り込み先の銀行名と口座番号が書いてあるから振り込\nみでも払えるよ。確認してみて。\nM：え、そうなんだ？知らなかった。もう一度ホームページ見てみる。\nF：支払いが済んだ用紙の写真を添付すれば、ホームページから申し込みで\nきるって書いてあったよ。\nM：ありがとう。でもやっぱりクレジットカードがないと、こんな時、本当不便だ\nね。\nF：そうだね。\nM：今回のセミナーの申し込みにも間に合うかもしれないから、早速カード作ろ\nうかな。\nじ た く とど ２ しゅうかん もう\nF：だけど、クレジットカードは自宅に届くまで2 週間 くらいはかかるかも。申し\n込み、今週いっぱいだよ。\nM：そっか。じゃ、今回は間に合わないし、また今度にしよう。"}, {"k": "1-4", "sec": 1, "q": 4, "f": "audio/B2023G/1-4.mp3", "s": "1.照明器具の位置 2.照明器具のそざい\n3.照明の 光 の強さ 4.照明の明かりの色\n建築設計事務所で 女 の人と課長が照明の設計について話しています。\n女 の人はこれから何を変更しますか。\nF：課長、カフェ北山に提案する照明デザインなんですけど、案を見ていただ\nけましたか？\nM：うん、見たよ。この資料だよね。前回見せてもらった時は天井に大型の\n照明を1つ取り付けるってことだったけど、今回の案では天井から小さめの\n照明をいくつも並べてぶら下げることにしたんだね。\nF：はい。\nM：面白いと思うよ。天井からぶら下げる高さもよく 考 えてあるね。\nＦ しょうめいきぐ そ ざ い せい\nF：ありがとうございます。あの、照明器具の素材はガラス製のものにしたんで\nすが、どうですか？\nM：ガラスも悪くはないと思うけど、店の雰囲気から 考 えると和紙なんかも合\nうね。\nＦ かんが\nF：あ、 考 えていませんでした。そうですね、そうしてみます。\nM： 光 の強さについてはリラックスする空間にふさわしく抑えてあるね。明かり\nの色は白すぎず、 温 かみのある色になっているから案の通りで。\nF：はい、わかりました。"}, {"k": "1-5", "sec": 1, "q": 5, "f": "audio/B2023G/1-5.mp3", "s": "1. 机 といすをならべる 2.パソコンを設置する\n3. 机 に封筒を置く 4.来場者の案内をする\n説明会の会場で課長が部下の社員に話しています。\n部下の社員は今日この後、何をしますか。\nF：皆さん、暑い中、明日の新商品説明会の準備をありがとうございます。\nおかげさまで 机 、いすは準備が 整 い、パソコンやスクリーンの設置は当日行\nいますので、パンフレットが入った封筒を各机に置いて準備は完了となりま\nす。\n今回の説明会は規模がかなり大きいので当日は来場者の案内もよろしくお\n願いします。"}, {"k": "2-1", "sec": 2, "q": 1, "f": "audio/B2023G/2-1.mp3", "s": "1.地域の林業についての講義 2.山での基本作業の体験\n3.人工呼吸の練習 4.木材を使った工作\n男 の学生と 女 の学生が話しています。\n女 の学生が林業のイベントの中で 1 番興味があるのは何ですか。\nM：週末、予定ある？前、林業について興味あるって言ってたけど、 南 町 の\n林業センターで林業について学ぶっていうイベントを見つけたから一緒にどう\nかなあと思って。\nF：うん、行ってみたい。\nM：これ、パンフレット。地域の林業についての講義とか実際に近くの山で木を\n切り倒したり、林業の基本作業も体験できるよ。\nF：実際に木を切ったりする作業ができるってこと？面白そう!あ、人工呼吸の\n練習 もやるんだね。\nM：うん。林業は危険な作業もあるし、安全について学ぶ時間もあるみたいだ\nね。\nF：へぇ、もしもの時に役立つし、知ってて損はないよね。でも 私 はやっぱり\n作業が1番楽しみ。\nM：うん、僕はこの木材を使ってする工作、やってみたいなあ。\nF：吉田くん、物づくり好きだよね。"}, {"k": "2-2", "sec": 2, "q": 2, "f": "audio/B2023G/2-2.mp3", "s": ".\n1.パンの値段を下げる 2.閉店時間を早め\n3.ホームページを作る 4.ちらしに割引券をつける\nパン屋で店長と店員が話しています。\nこの店では客 を増やすためにどうすることにしましたか。\nM：最近、お客 さんの数が減ってきたね。\nF：近くに 新 しい店ができたせいでしょうかね。パンも売れ残るようになりまし\nたしね。\nM：どうにかしないとね。この辺は学生さんが多いからパンの値段を下げたい\nところだけど、原材料の価格が上がってて厳しいんだよね。\nF：そうですか。うーん、開店時間を早めて通勤通学の時間に店を開けるよう\nにするとかは？\nM：そうだね。朝が早いとアルバイトを見つけるのが 難 しいんだよね。\nF：そういえば、このお店ってホームページありませんよね。もっと宣伝に 力 を\n入れたらどうですか？\nM：うん、その方がいいのかな？前に近所の人にチラシを配った時は割引券\nを付けたけど、売り上げが伸びなかったんだけど。\nF：あー、まア、今はおいしいと聞けば、遠くでもお店の情報を検索して買いに\n行く人多いですし、早速やってみましょうよ。\nM：そうだね、やってみよう。"}, {"k": "2-3", "sec": 2, "q": 3, "f": "audio/B2023G/2-3.mp3", "s": ".\n1.ほかの保護者と知り合うことができる\n2.ちいきの役に立つことができる\n3.先生たちのことを知ることができる\n4.学校での子供の様子を見ることができる\n小学生の子供がいる 女 の人と 男 の人が話しています。\n男 の人が学校の手伝いを始めた理由は何ですか。\nF：あ、山本さん。あの、ちょっと 伺 いたいんですけど保護者として小学校のお\n手伝いの活動に参加されてますよね。\nM：ええ。息子が入学した頃、ちょうど仕事以外でも人間関係を広げたいと思\nっていたから他の保護者の皆さんと知り合えないかと思って。\nF：そうなんですね。先週 、桜 町 のお祭りに行ったんですが、お祭りも小学校\nの保護者が手伝ったりしているんですね。\nM：ええ。地域の行事に小学校の保護者も協力 するんですよ。地域に関われ\nるのが一番の魅力だとおっしゃる方もいらっしゃいます。あと、学校の先生方\nのことをよく知ることができていいという方も多いですよ。どうですか？加藤さ\nんも。\nF：ちょっと興味あるんですけど仕事も 忙 しいし……\nM： 短 い時間でできる活動もありますよ。前に、学校での子供の様子をもっと\n知りたいっておっしゃってましたよね。活動に参加するとそういったこともわか\nりますよ。\nF：はい、学校での様子は親として1番気になることだし、 考 えてみようかな。"}, {"k": "2-4", "sec": 2, "q": 4, "f": "audio/B2023G/2-4.mp3", "s": ".\n1.様々な値段から選ぶから\n２ ふる もの ふる かん\n2.古い物でも古さを感じさせないから\n３ おび こ も の く あ たの\n3.帯や小物との組み合わせが楽しめるから\n４ ちゅうもく あつ\n4.注目を集めることができる\n男 の人と 女 の人が着物について話しています。\n女 の人はどうして着物に夢中になったと言っていますか。\nM：着物、似合ってるね。よく着物着てるけど着物って高いんだよね？\nF：そんなことないよ。これ、全部で1万円ぐらい。今はフリーマーケットとかで\n昔 のものが安く買えるの。古い着物って今のと違って個性的な柄も多いし。\nM：へぇ。特に古い着物が好きなの？\nF：う一ん、そういうわけじゃないんだけど、 新 しい着物は学生には高いから\nね。\nM：そう、僕も結構興味あるんだけど、ちょっと 難 しそうで。帯と着物の色の合\nわせ方とか小物との組み合わせも 考 えるんだよね？\nF：うん、最初に着物を買ったお店の人が教えてくれたんだけとど、合わせるも\nので同じ着物とは思えないってくらい印象が変わるんだよ。 私 、そこから\n毎日着たいくらい大好きになっちゃった。\nM：そうなんだ。ねえ、着物ってやっぱり目立っちゃうよね。ジロジ口見られたり\nしない？\nF：それがうれしいって言ってる友達もいるけど、 私 は他の人の目は気になら\nないんだ。"}, {"k": "2-5", "sec": 2, "q": 5, "f": "audio/B2023G/2-5.mp3", "s": ".\n1.ウオーキングコンテストの実施\n2.体操動画の公開\n3.運動用品の支給\n4.食事のアドバイス\n会社の会議で課長が話しています。会社で今年度から始める健康のための\n取り組みは何ですか。今年度から始める取り組みです。\nM：我が社では三年前から社員の健康維持を目的とした取り組みを続けてい\nます。今年度は4つの取り組み。\n1ヶ月に歩いた距離の合計を競う、ウォーキングコンテストの実施、体操動画\nの公開、運動用品の支給、食事のアドバイスを 行 い、皆さんの健康を支えま\nす。\nこのうち、歩行距離を競うことは、昨年末の社員へのアンケート結果を受けて\n新たに採用になりました。食事に運動に、これからも健康第一で頑張りましょ\nう。"}, {"k": "2-6", "sec": 2, "q": 6, "f": "audio/B2023G/2-6.mp3", "s": ".\n1.海の深いところの温度を測ること\n2.海の表面 の温度を測る計測器を開発すること\n3.世界各国の協力 を得ること\n4.非常に多くのデータを分析すること\nシンポジウムで大学の先生が共同研究の 話 をしています。\n先生はこの研究 の中で何が1 番 難 しかったと言っていますか。\nF：気候の変化を正確に予測するためには海の温度を測ることが大切です。\nしかも多くの場所で海の表面 だけでなく、深さ1000メートルとか2000メートル\nのところの温度を測る必要があるのです。\nそのための計測器の開発が非常に 難 しかったんです。そして、さらに困難だ\nったのはいくつもの国から協力 してもらうこと。\nそれが実現して、ようやく世界中のデータを研究 のために使えるようになりま\nした。データは膨大な量 となり、分析には時間もかかりますが、かなり正確な\n予測が 行 われるようになりました。"}, {"k": "3-1", "sec": 3, "q": 1, "f": "audio/B2023G/3-1.mp3", "s": ". 大学で先生が授業の始まる前に学生に話しています。\nF：授業を始める前に聞いてもらいたいことがあります。えー、 私 は環境問題\nの解決に取り組んでいる団体のメンバーとして活動をしています。\n団体では月に1回程度、イベントを行なっているのですが、先週末に予定され\nていたイベントが天候の影響で来週の日曜日に延期になってしまいました。\nそのため、本来お手伝いいただこうと思っていたボランティアの方々の参加が\n難 しくなりました。もしこの中に環境問題のイベント運営に興味のある人がい\nたら授業の後にでもぜひ 私 に声をかけてください。\n先生は何について話していますか。\n1．ボランティア参加の呼びかけ\n2．環境問題を解決する大切さ\n3．イベント運営の 難 しさ\n4．授業内容の変更"}, {"k": "3-2", "sec": 3, "q": 2, "f": "audio/B2023G/3-2.mp3", "s": ". テレビで医者が話しています。\nF：夏になると 体 がだるい、食欲がないといった症状 が出やすくなります。\nこういった症状 は例えば、暑い屋外と冷えた室内を行き来することで体温\n調節 がうまくできなくなったり、また、汗をかくことで 体 の水分が不足気味に\nなったりすることで起こると 考 えられています。\nまた、寝苦しさによる睡眠不足でもそうした症状 が出やすくなります。\n医者は何について話していますか。\n１．夏に 行 うと良い運動\n2．夏の体調不良とその原因\n3．夏の睡眠不足を解消する方法\n4．夏を健康に過ごすための食事"}, {"k": "3-3", "sec": 3, "q": 3, "f": "audio/B2023G/3-3.mp3", "s": ".テレビで小学生の 女 の子と今宇宙にいる宇宙飛行士が話しています。\nF：こんにちは。今井はな、5年生です。\nM：こんにちは。宇宙飛行士の本田です。\nF：えっと、質問があります。宇宙は重力 がないと聞いたことかがありますが、\nどんな感じですか？\nM：はい、宇宙には重力 がありません。ですから 私 は今、無重力の中にいま\nす。 体 が床から浮きます。背骨の骨と骨がつながっているところが少し伸び\nて、1cmくらい背が伸びるんですよ。\nF：わー。 私 も宇宙飛行士になって、そういう体験してみたいです。\nM：ええ、ぜひなってください。それから、顔が丸くなるんですよ。地球では\n重力 で下に引っ張られて、下半身に行っていた血液などが上半身に行きや\nすくなるので。他には足の裏の皮が柔らかくなります。これは地面に足をつけ\nて歩かないからですね。\nF：へぇ、そうなんですね。\n宇宙飛行士は、何について話していますか。\n1．無重力の仕組み\n2．宇宙で 行 う実験\n3．宇宙飛行士の生活\n4．宇宙での 体 の変化"}, {"k": "3-4", "sec": 3, "q": 4, "f": "audio/B2023G/3-4.mp3", "s": ".高校の卒業生が集まる会で校長が話しています。\nM：本学園は再来年、創立100周年 を迎えるにあたり、社会の変化に対応した\n教育が 行 える新校舎の建設を予定しております。\n代々の卒業生の皆様には日頃からご支援いただいておりますが、学園の\n未来に対し、 改 めてご寄付という 形 でご協力 いただければ 幸 いです。\nご協力 いただけた方には 新 しい校舎1階の壁にお名前を入れさせていただ\nきます。ぜひ完成を皆様とお祝いできればと思います。\n校長の言いたいことは何ですか。\n1．社会と教育の変化\n2． 新 しい校舎のイメージ\n3．卒業生の活躍\n4．新校舎のための寄付の依頼"}, {"k": "3-5", "sec": 3, "q": 5, "f": "audio/B2023G/3-5.mp3", "s": ".市民向けのセミナーで鳥の専門家が話しています。\nM： 私 たちに身近な鳥、カラスですが、ゴミを荒らしたり、鳴き声がうるさいな\nど迷惑な存在で生き物としてはあまり関心を持てないかもしれませんね。\nそのカラスですが、カラスの仲間は世界に約40種類、そのうち主に2種が年間\nを通して日本各地で見られます。\nカラスの鳴き声を観察したところ、十数種類の鳴き方があり、鳴き合うことで\n同じ群れの仲間か確かめたり、相手との距離や飛んでいる方向を確認したり\nしてコミュニケーションを取っていることがわかりました。\nまた、連続して鳴く場合は食料 の場所を仲間に知らせていることが明らかに\nなりました。鳴き声を上手に使っているんですね。\n鳥の専門家はカラスの何について話していますか。\n1．種類によって鳴き方が違うこと\n2．鳴き声による被害と対策\n3．鳴き声を出す仕組み\n4．鳴き声に意味があること"}, {"k": "4-1", "sec": 4, "q": 1, "f": "audio/B2023G/4-1.mp3", "s": "このお皿、色はともかく、使いやすいんだよね。\n1．このお皿、完璧ってわけだね。\n2．そう、色も悪くないと思うけどね。\n3．君が好きな色だよね。"}, {"k": "4-2", "sec": 4, "q": 2, "f": "audio/B2023G/4-2.mp3", "s": "ジュンさん、ジュンさんの企画、予算の面で部長にひどく反対されたけど、\n諦 めることはないよ。\n1． 諦 めるしかないんですか。\n2．はい、もう一度見直してみます。\n3．直しても無駄だとおっしゃるんですか？"}, {"k": "4-3", "sec": 4, "q": 3, "f": "audio/B2023G/4-3.mp3", "s": "一人暮らしを始めてから野菜が不足しがちなんだよね。\n1．野菜を摂りたくないんだね。\n2．野菜十分足りてていいね。\n3．気をつけて野菜も食べないとね。"}, {"k": "4-4", "sec": 4, "q": 4, "f": "audio/B2023G/4-4.mp3", "s": "昨日テレビで歌手の小林ゆうとを見たけど、忘れられつつあるよね。\n1．ずっと人気あるよね。\n2．確かにあの人、よくテレビで見るね。\n3．ああ、そんな人いたね。"}, {"k": "4-5", "sec": 4, "q": 5, "f": "audio/B2023G/4-5.mp3", "s": "仕事、簡単に辞めるべきじゃなかったんじゃない？\n1．ちょっと後悔してるんだ。\n2．もっと早く辞めるべきだったってこと？\n3．辞めてよかったよね。"}, {"k": "4-6", "sec": 4, "q": 6, "f": "audio/B2023G/4-6.mp3", "s": "この 間 の花見、あいにくのお天気でしたね。\n1．お天気、よくなくて残念でしたね。\n2．よく晴れて気持ちよかったですね。\n3．期待通りの天気でしたね。"}, {"k": "4-7", "sec": 4, "q": 7, "f": "audio/B2023G/4-7.mp3", "s": "僕が勤めている会社、上司に意見を言いやすかったらいいのに。\n1．上司にいろんなことが話せていいね。\n2．上司に思ったことが言えない環境 なの？\n3．上司が意見をよく聞いてくれるんだ。"}, {"k": "4-8", "sec": 4, "q": 8, "f": "audio/B2023G/4-8.mp3", "s": "山田課長。佐藤さん転んで骨折したけど、入院 せずに済むそうです。\n1．入院 しなくていいですね。\n2．入院 するんですか、大変ですね。\n3．入院 するかどうかわからないんですね。"}, {"k": "4-9", "sec": 4, "q": 9, "f": "audio/B2023G/4-9.mp3", "s": "体 に悪いと知りつつ、夜中にお菓子食べるのをやめられないんだ。\n1． 体 に悪いって知らなかったの？\n2．わかっていてもやめられないことってあるよ。\n3．健康に良くないから我慢しているんだね。"}, {"k": "4-10", "sec": 4, "q": 10, "f": "audio/B2023G/4-10.mp3", "s": "昨日のイベント、予想に反してたくさんの人が来たね。\n1．もっとたくさん来ると思ってましたよね。\n2． 私 たちの予想通りでしたね。\n3．思っていたより多かったですね。"}, {"k": "4-11", "sec": 4, "q": 11, "f": "audio/B2023G/4-11.mp3", "s": "この子供用のなぞなぞの本やってみたんだけど、半分も解ければいい方だよ。\n1.大人でもそんなに 難 しいの？\n2.子どもにとっても易しいの？\n3.大人なら簡単に解けるの？"}, {"k": "5-1", "sec": 5, "q": 1, "f": "audio/B2023G/5-1.mp3", "s": "博物館で職員3人が小学生向けの科学教室の企画について話しています。\nA：次の子供科学教室、空気中で音が伝わる仕組みっていうテーマだったよ\nね？なかなかいい企画だけど、今のままだと時間をオーバーしそうだから\n内容を削りたいんだ。\nF：今の案では、前半で仕組みを説明して、後半で身近なもので楽器を作るっ\nていう工作をする構成になってますよね？ストローを使った笛と空き缶を使っ\nた太鼓。内容を削るなら工作を2つじゃなくて1つにしましょうか。\nM：え？何度も試作したんですよ？工作は両方残しましょうよ。\nF：じゃあ、前半の説明を 短 くするのはどうですか？\nM：説明のところ、もう十 分 短 くしてありますよね？\nA：そうだね。そこはこれ以上カットするとただの工作教室になっちゃうから\n企画とは合わないよね。\nM：工作は2つ紹介して、どちらかやりたいほうを子供が選んで作れるようにし\nたらどうですか？\nA：なるほどね。どっちにするか迷って時間がかからないように進行の仕方を\n検討する必要がありそうだけど…\nM：他にはストローとか空き缶とか、工作の材料をこちらで事前に切っておい\nて準備の時間を短縮するという手もありますが……\nF：それでそんなに時間が変わるでしょうか？\nA：そうだね。それに準備するところから子供たちに体験してもらいたいから。\nそうすると子供に選んでもらうさっきの案にしよう。\n3人は内容をどう変更することにしましたか。\n1．紹介する工作を 1 つにする 2．前半の説明を 短 くする\n3．作らせる工作を 1 つにする 4．工作の材料を切っておく"}, {"k": "5-2", "sec": 5, "q": 2, "f": "audio/B2023G/5-2.mp3", "s": "ラジオを聞いて女の学生と男の学生が話しています。\n来週から1週間 、山川市で桜映画祭が 行 われます。鑑賞の仕方が少し 珍 し\nい映画を4つご紹介します。\nまずは、アニメ映画の「白い雲」。映画を観ながら歌ったり手を叩いたりしても\nいいことになっているので賑やかに楽しめます。\nそれからミステリー映画の「 緑 の列車」。こちらはオーケストラが映像に合わ\nせて生で音楽を演奏します。\n恋愛映画「美 しい1日」の会場は、今回の映画祭唯一の屋外の会場です。\n山川公園に臨時でスクリーンが設置されます。今はいい季節だから気持ちが\nいいでしょうね。\n最後にミュージカル映画「旅の空」。会場のレストランで食事を楽しみながら\n鑑賞できます。\nF：今言ってた映画祭、2人用のチケットが2枚あるんだけど、一緒に見に行か\nない？2つ見られるから1つずつ選ぼう。\nM：え？いいの？うーん、僕、前に映画の音楽に合わせてみんなで歌ってもい\nいっていう映画を観に行ったことがあるんだけど、一体感があって楽しかった\nよ。\nF：へぇ、日本では静かに観ましょうっていう映画館のほうが多いけどね。\nM：うん。あの雰囲気をまた味わいたいな。\nF：いいね。1つはそれにしよう。 私 は、うーん、おいしい食事を楽しみながらっ\nていうのも魅力的だけど、開放感がある外で見てみたいな。\nM：じゃ、そうしよう。\n質問1． 男 の学生はどの映画を選びましたか。\n1.『白い雲』 2.『 緑 の列車』 3.『美 しい一日』 4.『旅の空』\n質問2． 女 の学生はどの映画を選びましたか。\n1.『白い雲』 2.『緑の列車』 3.『美しい一日』 4.『旅の空』"}]}];window.DATA=window.DATA||{};DATA.tts={"ちりょう": "tts/91d3a81dd0.mp3", "歯医者に行って虫歯の治療を受けた。": "tts/bed4d597ee.mp3", "きそって": "tts/be569b82c7.mp3", "私たちはテストのたびに学年でトップを競っていた。": "tts/63428257ae.mp3", "ひひょう": "tts/48f5c0b6a3.mp3", "今月の雑誌に新しい映画の批評が掲載された。": "tts/0e3198f4e3.mp3", "おさめた": "tts/656b06c6c0.mp3", "期日までに入学金を納めた。": "tts/200ddaf0d3.mp3", "おとる": "tts/e91b46794b.mp3", "A社の製品は他社のものより品質が劣る。": "tts/6976480b27.mp3", "おさない": "tts/bbeaa64ba7.mp3", "青木さんってちょっと幼いところがあるよね。": "tts/aa64928137.mp3", "にぎって": "tts/237c9292cb.mp3", "しっかり握ってください。": "tts/df7c9d928e.mp3", "みっぺい": "tts/17a93e9915.mp3", "空気が入らないようにちゃんと密閉してください。": "tts/1b7242641d.mp3", "しぼった": "tts/7bb0053fcd.mp3", "かなりの時間をかけてテーマを絞った。": "tts/7cba6ba959.mp3", "すいちょく": "tts/3726765e31.mp3", "この線に対して垂直な線を引いてください。": "tts/96aba52b1d.mp3", "みだれて": "tts/50c27c3317.mp3", "きれいに整えた髪が乱れてしまった。": "tts/4cd4df5b13.mp3", "じゅうなん": "tts/65419f623d.mp3", "係員は柔軟に対応してくれた。": "tts/f8f7452e33.mp3", "つよび": "tts/76fd6e43ed.mp3", "表面を強火で焼いてください。": "tts/3e2fee06c5.mp3", "かかえる": "tts/b45a7d2542.mp3", "それを一人で抱えるのは大変そうだ。": "tts/1056ebb371.mp3", "きゅうじん": "tts/577aefff0b.mp3", "アルバイトの求人があったので、応募した。": "tts/639fbaaef0.mp3", "こわい": "tts/f383b67502.mp3", "私は少し怖いと思いました。": "tts/b24ad4e72a.mp3", "れいぞうこ": "tts/be165a8b4b.mp3", "この食品は冷蔵庫で保存してください。": "tts/66fbd22f6b.mp3", "そうがく": "tts/93cf12a0fd.mp3", "今年の支出は総額で約5300万円だった。": "tts/edcf769082.mp3", "しめって": "tts/1b4eef2246.mp3", "まだ湿っているから、もう少し待ちましょう。": "tts/7d01390db4.mp3", "ちゅうせん": "tts/16bbb3e502.mp3", "応募者には抽選でプレゼントが当たります。": "tts/71b3da73aa.mp3", "はなれて": "tts/a4651c82dd.mp3", "二人は離れて座った。": "tts/a2cfcc15e9.mp3", "きかく": "tts/85bac8c480.mp3", "何か良い企画はありますか。": "tts/d03fe742e6.mp3", "さいど": "tts/133a3f9b43.mp3", "再度確認をお願いします。": "tts/35fbbe692c.mp3", "なごやか": "tts/f9f31e87f3.mp3", "とても和やかなパーティーだった。": "tts/cbbe24e2c7.mp3", "しょり": "tts/482c1c68fb.mp3", "コンピュータでデータを処理した。": "tts/924f26d2b8.mp3", "にくんで": "tts/5b398415ad.mp3", "誰も憎んでなんていませんから、心配しないでください。": "tts/d4de087670.mp3", "ぐうぜん": "tts/8958357e1f.mp3", "偶然、駅で友達に会った。": "tts/e4804d4971.mp3", "しげき": "tts/bd7d1e4ddb.mp3", "大学のゼミではいろいろな刺激を受けた。": "tts/2fb1549965.mp3", "はじ": "tts/be74394a64.mp3", "失敗して恥をかいたが、先輩の優しい一言に慰められた。": "tts/69472fe920.mp3", "あっとうてき": "tts/0013fc382f.mp3", "彼の強さは圧倒的だ。": "tts/33fe52b740.mp3", "かんりかにおく": "tts/a74faf7738.mp3", "この土地は、国の管理下に置かれている。": "tts/fac709eb1f.mp3", "あんいな": "tts/b9bb9b94a3.mp3", "確認もしないで安易に信じてしまった。": "tts/917a61f575.mp3", "のんびり": "tts/94b4760cd9.mp3", "週末は家で本を読んでのんびり過ごした。": "tts/286cbf59f3.mp3", "ひきょうな": "tts/149bc4f952.mp3", "高橋さんは、そんな卑怯なやり方はしませんよ。": "tts/fbcece6a06.mp3", "しょうじる": "tts/1a719e32b7.mp3", "海外の生活では、習慣の違いから誤解が生じることがある。": "tts/88453cda5e.mp3", "ぜん ": "tts/36c6a7fee4.mp3", "今の社長は前社長より15歳も若い。": "tts/012c00cedb.mp3", "まうしろ": "tts/de3aa29774.mp3", "真後ろからでは顔が見えない。": "tts/993ac942bf.mp3", "おだやかな": "tts/ecf4e5d6ad.mp3", "穏やかな天気が続いている。": "tts/1dcbd976b3.mp3", "あぴーるする": "tts/3992d3ced1.mp3", "商品の良さを消費者にもっとアピールしたい。": "tts/bef6ba309a.mp3", "ひそひそ": "tts/43296a7200.mp3", "あの二人はさっきからひそひそ話している。": "tts/40fd873aeb.mp3", "あやまり": "tts/ee1fce1d6e.mp3", "資料に誤りがあったら知らせてください。": "tts/6886cb2692.mp3", "とっくに": "tts/8498185e54.mp3", "高橋さんならとっくに帰りましたよ。": "tts/3ad37115cc.mp3", "ゆずる": "tts/d41fd7807a.mp3", "あの自転車は弟に譲りました。（给了弟弟）": "tts/9fa3f793cd.mp3", "ちょうじょう": "tts/bd9121a598.mp3", "山に登り始めて5時間、ようやく頂上に着いた。": "tts/12c28fb71e.mp3", "ぶんかいする": "tts/5ba167d1ec.mp3", "機械を分解して部品を点検した。": "tts/34edbf3cd5.mp3", "すくう": "tts/ae26 ってもらえると助かります": "tts/999727ccd0.mp3", "今日は早く帰らせていただけませんか": "tts/adbbe4535c.mp3", "連絡のしようがない": "tts/7a124defa5.mp3", "そんなことができるわけがない": "tts/12bfca1cd6.mp3", "疲れた時は寝るに限る": "tts/e65817c1bd.mp3", "雨にもかかわらず、試合は行われた": "tts/133f4384f1.mp3", "彼は英語ばかりか中国語も話せる": "tts/2fec2718a7.mp3", "景気は回復しつつある": "tts/df0bf29cf2.mp3", "冬は風邪を引きがちだ": "tts/a0c58dfe86.mp3", "ご利用に際しては、規約をお読みください": "tts/25b2769950.mp3", "生徒「これからご紹介するのは、私が新しい単語を覚えるのにいい方法はないかとあれこれ考えた末に思いついた方法です。」": "tts/43a9d7026b.mp3", "片付けが苦手という話をよく聞きますが、それは決して性格や能力の問題ではなくやり方を知らないだけなので、やり方を身につければ必ず片付けられるようになります。": "tts/3d2950eb5d.mp3", "X市には、市民のための文化施設が二つあり音楽コンサートをはじめとしたさまざまな催しを行っている。": "tts/490145bc29.mp3", "おなかがすいているわけでもないのにおなかが鳴るのはどうしてだろう。": "tts/bf30accf17.mp3", "出張に行くたびに泊まっているYホテルが先週から工事で休業中なので、今回は別のホテルに泊まることにした。": "tts/7489570baa.mp3", "どんなスポーツでも、日々の練習が上達に欠かせないのはもちろんだが間違った方法で行うと時間をかけてもなかなか上達しない。": "tts/7e23d35b90.mp3", "姉は歌手の赤川ケイの大ファンで、彼女のことならどんなに小さなことでも知りたいと言っている。": "tts/5fbd5984a5.mp3", "明日の夕方が締め切りのレポートがまだ終わっていない。明日は一日中授業があって時間がとれないので、今晩徹夜してでも終わらせてしまわないといけない。": "tts/7312baa5f6.mp3", "田中さんはみかんが好きらしく一度食べだすと止まらないほど、冬はいつもみかんを大量に買うそうだ。": "tts/817fdb3602.mp3", "私は、中学生になったころから次第に医学に興味を持ち始め高校に入ったときには将来医者になろうと決めていた。": "tts/0ebeb859b1.mp3", "料理の面白いところは、安い材料でも工夫次第で豪華なごちそうができるところです。": "tts/8c37152083.mp3", "田中「昨日は、息子の高校の入学式だったんですよ。」 山田「田中さんの息子さんももう高校生ですか。早いですね。」": "tts/7d3dc0f09e.mp3", "世界各国の国会議員選挙における投票率を世代ごとに見ると、若い世代の投票率は我が国に限らず相対的に低い傾向があることがわかる。": "tts/70cdeca2e2.mp3", "5歳の娘は、私と同じ警察官になりたいと言っている。本当に将来なるかどうかは別としてそんなことを言ってくれたことに感激した。": "tts/dd7d8f98e7.mp3", "試合に負けて本当は悔しいはずの選手たちがなぜか明るい表情だったのは、「つらいときこそ明るく」というのが監督の方針だからだそうだ。": "tts/adb7185345.mp3", "この歌を聞くたびに思い出すのは高校時代の友人のことだ。彼はカラオケに行くと必ずこの歌を歌っていた。": "tts/760c296d77.mp3", "昨日、アルバイトに遅刻しそうだったので急ごうと思ってタクシーに乗ったら道が渋滞していたせいでかえって時間がかかり結局遅刻してしまった。": "tts/819bb1213c.mp3", "来月結婚する友人に結婚式のスピーチを頼まれた。大勢の前で話すのは苦手なので悩んだのだがどうしてもと言われて、引き受けることにした。": "tts/79c2167962.mp3", "先日の政治家A氏の発言はあまりに無責任だ。自分の立場をよく考えたうえで政治家としての発言しなければならなかったと思う。": "tts/7f2e0e5dec.mp3", "食事や睡眠などの生活習慣は一度乱れてしまうと、戻そうとしてもなかなか戻せないので規則正しい生活を普段から意識することが大切だ。": "tts/b8128cb411.mp3", "結婚生活を送るうえで何が大切かといえば、相手への思いやりの気持ちを持つことだと思う。": "tts/aa6c4b9d3f.mp3", "就職したときに買って以来ずっと使っていたかばんがとうとう壊れたので、買い換えることにした。": "tts/4c0097146c.mp3", "登山には不思議な魅力がある。登っているときはこんなに苦しいことは二度としたくないと思うのに山を下りて何日かするとなぜかまた登りたくなる。": "tts/86359f6843.mp3", "彫刻家川村たけるが作る動物の彫刻作品は、形はシンプルながら今にも動き出しそうな生命力にあふれている。": "tts/efe9178548.mp3", "このお菓子はとても簡単に作れるから初心者でも失敗することはまずないという友人の話を聞いて、作ってみようと思った。": "tts/df26bf97f4.mp3", "近所のスーパーの隣にはクリーニング屋がある。スーパーもクリーニング屋も私が仕事から帰る時間でも開いていて買い物するついでに預けた服を取りに行けるのが助かる。": "tts/f1bf966d40.mp3", "薬は正しく飲まないと得られるはずの効果が得られないだけでなく状態を悪化させてしまう危険もある。": "tts/04115d729d.mp3", "いつ行っても長い行列ができているラーメン屋なのに今回あまり並ばないで済んだのは何時ごろがすいているか事前に確認してから行ったからだ。": "tts/b1f261e1c4.mp3", "山や植物の写真家として有名な岩本まさき氏の写真展が15日からABCデパートで開催される。": "tts/a7fc293518.mp3", "子供のころは、1年が長く感じられたのに、年をとるにつれて短く感じるようになるのはなぜだろうか。": "tts/bfccd7d50c.mp3", "情報をどのような順番で提示するかによって相手の受け止め方が変わってくるので、順番を意識して話す必要がある。": "tts/396dff0ef6.mp3", "日本では、99歳のお祝いを「白寿」と言います。「百」の字から「一」をとると「白」という字になることからそう呼ばれています。": "tts/9ba0414c4d.mp3", "講師「最初は全く興味がなかった商品なのにCMなどで何度か見ているうちに気になってくるということはありませんか。」": "tts/45b2489e55.mp3", "この本の内容をきちんと理解するにはそれなりの知識が求められるので難しいと感じる人も多いだろう。": "tts/6fc00258d4.mp3", "石油は、自動車や航空機などの燃料として使われるだけでなくプラスチック製品を作る原料としても利用されている。": "tts/4dc0034d58.mp3", "東鉄道竹山線内にある二つの信号機が故障しており、大事故が起きかねない危険な状態が続いていたことが明らかになった。": "tts/8a213f63e8.mp3", "（インタビューで）「店長になって最初の1年間は大変でした。店長になったといってもわからないことばかりで自分でいいのかと悩むこともありました。」": "tts/5a08d94221.mp3", "家を買うことについて否定的な夫は一度買ってしまうと簡単に引っ越せないのが嫌だと言っている。": "tts/ef7f7b4c5a.mp3", "隣のクラスの友達とけんかをしてしまい、学校の廊下ですれ違っても目を合わせることすらなくなってしまった。": "tts/2b0ff97ac5.mp3", "このソファーは、それなりの大きさはあるが、見た目ほどの重さはないため一人でも楽に動かせる。": "tts/aa03bda771.mp3", "友達にスキー旅行に誘われている。返事をしなければと思いながらも仕事の予定が決まっていなくてまだ返事ができていない。": "tts/acf589ec72.mp3", "私は、美術館では音声ガイドの機械を借りて、説明を聞きながら作品を鑑賞する。作品のどこに注目して鑑賞したらいいのかがわかるとその作品をより深く味わえるからだ。": "tts/293f8fbb22.mp3", "雪が降っているわりにそんなに寒く感じないのは風がほとんどないからだろう。": "tts/ea67a27dff.mp3", "急いでいたので、危うく電車に乗り遅れるところでした。": "tts/a3a928429d.mp3", "1番。間に合ってよかったですね。": "tts/a8602a8a24.mp3", "2番。じゃあ、次の電車ですね。": "tts/95f3a50508.mp3", "3番。どうして遅れたんですか。": "tts/9fa5277937.mp3", "あいにく、田中は今席を外しております。": "tts/333fcf169c.mp3", "1番。では、また後でかけ直します。": "tts/eba0a1b3f0.mp3", "2番。じゃあ、伝えておきます。": "tts/ec1fb114ba.mp3", "3番。席にいらっしゃいますか。": "tts/7b6a002132.mp3", "この仕事、手伝ってもらえると助かるんだけど。": "tts/9ceb2ab9bd.mp3", "1番。いいですよ、何をしましょうか。": "tts/8b4993d8fe.mp3", "2番。ありがとうございます。助かりました。": "tts/1483163f9c.mp3", "3番。手伝ってあげますよ、ありがとう。": "tts/cbf7e9b0ad.mp3", "ご要望にはお応えしかねます。": "tts/71521ec41d.mp3", "1番。そうですか、それは残念です。": "tts/6f5d1f0604.mp3", "2番。お応えいただけて助かります。": "tts/531911f761.mp3", "3番。ぜひお願いします。": "tts/7b2f7384b0.mp3", "お先にどうぞ。": "tts/0d96124eb1.mp3", "1番。では、お言葉に甘えて。": "tts/8df1f0c88d.mp3", "2番。いえ、結構です。お先にいらっしゃる。": "tts/51a4dd4886.mp3", "3番。お先に失礼です。": "tts/b972782587.mp3", "忙しくて、旅行どころじゃないんです。": "tts/f0eb528b06.mp3", "1番。それは大変ですね。": "tts/fa26f14d20.mp3", "2番。楽しんできてくださいね。": "tts/d833471b85.mp3", "3番。旅行はいつ行きますか。": "tts/6ae8bc195b.mp3", "行けないことはないんですが…。": "tts/16dd7fa330.mp3", "1番。無理なら、いいですよ。": "tts/dd2c017589.mp3", "2番。じゃあ、行けないんですね。": "tts/bb811980bf.mp3", "3番。では、絶対来てください。": "tts/9c3e334cc4.mp3", "今日は早めに帰らせていただけませんか。": "tts/58eee30661.mp3", "1番。ええ、いいですよ。": "tts/da0bfc4292.mp3", "2番。ありがとうございます。助かります。": "tts/21e28a6c16.mp3", "3番。今日は早く帰らないでください。": "tts/95040650da.mp3", "1番。ありがとうございます。いただきます。": "tts/de04687a94.mp3", "2番。コーヒーはいかがでしたか。": "tts/bfb3f72c45.mp3", "3番。コーヒーを飲んだことがありません。": "tts/09bfefd346.mp3", "連絡先が分からなくて、連絡しようがなかったんです。": "tts/9811305836.mp3", "1番。それは困りましたね。": "tts/f9576fcb80.mp3", "2番。じゃあ、連絡しなくてもいいですね。": "tts/e4aa476b9e.mp3", "3番。連絡先を教えてもらってください。": "tts/8dc96c0583.mp3", "無事に終わりました、おかげさまで。": "tts/2aa4c1f95d.mp3", "1番。それはよかったですね。": "tts/7f6df668c5.mp3", "2番。どういたしまして。": "tts/6ab23fff86.mp3", "3番。お大事に。": "tts/f04b7f6a2e.mp3", "痛いほどではないんですが、少し気になって。": "tts/6be62e4d49.mp3", "1番。念のため、診てもらったらどうですか。": "tts/d54284ad8a.mp3", "2番。それは大変ですね、すぐ救急車を呼びましょう。": "tts/0d2352e928.mp3", "3番。痛くないなら大丈夫ですね。": "tts/4325d6c5fd.mp3", "資料はもうコピーしてあります。": "tts/9e4e9bac9f.mp3", "まず資料をコピーしておいてください。": "tts/9ec05c764b.mp3", "コピーは会議が終わってからでいいですよ。": "tts/f56698da2c.mp3", "コピーはしなくても大丈夫です。": "tts/52f5443467.mp3", "予約は、さっき済ませました。": "tts/8759326d02.mp3", "予約は、とりあえず先にお願いします。": "tts/f9eaecafd0.mp3", "連絡は後回しにして、先に準備をしましょう。": "tts/cc0fd02c86.mp3", "それはこちらでやりますので、結構です。": "tts/42e7ae5f27.mp3", "報告書は昨日のうちに出しておきました。": "tts/aa7e60b1dd.mp3", "報告書は今日中に出してください。": "tts/cca767c6fc.mp3", "報告書はまた今度でかまいません。": "tts/8b6d93e3b3.mp3", "報告書は出さなくてもいいことになりました。": "tts/fb527ab616.mp3"};window.DATA = window.DATA || {};

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

  var pool=shuffle(it.tk.concat(it.x||[])).map(function(t,i){return {t:t,i:i};});
  var picked=[];
  h+=(it.pre!==undefined?'<p class=q>'+esc(it.pre)+' <span class=gap>＿＿＿＿</span> '+esc(it.post)+'</p><p class=note>提示：'+esc(it.zh)+'</p><button id=play class=btn>🔊 听整句</button>':it.dict?'<button id=play class=btn>🔊 播放</button>'+ttsWarn()+'<p class=note>点播放，听完把句子拼出来（参考：'+esc(it.zh)+'）</p>':'<p class=q>'+esc(it.zh)+'</p><button id=play class=btn>🔊 听日语</button>')+
   '<div id=ans class=ans></div><div id=bank class=bank></div><button id=chk class=btn>检查</button> <button id=clr class=btn>清空</button><div id=fb></div>';
  render(h);
  function draw(){
   $('#ans').innerHTML=picked.map(function(p,n){return '<button class=tile data-n="'+n+'">'+esc(p.t)+'</button>';}).join('')||'<span class=note>点下面的词块组句</span>';
   $('#bank').innerHTML=pool.filter(function(p){return picked.indexOf(p)<0;}).map(function(p){return '<button class=tile data-i="'+p.i+'">'+esc(p.t)+'</button>';}).join('');
   [].forEach.call(document.querySelectorAll('#bank .tile'),function(b){b.onclick=function(){var p=pool.filter(function(x){return x.i===+b.getAttribute('data-i');})[0];picked.push(p);draw();};});
   [].forEach.call(document.querySelectorAll('#ans .tile'),function(b){b.onclick=function(){picked.splice(+b.getAttribute('data-n'),1);draw();};});}
  draw();
  var full=it.tk.join(''),spoken=(it.pre||'')+full+(it.post||'');
  $('#play').onclick=function(){speak(spoken);};
  
  $('#clr').onclick=function(){picked=[];draw();};
  $('#chk').onclick=function(){
   var ok=picked.map(function(p){return p.t;}).join('')===full;
   $('#chk').disabled=true;$('#clr').disabled=true;
   finish(it,ok,(ok?'<p class=ok>✔ 正解</p>':'<p class=ng>✘ 正确：'+esc(full)+'（稍后会再出现）</p>')+'<p class=note>'+esc((it.pre||'')+'【'+full+'】'+(it.post||''))+'<br>'+esc(it.zh)+' · '+esc(it.s)+'</p>');
   speak(spoken);};}
 show();}

function wrongView(){
 var open=wrongOpen(),due=wrongDue();
 var h='<h1>错题本</h1><p>未稳定 '+open.length+' 题，今天该复习 <b>'+due.length+'</b> 题。</p>';
 if(due.length)h+='<a class=btn href="#/wrongquiz">复习今天到期的</a> ';
 if(open.length)h+='<a class=btn href="#/wrongall">全部重做</a>';
 if(!open.length)h+='<p>目前没有错题。</p>';
 render(h);}

function report(){
 var t=dayNum(),lines=['N2REPORT d'+t+' exam '+S.exam];
 for(var k in SETS){var n=0,w=0;SETS[k].items.forEach(function(it){var s=S.stat[it.id];if(s){n+=s.n;w+=s.w;}});lines.push(k+' '+n+'/'+w+'wrong');}
 var top=Object.keys(S.stat).filter(function(k){return S.stat[k].w>0;}).sort(function(a,b){return S.stat[b].w-S.stat[a].w;}).slice(0,25);
 lines.push('TOP '+top.map(function(k){return k+':'+S.stat[k].w+'/'+S.stat[k].n;}).join(' '));
 lines.push('OPEN '+wrongOpen().join(','));
 var boxes={};Object.keys(S.cards).forEach(function(k){var d=k.split(':')[0];boxes[d]=boxes[d]||[0,0,0,0,0,0];boxes[d][S.cards[k].box]++;});
 lines.push('CARDS '+JSON.stringify(boxes));
 lines.push('DAYS '+JSON.stringify(S.log));
 return lines.join('\n');}

function lessonsView(){
 var h='<h1>引导型课程</h1><div class=grid>';
 DATA.lessons.forEach(function(L){h+='<a class=card href="#/lesson/'+L.id+'"><b>'+esc(L.title)+'</b><span>'+esc(L.sub)+'</span></a>';});
 render(h+'</div>');}

function lessonView(id){
 var L=DATA.lessons.filter(function(x){return x.id===id;})[0];
 if(!L){lessonsView();return;}
 var h='<h1>'+esc(L.title)+'</h1><p class=sub>'+esc(L.sub)+'</p>';
 L.blocks.forEach(function(b,n){
  if(b.t==='h')h+='<h2>'+esc(b.x)+'</h2>';
  else if(b.t==='p')h+='<p>'+b.x+'</p>';
  else if(b.t==='ul')h+='<ul>'+b.xs.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul>';
  else if(b.t==='table')h+='<div class=tw><table>'+b.rows.map(function(r,i){return '<tr>'+r.map(function(c){return i?'<td>'+esc(c)+'</td>':'<th>'+esc(c)+'</th>';}).join('')+'</tr>';}).join('')+'</table></div>';
  else if(b.t==='note')h+='<div class=noteb>'+esc(b.x)+'</div>';
  else if(b.t==='think')h+='<div class=think><b>想一想：</b>'+esc(b.q)+'<br><button class="btn small rv" data-n="'+n+'">看答案</button><div class=hide id="a'+n+'">'+esc(b.a)+'</div></div>';
  else if(b.t==='mcq'){h+='<div class=mcq data-n="'+n+'"><p><b>'+esc(b.q)+'</b></p>';b.o.forEach(function(o,i){h+='<button class="opt" data-n="'+n+'" data-i="'+i+'">'+esc(o)+'</button>';});h+='<div class=note id="m'+n+'"></div></div>';}
  else if(b.t==='go')h+='<a class=btn href="#/quiz/'+b.set+'">'+esc(b.x)+'</a>';});
 render(h);
 [].forEach.call(document.querySelectorAll('.rv'),function(b){b.onclick=function(){$('#a'+b.getAttribute('data-n')).className='note';};});
 [].forEach.call(document.querySelectorAll('.mcq .opt'),function(b){b.onclick=function(){
  var n=+b.getAttribute('data-n'),i=+b.getAttribute('data-i'),bl=L.blocks[n];
  $('#m'+n).innerHTML=(i===bl.a?'✔ ':'✘ ')+esc(bl.e);b.className+=(i===bl.a?' right':' wrong');};});}

function settings(){
 var h='<h1>设置</h1><label>考试日期 <input type=date id=exam value="'+S.exam+'"></label><p><button id=exp class=btn>导出进度</button> <button id=imp class=btn>导入进度</button></p><textarea id=ta rows=5></textarea><p><button id=rep class=btn>复制学习报告（发给 Claude）</button></p><p><button id=rst class="btn bad">重置</button></p>';
 render(h);
 $('#exam').onchange=function(){S.exam=this.value;save();};
 $('#exp').onclick=function(){$('#ta').value=JSON.stringify(S);};
 $('#imp').onclick=function(){try{S=JSON.parse($('#ta').value);save();alert('已导入');}catch(e){alert('格式错误');}};
 $('#rep').onclick=function(){var r=report();$('#ta').value=r;try{navigator.clipboard.writeText(r);}catch(e){}$('#ta').select();};
 $('#rst').onclick=function(){if(confirm('确定重置？')){S=null;try{localStorage.removeItem(KEY);}catch(e){}load();save();route();}};}

function route(){
 var p=(location.hash||'#/home').slice(2).split('/');
 var v=p[0];
 if(v==='cards'&&DECKS[p[1]])cards(p[1]);
 else if(v==='quiz'&&SETS[p[1]])quiz(p[1]);
 else if(v==='audio'){if(p[1])audioPaper(p[1]);else audioHome();}
 else if(v==='clip')clipView(p[1],p[2]);
 else if(v==='wrong')wrongView();
 else if(v==='wrongquiz'){var ids=wrongDue();if(ids.length)quiz(null,ids);else wrongView();}
 else if(v==='wrongall'){var ids2=wrongOpen();if(ids2.length)quiz(null,ids2);else wrongView();}
 else if(v==='lessons')lessonsView();
 else if(v==='lesson')lessonView(p[1]);
 else if(v==='settings')settings();
 else home();}
window.addEventListener('hashchange',route);
load();route();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body></html>
