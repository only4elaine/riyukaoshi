<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>N2 冲刺</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c0392b">
<style>:root{--bg:#faf8f4;--fg:#222;--card:#fff;--bd:#ddd;--ac:#c0392b;--ok:#1e8449;--ng:#c0392b;--mut:#666}
@media(prefers-color-scheme:dark){:root{--bg:#1b1b1d;--fg:#eee;--card:#27272a;--bd:#3a3a3e;--ac:#ff7b6b;--ok:#58d68d;--ng:#ff7b6b;--mut:#aaa}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 -apple-system,"Hiragino Sans","PingFang SC","Noto Sans CJK JP",sans-serif}
nav{display:flex;gap:16px;padding:12px 16px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg)}
nav a{color:var(--fg);text-decoration:none;font-weight:600}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:8px 0}h2{font-size:18px;margin:24px 0 8px}small{color:var(--mut);font-size:14px}
.sub{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;color:var(--fg);text-decoration:none}
.card span{color:var(--mut);font-size:14px}
.btn,.opt{font:inherit;padding:10px 16px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer;text-decoration:none;display:inline-block;margin:4px 4px 4px 0}
.btn.good{border-color:var(--ok)}.btn.bad{border-color:var(--ng)}.btn.small{padding:4px 10px;font-size:14px}
.opts{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.opt{text-align:left;width:100%}.opt.right{border-color:var(--ok);background:rgba(30,132,73,.15)}.opt.wrong{border-color:var(--ng);background:rgba(192,57,43,.15)}
.flash{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:24px;text-align:center;margin:12px 0}
.front{font-size:32px;font-weight:700}.big{font-size:22px;font-weight:700;margin:12px 0}
.ex,.note{color:var(--mut);font-size:15px;margin-top:8px}
.hide{display:none}.q{font-size:18px}
.ok{color:var(--ok);font-weight:700}.ng{color:var(--ng);font-weight:700}
.noteb,.think{background:var(--card);border-left:4px solid var(--ac);padding:10px 14px;margin:12px 0;border-radius:6px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid var(--bd);padding:6px 8px;text-align:left}th{background:var(--card)}
textarea,input{font:inherit;width:100%;background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:8px}
.tile{font:inherit;padding:8px 12px;margin:4px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer}
.ans{min-height:56px;border-bottom:2px solid var(--bd);margin:12px 0;padding:4px}.bank{margin:12px 0}
.gap{border-bottom:2px solid var(--ac);padding:0 4px}
</style></head>

function deckStat(k){var d=DECKS[k],t=dayNum(),due=0,nw=0;
 d.list.forEach(function(c){var s=S.cards[k+':'+c.id];if(!s)nw++;else if(s.due<=t)due++;});
 return {due:due,nw:nw,total:d.list.length};}

// ---- quiz sets
function buildSets(){
 var sets={};
 sets.qRead={name:'读音测验',items:DATA.readings.map(function(r){
  var opts=shuffle([r.r].concat(r.ds));
  return {id:'qr_'+r.id,q:'「'+r.w+'」怎么读？\n'+r.ctx,o:opts,a:opts.indexOf(r.r),e:r.note,s:r.src};})};
 sets.qL4={name:'听力・问题4 即时应答',listen:true,items:DATA.qL4.map(function(x){
  return {id:x.id,q:x.q,o:x.o,a:x.a,e:x.e,s:x.s,listen:true,tts:[x.q].concat(x.o.map(function(t,i){return (i+1)+'番。'+t;})),fixed:false};})};
 sets.qL1={name:'听力・课题理解（行动判断）',listen:true,items:DATA.qL1.map(function(x){
  return {id:x.id,q:x.q,o:DATA.qL1opts,a:x.a,e:x.e,s:x.s,listen:true,tts:[x.q],fixed:true};})};
 sets.sBuild={name:'造句・排序（真题+补充）',items:DATA.sort.map(function(x){return {id:x.id,type:'build',zh:x.zh,tk:x.tk,x:[],pre:x.pre,post:x.post,s:x.src+' · '+x.s};}).concat(DATA.sent.map(function(x){return {id:x.id,type:'build',zh:x.zh,tk:x.tk,x:x.x,s:x.s};}))};
 sets.sDict={name:'听写造句（听音拼句）',listen:true,items:DATA.sent.map(function(x){return {id:'d'+x.id,type:'build',dict:true,zh:x.zh,tk:x.tk,x:x.x,s:x.s,listen:true};})};
 sets.qKeigo={name:'敬语',items:DATA.qKeigo};
 sets.qJita={name:'自他动词',items:DATA.qJita};
 sets.qGram={name:'语法填空',items:DATA.qGram};
 return sets;}
var SETS=buildSets();
function allItems(){var out=[];for(var k in SETS)SETS[k].items.forEach(function(it){out.push(it);});return out;}

// ---- TTS
var ttsTimer=null;
function speak(txt,done){
 if(!window.speechSynthesis){if(done)done();return;}
 var u=new SpeechSynthesisUtterance(txt);u.lang='ja-JP';u.rate=0.95;
 u.onend=function(){if(done)done();};u.onerror=function(){if(done)done();};
 speechSynthesis.speak(u);}
function speakSeq(arr,done){if(window.speechSynthesis)speechSynthesis.cancel();var i=0;
 (function next(){if(i>=arr.length){if(done)done();return;}
  var t=arr[i++];speak(t,function(){ttsTimer=setTimeout(next,700);});})();}
function stopTTS(){clearTimeout(ttsTimer);if(window.speechSynthesis)speechSynthesis.cancel();}

// ---- views
function nav(){return '<nav><a href="#/home">首页</a><a href="#/lessons">课程</a><a href="#/wrong">错题本</a><a href="#/settings">设置</a></nav>';}
function render(h){stopTTS();app.innerHTML=nav()+'<main>'+h+'</main>';window.scrollTo(0,0);}

function home(){
 var d=Math.ceil((new Date(S.exam+'T00:00:00')-new Date())/86400000);
 var wcount=wrongOpen().length,wdue=wrongDue().length;
 var h='<h1>N2 冲刺</h1><p class=sub>距离考试还有 <b>'+(isFinite(d)?d:'?')+'</b> 天 · 今日已答 '+(S.log[dayNum()]||0)+' 次</p>';
 h+=(wdue?'<a class=card style="border-color:var(--ac)" href="#/wrongquiz"><b>今日错题复习：'+wdue+' 题</b><span>按记忆曲线到期的错题</span></a>':'')+'<h2>① 先背（卡片）</h2><div class=grid>';
 ['lexp','lwords','read','vocab','gram','keigo','jita'].forEach(function(k){var s=deckStat(k);
  h+='<a class=card href="#/cards/'+k+'"><b>'+DECKS[k].name+'</b><span>待复习 '+s.due+' · 新 '+s.nw+' / '+s.total+'</span></a>';});
 h+='</div><h2>② 再做（测验）</h2><div class=grid>';
 for(var k in SETS)h+='<a class=card href="#/quiz/'+k+'"><b>'+SETS[k].name+'</b><span>'+SETS[k].items.length+' 题'+(SETS[k].listen?' · 🔊':'')+'</span></a>';
 h+='</div><h2>③ 补课</h2><div class=grid><a class=card href="#/lessons"><b>引导型课程</b><span>自他动词・敬语・动词变形</span></a><a class=card href="#/wrong"><b>错题本</b><span>'+wcount+' 题待攻克</span></a></div>';
 render(h);}

function cards(k){
 var d=DECKS[k],t=dayNum(),q=[],nw=[];
 d.list.forEach(function(c){var s=S.cards[k+':'+c.id];if(!s)nw.push(c);else if(s.due<=t)q.push(c);});
 q=shuffle(q).concat(nw.slice(0,NEW_PER_DAY));
 var cur=null,total=q.length;
 function step(){
  if(!q.length){render('<h1>'+d.name+'</h1><p>今天完成了 ✓</p><a class=btn href="#/home">返回</a>');return;}
  cur=q.shift();
  var h='<h1>'+d.name+' <small>剩 '+(q.length+1)+'</small></h1><div class=flash><div class=front>'+esc(d.front(cur))+'</div><div id=back class=hide>'+d.back(cur)+'</div></div>'+
   '<div id=ctl><button id=sp class=btn>🔊 发音</button> <button id=show class=btn>显示答案</button></div>';
  render(h);
  var say=cur.line||cur.ctx||cur.ex||cur.r||cur.w;
  $('#sp').onclick=function(){speak(cur.r&&cur.r.indexOf('↔')<0?cur.r:cur.w,function(){if(say&&$('#back').className==='')speak(say);});};
  $('#show').onclick=function(){$('#back').className='';speak(say);
   $('#ctl').innerHTML='<button class="btn bad" data-g=0>不会</button><button class="btn mid" data-g=1>模糊</button><button class="btn good" data-g=2>会</button>';
   [].forEach.call(document.querySelectorAll('#ctl button'),function(b){b.onclick=function(){grade(+b.getAttribute('data-g'));};});};}
 function grade(g){
  var key=k+':'+cur.id,s=S.cards[key]||{box:0,due:t};
  if(g===0){s.box=0;s.due=t;q.splice(Math.min(4,q.length),0,cur);}
  else if(g===1){s.due=t+Math.max(1,INT[s.box]);}
  else{s.box=Math.min(s.box+1,INT.length-1);s.due=t+INT[s.box];}
  S.cards[key]=s;bump();save();step();}
 step();}

function wrongDue(){var t=dayNum();return Object.keys(S.wrong).filter(function(k){var w=S.wrong[k];return w&&w.box<5&&w.due<=t;});}
function wrongOpen(){return Object.keys(S.wrong).filter(function(k){var w=S.wrong[k];return w&&w.box<5;});}
function record(it,ok,failedInSession){
 var st=S.stat[it.id]=S.stat[it.id]||{n:0,w:0};st.n++;if(!ok)st.w++;
 var t=dayNum(),w=S.wrong[it.id];
 if(!ok){S.wrong[it.id]={box:0,due:t};}
 else if(w){ if(!failedInSession){w.box++;w.due=t+INT[Math.min(w.box,INT.length-1)];} else {w.box=0;w.due=t+1;} }
 bump();save();}
function quiz(setKey,ids){
 var items;
 if(ids){var all=allItems();items=all.filter(function(i){return ids.indexOf(i.id)>=0;});}
 else items=SETS[setKey].items.slice();
 items=items.some(function(i){return i.listen;})?items:shuffle(items);
 var q=items.slice(),total=items.length,score=0,failed={},done=0;
 function show(){
  if(!q.length){render('<h1>完成</h1><p class=big>一次答对 '+score+' / '+total+'</p><p class=note>答错的题已加入错题本，会按 1→2→4→7→15 天间隔反复出现，直到稳定。</p><a class=btn href="#/home">返回</a> <a class=btn href="#/wrong">错题本</a>');return;}
  var it=q.shift();
  var h='<h1>'+(done+1)+' / '+total+' <small>还剩 '+(q.length+1)+'</small></h1>';
  if(it.type==='build'){buildView(it,h);return;}
  var opts=it.o.map(function(x,i){return {t:x,i:i};});
  if(!it.fixed&&!it.listen)opts=shuffle(opts);
  if(it.listen){h+='<button id=play class=btn>🔊 播放</button><p class=note>先听，再作答；答完看原文。</p><div id=txt class=hide>'+esc(it.q)+'</div>';}
  else h+='<p class=q>'+esc(it.q).replace(/\n/g,'<br>')+'</p>';
  h+='<div class=opts>';
  opts.forEach(function(o,n){h+='<button class=opt data-i="'+o.i+'">'+(n+1)+'. '+(it.listen&&!it.fixed?'选项 '+(n+1):esc(o.t))+'</button>';});
  h+='</div><div id=fb></div>';
  render(h);
  if(it.listen){var pl=$('#play');pl.onclick=function(){speakSeq(it.tts);};setTimeout(function(){pl.onclick();},300);}
  [].forEach.call(document.querySelectorAll('.opt'),function(b){b.onclick=function(){answer(it,+b.getAttribute('data-i'),b);};});}
 function finish(it,ok,fbHtml){
  if(ok){ if(!failed[it.id])score++; } else { failed[it.id]=true; q.splice(Math.min(3,q.length),0,it); }
  record(it,ok,failed[it.id]&&ok);
  if(ok)done++;
  $('#fb').innerHTML=fbHtml+'<button id=nx class=btn>下一题</button>';
  $('#nx').onclick=function(){show();};}
 function answer(it,i,btn){
  var ok=i===it.a;
  [].forEach.call(document.querySelectorAll('.opt'),function(b){b.disabled=true;if(+b.getAttribute('data-i')===it.a)b.className+=' right';});
  if(!ok)btn.className+=' wrong';
  var tx=$('#txt');if(tx)tx.className='note';
  var detail=it.listen&&!it.fixed?'<div class=note>'+it.o.map(function(o,n){return (n+1)+'. '+esc(o);}).join('<br>')+'</div>':'';
  finish(it,ok,(ok?'<p class=ok>✔ 正解</p>':'<p class=ng>✘ 正解：'+esc(it.o[it.a])+'（稍后会再出现）</p>')+detail+'<p class=note>'+esc(it.e)+(it.s?' · '+esc(it.s):'')+'</p>');}
 function buildView(it,h){
  var pool=shuffle(it.tk.concat(it.x||[])).map(function(t,i){return {t:t,i:i};});
  var picked=[];
  h+=(it.pre!==undefined?'<p class=q>'+esc(it.pre)+' <span class=gap>＿＿＿＿</span> '+esc(it.post)+'</p><p class=note>提示：'+esc(it.zh)+'</p><button id=play class=btn>🔊 听整句</button>':it.dict?'<button id=play class=btn>🔊 播放</button><p class=note>听写：听完把句子拼出来（参考：'+esc(it.zh)+'）</p>':'<p class=q>'+esc(it.zh)+'</p><button id=play class=btn>🔊 听日语</button>')+
   '<div id=ans class=ans></div><div id=bank class=bank></div><button id=chk class=btn>检查</button> <button id=clr class=btn>清空</button><div id=fb></div>';
  render(h);
  function draw(){
   $('#ans').innerHTML=picked.map(function(p,n){return '<button class=tile data-n="'+n+'">'+esc(p.t)+'</button>';}).join('')||'<span class=note>点下面的词块组句</span>';
   $('#bank').innerHTML=pool.filter(function(p){return picked.indexOf(p)<0;}).map(function(p){return '<button class=tile data-i="'+p.i+'">'+esc(p.t)+'</button>';}).join('');
   [].forEach.call(document.querySelectorAll('#bank .tile'),function(b){b.onclick=function(){var p=pool.filter(function(x){return x.i===+b.getAttribute('data-i');})[0];picked.push(p);draw();};});
   [].forEach.call(document.querySelectorAll('#ans .tile'),function(b){b.onclick=function(){picked.splice(+b.getAttribute('data-n'),1);draw();};});}
  draw();
  var full=it.tk.join(''),spoken=(it.pre||'')+full+(it.post||'');
  $('#play').onclick=function(){speak(spoken);};
  if(it.dict)setTimeout(function(){speak(full);},300);
  $('#clr').onclick=function(){picked=[];draw();};
  $('#chk').onclick=function(){
   var ok=picked.map(function(p){return p.t;}).join('')===full;
   $('#chk').disabled=true;$('#clr').disabled=true;
   finish(it,ok,(ok?'<p class=ok>✔ 正解</p>':'<p class=ng>✘ 正确：'+esc(full)+'（稍后会再出现）</p>')+'<p class=note>'+esc((it.pre||'')+'【'+full+'】'+(it.post||''))+'<br>'+esc(it.zh)+' · '+esc(it.s)+'</p>');
   speak(spoken);};}
 show();}

function wrongView(){
 var open=wrongOpen(),due=wrongDue();
 var h='<h1>错题本</h1><p>未稳定 '+open.length+' 题，今天该复习 <b>'+due.length+'</b> 题。</p>';
 if(due.length)h+='<a class=btn href="#/wrongquiz">复习今天到期的</a> ';
 if(open.length)h+='<a class=btn href="#/wrongall">全部重做</a>';
 if(!open.length)h+='<p>目前没有错题。</p>';
 render(h);}

function report(){
 var t=dayNum(),lines=['N2REPORT d'+t+' exam '+S.exam];
 for(var k in SETS){var n=0,w=0;SETS[k].items.forEach(function(it){var s=S.stat[it.id];if(s){n+=s.n;w+=s.w;}});lines.push(k+' '+n+'/'+w+'wrong');}
 var top=Object.keys(S.stat).filter(function(k){return S.stat[k].w>0;}).sort(function(a,b){return S.stat[b].w-S.stat[a].w;}).slice(0,25);
 lines.push('TOP '+top.map(function(k){return k+':'+S.stat[k].w+'/'+S.stat[k].n;}).join(' '));
 lines.push('OPEN '+wrongOpen().join(','));
 var boxes={};Object.keys(S.cards).forEach(function(k){var d=k.split(':')[0];boxes[d]=boxes[d]||[0,0,0,0,0,0];boxes[d][S.cards[k].box]++;});
 lines.push('CARDS '+JSON.stringify(boxes));
 lines.push('DAYS '+JSON.stringify(S.log));
 return lines.join('\n');}

function lessonsView(){
 var h='<h1>引导型课程</h1><div class=grid>';
 DATA.lessons.forEach(function(L){h+='<a class=card href="#/lesson/'+L.id+'"><b>'+esc(L.title)+'</b><span>'+esc(L.sub)+'</span></a>';});
 render(h+'</div>');}

function lessonView(id){
 var L=DATA.lessons.filter(function(x){return x.id===id;})[0];
 if(!L){lessonsView();return;}
 var h='<h1>'+esc(L.title)+'</h1><p class=sub>'+esc(L.sub)+'</p>';
 L.blocks.forEach(function(b,n){
  if(b.t==='h')h+='<h2>'+esc(b.x)+'</h2>';
  else if(b.t==='p')h+='<p>'+b.x+'</p>';
  else if(b.t==='ul')h+='<ul>'+b.xs.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul>';
  else if(b.t==='table')h+='<div class=tw><table>'+b.rows.map(function(r,i){return '<tr>'+r.map(function(c){return i?'<td>'+esc(c)+'</td>':'<th>'+esc(c)+'</th>';}).join('')+'</tr>';}).join('')+'</table></div>';
  else if(b.t==='note')h+='<div class=noteb>'+esc(b.x)+'</div>';
  else if(b.t==='think')h+='<div class=think><b>想一想：</b>'+esc(b.q)+'<br><button class="btn small rv" data-n="'+n+'">看答案</button><div class=hide id="a'+n+'">'+esc(b.a)+'</div></div>';
  else if(b.t==='mcq'){h+='<div class=mcq data-n="'+n+'"><p><b>'+esc(b.q)+'</b></p>';b.o.forEach(function(o,i){h+='<button class="opt" data-n="'+n+'" data-i="'+i+'">'+esc(o)+'</button>';});h+='<div class=note id="m'+n+'"></div></div>';}
  else if(b.t==='go')h+='<a class=btn href="#/quiz/'+b.set+'">'+esc(b.x)+'</a>';});
 render(h);
 [].forEach.call(document.querySelectorAll('.rv'),function(b){b.onclick=function(){$('#a'+b.getAttribute('data-n')).className='note';};});
 [].forEach.call(document.querySelectorAll('.mcq .opt'),function(b){b.onclick=function(){
  var n=+b.getAttribute('data-n'),i=+b.getAttribute('data-i'),bl=L.blocks[n];
  $('#m'+n).innerHTML=(i===bl.a?'✔ ':'✘ ')+esc(bl.e);b.className+=(i===bl.a?' right':' wrong');};});}

function settings(){
 var h='<h1>设置</h1><label>考试日期 <input type=date id=exam value="'+S.exam+'"></label><p><button id=exp class=btn>导出进度</button> <button id=imp class=btn>导入进度</button></p><textarea id=ta rows=5></textarea><p><button id=rep class=btn>复制学习报告（发给 Claude）</button></p><p><button id=rst class="btn bad">重置</button></p>';
 render(h);
 $('#exam').onchange=function(){S.exam=this.value;save();};
 $('#exp').onclick=function(){$('#ta').value=JSON.stringify(S);};
 $('#imp').onclick=function(){try{S=JSON.parse($('#ta').value);save();alert('已导入');}catch(e){alert('格式错误');}};
 $('#rep').onclick=function(){var r=report();$('#ta').value=r;try{navigator.clipboard.writeText(r);}catch(e){}$('#ta').select();};
 $('#rst').onclick=function(){if(confirm('确定重置？')){S=null;try{localStorage.removeItem(KEY);}catch(e){}load();save();route();}};}

function route(){
 var p=(location.hash||'#/home').slice(2).split('/');
 var v=p[0];
 if(v==='cards'&&DECKS[p[1]])cards(p[1]);
 else if(v==='quiz'&&SETS[p[1]])quiz(p[1]);
 else if(v==='wrong')wrongView();
 else if(v==='wrongquiz'){var ids=wrongDue();if(ids.length)quiz(null,ids);else wrongView();}
 else if(v==='wrongall'){var ids2=wrongOpen();if(ids2.length)quiz(null,ids2);else wrongView();}
 else if(v==='lessons')lessonsView();
 else if(v==='lesson')lessonView(p[1]);
 else if(v==='settings')settings();
 else home();}
window.addEventListener('hashchange',route);
load();route();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
