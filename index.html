<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>N2 冲刺</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c0392b">
<style>:root{--bg:#faf8f4;--fg:#222;--card:#fff;--bd:#ddd;--ac:#c0392b;--ok:#1e8449;--ng:#c0392b;--mut:#666}
@media(prefers-color-scheme:dark){:root{--bg:#1b1b1d;--fg:#eee;--card:#27272a;--bd:#3a3a3e;--ac:#ff7b6b;--ok:#58d68d;--ng:#ff7b6b;--mut:#aaa}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 -apple-system,"Hiragino Sans","PingFang SC","Noto Sans CJK JP",sans-serif}
nav{display:flex;gap:16px;padding:12px 16px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg)}
nav a{color:var(--fg);text-decoration:none;font-weight:600}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:8px 0}h2{font-size:18px;margin:24px 0 8px}small{color:var(--mut);font-size:14px}
.sub{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;color:var(--fg);text-decoration:none}
.card span{color:var(--mut);font-size:14px}
.btn,.opt{font:inherit;padding:10px 16px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer;text-decoration:none;display:inline-block;margin:4px 4px 4px 0}
.btn.good{border-color:var(--ok)}.btn.bad{border-color:var(--ng)}.btn.small{padding:4px 10px;font-size:14px}
.opts{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.opt{text-align:left;width:100%}.opt.right{border-color:var(--ok);background:rgba(30,132,73,.15)}.opt.wrong{border-color:var(--ng);background:rgba(192,57,43,.15)}
.flash{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:24px;text-align:center;margin:12px 0}
.front{font-size:32px;font-weight:700}.big{font-size:22px;font-weight:700;margin:12px 0}
.ex,.note{color:var(--mut);font-size:15px;margin-top:8px}
.hide{display:none}.q{font-size:18px}
.ok{color:var(--ok);font-weight:700}.ng{color:var(--ng);font-weight:700}
.noteb,.think{background:var(--card);border-left:4px solid var(--ac);padding:10px 14px;margin:12px 0;border-radius:6px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid var(--bd);padding:6px 8px;text-align:left}th{background:var(--card)}
textarea,input{font:inherit;width:100%;background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:8px}
.tile{font:inherit;padding:8px 12px;margin:4px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer}
.ans{min-height:56px;border-bottom:2px solid var(--bd);margin:12px 0;padding:4px}.bank{margin:12px 0}
.gap{border-bottom:2px solid var(--ac);padding:0 4px}
.rd{font-size:20px;color:var(--ac);margin-top:4px}
audio{width:100%}
</style></head>

window.DATA=window.DATA||{};DATA.audio=[{"id": "B2016G", "name": "2016年7月", "clips": [{"k": "1-1", "sec": 1, "q": 1, "f": "audio/B2016G/1-1.mp3", "s": "1.資料を修正 する 2.修正 してある資料を送る\n3.打ち合わせの日を決める 4.資料について相談する\n電話で男の人と女の人が話しています。\n男の人はこのあとすぐ何をしますか。\n男：はい。桜 デザイン事務所です。\n女：もしもし、いつもお世話になっております。南銀行の鈴木です。\n男：あ、鈴木様、ちょうど先ほどご依頼のあった資料をメールでお送りしたとこ\nろです。\n女：ええ、その件なんですが、拝見したところ、どうもこちらでお願いしたもの\nと内容が違うようで。確か、資料を修正 していただくようお願いしたと思うん\nですけど。\n男：えっ、変更されていませんでしたか。大変失礼いたしました。間違って\n修正前のファイルを添付してしまったんだと思います。\n女：では、すみませんが、新しいものを。\n男：はい、直ちに。\n女：次回以降の打ち合わせの日程については、資料を確認したあと、 改 めて\nご相談させてください。\n男：わかりました。"}, {"k": "1-2", "sec": 1, "q": 2, "f": "audio/B2016G/1-2.mp3", "s": "1.個人情報を引き出しにしまう 2.パソコンに張ってあるメモを取る\n3.古い書類を整理する 4.棚のファイルにラベルをつける\nオフィスで 係 長 が話しています。\n社員はこのあと新たに何をしなければなりませんか。\n皆さん、先月の会議でオフィス環境 の改善についてお 話 しましたが、取り組\nんでくれていますか。 机 の上に個人情報を出したままにしないというのは\n徹底してくれているようですね。以前はメモがたくさん張ってあるパソコンをよ\nく見ましたが、最近はなくなりました。えー、今は使わない 昔 の書類ですが、\nダンボール箱に入ったままになっていますね。年度ごとにファイルにまとめる\nなどしておいてください。あっ、ファイルといえば、たなの中のものは、ラベル\nが付いて整理され、見違えるようになりましたね。"}, {"k": "1-3", "sec": 1, "q": 3, "f": "audio/B2016G/1-3.mp3", "s": "1.声の出し方の練習 を強化する 2.曲 を変更する\n3.生徒に歌の意味を 考 えさせる 4.体力トレーニングを増やす\n学校でコーラス部の女の先生と校長先生が話しています。\n女の先生はこのあとまず何をしますか。\n女：校長先生、あのう、校長先生は以前、コーラス部の指導をされていたこと\nがあると 伺 ったんですが。うちの学校のコーラス部のことで、ご相談したい\nことがあるんです。少しよろしいですか。\n男：ええ、なんですか。\n女：今コンクールに向けて練習 をしているんですけど、生徒たちの声、今ひと\nつ表現力 が乏しくて。声の出し方など、基礎的な練習 を強化したほうがい\nいんでしょうか。\n男：うん、そういう時は、曲全体を見直したほうがいいんじゃないかな。\n女：えっ、曲 を変更するんですか。\n男：いや、みんなで歌詞を読んで、意味を深く理解する時間を取るっていう\n意味ですよ。\n女：はい。\n男：そうすれば、曲の捉え方が変わって、感情の込め方もよくなると思います\nよ。\n女：なるほど。\n男：その後様子を見て、必要だったら、体力トレーニングを増やしたりしてもい\nいと思います。大きく伸びのある声を出すには 体 の強さも必要だから。\n女：ありがとうございます。早速やってみます。"}, {"k": "1-4", "sec": 1, "q": 4, "f": "audio/B2016G/1-4.mp3", "s": "1.一日体験教室に申し込む 2.家具の写真を用意する\n3.会員登録をする 4.道具を買う\n電話でホームセンターの店員と女の人が話しています。\n女の人はホームセンターに行く前に、何をしなければなりませんか。\n男：はい、青空ホームセンターです。\n女：もしもし、あのう、そちらで家具の作り方を教えてもらえるって、インターネ\nットで見たんですが。\n男：ええ、今度の土曜日に、親子向けの一日体験教室をやります。定員が限\nられているので、早めにお申し込みください。\n女：ええと、そうじゃなくて、定期的に集まって、ちょっと本格的なものを作って\nいるサークルのようなものがあるって。初心者なんですが。\n男：ああ、それなら、毎週日曜の午後にやってます。インストラクターが一人\nいますから、初心者の方でも大丈夫ですよ。作りたい家具の写真を持って\nきてください。あくまで、参考にする程度ですが。\n女：わかりました。あっ、ホームページに、会員とうろくが必要だって書いてあ\nりましたが。\n男：それは一度参加されてから、継続すると決められた時で結構です。\n女：そうですか。それから、道具は。\n男：初回は、ここのを使っていただけます。その後は、少しずつご自分で買っ\nて揃えていってください。\n女：わかりました。では、次の日曜日に 伺 います。わたくし、斎藤と申します。\nよろしくお願いします。"}, {"k": "1-5", "sec": 1, "q": 5, "f": "audio/B2016G/1-5.mp3", "s": "1.資料を会場に運ぶ 2.手伝ってくれる人を探す\n3.招待客 の席を確保する 4.弁当を注文する\n大学の事務室で男の人と女の人が話しています。\n女の人はこのあとまず何をしますか。\n男：山本さん、あしたうちの大学で 行 うシンポジウムですが、お願いしていた\n準備進んでますか。\n女：はい。配る資料は、すべて印刷が終わっています。\n男：では早速会場に運んでください。\n女：はい。\n男：結構な量 ですから。何人か手伝ってくれる人を探したほうがいいですね。\n女：今朝声をかけて３人にお願いしてあります。そろそろ来てくれる時間です。\n男：そうですか。それから会場の席ですが、今回は招待客 が来ますから、そ\nの方々の分をとっておかなくちゃいけません。前の方の真ん中辺り、\n十二席に「招待席」と書いた紙を張っておいてください。\n女：わかりました。\n男：椅子に張る紙は山本さんたちが資料を運んでる 間 に、 私 が作っておき\nますから、後で取りに来てくれますか。\n女：はい。\n男：それから、講演していただく先生にお出しするお昼はどうなってますか。\n女：お弁当の予約は済んでるんですが、配達の確認は当日の朝することにな\nっているので、 必 ずやっておきます。\n男：そうですか。頼みますよ。"}, {"k": "2-1", "sec": 2, "q": 1, "f": "audio/B2016G/2-1.mp3", "s": "1.気温が低すぎたから 2.水をやりすぎたから\n3.日光を当てすぎたから 4.鉢を大きいものに変えたから\n花屋で 女 の人と店員が話しています。\n店員はどうして木の元気がなくなったと言っていますか。\n女：すみません、あのう、この木と同じものを２か月前にここで買って育ててる\nんですけど。最近元気がなくて、比較的気温の変化に強くて、世話も簡単\nだって聞いてたんですが。\n男：そうですか。ううん、どうしたんでしょうね。枯れる原因でまず 考 えられる\nのは、水のやりすぎによって、根が腐ってしまうことですけど。\n女：はい。水はやり過ぎないように注意していましたし、日当たりのいいべラ\nンダに常に置くようにしていたんですけど。\n男：ああ、おそらくそれですね。この木は 暖 かい場所を好むんですが、\n直接日光を長く浴びてしまうと、枯れてしまうこともあるんですよ。\n女：ああ、そうなんですか。気をつけなきゃいけませんね。\n男：あと、これからの時期、どんどん枝が伸びてくるので、そのときははちを\n大きいものに変えてください。\n女：あ、はい、わかりました。"}, {"k": "2-2", "sec": 2, "q": 2, "f": "audio/B2016G/2-2.mp3", "s": "1.味があっさりしすぎているところ 2.値段が高いところ\n3.インテリアがはでなところ 4.サービスが良くないところ\n女の人と男の人が話しています。\n女の人はレストランのどんなところが気になったと言っていますか。\n女：昨日、会社の前にできた 新 しいパスタの店に行ってきたよ。\n男：ああ、そこ、僕は行きたいって思ってたんだ。どうだった。\n女：うん、まあ、悪くはなかったけど。ちょっと気になったところもあってね。\n男：えっ、一流のレストランで 働 いてた人がやってるって聞いたけど。\n女：うん、あっさりした味付けで、素材の味を生かした上品な料理が多かった\nよ。決して安くはないけど、まあ、あの味なら、値段も妥当かな。\n男：そうか。じゃ、インテリア？外から覗いただけだけど、色使いが独特だよね。\n女：うん、雰囲気を出そうとしているのはわかるんだけど、実際中に入ってみ\nると、ちょっと派手すぎて、落ち着かないんだ。店の人の気配りや対応なん\nかは、さすがだなと思ったけど。"}, {"k": "2-3", "sec": 2, "q": 3, "f": "audio/B2016G/2-3.mp3", "s": "1.みんなをまとめていくのが苦手だから\n2.就職 のための準備が大変だから\n3.卒 業 前に留学したいから\n4.クラブをやめようと思っているから\n大学で男の学生と女の学生が話しています。\n男 の学生はどうしてクラブの部長になるのを 断 りたいと言っていますか。\n男：あのう、先輩。先週先輩から、来年部長にならないかってお 話 いただき\nましたけど。あれ、やっぱりお 断 りしたいと思ってるんです。クラブのみん\nなをまとめていく役割には興味があるんですが。\n女：そう。 私 がやめた後の部長は田中君にお願いしたいなって思ってたんだ\nけど。やっぱり四年生になると、会社を訪問したり、面接を受けたり、\n就職活動で大変だよね。\n男：いいえ、それはほかの四年生も同じだと思うんですけど、実は卒業前に\nやりたいことがあって。\n女：あ、確か留学したいんだっけ。\n男：はい、それさえなければ、引き受けたかったんですが。途中で部長をやめ\nることになっても、申し訳ありませんし。すみません。\n女：そう。残念だけど、仕方がないね。"}, {"k": "2-4", "sec": 2, "q": 4, "f": "audio/B2016G/2-4.mp3", "s": "1.全体の量 は少ないが、野菜がたっぷりのべんとう\n2.全体の量が少なく、見た目の良いべんとう\n3.全体の量が多く、野菜もたっぷりのべんとう\n4.全体の量が多く、見た目の良いべんとう\n会社で 男 の人と 女 の人が話しています。 女 の人は今回どんな点を重視し\nた弁当をつくろうと 考 えていますか。\n男：山本さん、今回のうちの課の新商品のお弁当の企画、山本さんが担当す\nることになったんだって。\n女：あ、はい。\n男：どんなお弁当を 考 えてるの。確か前回、うちの課が企画したのはお年寄\nりをターゲットにした和風弁当だったよね。\n女：ええ、全体的に量 は少なくても、野菜がきちんと取れるって評判 ですよね。\nで、今回は、ターゲットを若い人に絞った和風弁当にしてみたいんです。\n男性にも女性にも 喜 ばれそうな。\n男：いいんじゃない。最近は若い男性も栄養バランスを意識して、野菜がたっ\nぷり入ったお弁当を好む人多いらしいし。\n女：はい、でも今回私 が 考 えてるのは、野菜よりむしろ、肉とか 魚 とかの\nタンパク質を多めにした、全体的にボリュウムたっぷりの和風弁当なんで\nす。今は女性もバリバリ働いている時代ですから。\n男：ああ、そう。\n女：はい。それに、和食は目で食べるって言うから、ぱっと見た感じも大事で\nすよね。今回は、この２点を重視したお弁当にしたいんです。\n男：なるほどね。"}, {"k": "2-5", "sec": 2, "q": 5, "f": "audio/B2016G/2-5.mp3", "s": "1.看板や地図が外国語で書かれていないこと\n2.インターネットに接続できる場所が少ないこと\n3.交通機関のシステムが複雑で分かりにくいこと\n4.祭りの回数が少なく、見る機会が少ないこと\nテレビのニュースでアナウンサーが話しています。\n緑 町 を 訪 れる外国人が満足していないことはなんだと言っていますか。\n歴史的な建築物と祭りで有名な 緑 町 が、外国人観光客を対象とした満足度\n調査の結果を発表しました。看板や地図が外国語で書かれている。\n無線でインターネットに接続できる場所がある、などの点では、評価を得た\n一方、電車の乗り換えが複雑であるなど、交通機関のシステムがわかりにく\nいという否定的な声も聞かれました。\n来年は五年に一度の緑 祭 りが開催される年です。見る機会の少ないこの祭\nりを目当てに外国人観光客も大勢訪 れる見通しで、早急な対応が期待され\nます。"}, {"k": "2-6", "sec": 2, "q": 6, "f": "audio/B2016G/2-6.mp3", "s": "1.全国の大型スーパーではんばいを始めた\n2.特定の地域で、商品を売る店を増やした\n3.特定の地域向けに新商品を開発した\n4.特定の期間、商品の値段を下げた\n大学で先生がある食品会社について話しています。\nこの会社の野菜ジュースの売り上げが伸びた理由はなんですか。\nこの食品メーカーは、数年前まで、野菜ジュースを大型スーパーなどを中心\nに、全国的に販売していたんですが、売り上げがなかなか伸びなかったんで\nす。\nそこで、売り上げが好調な地域にターゲットを絞り、商品を販売する店の数を\n増やしたところ、売り上げが倍近く増加したそうです。\nこれは新商品を開発したり、商品の価格を下げたりするのではなく、売上に\n関するデータを生かした戦略の一つと言えます。"}, {"k": "3-1", "sec": 3, "q": 1, "f": "audio/B2016G/3-1.mp3", "s": "講演会で 男 の人が話しています。\n皆さんは学校で、ある先生の授業になると決まって眠くなったという経験はあ\nりませんか。\nそれはその先生が身振り手振りを効果的に使って話していなかったからかも\nしれません。\n結婚式でスピーチをする人が緊張のあまり、ただメモを読むように話すのを\n聞いていると、後になってどんな 話 だったか覚えていないというのもこれに似\nています。\nほかの人に何かを伝えたいと思ったら、常に聞き手の様子を 窺 いながら、\n体 を使って話すことが大切です。そうするだけで相手に聞こうと思わせること\nができるんですよ。\n男 の人は何について話していますか。\n1 授業を楽しくする方法 2 人前で緊張せずに話す方法\n3 聞き手が納得する話し方 4 聞き手の興味を引く話し方"}, {"k": "3-2", "sec": 3, "q": 2, "f": "audio/B2016G/3-2.mp3", "s": "テレビでアナウンサーが話しています。\n山川町といえば、緑茶の生産地として有名ですが、この町では風邪やインフ\nルエンザなどの予防のために、家庭でも学校でも水ではなく緑茶で 嗽 をして\nいます。\n緑茶に含まれる成分がウイルスに効くため市場にでないお茶の葉を地域で\n有効に利用しているということです。\nどんな種類の緑茶でも効果があるそうですから、みなさんも試してみてはい\nかがでしょうか。\n私 も最近始めたんですけど、一リットル程度作りおきしておくといつでも使えて\n便利ですよ。\nアナウンサーは主になにについて話していますか。\n1 緑茶でのうがいによる健康法\n2 毎日うがいをすることの重要性\n3 風邪の予防に効果がある緑茶の種類\n4 健康のために飲むとよい緑茶の量"}, {"k": "3-3", "sec": 3, "q": 3, "f": "audio/B2016G/3-3.mp3", "s": "講演会でカウンセラーが話しています。\n近年職場での人間関係や長時間労働によってストレスを抱える人が増えて\nいますが、無理を続けたために、対処が遅れ、長期休養を取らざるをえなくな\nってしまうケースが多く見られます。\n最初の一歩が早ければ、状態が深刻化するのを防ぐことが出来るのですが、\n真面目な人ほど一人で悩みを抱えてしまい、カウンセラーのところにやってく\nる頃には症状 が進んでいることも稀ではありません。\nカウンセラーの存在が広く知られるようになった今日でも、相談に来るのに\n消極的な人が多いのは残念です。\nカウンセラーは主に何について話していますか。\n1 カウンセラーを育成する必要性\n2 早期にカウンセリングを受ける大切さ\n3 現代人のストレスの原因\n4 ストレスを感じやすい人の特徴"}, {"k": "3-4", "sec": 3, "q": 4, "f": "audio/B2016G/3-4.mp3", "s": "テレビで評論家が話しています。\n先月政府が発表した調査結果から、一家族あたりの 魚 の消費量が肉の\n消費量に追い越されたことが分かりました。\nこれは、ここ数年で肉の消費が伸び、それと同時に 魚 の消費が緩やかに減少\nしたためです。肉の消費量については今後も同じ傾向が続くと思われます。\n一方 魚 ですが、これまで専門家の 間 では消費量は減少 することはあっても、\n増加することはないと言われてきました。\nしかし、そうではないと 私 は見ています。最近では和食の良さが 改 めて注目\nされるなど、食に対する意識が変わりつつあるからです。\n女 の人は今後魚と肉の消費量がどう変化すると 考 えていますか。\n1 魚 も肉も増える。 2 魚 も肉も減る。\n3 魚 は増え、肉は減る。 4 魚 は減り、肉は増える。"}, {"k": "3-5", "sec": 3, "q": 5, "f": "audio/B2016G/3-5.mp3", "s": "テレビで専門家が話しています。\n皆さんは仕事でよい結果を残せるタイプですか、それともなかなかうまくいか\nないタイプですか。\n今日は鳥の目と虫の目の 話 をご紹介します。鳥は高いところから対象を\n見渡すので近くでは分からない全体像を捉えることができます。\n一方、虫の目は近くで対象をじっくり見つめるため、対象物の微妙な動きや\n変化をしることができます。\n広い視野で物事を捉え 考 えることと、物事を細かく観察し分析すること。\n職場でもこの両方の目を常に意識していればより良い結果が得られるでしょ\nう。\n専門家の 話 のテーマは何ですか。\n1 鳥の目と虫の目の共通点\n2 自然界の生物の行動パターン\n3 仕事に役立つ物事の見方\n4 自分にあった仕事を見つける方法"}, {"k": "4-1", "sec": 4, "q": 1, "f": "audio/B2016G/4-1.mp3", "s": "女：佐藤さん、社長がお呼びですよ。\n1 ではここで待っています。\n2 すぐに社長を呼んできます。\n3 はい、今すぐ行きます。"}, {"k": "4-2", "sec": 4, "q": 2, "f": "audio/B2016G/4-2.mp3", "s": "女：林さん、 林 さんのスピーチ聞いたよ。練習 したかいがあったね。\n1 やっぱり練習不足ですよね。\n2 そう言っていただけると嬉しいです。\n3 あのう練習 の成果出てませんでしたか。"}, {"k": "4-3", "sec": 4, "q": 3, "f": "audio/B2016G/4-3.mp3", "s": "夏の旅行の飛行機だけど、来月になってからでないとチケット取れな\nいんだって。\n1 そうか、チケットもう取れないんだ。\n2 えー、今はまだ無理なの？\n3 じゃ、急いで買わなきゃ。"}, {"k": "4-4", "sec": 4, "q": 4, "f": "audio/B2016G/4-4.mp3", "s": "この間の食事会、用事でさきに帰っちゃったけど、みんなに悪かったか\nな。\n1 そんな気にすることないよ。\n2 用事が終わったら、また来れば？\n3 みんなは悪くないんじゃない？"}, {"k": "4-5", "sec": 4, "q": 5, "f": "audio/B2016G/4-5.mp3", "s": "加藤さん、加藤さんにお願いしてたイベントの企画書、昨日のうちに\n私 に提 出 してって言っといたよね？\n1 あ、まだ出さなくてよろしいんですね？\n2 すみません、もう少し待っていただけませんか。\n3 分かりました、じゃお願いします。"}, {"k": "4-6", "sec": 4, "q": 6, "f": "audio/B2016G/4-6.mp3", "s": "おかしいな、今日の発表で配る資料、ここにおいといたはずなんだけ\nどなあ。\n1 えっ、ないんですか。\n2 どこで見つかったんですか。\n3 まだ出来てないんですか。"}, {"k": "4-7", "sec": 4, "q": 7, "f": "audio/B2016G/4-7.mp3", "s": "ねえ、田中君、最近林君がテニスのサークルの練習休みがちなんだ\nけど、何か知ってる？\n1 なんか 忙 しいって言ってたよ。\n2 すごい、そんなに練習 してるんだ。\n3 練習 、一度も来てないの。"}, {"k": "4-8", "sec": 4, "q": 8, "f": "audio/B2016G/4-8.mp3", "s": "この間旅行先でばったり部長と会っちゃって。\n1 部長と旅行の約束してたの？\n2 へえー、そんなことあるんだ。\n3 なんとか、うまく会えてよかったね。"}, {"k": "4-9", "sec": 4, "q": 9, "f": "audio/B2016G/4-9.mp3", "s": "加藤さん、昨日の鈴木君のプレゼン、文句の付けようがなかったね。\n1 そうかな、よく 考 えられてたと思わない？\n2 文句があるなら、言ってみたら？\n3 すごく説得力があったね。"}, {"k": "4-10", "sec": 4, "q": 10, "f": "audio/B2016G/4-10.mp3", "s": "駅前にできたラストラン値段が高い割に味はいまいちだったよ。\n1 高くても行く価値はありそうだね。\n2 そりゃ、やすければ、美味しくないに決まってるよ。\n3 行こうかと思ってたけどやめとこう。"}, {"k": "4-11", "sec": 4, "q": 11, "f": "audio/B2016G/4-11.mp3", "s": "森さん、森さんの企画案が今回通らなかったからって、落ち込むこと\nないよ。\n1 そんなに叱らないでよ。\n2 うん、次があるよね。\n3 え、企画通ったんだ。"}, {"k": "4-12", "sec": 4, "q": 12, "f": "audio/B2016G/4-12.mp3", "s": "先輩、ざっとでいいので、この書類に目を通していただけないでしょう\nか？\n1 じゃ、早速やってもらえるかな。\n2 え、僕が全部直すの？\n3 後でも良かったら、見とくよ。"}, {"k": "5-1", "sec": 5, "q": 1, "f": "audio/B2016G/5-1.mp3", "s": "レストランで店のオーナーと店員二人が話しています。\nA：このところ毎月売上が落ちている、客 も減る一方だな。何かいい対策はな\nいかな。\nM：料理には自信を持ってるんですが、お客様の好みが変わってきたんでしょ\nうか。\nF：お客様からの料理の評価は高いですよね。\nA：そう、となると……。\nF：あのう、思い切って店の雰囲気を変えてみたらどうでしょう？インテリアに\n特色をだして、最近近所にできたレストランうちと似たような店ですけど、\n雰囲気がおしゃれって、評判 なんです。\nM：確かに、でも店の中を大きく変えるためには結構長い間 閉 店 しなくちゃい\nけないし、費用もかかりますよね。\nA：そうだな。\nM：あの、インターネットの掲示板に店の広告を出したら、客 が急増したところ\nがあるってテレビで見ました。\nA：そんなに宣伝効果があるもんなんだ。それって簡単にできるの？\nM：簡単ですよ。費用もそんなにかからないし。\nA：うん、前にドリンクの無料サービス券を配ったことがあったけど、近所の人にし\nか利用してもらえなかったしな。うちも時代に合わせて変わらないとね。\nM：そうですね。\nA：まあ、確かにインテリアの方もずいぶん変えてないから、こっちもいずれど\nうするか 考 えないとね。\n店の売上を上げるために、まず何をすることにしましたか。\n１ 料理の味を見直す ２ 店のインテリアを変える\n３ 新しい宣伝方法を試す ４ サービスを見直す"}, {"k": "5-2", "sec": 5, "q": 2, "f": "audio/B2016G/5-2.mp3", "s": "留学説明会で 男 の人が話しています。\n夏休みに一ヶ月海外で実施する語学研修についてですが、受け入れ先の\n語学学校を四つ紹介します。こちらのパンフレットをご覧下さい。\n一番の学校は首都にあって交通も便利なので、授業が終わってからいろい\nろな活動ができると四つのなかでは最 も人気があります。\nそれから二番の学校は町中からはだいぶ離れた静かな場所にあります。周\nりに娯楽施設がないので、勉強 に集 中 するには最適です。四週間大学の寮\nで生活します。週末は学校で様々なイベントがあり、地元の友だちもたくさん\nできますよ。\n三番の学校も同じく都心から離れていて日本人のほとんどいない地域にあり\nます。ここは滞在期間中、ずっとホームステイができるのが魅力です。\n最後にこちらの四番の学校は授業が厳しいことで有名です。町の中心部に\nあって、学校の設備は一番整っています。\nＦ：どこがいいか迷っちゃうな。地元の友だちができるのはいいよね。あ、でも\nやっぱり一番人気があるところにしようかな。一番人気があるってことはき\nっといい学校だよね。\nＭ：そこの学校に留学した人何人か知ってるけど、日本人が多くて、\n授業以外は結局日本語で話しちゃうから、思ったより語学力が伸びなかっ\nたって言ってたよ。\nＦ：へ、そうなんだ。\nＭ：ぼくは一度その国の家庭でありのままの暮らしを体験してみたかったから、\nここかな。現地の人の生活を知ることができるしね。\nＦ：へえ、二三日だったら、楽しいかも知れないけど。ずっと他人と一緒だとス\nトレスたまりそう。\nＭ：まあ、それも経験だよ、寮 だって似てると思うし。\nＦ：そうか。 私 は行くからにはしっかり勉強 できるところがいいな。実力が付\nかないんじゃ行く意味ないしね、でも気分転換も必要だから、学校帰りにシ\nョッピングに行ったり出来るところ。うん、ここにする。\n質問１：男の学生は何番の学校に留学したいと言っていますか。\n1 一番 2 二番 3 三番 4 四番\n質問２：女の学生は何番の学校に留学したいと言っていますか。\n1 一番 2 二番 3 三番 4 四番"}, {"k": "5-3", "sec": 5, "q": 3, "f": "audio/B2016G/5-3.mp3", "s": "（自动语音转写，个别字可能有误）\n三番\nまず\n話を聞いて下さい\nそれから\n二つの質問を聞いて\nそれぞれ問題用紙\n一から四の中から\nもっと\nい\n一つ選んでください\nでは\n始めます\n説明会\n男の人が話しています\n夏休みに一カ月\n海外で実施する語学研修についてですが\n受学学校を四つ紹介します\nパンフレットをご覧下さい\n一番の学校は\n首都にあって交通も便利なので\n授業が終わってからいろいろな活動ができる\n四つの中では最も人気があります\nそれから\n二番の学校は\n街なかからはだいぶ離れた静かな場所にあります\n周りに娯楽施設がないので\n勉強に集中するには最適です\n四週間\n大学の寮で生活します\n週末は学校でさまざまなイベントがあり\n地元の友達もたくさんできますよ\n三番の学校も\n同じく都心から離れていて\n日本人がほとんどいない地域にあります\nここは\n期間中\nホームステイができるのが魅力です\n最後に\nこちらの四番の学校\n授業が厳しいことで有名です\n町の中心部にあって\n学校の設備は一番整っています\nどこがいいか迷っちゃうな\n地元の友達ができるのはいいよね\nでもやっぱり一番人気があるところにしようかな\n一番人気があるってことは\nいい学校だよね\nそこの学校に留学した人何人か知ってるけど\n日以外は結局日本語で話しちゃうから\n思ったより語学力が伸びなかったって言ってたよ\nえっ\nそうなんだ\n一度その国の家庭でありのままの暮らしを体験してみたかったからここかな\n人の生活を知ることができるしね\n二十三日だったら楽しいかもしれないけど\nずっと他人と一緒だとストレスとなりそう\nそれも経験だよ\n亮だって似てると思うし\nそっか\n私は行くからには\n勉強できるところがいいな\n実力がつかないんじゃ行く意味ないしね\nでも\n転換も必要だから\n帰りにショッピングに行ったりできる所\nここにする\n［質問\n一\n男の学生は\n何番の学校に留学したいと言っていますか\n質問\n二\n女の学生\n何番の学校に留学したいと言っていますか"}]}, {"id": "B2016L", "name": "2016年12月", "clips": [{"k": "1-1", "sec": 1, "q": 1, "f": "audio/B2016L/1-1.mp3", "s": "会社で課長と男の人が話しています。\n男の人は、この後何をしますか。\n1.先週 の会議の記録を作成する 2.調査結果を入 力 する\n3. 林 さんに電話をする 4.プレゼンのしりょうを作成する\n女：ちょっといい?\n男：はい、課長。\n女：今 林 さんから電話があって、お子さんが熱を出して、今日は会社を\n休むそうなの。それで、悪いんだけど、先週の会議の内容を代わりに\nまとめてもらえない？明日の会議で使うから、今日の昼までにお願い\nしたいんだけど。前もやったことあるよね。\n男：あ、はい。ただ、午前中にその作業が入ると、今やってる調査結果の\n入 力 が今日中には終わらなくなってしまいますが。\n女：ああ、じゃあ、今してもらってるほうは他の人にお願いしましょう。\n男：わかりました。作業の詳細は 林 さんに電話で確認したほうがいいで\nすか。\n女：あ、パソコンにある共有フォルダーに途中まで作業したのが入ってい\nて、見ればわかるそうだから。\n男：はい。わかりました。\n女：この前も他の人が休んだときに、プレゼンの資料を作ってもらったよ\nね。申し訳ないけど、よろしくね。\n男：はい。"}, {"k": "1-2", "sec": 1, "q": 2, "f": "audio/B2016L/1-2.mp3", "s": "駅の改札口で、女の人と駅員が話しています。\n女の人は今ここでいくら払いますか。\n1.2000 円 2.1000 円 3.900 円 4.100 円\n女：すみません。切符をなくしてしまって、山川駅から乗ったんですが、よ\nく探したんですけど、見つからなくて。\n男：もう一度乗車券を購入していただくことになります。\n女：あのう、全額払わなければなりませんか。\n男：はい。山川駅からですと、1000円ですね。\n女：でも、確かに切符を買ったんですが。2000円も払うことになっちゃうん\nですけど。\n男：同じ切符を2回買っていただくことになってしまいますが、そういう\n規則ですので。申し訳ありません。\n女：そうですか。\n男：今から切符を再発行したという証明書をお出ししますので、なくされ\nた乗車券が出てきましたら、どちらの駅でもけっこうですので、証明書\nとその乗車券をご提示ください。そうしましたら、乗車料金から払い戻\nしの手数料分100円を差し引いた900円をご返金しますので。\n女：わかりました。"}, {"k": "1-3", "sec": 1, "q": 3, "f": "audio/B2016L/1-3.mp3", "s": "大学で、 男 の学生と 女 の学生が話しています。\n男 の学生はこの後、まず何をしますか。\n1.駐輪場で張り紙を見る 2.大学で申請書の準備をする\n3.市役所に申請書を取りに行く 4.市役所で学生証をコピーする\n男：あっ、中野さん。中野さんって大学の最寄り駅の駐輪場を借りて、\n大学まで自転車で来てるよね。僕も駅前の駐輪場を借りたいんだけ\nど、どうやって申請するか教えてくれない。\n女：うん。でも申請の締め切りって毎月二十日だから、今日締め切りだよ。\n男：え、本当？\n女：うん。駐輪場に張り紙がしてあったのを見たよ。\n男：そうなんだ。今日四時半まで授業終わるのに、どうしよう。申し込み\nは駐輪場の受付でするの？\n女：ううん、市役所。窓口は五時までだから、申請書を用意して 予 め\n記入しておけば、ぎりぎり間に合うんじゃない？\n男：でも、申請書は市役所に取りに行かないとだめなんだよね。\n女：市役所のホームページからもダウンロードできるよ。午後の授業が\n始まるまで、まだ時間あるから、印刷してすぐ提 出 できる状態にして\nおいたら？\n男：うん。そうする。申請書のほかに必要な書類ってある？\n女：学生証のコピーが要るんだけど、それは市役所でコピーすればいいよ。\n男：わかった。"}, {"k": "1-4", "sec": 1, "q": 4, "f": "audio/B2016L/1-4.mp3", "s": "女の人と男の人が話しています。\n女の人はこの後まず、何をしますか。\n1.インターネットで店を探す 2.木村さんに道具を借りる\n3.アウトドア用品の店で道具を買う 4.初心者向けの講座に参加する\n女：木村さん、夏休みに家族でキャンプに行きたいんですが、初めてな\nんで、道具とかどうしたらいいかわからなくて、木村さんはよく行かれ\nるんですよね。何かアドバイスいただけませんか。\n男：うん、最近はインターネットにいろんな情報が載ってるから、まずは\nネットで調べてみたら。\n女：そう思って調べてみたんですけど、情報が多すぎでよくわからなかっ\nたんです。\n男：そっか、僕のを貸してあげてもいいんだけど、一人用のだからなあ。\n女：そうですか。\n男：あ、アウトドア用品の専門店が企画してるキャンプの講座があるんだ\nけど、お店、紹介しようか。初めての人対象でキャンプのベテランがい\nろいろ教えてくれるよ。\n女：ええ、でもそれに出たらその店でキャンプの道具を買わされたりしな\nいですか。\n男：まあ、宣伝もかねてるんだろうけど、むりやりなんてことはないよ。\n女：それならいいですね。じゃそうします。"}, {"k": "1-5", "sec": 1, "q": 5, "f": "audio/B2016L/1-5.mp3", "s": "会社で男の人と女の人が話しています。\n女の人は、これから何をしなければなりませんか。\n1.工場の管理の状 況 を調べる 2.契約農家に状 況 を聞く\n3.運送会社に状 況 を聞く 4.倉庫の保存状況を調べる\n男：うちのお茶の葉の品質管理のことで調べてほしいことあって、実は、\n市場に出る前でよかったんだけど、一部の製品の質が通常より悪いこ\nとがわかってね。\n女：え、そうなんですか。\n男：いつもと香りが違っていて、それで、うちの部が中心となって可能性\nのあるところを調べて、原因を特定することになったんだ。\n女：そうですか。どこをあたりましょうか。工場からでしょうか。\n男：工場のほうは、気温や湿度などの管理の状 況 を調べてもらったとこ\nろ、特に問題はなかったんだよ。\n女：では、生産者側への確認ですか。うちが契約している農家に問い合\nわせましょうか。\n男：うん、それは生産地に近い支社の担当者が対応することになってい\nるんだ。それより、農家から工場までの輸送は外部に頼んでるだろう。\nどのように運んでいたか、向こうの会社の担当者に確認してもらいた\nいんだよ。暑い時期だしね。\n女：わかりました。あっ、うちの倉庫で製品を保存しているうちにってこと\nも 考 えられますか。そちらの状 況 も調べたほうがいいでしょうか。\n男：ありがとう。そこは 私 がやるから。\n女：はい。ではすぐ取り掛かります。"}, {"k": "2-1", "sec": 2, "q": 1, "f": "audio/B2016L/2-1.mp3", "s": "男の学生と女の学生が話しています。\n男の学生のうちに警察官が来た目的は何ですか。\n1.近所で起こった事件について調べるため\n2.災害時の非難場所を知らせるため\n3.どこにだれが住んでいるのか知るため\n4.担当地域の住民 にあいさつするため\n男：この前突然うちに警察官が尋ねてきたんだよ。\n女：え？近くでなんか事件でもあったの？\n男：うん、僕もそう思ったんだ。一人暮らしですか、一緒に住んでる家族\nはいますかって聞かれて、何か 疑 われてるのかなって。\n女：うん、うん。\n男：そうしたらね、火事とか何か災害があったときに、住民 の無事を確認\nする必要があるから、定期的にそういうの聞いて回ってるんだって。\n女：ああ、そういうとき、どこに誰が住んでるか分かってないとね。\n男：うん、警察の人が来るなんてびっくりしたって正直に伝えたら、ほか\nにも地域の担当警官が変わったときに、挨拶に回ったりすることもある\nって。\n女：え、警察官があいさつに来るの？知らなかった。"}, {"k": "2-2", "sec": 2, "q": 2, "f": "audio/B2016L/2-2.mp3", "s": "研究会で学生と先生が話しています。先生はこの学生の研究発表\nについて、何が問題だったと言っていますか。\n1.緊張して落ち着きがなかったこと\n2. 話 の進み方が適当でなかったこと\n3.声が小さくて聞き取りにくかったこと\n4.質問への対応がよくなかったこと\n女：先生、先ほどの 私 の発表何か問題があったでしょうか。先生、渋い\nお顔されていたので…\n男：。 私 の表 情 まで見えてましたか、初めてにしてはたいしたもんだ。落\nち着いてた証拠だね\n女：いえ、そんなことは…すごく緊張しました。\n男：まあ、全体的には合格点と言えるんだけどね。 話 の運び方が、まず\nは全体像、その後で調査の方法とか結果とか詳細へと進めるといい\nよ。聞いている人にとっては初めて聞く 話 なんだから。ああやって細\nかいところから伝えられるとね。\n女：はい。\n男：でも、まあ、発表の時の声の大きさも適当だったし、受けた質問への\n対応も好感が持てたし、なかなかのものだったよ。\n女：あ、はい。次からはご指摘いただいた点、気をつけます。"}, {"k": "2-3", "sec": 2, "q": 3, "f": "audio/B2016L/2-3.mp3", "s": "男 の人と 女 の人が話しています。\n女 の人はどうしてカフェの開店を延期することにしましたか。\n1.スタッフの数がそろっていないから\n2.店の工事が間に合わないから\n3.メニューが決まっていないから\n4.注文した食器がとどいていないから\n男：前田さん、来週カフェをオーペンするんだよね、どう、 順 調 ？\n女：うーん、従業員募集してるんだけど、必要人数に達してなくて、夕方\nから夜にかけて勤務できる人が必要なんだけどねえ。先月までは店\nの工事がずいぶん遅れてて心配 したんだけど、そっちは何とか間に\n合ったのに。そういうわけで結局オーペン１ヶ月先になったんだ。\n男：ええ？本当？でも、まあ、焦って開店してサービスの評判 を落とすよ\nり、延期してでもちゃんと準備したほうがいいよ。あ、メニューは決まっ\nた？前に、どんなメニュー出すか悩んでただろう？\n女：うん、完成した。食事のメニューも充実してるから、オーペンしたら、\n食べに来て。あ、食器もこってるんだよ。飲むカップによって、おいしさ\nが変わってくるなんてことも言われるでしょう。ほとんどの食器海外か\nら取り寄せたんだ。\n男：海外から食器を？すごいな！オーペン楽しみにしてるよ。"}, {"k": "2-4", "sec": 2, "q": 4, "f": "audio/B2016L/2-4.mp3", "s": "大学で休み時間に 男 の学生と 女 の学生が話しています。\n女 の学生はどうしてぼんやりしていましたか。\n1. 考 え事をするため 2. 頭 の中を整理するため\n3.脳を休めるため 4. 体 をリラックスさせるため\n男：森さん、さっきからずっとぼんやりして、何か考え事？\n女：あ、うん、あのね、昨日テレビで、ぼんやりすることにはすごい効果が\nあるって紹介してたんだ。五分ぐらい目を閉じて何も 考 えないでぼん\nやりしてると、 頭 の中の情報が整理されて記憶が定着しやすくなるっ\nていう実験結果があってね。\n男：へえ、ぼんやりしてるときは、のうがやすんでるんじゃないの？\n女：そう思うでしょう？ところがのうは活発に 働 いてるんだって。私先 の\n授業で山ほど知識詰め込んで、ごちゃごちゃなってるから、さっそくぼ\nんやりを実践しようとしてたんだ。\n男：あ、じゃ、邪魔しちゃったね。\n女：ううん、あ、そういえば、疲れてるときなんかにこれやると、すっきりし\nて、 体 がリラックスするとも言ってたな。\n男：へえ、僕も今度やってみるよ。"}, {"k": "2-5", "sec": 2, "q": 5, "f": "audio/B2016L/2-5.mp3", "s": "テレビでアナウンサーと大学の教授が話しています。\n教授が大学の研究 で心配しているのはどんなことですか。\n1.すぐに社会に役立つ研究 が少ないこと\n2.産業界の協力 が得られなくなること\n3.実用化までに時間がかかりすぎること\n4.基礎 研究 が重視されなくなること\n女：今日は物理学の青木教授に大学での研究 が抱える問題についてお\n話 を 伺 います。\n男： 私 は大学で40年研究・教育に取り組んでいます。かねてから大学の\n研究 はすぐに社会に役立つものが少ないと批判を受けることがあります。\n女：ええ。\n男：もちろん、科学は最終的に人の役に立つものであるべきです。昨今\nでは産業界の協力 を得て応用技術の開発や実用化が比較的短い\n期間で可能になりました。が、本来大学の使命というのは基礎研究に\nあります。\n女：基礎研究というのは木の根っこのようなものですね？\n男：ええ、そこをしっかりやってこそ様々な応用、科学の発展へとつなが\nっていくんです。根っこが枯れてしまっては取り返しが付きません。\n社会や産業界からすぐに役立つ研究 、より早い実用化が求められる\nのも分かりますが、大学の本来の使命が見失われてしまうことに 私\nは大変危機感を持っています。"}, {"k": "2-6", "sec": 2, "q": 6, "f": "audio/B2016L/2-6.mp3", "s": "照明器具の店で店員が 新 しい商品について話しています。\nこの商品にはどんな機能がありますか。\n1.電気をつけておく時間が設定できる\n2.動くものに反応して電気がつく\n3.電気の明るさが細かく調節できる\n4.外の明るさに応じて電気の明るさが変わる\n男：こちらの照明は防犯を意識したものです。タイマーをセットすれば、\n室内の電気のオン・オフが普段と同じ時間に出来るので、旅行などで家\nを空けても外から留守だと分かりません。防犯用照明というと、これまで\nは、たとえば、人の動きに反応してつくものなど、屋外の照明に限られ、\nこういった室内用のものはありませんでした。最近の室内照明は、明るさ\nを細かく調節出来たり、外の明るさに応じて、自動的に電気の明るさを\n変える機能があったりと省 エネーをアピールしたものが主流ですが、こち\nらの商品は特定のニーズに答えたものといえますね。"}, {"k": "3-1", "sec": 3, "q": 1, "f": "audio/B2016L/3-1.mp3", "s": "ラジオで男の人が話しています。\n男：ええ、和紙、伝統的な日本の紙ですね。その和紙の専門店に最近行\nったんですけど、そこにきれいな折り紙の作品が飾ってあったんですよ。\n折り紙は千年ほど前、和紙を使って贈り物を美 しく包装するために折り\n方を工夫することから始まったそうです。そして、和紙が安く生産される\nようになると、一枚の和紙からさまざまな 形 を生み出す遊びとして、子ど\nもたちの 間 でも人気が出て、折り方の本も出版されるようになりました。\n近代になると、幼稚園などの教育現場にも取り入れられ、今も広く親しま\nれています。\n男 の人は何について話していますか。\n1 和紙でものを美 しく包む方法\n2 折り紙の始まりと歴史\n3 教育現場に折り紙が取り入れられた理由\n4 和紙ができるまでの流れ"}, {"k": "3-2", "sec": 3, "q": 2, "f": "audio/B2016L/3-2.mp3", "s": "会社の企画部の会議で、女の人が話しています。\n女：先月、20歳代から50歳代の 働 く女性を対象に、ストレスと香りに関\nするアンケート調査を 行 ったんですが、なんらかのストレスを感じる、と\n答えた人のほうが、香りを重視してシャンプを購入していました。ええ、そ\nれから以前よりも仕事を持つ女性のストレスが増えているということもわ\nかりました。そこで、 新 しい商品作りには、この結果を取り入れ、リラック\nス効果の高い香りがするシャンプという方向で進めていくのがいいと思\nいます。ストレス解消を求める 働 く女性にアピールしていけば、販売数\nの上 昇 に繋がるのではないでしょうか。\n女の人は何について話していますか。\n1 調査結果に基づく商品開発の方向性\n2 働 く女性に対する調査の方法\n3 シャンプの販売実績\n4 新商品のストレス解消への効果"}, {"k": "3-3", "sec": 3, "q": 3, "f": "audio/B2016L/3-3.mp3", "s": "子育て教室で、 男 の人が話しています。\n男：この中には初めてお子さんを育てるという方もいらっしゃるでしょう。\n子どもが成長 する過程で、絵本は欠かせないものです。赤ちゃんがまだ、\n言葉がわからないうちは、ストーリーを理解できないから絵本は無理だと\n思う方も多いかもしれませんが、始めは色や 形 や、音のリズムが面白\nいものなら興味を持つはずです。赤ちゃんが成長するにつれて、挨拶や\n生活のマナーなどが学べるものを取り入れていくといいですね。さらに\n理解力が高くなってきたら、わくわく、どきどきするようなストーリーのある\nものを親子で一緒に楽しんでみたらいかがでしょうか。\n男 の人は何について話していますか。\n1 子育てにおける絵本の役割\n2 子どもが絵本を好きな理由\n3 成長に応じた絵本の選び方\n4 絵本におけるストーリーの重要性"}, {"k": "3-4", "sec": 3, "q": 4, "f": "audio/B2016L/3-4.mp3", "s": "ラジオで女の人が話しています。\n女：健康のためには毎日の運動が必要だと分かっていても、なかなか続\nけられない方も多いと思います。でも、毎日の過ごし方を少し変えるだけ\nで、軽いスポーツをするのと同等の効果が得られるそうなんです。じっと\nしている時間を30分減らす。その程度で十分 です。これならちょっと気分\nを変えて、テレビを見る代わりに近所を散歩する。友人と喫茶店で話す\n代わりにウィンドウショッピングを楽しむなど、日ごろしていることを少し\n見直すだけで、出来そうですよね。\n女の人は何について紹介していますか。\n１ 日常生活に運動を取り入れる工夫 ２ スポーツの楽しみ方\n３ 無駄な時間をなくす工夫 ４ 気分転換の仕方"}, {"k": "3-5", "sec": 3, "q": 5, "f": "audio/B2016L/3-5.mp3", "s": "小学校で先生が児童の親たちに話しています。\n男 ：もうすぐ夏休みです。海水浴や山登りなどいろいろな計画を立てて\nいらっしゃると思います。ただ毎年休みの 間 に、海や山など出かけた先\nで怪我をする子供がいます。楽しい夏休みが台無しにならないよう、遊\nぶときのルールを子供と一緒に決めるようにしてください。たとえば、海\nであれば、泳ぐ前に体操をすること、沖に流されないよう、砂浜に近いと\nころで遊ぶことなどを約束するといいでしょう。いずれにしても、大切なこ\nとは、ご両親が子供の行動を見守ることです。どうぞよろしくお願いします。\n先生は何について話していますか。\n1 夏休み 中 の学校行事の予定\n2 夏休みを安全に過ごすための注意点\n3 怪我をしたときの対処法 4 海や山で守るべきマナー"}, {"k": "4-1", "sec": 4, "q": 1, "f": "audio/B2016L/4-1.mp3", "s": "トムさん、よかったら今日の夕食、うちにおいでになりませんか。\n1 ええと、何時に来られますか。\n2 えっ、 伺 ってもよろしいんですか。\n3 今日はうちにはおりませんが。"}, {"k": "4-2", "sec": 4, "q": 2, "f": "audio/B2016L/4-2.mp3", "s": "駅前のあの人気のレストラン、昨日行ってみたけど、味は期待した\nほどじゃなかったよ。\n1 ええ？期待してなかったのに？\n2 ああ、だから込んでるんだね。\n3 ええ？何で人気があるんだろう。"}, {"k": "4-3", "sec": 4, "q": 3, "f": "audio/B2016L/4-3.mp3", "s": "部長、社内アンケート、山田さんを除いて全員から回答を得ました。\n1 山田さん、回答早いなあ。\n2 山田さん、答えてないの。\n3 山田さんが全員分集めたんだね。"}, {"k": "4-4", "sec": 4, "q": 4, "f": "audio/B2016L/4-4.mp3", "s": "佐藤さん、日曜のバイト、 私 と時間かわってもらうわけにいかない?\n1 別にかまいませんけど。\n2 えっ？かわってませんけど。\n3 僕、お願いしてませんけど。"}, {"k": "4-5", "sec": 4, "q": 5, "f": "audio/B2016L/4-5.mp3", "s": "昨日、初めて劇場で芝居見たんだけど、また行きたくてたまらない\nんだ。\n1 何がたまってないの？\n2 また 行 っちゃったの？\n3 そんなに感動したの？"}, {"k": "4-6", "sec": 4, "q": 6, "f": "audio/B2016L/4-6.mp3", "s": "課長、プリンター、修理に出したんですが、もう買い替えるしかない\nって言われました。\n1 じゃ、 新 しいの、買わなきゃね。\n2 買い替える必要ないってこと?\n3 それなら、修理してもらおう。"}, {"k": "4-7", "sec": 4, "q": 7, "f": "audio/B2016L/4-7.mp3", "s": "キムさん、レポートチェックしたよ。ここの数字さえ直せば問題ないよ。\n1 数字のほかはどこですか。\n2 すぐに訂正します。\n3 何も問題がなくて安心しました。"}, {"k": "4-8", "sec": 4, "q": 8, "f": "audio/B2016L/4-8.mp3", "s": "この会議室、壁の色を変えたせいか広く見えるんじゃない?\n1 わかりました。そうしてみます。\n2 本当、変えて正解ですね。\n3 色のせいで広く見えないんですか。"}, {"k": "4-9", "sec": 4, "q": 9, "f": "audio/B2016L/4-9.mp3", "s": "このアパート、この間取りと設備でこの家賃、言うことなしだね。\n1 本当、家賃がちょっとね。\n2 こんないい条件、ほかにないよね。\n3 それじゃあ、あきらめようか。"}, {"k": "4-10", "sec": 4, "q": 10, "f": "audio/B2016L/4-10.mp3", "s": "今週は仕事のスケジュールがぎっしりで、嫌んなっちゃうよ。\n1 忙 しそうだけど、無理しないようにね。\n2 まだスケジュールが決まらないの。\n3 今週は仕事が少ないんだね。"}, {"k": "4-11", "sec": 4, "q": 11, "f": "audio/B2016L/4-11.mp3", "s": "僕、スキーするの、今日五年ぶりですよ。できるかな。\n1 五年なら 体 が覚えてますよ。\n2 今日から五年もできないんですか。\n3 五年間も続けてるなんてすごいですね。"}, {"k": "4-12", "sec": 4, "q": 12, "f": "audio/B2016L/4-12.mp3", "s": "所長、事務所の防災グッズ確認したら、足りないものだらけです。\n1 ああ、足りないものはなかったんだね。\n2 あっ、一つだけ足りなかったの。\n3 え、足りないもの、そんなにあった?"}, {"k": "5-1", "sec": 5, "q": 1, "f": "audio/B2016L/5-1.mp3", "s": "大学で、男の学生と職員が話しています。\n男：すみません、アルバイトを紹介してもらいたいんですが、お客 さんと\n接する仕事がいいんですが、どんなのがあるか教えていただけませ\nんか。時給は出来たら、900円以上で、週三日までで探しているんです\nけど。\n女：ええと、条件に近いものが四つありますよ。まず、これですね。\n大学正門前のコンビニです。時給８５０円で週三日、早朝と深夜は\n時給が100円高くなるそうです。それから大学の前の大通り沿いの\nガソリンスタンドですね、時給1200円です。ただ土日を含めて、週 4\n日以上勤務できる人が希望だそうです。\n男：どちらもお客 さん相手なのはいいですね。\n女：後、大学から駅に行く途中にあるレストランでも募集していますよ。\n時給１１００円。調理の補助をまれに頼まれることもあるそうですが、\n基本的には注文を取ったり、料理を出したりする仕事で、週二日来て\nほしいそうです。\n男：キッチンの仕事もたまにならいいかな。\n女：えー、それから、駅前のデパートでのアルバイト。売り場には出ない\nで商品を発送する仕事になりますが、勤務日数が自由に決められま\nすし、時給1300円と高いのが魅力だと思いますよ。\n男：うーん、直接お客 さんとやり取りできる仕事で、出来るだけ時給が高\nいのがいいです。クラブ活動などもあって、勤務日は増やせないから、\nこれにします。\n男の学生はどのアルバイトを選びますか。\n1 コンビニ 2 ガソリンスタンド 3 レストラン 4 デパート"}, {"k": "5-2", "sec": 5, "q": 2, "f": "audio/B2016L/5-2.mp3", "s": "環境問題を学ぶ学生三人が授業でのグループ発表について話して\nいます。\n女１：今度の 桜 蛙 を守る地域の活動についてのグループ発表だけど、\n昨日の練習だと１０分以内におさまりそうになかったよね。どうしようか。\n男：前半で 蛙 が減っている現状について説明しておいて、後半で写真を\n見せながら、 蛙 を守る活動の重要性について話す構成なのに、後半\n時間が足りなくなっちゃったよね。後半で見せる写真を少し減らそうか。\n女2：そうしたら、活動の様子が伝わりにくいことはない？\n男：そうか。\n女２：前半の減っている現状については、少し省けるところがあると思っ\nたけど。\n女１：たとえば？\n女２：説明で似たような内容を繰り返しているから、そこをカットするとか。\n女１：なるほどね、ほかにはないかな？\n女２：そうだな、前半の発表は 私 の担当だけど、昨日は少しゆっくりしゃ\nべりすぎたかな？少し速めに話そうか。\n女１：話し方で調整 か。\n男：それか、活動の重要性について話す前に、地域の学校でどんな活動\nが 行 われてるでしょうってクイズを入れているよね、あれをなくせば、\n後半の時間が確保できるんじゃない？\n女1：いや、聞いている人に興味を持ってもらうためにあれはいい工夫だ\nと思うよ。\n女２：うん、私もそう思う。\n女１：じゃ、話すスピードは今より速くすると聞きにくくなっちゃうと思うから、\nやっぱり現状のところを整理しよう。\n質問：発表の時間を 短 くするために、どう変更することにしましたか。\n1 前半の説明を 短 くする 2 前半を早めに話す\n3 クイズをやめる 4 後半の写真を減らす"}, {"k": "5-3", "sec": 5, "q": 3, "f": "audio/B2016L/5-3.mp3", "s": "町の市民講座で交通安全についての説明を聞いて夫婦が話してい\nます。\n男1：今日は町の交通安全について 考 えたいと思います。グループに分\nかれて問題になっている地域の現状を見に行き、その後対策を話し合\nいますので、一つ選んでください。\nまず、北中通りです。駅前の大通りで、子供に自転車が多く止められて\nいて、歩きにくいと苦情が寄せられています。\n次は運動公園沿いの大川通りです。週末公園の利用者の車 が駐車場\nに入りきらず、とおりに駐車するため、問題になっています。\n次の上田通りは近くに小学校があり、児童が通学で利用しています。し\nかし、歩道が狭く安全を心配する声が上がっています。\n最後の山下通りは商店街です。自転車の通行量が多く、歩行者が安心\nして買い物できる対策が求められています。\n男２：どこにする？この前公園の近くを歩いてたら、確かに道路に駐車し\nている車 が多かったな。\n女：うん、でも親としては、子供が毎日登校や下校に使う道路の安全の\nほうが心配じゃない？\n男2：そうだね。僕もそっちのほうが心配だな。\n女：じゃ、きまり、一緒に行こう？\n男２：あ、でも僕自転車の問題も気になってるんだ。通勤で急いでいると\nき迷惑なんだよ。\n女：あ、商店街でしょう。 私 も自転車とぶつかりそうになったことあるよ。\n男２：僕が言ってるのはそこじゃないよ。朝とか人通りが多いときに、\n歩道に置いてあると邪魔なんだよね。僕はそっちを見に行くよ。\n女：分かった、じゃあ、別々に見に行こう。\n質問1 女の人はどこを見に行きますか。\n1 北中通り 2 大川通り 3 上田通り 4 山下通り\n質問2男の人はどこを見に行きますか。\n1 北中通り 2 大川通り 3 上田通り 4 山下通り"}]}, {"id": "B2017G", "name": "2017年7月", "clips": [{"k": "1-1", "sec": 1, "q": 1, "f": "audio/B2017G/1-1.mp3", "s": "会社で女の学生と男の人が話しています。女の学生はこの後、まず、何をし\nなければなりませんか？\n女：今日から１ヶ月、職場体験でこちらにお世話になる原田です。よろしくお願\nいします。\n男：よろしくお願いします。じゃ、早速だけど、これ、原田さんの１ヶ月の仕事\nの予定表です。挨拶を兼ねてみんなに配ってください。\n女：はい、分かりました。\n男：終わったら、原田さんが使うパソコンの設定をしてほしいんだけど、パス\nワードはオリエンテーションのときに聞いてるよね。\n女：はい、教えてもらいました。\n男：そのパスワードで一度入って、パスワードを再設定してね。それからじゃ\nないと、パソコンで何も作業できないようになってるから。\n女：はい、あの、その日にどんな仕事をしたか、報告書は毎日書くんですよ\nね。\n男：うん、そんなに長くなくても大丈夫だよ。あと、この部屋の座席表、原田さ\nんの名前も入れて、今新しくしてもらっているところだから、明日渡すね。\n女：はい、分かりました。\n女の学生はこの後、まず、何をしなければなりませんか？"}, {"k": "1-2", "sec": 1, "q": 2, "f": "audio/B2017G/1-2.mp3", "s": "大学で、男の学生と女の学生が話しています。男の学生はセミナーにどうや\nって申し込みますか？\n男：この間の授業で、先生が言ってた、来月の佐倉市の国際交流セミナー、\n申し込もうと思ってるんだけど。\n女：あっ、私、もう申し込んだ。締め切り、明日だよ。申込書持ってる？\n男：うん。さっき書いたんだけど、市役所の窓口に出せばいいんだよね。\n女：え？郵送でしか受付てくれないよ。\n男：え？\n女：毎年、応募者が多くて、窓口だと対応しきれないから、今年からそうなっ\nたんだって。\n男：え？それなら、今日出さないと間に合わないなあ。そんなに応募が多い\nのか、抽選になったら、結果ははがきで連絡が来るんだよね。\n女：うん。そんなのメールで送ってくれたらいいのにね。返信用のはがきは用\n意した？\n男：まだ。これから買いに行くよ。\n女：実は一枚多く買っちゃって、今持ってるんだけど、使う？\n男：いいの？ありがとう。\n男の学生はセミナーにどうやって申し込みますか？"}, {"k": "1-3", "sec": 1, "q": 3, "f": "audio/B2017G/1-3.mp3", "s": "電話で、テレビ局の人とケーキ屋の店長が話しています。ケーキ屋の店長は、\n撮影の日までに、何をしなければなりませんか？\n男：ひまわりテレビの鈴木です。番組の取材の件ですが、撮影まで一週間に\nなりましたので、お電話しました。\n女：あっ、どうも、お世話になります。\n男：ええと、先日打ち合わせしましたように、当日はケーキの製作現場とお店\nに並んでいるケーキ、それから、外からお店全体を取らせていただきます。お\n店のスタッフの方も映りますけど、よろしいですか。\n女：あっ、はい。それは了解を得ています。\n男：当日、お客さんもある程度いてくださったほうがいいので、よくいらっしゃ\nるお客さんにお知らせしておいてください。\n女：あっ、分かりました。\n男：それから、お勧めのケーキについて、一言ご紹介いただくことになってい\nますが。\n女：はい、準備できています。ちょうど季節のケーキを出したところですし。\n男：そうですか。じゃ、当日、よろしくお願いします。\nケーキ屋の店長は、撮影の日までに、何をしなければなりませんか？"}, {"k": "1-4", "sec": 1, "q": 4, "f": "audio/B2017G/1-4.mp3", "s": "大学のサークルで、男の学生と女の学生が話しています。男の学生はこの\nあと、まず、何をしなければなりませんか？\n男：先輩、来月の地域の子どもたちとの交流会なんですが、そろそろ準備始\nめたほうがいいですよね。今年は僕がリーダーなんですけど、気をつけること\nとかありますか。\n女：そうだったね。やることわかる？簡単に言うと、会場の予約、食べ物の準\n備、プログラムの内容を決めることだよ。場所は何をするかによって変わるか\nらね。\n男：ああ、ボールを使うようなゲームをするなら、広いところが必要ですもん\nね。\n女：うん、何するか早く決めてね。去年は決めるのが遅くなって、会場確保に\n苦労したから。\n男：はい。\n女：食べ物は宅配のピザとか、お寿司とかを頼むのでいいと思うよ。まあ、そ\nれは１週間前でもいいかな。\n男：サークルのメンバーに開催日を早く連絡したほうがいいですよね。\n女：それは年間スケジュールで決まってるから、みんな知ってるはずだよ。\n男：あっ、そうですね。\n男の学生はこのあと、まず、何をしなければなりませんか？"}, {"k": "1-5", "sec": 1, "q": 5, "f": "audio/B2017G/1-5.mp3", "s": "大学で、女の学生と先生が話しています。女の学生はこのあと、まず、何をし\nますか？\n女：先生、レポートのためのアンケートができたんですが、見ていただけませ\nんか。\n男：うーん、質問の数が多いな。これ、答えるのに何分くらいかかるか、時間\n計ってみた？\n女：いえ。\n男：え？あまりに時間がかかるようだと、ちゃんと答えてもらえないこともある\nから、一度自分でやってみて。本当はほかの人にやってもらったほうがいい\nんだけど、もう日程が厳しいしね。\n女：あぁ、はい。\n男：かかった時間によっては回答形式を変えることも考えないと。全部選択式\nにするとか。で、回答者の数は何人ぐらい。\n女：20人ぐらいに頼んでるんですが、少ないですか。\n男：うーん、全員がきちんと回答してくれれば十分だけど、まあ、分析に使え\nないものがあったら、また増やせばいいよ。\n女：はい。\n女の学生はこのあと、まず、何をしますか？"}, {"k": "2-1", "sec": 2, "q": 1, "f": "audio/B2017G/2-1.mp3", "s": "会社で、男の人と女の人が話しています。女の人がお弁当を持ってきている\n理由は何ですか？\n男：井上さん、最近お昼に外に食べに行かないね。\n女：あ、お弁当を作って、持ってきてるから。\n男：でも、前にお弁当は作るの、大変って言ってなかった？\n女：うん、それは子どものお弁当のことだったんだ。前に子どものお弁当を作\nってたときは、栄養のバランスを考えて作っていたし、それに、好きなものを\nたくさん、入れてあげたいと思うから、手間がかかったんだけど、自分のだけ\nならね。\n男：ああ、そういうものか。\n女：ほら、昼休みに外に食べに行くと、時間かかっちゃうでしょう。お店まで行\nくのも、待つのも。休憩は１時間しかないから、ちょっと運動したり勉強したり、\nなんか有意義に時間を使いたいなあと思って。\n男：なるほど。僕もお弁当を持って来ようかな。食費の節約にもなるしね。\n女の人がお弁当を持ってきている理由は何ですか？"}, {"k": "2-2", "sec": 2, "q": 2, "f": "audio/B2017G/2-2.mp3", "s": "女の人と男の人があるドラマについて話しています。男の人はドラマのどん\nな点が気に入っているといっていますか？男の人です。\n女：ねえ、山下君、先月始まった、あのドラマ見てる？\n男：ああ、島の警察官？好きな俳優が出てるって言ってたよね。\n女：うん。最初はそれで見始めたんだけど、今は俳優の魅力より、ストーリー\nが面白くて見てる。山下君は？\n男：うん。僕はどっちかっていうと、ドラマに出てくる町にひかれてる。舞台に\nなってる島の風景とか、海沿いの古い家とか、僕が住んでいるとことは全然\n違うから、行ってみたくなっちゃうんだ。\n女：確か、あの島、今観光客が増えているらしいよ。\n男：やっぱりね。あっ、そういえば、ドラマの最後に流れる歌も最近人気みた\nいだよ。\n女：ああ。あのドラマにぴったりで、暖かい感じがする素敵な曲だもんね。\n男の人はドラマのどんな点が気に入っているといっていますか？"}, {"k": "2-3", "sec": 2, "q": 3, "f": "audio/B2017G/2-3.mp3", "s": "男の人と女の人が山川市の新しい市長について話しています。女の人はま\nず、市長にどんな問題に取り組んでほしいといっていますか？女の人です。\n男：今回の選挙で、新しい市長決まったね。なかたさんは市長にまず、どんな\n課題に取り組んでほしいと思う？今回の選挙では、地域の経済が落ち込ん\nでいるのが問題になってたけど。\n女：そうね。働くところ見つけるのも大変だって聞くよね。うーん、うちは両親\nが年取ってきたし、介護の問題も気になるけど、子どもがいるから、小児科の\n先生が足りないって問題を先に解決してほしいなあ。\n男：うちもちっちゃい子どもいるから、分かるよ。うちは妻も働きながら、子育\nてしたいっていってるから、僕はまずは保育所の問題に取り組んでほしいな\nあ。\n女：ああ。保育所不足って、どこの自治体も問題になってるね。\n女の人はまず、市長にどんな問題に取り組んでほしいといっていますか？"}, {"k": "2-4", "sec": 2, "q": 4, "f": "audio/B2017G/2-4.mp3", "s": "会社の企画部で、男の課長と女の社員が話しています。課長はどうして企画\nの説明をこの女の社員に頼みたいといっていますか？\n男：本田さん、今うちの部が企画している新しい手帳のことなんだけど、ほら、\n本田さんのアイディアから生まれた手帳。\n女：あっ、はい。\n男：来週、営業部とかほかの部の部長も出席する会議があって、そこであの\n商品の企画について説明することになったんだよ。それで、その説明、本田\nさんにお願いしたいんだけど。\n女：え？私ですか？\n男：うん。この企画にずっとかかわってきたし、あれ思いついたの、本田さん\nだから。発想についても話してほしいんだ。\n女：あっ、でも、私、まだ会議で商品のプレゼンテーションなどした経験がなく\nて。\n男：ああ、ちょっと緊張するかもしれないけど、何かあったら、横から僕が助け\nるから、大丈夫だよ。\n女：はい、分かりました。やってみます。\n課長はどうして企画の説明をこの女の社員に頼みたいといっていますか？"}, {"k": "2-5", "sec": 2, "q": 5, "f": "audio/B2017G/2-5.mp3", "s": "女の人と男の人が話しています。男の人にとって、登山の一番の魅力は何で\nすか？\n女：山田さん、山がご趣味だそうですけど、登山の魅力って何ですか。\n男：何かな。すぐには答えられないな。自然の中を何も考えないで、一歩一歩\n歩いてると、普段の生活とか悩みが忘れられるんだけど。\n女：ああ。日常から解放されるんですね。\n男：うーん、山頂に着いた瞬間が最高なんだよ。自分の足でゴールに到達し\nたっていう満足感、これが最高。なんとも言えないんだ。だから、またその気\n分を味わいたくて、山に行くんだ。うん、やっぱりこれだな。\n女：そうですか。\n男：自然を全身で感じることが一番の魅力っていう人もいるけどね。\n女：お話聞いてたら、自然の中を歩くのっていいなと思いました。\n男：うん、足腰鍛えられるよ。\n男の人にとって、登山の一番の魅力は何ですか？"}, {"k": "2-6", "sec": 2, "q": 6, "f": "audio/B2017G/2-6.mp3", "s": "テレビでレポーターがある動物園について話しています。この動物園はどうし\nて最近、客が増えましたか？\n女：今日は今話題の南動物園に来ています。この動物園は20年前にオープ\nンし、珍しい動物に会える動物園として、当時多くの人が訪れていました。と\nころが、最近の新しい動物園では、動物に直接餌をやる、餌やり体験なども\nできるため、来場者が減少してしまいました。そこで、象やペンギンが園内を\n歩く様子を目の前で見られるイベントを始めたところ、これが人気を集め、来\n場者数が大きくのびたそうです。現在は夜の動物の行動も見てもらえるよう、\n週末限定の夜間営業も検討しているとのことです。\nこの動物園はどうして最近、客が増えましたか？"}, {"k": "3-1", "sec": 3, "q": 1, "f": "audio/B2017G/3-1.mp3", "s": "会社で、女の人と男の人が電話で話しています。\n女：もしもし、総務の北村です。来週金曜日の３時から予約されている会議室\nのことなんですが。\n男：あっ、はい。\n女：さきほどお電話で、人数が１０人に変更になったとご連絡いただきました\nよね。\n男：ええ。\n女：20人用の第一会議室をお取りしていましたが、実は同じ日時に2０人で会\n議室を利用したいという連絡がありまして、その人数が入れるのは一部屋し\nかないんです。\n男：ああ、そうですか。\n女：10人用の第二会議室でしたら、空いておりますが。\n男：じゃ、課長と相談して、折り返し電話します。\n女：すみません。この日はほかの時間もすべて会議室が埋まっていますので、\nよろしくお願いします。\n女の人が言いたいことは何ですか？\n1 会議の時間を教えてほしい\n2 会議の人数を教えてほしい\n3 会議の時間を変更してほしい\n4 会議の部屋を変更してほしい"}, {"k": "3-2", "sec": 3, "q": 2, "f": "audio/B2017G/3-2.mp3", "s": "中学校の教室で、生徒がスピーチをしています。\n女：私には、好きなものが全く違う友人がいます。私が好きなことは読書、彼\n女は映画です。勉強でも、私は国語が好きだけど、彼女は数学が得意。こん\nなふうに全然違うんです。でも、テストの前は、私が国語を教えて、彼女は数\n学を教えてくれます。助け合うことで、一人ではできないことができるようにな\nります。趣味が同じ友人もいいけれど、違うからこそ、お互いに世界を広げる\nことができる。これは友人同士の話に限らず、周りの人たちとの付き合いす\nべてに当てはまるかもしれません。\n生徒が伝えたいことは何ですか？\n1 好みが違う人と付き合う難しさ\n2 一緒に学習することで生まれる友情\n3 親しい友人の意外な一面\n4 互いに補い合う関係の良さ"}, {"k": "3-3", "sec": 3, "q": 3, "f": "audio/B2017G/3-3.mp3", "s": "テレビでアナウンサーが話しています。\n女：本を読む人が少なくなったといわれていますが、実は図書館については、\n利用者数が増加傾向にあります。図書館としても、今までにはない、いろいろ\nな試みを行っているんです。例えば、お茶を飲みながら、本が読めるスペー\nスや利用者同士がおしゃべりできる部屋を作った図書館もあります。今回の\n取材の中では、図書館で高齢の利用者と親しくなって、いろいろな話を聞くの\nが楽しみになり、よく足を運ぶようになったという若者の声も聞かれ、一定の\n効果をあげていることがうかがわれます。図書館は静かに本を読むところだ\nというイメージがありましたが、変わってきているようです。\nアナウンサーの話のテーマは何ですか？\n1 図書館の数の変化\n2 図書館の利用のマナー\n3 図書館の利用者を増やす試み\n4 図書館の利用者の年齢層の変化"}, {"k": "3-4", "sec": 3, "q": 4, "f": "audio/B2017G/3-4.mp3", "s": "町の議会で、町長が話しています。\n男：来年建設予定の町の総合文化施設ですが、ここには保育所や図書館な\nども入る予定で、この施設ができると、町民の生活が便利になることは間違\nいないと思われます。建設費が高いということから、町民の皆さまの間には\n反対意見も多くあります。しかし、子どもからお年寄りまで、みんなが利用で\nきるこのような施設は周辺地域にもない、ユニークなものです。建設予定地\nが駅から遠く、不便だという意見もありますが、この点については、駅からバ\nスを出す可能性などを含めて、今後、検討していきたいと思います。\n町長は施設の建設について、どういっていますか？\n1 住民の反対が強く、建設すべきではない。\n2 住民の反対が強いが、建設すべきだ。\n3 住民の反対は少ないが、建設の必要はない。\n4 住民の反対も少なく、建設すべきだ。"}, {"k": "3-5", "sec": 3, "q": 5, "f": "audio/B2017G/3-5.mp3", "s": "女：今日から１２月です。年末年始の消費活動は翌年の景気を占う上で、よく\n注目されます。今年の後半になり、企業の売り上げは順調に伸びてきている\nようですが、このまま景気は回復するのでしょうか。旅行会社によると、この\n年末年始の旅行先としては、海外より国内旅行のツアー、中でも、安く手軽\nに参加できる日帰りツアーに人気が集中しているとのことです。大手デパート\nの調べでは、お歳暮商戦も昨年同様3000円前後の品が最も売れているとい\nうことです。このように、消費者が派手な消費を抑える傾向が見られることか\nら、景気の回復を実感するにはまだ時間がかかると考えられます。\nアナウンサーは何について話していますか？\n1 来年の景気についての見通し\n2 景気が回復したきっかけ\n3 売り上げを伸ばすための企業の努力\n4 年間の消費行動の傾向"}, {"k": "4-1", "sec": 4, "q": 1, "f": "audio/B2017G/4-1.mp3", "s": "女：川野さん、来週の土曜日、うちの新製品の発表会をやるので、ぜひ、お\n越しください。\n1 あっ、新製品がまだ発表できないんです。\n2 何時ごろ、お越しになれますか。\n3 そうですか。会場はどちらですか。"}, {"k": "4-2", "sec": 4, "q": 2, "f": "audio/B2017G/4-2.mp3", "s": "男：おかしいな。今日のコンサートのチケット、鞄にいれてきたつもりだったん\nだけど。\n1 もう一度、よく見て。\n2 あれ、今日はコンサート行かないことにしたんだっけ。\n3 そうか。かばんの中にあったんだ。"}, {"k": "4-3", "sec": 4, "q": 3, "f": "audio/B2017G/4-3.mp3", "s": "男：あのう、先輩、これ、卒業論文の概要なんです。コメントもらえるとありが\nたいんですが。\n1 今忙しいから、明日でもかまわない？\n2 読んでもらえて、助かったよ。\n3 コメント、たくさんもらえたんだ。"}, {"k": "4-4", "sec": 4, "q": 4, "f": "audio/B2017G/4-4.mp3", "s": "女：小林様、先日のコピー機のカタログ、ご覧いただけましたでしょうか。\n1 カタログ、いつお見せしたらよろしいですか。\n2 いや、ここ数日、何かと忙しかったもので。\n3 もうご覧になったんですね。"}, {"k": "4-5", "sec": 4, "q": 5, "f": "audio/B2017G/4-5.mp3", "s": "男：あの、森さん、倉庫の書類を整理したいんですけど、今、手空いてます\nか。\n1 あっ、これ以上はもう持てません。\n2 え、おまかせしてもいいんですか。\n3 うーん、１時間ぐらいならいいですよ。"}, {"k": "4-6", "sec": 4, "q": 6, "f": "audio/B2017G/4-6.mp3", "s": "男：台風が来てるし、明日の屋外イベントは中止せざるを得ないよ。\n1 予定通り、がんばってやりましょう。\n2 今回は仕方ありませんね。\n3 中止にならなくて、ほっとしました。"}, {"k": "4-7", "sec": 4, "q": 7, "f": "audio/B2017G/4-7.mp3", "s": "女：佐藤君、さっき会議室出るとき、エアコンちゃんと消してくれた？\n1 すぐつけに行ってくるよ。\n2 消しちゃいけなかった。\n3 ああ、忘れたかもしれない。"}, {"k": "4-8", "sec": 4, "q": 8, "f": "audio/B2017G/4-8.mp3", "s": "女：ねえ、吉田さん、今日課長、ご機嫌だと思わない？\n1 嫌なことでもあったんじゃない？\n2 なんかいいことあったのかな？\n3 機嫌直るといいね。"}, {"k": "4-9", "sec": 4, "q": 9, "f": "audio/B2017G/4-9.mp3", "s": "男：堀さん、堀さんいくら疲れてるからって、打ち合わせでうとうとしちゃうなん\nて。\n1 申し訳ありません、気をつけます。\n2 お褒めいただき、恐縮です。\n3 では、遠慮なく、休ませていただきます。"}, {"k": "4-10", "sec": 4, "q": 10, "f": "audio/B2017G/4-10.mp3", "s": "男：石田監督が作った最新の映画見ましたけど、今一つでしたよ。\n1 今までで、一番よかったんですね。\n2 え、見に行こうと思ってたんですけど。\n3 そんなに面白いなら、見に行ってみます。"}, {"k": "4-11", "sec": 4, "q": 11, "f": "audio/B2017G/4-11.mp3", "s": "女：受付の木村さん、毎朝早く来て、掃除してくれてるんだって。頭が下がる\nよ。\n1 全く頭にくるよね。\n2 なかなかできないことだよね。\n3 え？具合悪くなっちゃったの。"}, {"k": "4-12", "sec": 4, "q": 12, "f": "audio/B2017G/4-12.mp3", "s": "男：今度入った加藤さん、営業の仕事が初めてのわりには、営業成績上げて\nるよね。\n1 営業の仕事やってきてるんなら、当然じゃない？\n2 経験がないのに、結果出してるよね。\n3 そんなに成績落としちゃったら、まずいね。"}, {"k": "5-1", "sec": 5, "q": 1, "f": "audio/B2017G/5-1.mp3", "s": "会社で、部長と女の社員が社内行事について話しています。\n男：島田さん、毎年８月にやってる社内行事の企画、お願いしてあったよね。\nどうなった。\n女：はい、レストランでの食事会が続いてるから、何か新しいアイデアをという\nことでしたよね。\n男：うん、仕事のことは忘れて、社員同士の交流を深めるっていう本来の目\n的は変えずにね。予算はいつも通り、一人3000円以内で。\n女：はい。まず、バーベキューの案。車で１時間のところにある朝日公園でで\nきます。材料費も予算内でおさまりそうですし、自然の中でみんなで食べるの\nって開放的で、会話も盛り上がると思います。\n男：車で１時間か。\n女：はい。後は体を動かすイベントです。会社の近くにボウリング場あります\nよね。団体向けに近くのお店での食事がセットになったプランがあるんです。\nボウリングをチーム対抗にしたら、普段話さない人との交流も深まるし、一体\n感も増すと思うんです。ただ、予算オーバーになりますが。\n男：そうか。\n女：あと、社内イベントとして、地域の清掃活動に参加してる会社もあるみた\nいです。会社近くの公園でもごみ拾い活動をやってますよね。社員同士とい\nうよりは社員と地域住民との交流になりますが。\n男：なるほど。それも新しいね。\n女：あとは、いつもの食事会なんですが、ほかの店にすれば、今までと違った\n感じになると思うんです予算内でおいしい料理食べられるお店もありました\nし。\n男：どれもよさそうだね。うーん、でも一度思い切ってやることを変えてみよう。\nで、予算内でできて、本来の目的にあっているのがいいね。\n部長は社内行事で何をするのがいいといっていますか？\n1 バーベキュー\n2 ボウリング\n3 ごみ拾い活動\n4 レストランでの食事会"}, {"k": "5-2", "sec": 5, "q": 2, "f": "audio/B2017G/5-2.mp3", "s": "会社で、先輩と後輩二人が話しています。\n女1：部長の退職まで、あと１ヶ月だね。私たち入社したころ、部長には特別お\n世話になったし、お祝いを贈ろうって話してたけど、どうしようか。確か、営業\n部全体では花束を贈るんだよね。\n女2：ええ。部長、生け花が趣味だっておっしゃってたから。花瓶なんてどうで\nすか。\n女1：花瓶ね。喜んでもらえそうだけど、いいものはかなり高いよね。\n女2：そしたら、私たちからも花束にしませんか。営業部のとは違うお花で。部\n長、お花が好きだから、たくさんもらっても喜んでいただけると思います。\n女1：うーん。\n男：でも、同じものっていうのは。せっかくなので、ずっと使ってもらえるものが\nいいと思いますけど。\n女1：そうだね。\n男：部長って、時々スーツに合わせてスカーフしてますよね。だから、花柄の\nスカーフとかどうですか。\n女1：なるほどね。ただ、身につけるものとなると、よほど好みに合ったものじ\nゃないとね。そういうのが選べるかどうか。\n男：じゃ、食器はどうですか。コーヒーカップとか。\n女2：それもスカーフと同じで、好みがありますよ。\n女1：そうだね。何でも難しいんだけど、まあ、趣味に使ってもらえるものがい\nいかな。\n３人で出し合えば、それなりにいいもの買えるよね。長く使ってもらえそうなも\nの、選ぼう。\n部長への贈り物は何になりましたか。\n1 花瓶\n2 花束\n3 スカーフ\n4 食器"}, {"k": "5-3", "sec": 5, "q": 3, "f": "audio/B2017G/5-3.mp3", "s": "まず話を聞いてください。それから、二つの質問を聞いて、それぞれ問題用\n紙の１から4の中から、最もよいものを一つ選んでください。\nラジオで、野球の観戦チケットを紹介しています。\n今日は夏休みにプロ野球をもっと楽しんでいただけるお得なチケットのお知\nらせです。スター球場では、観戦をより楽しめる特別なチケットを4種類販売し\nています。\n一つ目のきらきらチケットは試合前に、人気選手と一緒に記念撮影できるチ\nケットです。野球観戦の思い出にいかがでしょう。\n二つ目のにこにこチケットはお弁当と応援グッズがついてきます。グッズの中\nには人気選手のサイン入りボールが入っていますよ。\n三つ目はグラウンドを見下ろすレストランの窓際からゆっくり観戦できるわく\nわくチケットです。ご家族やお友達と一緒に、食事を楽しみながら、応援して\nみてはいかがでしょうか。\n四つ目のどきどきチケットはグラウンドに近い、前のほうの特別席で観戦でき\nるチケットです。こちらもお弁当とドリンクつきです。\n男：うちの父、野球が大好きなんだよ。父の誕生日プレゼント探してたから、\nちょうどいいかも。\n女：プレゼントなら、一緒に写真撮れるのなんていいんじゃない？いい記念に\nなるし。\n男：父は写真を撮られるの苦手だからね。選手のサイン入りボールのほうが\n喜びそうだから、そっちにするよ。山田さんは家族でよく見に行くんだよね。み\nんなで食事しながら、見るっていうのも楽しいんじゃない？\n女：うん。来月行こうって言ってるんだけど、もっと近くでみたいな。選手たち\nのプレーを間近で見られるっていうのにしてみる。\n男：ボールとか飛んで来たりするんじゃない。\n女：だったらいいな。\n質問1 男の人はお父さんにどのチケットをプレゼントしたいといっています\nか。\n1 きらきらチケット\n2 にこにこチケット\n3 わくわくチケット\n4 どきどきチケット\n質問2 女の人はどのチケットを買いたいといっていますか。\n1 きらきらチケット\n2 にこにこチケット\n3 わくわくチケット\n4 どきどきチケット"}]}, {"id": "B2017L", "name": "2017年12月", "clips": [{"k": "1-1", "sec": 1, "q": 1, "f": "audio/B2017L/1-1.mp3", "s": "1.⓪⓪②→開く→⑦②⑤ 2.⓪⓪②→開く→⑦②⑤→開く\n3.⑦②⑤→開く→⓪⓪② 4.⑦②⑤→開く→⓪⓪②→開く\n会社で 女 の人と男 の人が話しています。 女 の人は倉庫に入るとき、どの\n順番 で入口のボタンを押さなければなりませんか。\n女：すみません。地下の倉庫に行って、資料を取ってきたいんですが、入口\nの開け方がわからなくて…\n男：ああ、最近、管理が厳しくなって、入口の横のボタンを押さないとだめなん\nだよ。倉庫は三つあるけど、何番の？\n女：ええと、二番です。\n男：じゃ、倉庫の番号は００２だね。それと、暗証番号も必要だよ。\n女：そうですか。暗証番号は？\n男：７２５だよ。ドアの横のボタンを暗証番号、「開く」のボタン、倉庫の番号、\n「開く」のボタンの順 で押して。そうすれば、すぐドアが開くから。\n女：暗証番号、開く、倉庫の番号…\n男：そのあとに、「開く」だよ。\n女：はい、わかりました。ありがとうございます。\n女 の人は倉庫に入るとき、どの順番 で入口のボタンを押さなければなりませ\nんか。\n問題一選択肢の設計\n1 已做的 た ている てある もう 済み\n2 要做的(正解) 頼み 命令 てください て てもらえる\n3 之后再做的 あと たら てから 次第\n4 不用做/说话人自己做的 ます型 原型"}, {"k": "1-2", "sec": 1, "q": 2, "f": "audio/B2017L/1-2.mp3", "s": "1. 入金 をかくにんする 2. 商品を発送する\n3. 新商品のサンプルを用意する 4. 青空会社にれんらくする\n電話で 女 の人と課長が話しています。 女 の人はこの後まず何をしなければ\nなりませんか。\n女：はい、山川工業です。\n男：もしもし、田中です。今出張先なんだけど。さっき青空会社の遠藤さんか\nら 私 の携帯に連絡があってね。\n女：はい。\n男：昨日の夕方、青空会社から注文が入った商品についてなんだけど、さっ\nきうちの口座に代金を振り込んだそうだから、入金が確認でき次第、すぐ\n発送してくれるかな。かなり急ぎみたいで、できるだけ早く送ってほしいって。\n女：わかりました。新商品のサンプルも一緒に送っておきますね。\n男：それは以前送ってあるよ。あ、青空会社の遠藤さんに一言、発送完了の\n連絡も入れておいて。よろしくね。\n女：はい。\n女 の人はこの後まず何をしなければなりませんか。"}, {"k": "1-3", "sec": 1, "q": 3, "f": "audio/B2017L/1-3.mp3", "s": "1. 話 のてんかいを変える 2. イラストの線の太さを変える\n3. 主人公の外見をかき変える 4. げんこうの枚数を減らす\n漫画クラブで 女 の学生と男 の学生が話しています。 女 の学生はこの後どう\nしますか。\n女：山田くん、再来月のコンクールに出す漫画の下書き、読んでくれた？\n男：うん、ストーリーの展開がよく工夫されてて、さすがだなぁって思った。特\nに最後、いい意味で読者の期待を裏切る展開になってるね。\n女：そこ、結構苦労したんだ。あのう、今回は全体的に線を太目に描いたんだ\nけど、どうだった？\n男：うん、力強くて、 話 の世界観に合ってると思ったよ。線の強弱も効果的に\n使われてたし、コンクールでも評価されるんじゃないかな。\n女：うん。\n男：でも、読む前、ぱっと絵を見たときに、主役のこのインパクトが弱いなあっ\nて感じたんだ。髪型とか身につけてるものとか、もうちょっとユニークにできな\nいかな。\n女：うん、やってみる。\n男：あっ、そういえば、原稿の枚数、確かめてある？たしか制限あったよね。\nオーバーすると、減点の対象になっちゃうから、多かったら減らしたほうがい\nいよ。\n女：枚数は指定内に納まってるよ。\n男：そう？じゃ、コンクールまでもうちょっと頑張ってね。\n女 の学生はこの後どうしますか。"}, {"k": "1-4", "sec": 1, "q": 4, "f": "audio/B2017L/1-4.mp3", "s": "1. 見積書を課長にわたす 2. 見積書をコピーする\n3. 出張報告書を書直す 4. 出張報告書をいんさつする\n電話で 女 の人と男 の人が話しています。男 の人はこの後、まず何をしなけ\nればなりませんか。\n女：もしもし、佐藤さん、おはようございます。中野ですが。今日体調が悪くて、\n出勤できそうにないんです。申し訳ないんですけど、ちょっとお願いしてもい\nいですか。\n男：大丈夫ですか。なんでも任せてください。\n女：ありがとうございます。今日中に 必 ず課長に提出しなきゃいけない書類\nがあるんです。 私 の机 の右側に赤いファイルがあるんだけど、その中の\n一番上にある見積書、課長に渡してもらえますか。\n男：わかりました。今確認しますね。あ、これですね。渡す前に、コピー取って\nおきますか。\n女：ううん、いいわ。課長、たしか今日は朝から昼過ぎまで桜銀行で会議だか\nら、午後にならないと、オフィスに来ないと思うんだけど、直接手渡してもらえ\nますか。大事な書類だから。\n男：はい。\n女：あっそうだ。今日朝10時からのミーティングで、私出張報告することになっ\nてましたよね。先週佐藤さんと一緒に行った出張 の。悪いんですけど、それ\nもやってくれますか。\n男：わかりました。出張報告書をもう完成してますか。昨日、書き直したい\n箇所があるっておっしゃってましたよね。\n女：ええ、昨日直して、パソコンの共有フォルダーにデーターを保存してある\nので、印刷して会議で配ってください。\n男：わかりました。今日はゆっくり休んでくださいね。\n男 の人はこの後、まず何をしなければなりませんか。"}, {"k": "1-5", "sec": 1, "q": 5, "f": "audio/B2017L/1-5.mp3", "s": "1. やさしい言葉に直す 2. 実用化された例をあげる\n3. 図を分かりやすくする 4. 子供たちへの質問を追加する\n大学で 女 の先生と男 の学生が話しています。男 の学生はこの後、資料をど\nのように直しますか。\n女：送ってくれた資料、見ましたよ。\n男：あ、ありがとうございます。\n女：これは小学校の交流会で配るものでしたね。\n男：はい。子供たちに自分の研究について話すときに配るものです。\n女：えーとね、なかなかよくできてましたよ。 難 しい言葉も使っていないし。\n男：はい。易しい言葉を使うようにしました。\n女：うん、ただ、 話 が抽象的で、何を言っているのかわからないんじゃないか\nな。この研究が 私 たちの身近なこんなところに使われていますとか、こんなこ\nとにも役に立っていますとかって説明してあげたらいいんじゃない？\n男：ああ、なるほど。はい、わかりました。\n女：あとは、この図もとてもわかりやすいし、問題ないんじゃない。子供たちか\nら質問がたくさん出るといいわね。\n男：ありがとうございます。すぐ直します。\n男 の学生はこの後、資料をどのように直しますか。"}, {"k": "2-1", "sec": 2, "q": 1, "f": "audio/B2017L/2-1.mp3", "s": "1. ひろった人がデパートにとどけてくれた\n2. ひろった人が学校に送ってくれた\n3. ひろった人が家に送ってくれた\n4. ひろった人が交番にとどけてくれた\n家で妻と夫 が話しています。息子の隆君の帽子は、どのようにして戻ってき\nましたか。\n女：この 間 隆 がデパートに行ったとき、小学校の制服の帽子無くしたって言\nったでしょう。\n男：うん、デパートのサービスカウンターに聞いたけど、見つからなかったん\nだよね。\n女：もう 諦 めてたんだけど、世の中親切な人がいて。ほら、帽子の裏に\n学校名と名前が書いてあるでしょう。\n男：えっ？拾った人がわざわざ学校に持ってきてくれたの？\n女：ううん、郵送してくれたんだって。\n男：へえ。僕も落し物拾って交番に届けたことはあるけど、そこまでしてくれる\nなんて。何かお礼しなきゃね。\n女：それが差出人が書いてないの。「デパートの近くで拾いました。」っていう\nメモが入ってただけで。\n男：そうか。お礼に気を遣わないようにって 考 えてくれたのかもしれないね。\n息子の隆君の帽子は、どのようにして戻ってきましたか。"}, {"k": "2-2", "sec": 2, "q": 2, "f": "audio/B2017L/2-2.mp3", "s": "1. へんきゃく期日がすでに過ぎているから\n2. 貸出期間内でのえんちょうが２回目だから\n3. ほかの利用者から予約が入っているから\n4. ほかの図書館から取りよせた本だから\n電話で図書館の人と男 の人が話しています。男 の人はどうして貸出期間の\n延長ができませんか。\n女：はい、北山図書館です。\n男：もしもし、あのう、今借りてる本の返却期限の延長ってできますか。\n女：はい。返却日を過ぎていなければ、貸出期間中に一度だけ、図書館のカ\nウンターかインタネット上で延長可能です。ただ、ほかの方から予約が入って\nいる本や、ほかの図書館から取り寄せた本は、延長はできませんが。\n男：そうですか。\n女：今お手元に図書館のカードをお持ちですか。右上のバーコードの下にあ\nるご利用者番号がお分かりでしたら、延長できるかお調べしますが。\n男：あ、お願いします。番号は255127です。本のタイトルは「相撲の歴史」で\nす。\n女：あ、今のところ、予約は入っていないんですが、貸出期間が昨日まででし\nた。一度返していただく必要が…\n男：え？すみません。うっかりしてて。今日中に返します。\n男 の人はどうして貸出期間の延長ができませんか。"}, {"k": "2-3", "sec": 2, "q": 3, "f": "audio/B2017L/2-3.mp3", "s": "1. ぎじゅつを向上させるため 2. 気分転換をするため\n3. 新 しいことにチャレンジするため 4. 知り合いを増やすため\nラジオでアナウンサーが大人の習い事について話しています。調査によると、\n何のために習い事をしているという答えが最 も多かったですか。\n男：今、大人をターゲットにした習い事が人気で、外国語を始め、楽器、ダン\nスなど、様々なスクールに通う大人が増えています。今朝の新聞に、「習い事\nの目的は何か」という調査結果が出ていました。自分の経験から一番多いの\nは技術の習得だと思ったのですが、「気分転換のため」が「技術」を上回り、ト\nップでした。この二つに次いで多かったのは、「 新 しいことへのチャレンジ」と\nいう答えで、「知り合いを増やすため」というのも多く、自分の世界を広げたい\nという気持ちが 伺 えます。\n調査によると、何のために習い事をしているという答えが最 も多かったです\nか。"}, {"k": "2-4", "sec": 2, "q": 4, "f": "audio/B2017L/2-4.mp3", "s": "1. 今流行している物がないから 2. 商品の質があまりよくないから\n3. 他人の着た物を着たくないから 4. なくてもいい物も買ってしまうから\n女 の学生と男 の学生が話しています。 女 の学生はどうしてリサイクルショッ\nプで買い物をしないと言っていますか。\n女：おはよう。あ、そのジャケットいいね。\n男：加藤さん、おはよう。これ、リサイクルショップで見つけてね。千円だよ。安\nいでしょう。\n女：へえ、今の流行とは違うけど、個性的でいいね。\n男：うん、これ見つけたときは、やったって思ったよ。加藤さんも、古着とか好\nきそうだよね。その店いいものが揃ってるし、リサイクルとは思えない品質だ\nから、今度行ってみたら？\n女：うん、 私 、リサイクルショップは行かないんだ。\n男：あ、やっぱり、知らない人が着てたもの着るの、抵抗ある？\n女：それはないけど。行くとやすいからって余計なものまで買って後悔するか\nら。以前そういうことが何度もあって。リサイクルショップって、今の流行じゃな\nいけど、今着てもおしゃれなの、いろいろあるでしょう。そういうのを見ると、買\nわずにはいられなくて。\n男：わかる気がする。\n女の学生はどうしてリサイクルショップで買い物をしないと言っていますか。"}, {"k": "2-5", "sec": 2, "q": 5, "f": "audio/B2017L/2-5.mp3", "s": "1. 仕事に集 中 できるから、さんせいだ\n2. 仕事に集 中 できないから、反対だ\n3. リラックスこうかが期待できるから、さんせいだ\n4. 曲 によってはリラックスできないから、反対だ\n会社で 女 の人と男 の人が話しています。職場に音楽を流すことについて、\n男 の人はどんな意見を持っていますか。男 の人です。\n女：ねえ、木村くん、部長に聞いたんだけど、今ね、職場環境の改善策の一\nつとして、勤務時間中に、オフィスに音楽を流すことが検討されてるんだっ\nて。\n男：ああ、職場に音楽を流すと、集中力 が上がったり、リラックスできたりして、\n仕事の能率も上がるって、最近注目されてるよね。\n女： 私 は何か 考 えてる時に、音楽が流れてると集 中 できないタイプだから、\n職場でっていうのはどうかと思うけど。それに、曲によっては、むしろリラック\nスできないものだってあるだろうし。\n男：どういう曲かけるんだろうね。リラックス効果があるかは、僕はわかんない\nけど、とにかくしんとしてると、かえって気が散る方だから、集 中 できて\n個人的には大歓迎だなあ。\n女：そう。じゃ、木村君の仕事の能率もぐんと上がって。\n男：ちょっと。そんな期待しないでよ。\n職場に音楽を流すことについて、男 の人はどんな意見を持っていますか。"}, {"k": "2-6", "sec": 2, "q": 6, "f": "audio/B2017L/2-6.mp3", "s": "1. 物事にじゅうなんに対応できないところ\n2. 自 ら進んで動くことができないところ\n3. 自分の意見を主張しすぎるところ\n4. 物事に根気強く取組めないところ\n就職のための面接で、男 の学生が話しています。男 の学生はどんなところ\nが自分の短所だと言っていますか。短所です。\n男：わたしは子供の頃から、クラスやクラブでは、リーダーを支えるような役割\nを果たしてきました。周囲の声に耳を 傾 け、物事に柔軟に対応することには\n自信があります。反面、つい受身になり、主体的に行動したり意見を述べたり\nということがあまり得意ではないので、その点に気を付け、仕事ではどんなこ\nとにも柔軟性を持ちつつ、根気強く取り組んでいきたいと思います。\n男 の学生はどんなところが自分の短所だと言っていますか。"}, {"k": "3-1", "sec": 3, "q": 1, "f": "audio/B2017L/3-1.mp3", "s": "地域の講演会で、 女 の人が話しています。\n日本では、ここ数十年の 間 に、レトルト食品など調理されている食品の普及\nが進みました。そのような食品の多くは、便利な一方、食べやすく調理されて\nいるため、しっかり噛まずに飲み込みがちですが、そのことが現代人の健康\nにとって、大きなマイナスとなっていると指摘する医師も少なくありません。よ\nく一口30回と言われますが、これを実践すると、心身を健康に保つ、様々な\n効果が得られることが明らかになっています。\n女 の人は何について話していますか。\n１ よく噛んで食べることの大切さ\n２ 足りない栄養を 補 うことの大切さ\n３ レトルト食品を美味しく食べるための工夫\n４ 料理を食べやすくするための工夫"}, {"k": "3-2", "sec": 3, "q": 2, "f": "audio/B2017L/3-2.mp3", "s": "テレビで 女 の人が話しています。\n「最近の若者は」という言葉、みなさんも一度は耳にしたことがありませんか。\n現代だけでなく、きっといつの時代でも使われてきた言葉なんでしょうね。わ\nたしが１０代の頃も、「礼儀を知らない」、「根気がない」などと言われた記憶\nがあります。ただ、その若者を教育してきたのは、親の世代だということを忘\nれてはいけません。若者がそのように言われるのは、本来手本となるべき\n大人にも、一因があると思うんです。\n女 の人が伝えたいことはなんですか。\n１ 最近は礼儀を知らない若者が多い。\n２ 若者は親に反抗するものだ。\n３ 若者が批判される原因は、親世代にもある。\n４ 若者は親を手本とすべきだ。"}, {"k": "3-3", "sec": 3, "q": 3, "f": "audio/B2017L/3-3.mp3", "s": "心理学の授業で先生が話しています。\nわたしは子供の時、ストレスに敏感で、不安を感じると、よくお腹が痛くなりま\nした。ある時、母が腹痛が治るという粉薬を病院でもらってきてくれたんです\nが、それ以降、不安でお腹が痛くなったとき、その薬 をジュースに入れて飲む\nと、腹痛がおさまったんです。ところが、中学生になったある日、母が言った\nんです。「あれはただの粉砂糖だった。まさかあんなに効くとはね」と。それ\n自体に 力 はなくても、飲むことで生じる気持ちの変化が実際に 体 の反応を\n変え、よく効く薬 となっていたんですね。今日の授業では、この点をテーマとし、\nより詳しく見ていきます。\n今日の授業のテーマはなんですか。\n１ ストレスの危険性 ２ 子供が不安を感じる原因\n３ 緊張を解く 新 しい薬 の開発 ４ 信じ込むことが 体 に与える効果"}, {"k": "3-4", "sec": 3, "q": 4, "f": "audio/B2017L/3-4.mp3", "s": "ラジオでアナウンサーが家計調査の結果について話しています。\n先日、政府が家計の収 入 や支出などを調べた家計調査の結果が発表され\nました。支出のうち、娯楽の費用と食事の費用の項目を見てみると、娯楽費\nは全項目のうち、増加が最 も目立ちました。これは景気の回復が影響してい\nると 考 えられます。また昨年度の調査以来、落ち込みを見せていた食費で\nすが、今回は外食の費用が大きな伸びを見せ、トータルでは、落ち込む以前\nの水準にまで戻っています。\n今回の家計調査の結果、支出は前回の調査に比べてどうなりましたか。\n１ 娯楽費も食費も増えた。 ２ 娯楽費も食費も減った。\n３ 娯楽費は増え、食費は減った。 ４ 娯楽費は減り、食費は増えた。"}, {"k": "3-5", "sec": 3, "q": 5, "f": "audio/B2017L/3-5.mp3", "s": "市の集会で、市長が話しています。\nええ、ゴミ処理場建設の今後の方針をお 話 いたします。先月の選挙では、\n処理場建設に反対の立場であった前市長を破ることができ、処理場建設に\n関して、市民の皆様のご支持をいただけたと思っております。ただ、建設をめ\nぐっては、候補地が住宅地に近いことから、一部の住民の方から、環境の\n悪化を心配し、強い反対の声が上がっており、候補地を見直す判断を致しま\nした。これに伴 い、工事日程に遅れが生じますが、多額な建設費がかかる\n大事な事業ですので、慎重に進めたいと 考 えております。\n市長はゴミ処理場の建設について、どう言っていますか。\n１ これまでの計画通りに建設する\n２ 計画の見直しが必要だが、建設する\n３ 費用が多額になるため、建設しない\n４ 住民が反対しているため、建設しない"}, {"k": "4-1", "sec": 4, "q": 1, "f": "audio/B2017L/4-1.mp3", "s": "男：うちの会社、正月の休みが3週間ぐらいあったらいいのにね。\n１ ええ？3週間もなかったと思うよ。\n２ ほんと。それぐらい休みたいよね。\n３ そんなに長くなったの？やった。"}, {"k": "4-2", "sec": 4, "q": 2, "f": "audio/B2017L/4-2.mp3", "s": "女：なんか外が騒がしいよね。どうしたんだろう。\n１ たぶんそうだろうね。\n２ 何かあったのかな。\n３ どうして知ってるの？"}, {"k": "4-3", "sec": 4, "q": 3, "f": "audio/B2017L/4-3.mp3", "s": "女：あの大手の緑建設、倒産の恐れがあるんですって。\n１ え？その可能性はなさそうなんですか。\n２ え？倒産しちゃったんですか。\n３ え？そんなに状況悪い"}, {"k": "4-4", "sec": 4, "q": 4, "f": "audio/B2017L/4-4.mp3", "s": "男：学校のみんながあんなに応援のメールくれたのに。僕たち試合負け\nたって、言いづらくない？\n１ ああ、もう伝えちゃったんだね。\n２ でも、ちゃんと報告しなきゃね。\n３ え？みんなに言いづらくないの？"}, {"k": "4-5", "sec": 4, "q": 5, "f": "audio/B2017L/4-5.mp3", "s": "男：李さん、あのう新年会の係りをやってくれたら助かるんだけど。\n１ あ、はい。 私 でよければ。\n２ あのう、 私 は 係 じゃないですよ。\n３ あ、やってくれるんですか。"}, {"k": "4-6", "sec": 4, "q": 6, "f": "audio/B2017L/4-6.mp3", "s": "女：この棚の引き出し、鍵かけといたはずなんだけど。\n１ ああ、そのほうがいいね。\n２ それはちょっとできないよ。\n３ え？開いてるの？"}, {"k": "4-7", "sec": 4, "q": 7, "f": "audio/B2017L/4-7.mp3", "s": "男：急 なんだけど、明後日の出張小野さんの代わりに行ってくれる？\n１ 小野さん、どうかされたんですか。\n２ 小野さんと一緒に行けばいいんですね。\n３ 小野さん、どなたと代わるんですか。"}, {"k": "4-8", "sec": 4, "q": 8, "f": "audio/B2017L/4-8.mp3", "s": "女：山本さん、悪いけど、もう会議室の準備、始めてくれないと。\n１ まだ早いでしょうか。\n２ すみません。すぐ取り掛かります。\n３ じゃ、会議は中止なんですね。"}, {"k": "4-9", "sec": 4, "q": 9, "f": "audio/B2017L/4-9.mp3", "s": "男：森さんって、就職するのに、親のコネ使いたくないんだって。まあ、わ\nからないこともないね。\n１ 少しはわかってあげてよ。\n２ 森さん、何がわかってないの？\n３ うん、その気持ちなんとなくわかる。"}, {"k": "4-10", "sec": 4, "q": 10, "f": "audio/B2017L/4-10.mp3", "s": "男：ああ、あしたの歯医者の予約時間、手帳に書いとくべきだったなあ。\n１ 手帳見て、何時か確認したら？\n２ 時間わかんなくなっちゃったの？\n３ 書くなら、ペンあるよ。"}, {"k": "4-11", "sec": 4, "q": 11, "f": "audio/B2017L/4-11.mp3", "s": "男：もう打ち合わせの時間だけど、社長が来ないとはじめようがないで\nすね。\n１ もう打合せしちゃうんですか。\n２ あ、社長に始めるよう言われたんですね。\n３ うん、待つしかありませんよね。"}, {"k": "4-12", "sec": 4, "q": 12, "f": "audio/B2017L/4-12.mp3", "s": "女：先輩、私最近ゴルフ始めたんですが、上達に欠かせないものって、\nなんでしょうか。\n１ うん、自分に合う道具を使うことかなあ。\n２ うん、練習が足りないからじゃない？\n３ うん、上達しにくいものは特にないよ。"}, {"k": "5-1", "sec": 5, "q": 1, "f": "audio/B2017L/5-1.mp3", "s": "（自动语音转写，个别字可能有误）\nえっ\n問題\n五\n五では\n長めの話を聞きます\nメモを取っても構いません\n一番\n二番\n用紙に\n印刷されていません\nまず\n話を聞いて下さい\nそれから\n質問と選択肢を聞いて\n一から四の中から\nもっと\n良いもの\n一つ選んでください\nでは\n始めます\n一番\nスポーツクラブ\n男の人と\n受付の人が話しています\nあの\nしたいと思いまして土日含めて週に何回かプールで泳ぎたいんです\nプールのご利用ですね\nプールの他にトレーニングジムのご利用は希望なさいますか\nうん予算内であれば利用したいですけど月々の会費は一万円までに抑えたいと思ってます\n四つございます\nまずラッキー会員ですと\nプールだけでなく\nトレーニングジムも何曜日でも好きな時にお使い頂けて\nそれからシルバー会員も全ての施設を毎日終日ご利用頂けます\n月の会費は一万五千円になってしまいますが\n専門の指導員がつきますので人気のあるプランになっております\nふんそうですか\nプールだけをご利用希望という方にはブルーカインがあります\n曜日を問わず好きなだけご利用頂けます\nこちらは会費が八千円です\nもしジムをご利用になりたい場合は\n一回ごとに千円でご利用頂けますので月のご利用が二回以下でしたら\n会員よりお得ですね\nお仕事帰りにご利用される方にはナイター会員がおすすめです\nプールが土日祝日を除く平日の夜八時以降にご利用になれて\n七千円です\nあっ\nジムは気が向いたとき月に一回利用するかしないかだし\nじゃあ\nお願いします\n男の人は\nどの会員になりますか\n一\n会員\n二\nシルバーカイン\n三\n会員\n四\nアカイン"}, {"k": "5-2", "sec": 5, "q": 2, "f": "audio/B2017L/5-2.mp3", "s": "（自动语音转写，个别字可能有误）\n［二番］\nデパートの会議\n上司と\n二人が話しています\n今日は\n屋方法について意見を聞きたいと思います\n今はテーブルと椅子を置いて休憩場所として開放していますが\n利用者が少ないのが現状です\nよい利用方法があればいいんですが\nそうですね\n社会人やご高齢のお客様の割合が多いので\nそういった方にゆっくりしてもらえるよう\nあふれる明るい庭を造ってはどうですか\n明るい庭ね\n私は\n子供の遊び場を作るのがいいと思います\nなど\nあるような遊び道具を置いて\nうちは親子のお客様の割合が少ないですから\n目当てでそういった方に来てもらえるようになると\n売り上げにつながります\n私は\n今来て下さっているお客様を大切にしたいと思いますが\n作るのはどうです\n青空の下で飲むコーヒーは格別ですよ\nなるほど\nはないと思いますが\nやっぱり\n連れたお客様を呼び込めるような活用のしかたがいいんじゃないでしょうか\n展では\n週末アニメのイベントを開催したりしてますよね\nうちも\n家族で楽しめるイベントを行ってはどうですか\nどれもいい案だと思いますが\nそうですね\n定期的にイベントを企画実行するのは\nスタッフの負担が大きすぎますね\nそれから\n十二階のレストラン街には\nテラスからの眺めを売りにした店がありますから\n同じようなことをするのもね\n連れのお客様の呼び込みが期待できそうな\nあん\nしょう\n屋上を活用するために\nことにしましたか\n一\n明るい\n二\n子どもの遊び場を作る\n三\n開く\n四\n向けのイベントを開催する"}, {"k": "5-3", "sec": 5, "q": 3, "f": "audio/B2017L/5-3.mp3", "s": "（自动语音转写，个别字可能有误）\n三番\nまず\n話を聞いて下さい\nそれから\n二つの質問を聞いて\nそれぞれ問題用紙の\n一から四の中から\n最もよいものを\n一つ選んで下さい\nでは\n始めます\n三番\n市民センターで\n女の人が\n講座の説明をしています\n来月から新しく始まる講座を四つご紹介します\n交代地\nこの講座では\nペンや鉛筆で美しい字が書けるようになることを目指します\n指導します\nファッションの色使い\n服\n普通\n鞄の上手な組み合わせを学んで\n感覚を磨きましょう\nさん\n教室\n着物の選び方着方はもちろん\n着物から洋服への変化の歴史や\n和室でのマナーなども学びます\n最後の高座四話\n旅行のための英会話教室\n生の英語をたくさん聞いて\n力をしっかり伸ばします\nへえいろんな講座があるんだね\n受講してみたいな\n字が下手だし\n上手になれるのがいいかな\n今って何でも携帯とかパソコンで書くでしょ\n役に立たないかもしれないよ\nあそうだね\nマリコさんは何かよさそうなのあった\n来年留学するって言ってたから\n講座\nそれは向こうに行ってから学べるし\nここでしなくてもいいよ\nそれより\n先で自分の国のことをちゃんと話せるように\n何か\n日本の文化とか作法が学べる講座があるといいなって思ってたんだ\nちょうどいいのがあったけど\nでも\n話聞いてるうちに\nについて学べるのもいいかなって\nうんうん\n服装に自信ないからそれにするよ\nそっか\n私は\n二つのうちどっちにするか迷うけど\n留学に備えられる方にする\n質問\n一\n男の人は\nどの口座に申し込むと言っていますか\n質問二\n女の人は\nどの口座に申し込むと言っていますか"}]}, {"id": "B2018G", "name": "2018年7月", "clips": [{"k": "1-1", "sec": 1, "q": 1, "f": "audio/B2018G/1-1.mp3", "s": "１ 対象者の数を増やす ２ 考察をもっと詳しく書く\n３ 結果の見せ方を変える ４ 分析方法を変える\n大学で 男 の学生と 女 の学生が話しています。\n女 の学生はこの後何をしますか。\nＭ:鈴木さん、この問頼まれたレポ一トのチェックだけと。\nF:あ、先輩、もう見てくださったんですか。\nＭ : うん 、 再調査 し て 対象者 の 数 も 増 え て 、 よ く な っ た ん じ ゃ な い ? 考察 も\n説得力が増して、読んでて面白かったよ。\nF:本当ですか、ありがとうございます。再調査 、思ったより時間 がかかって。;\nでも、やってよかったです。\nＭ:よく頑張ったねえ。うん、せっかくだから、結果の示し方をもう少し工夫して\nみたら? 表 ばっかりじゃなくて、少しグラフも入れるとか。もう少しパッと見てわ\nかるように。\nF:あ、はい。\nＭ:それにしても、この分析方法、面白いね。今度僕も使ってみよう。\n問題一選択肢の設計\n1 已做的 た ている てある もう 済み\n2 要做的(正解) 頼み 命令 てください て てもらえる\n3 之后再做的 あと たら てから 次第\n4 不用做/说话人自己做的 ます型 原型"}, {"k": "1-2", "sec": 1, "q": 2, "f": "audio/B2018G/1-2.mp3", "s": "１ 案内の葉書きを印刷する ２ 宛て名のシールを作る\n３ 会員情報のファイルを更新する ４ メールの文章を作成する\n会社で 男 の人と 女 の人が話しています。\n女 の人はこの後、まず何をしなければなりませんか。\nＭ:佐藤さん、そろそろ会員向けのセ一ルの案内を出さなきゃいけないんだけと。\nF:はい。\nＭ:印刷屋さんから案内の葉書きが出来上がってきたから、宛て名のシ一ルを\n作 ってくれるかな。会員 の情報 をまとめたファイルわかるよね。あれ使 って\n作成して。あ、郵送物を希望していないお客 さんにはメ一ルで送るから、シ一\nルはいらないよ。\nF:はい。会員情報のフアイルは更新されてるんですか。\nＭ:うん、されてるよ。個人情報だから、気をつけて作業してね。\nF:はい。メー ルのほうも 私 が送りますか。\nＭ:まだ文章を準備してないから、今日はいいよ。\nF:わかりました。"}, {"k": "1-3", "sec": 1, "q": 3, "f": "audio/B2018G/1-3.mp3", "s": "１ 保険証のコピーを提 出 する ２ 作業着の中に着るものを用意する\n３ 長靴を買う ４ 健康診断書を提 出 する\n大学で 女 の学生と 男 の学生が話しています。\n女 の学生はこの後何をしますか。\nF:先輩、去年の夏休みに農業体験行かれたんですよね。大学が主催してる。\nあれ、 私 も来週から一ヶ月行くんです。何か持っていったほうがいいものとか\nありますか。\nＭ:保険証。去年忘れた人がいて大変だったんだよ。コビーすら持ってきてなく\nて。僕らみたいな素人が農業 をやるときは、思わぬ怪我とかあるから忘れな\nいように気をつけて。\nF:はい、いつも持ち歩いてます。\nＭ:そう。それから、Ｔシャツは多めに持っていったほうがいいよ。作業着の中\nに着るんだけど、作業をしてると想像以上に汗を掻くからね。作業着とか長靴\nは貸してもらえるよ。よく実習生が来るからか、いろんなサイズのがあったよ。\nF:よかった。長靴買わなきゃって思ってたけど。Ｔシャツは、作業着があるから\nいいかなって思って、部屋着ぐらいしか用意してませんでした。\nＭ:そうそう。実は去年、僕、健康診断を受けるのを忘れてて、もう少しで参加\nできなくなりそうだったんだ。\nF:へえ、で、どうしたんですか。\nＭ:診断書をすく出してくれる病院 を探して、なんとか間に合ったんだけどね。\nF:ああ、それで今年は提 出 が先週 までだったんですね。"}, {"k": "1-4", "sec": 1, "q": 4, "f": "audio/B2018G/1-4.mp3", "s": "１ 講師に材料について相談する ２ 材料のリストを作る\n３ 代わりになる材料を調べる ４ 参加者にメニューの変更を知らせる\n市役所の国際交流課で、 男 の人と 女 の人が話しています。\n男 の人はこれから、まず何をしなければなりません。\nＭ:課長、来月の料理教室のことなんですが。\nF:あ、アジア料理教室の 話 ですね。誰でも家で作れるものっていうことで、メ\nニューも決めたんですよね\nＭ:ええ。講師の方と打ち合わせして材料のリストもらったんです。僕が材料を\n人数分まとめて揃えることになってるんですけど、聞いたことのない材料があ\nつて、取り寄せないといけないみたいなんですよ。\nF:その辺で買えるもので代わりにできないか、講師の先生に相談してください。\n難 しいようなら、メニュー変更ですね。\nＭ:わかりました。\nF:作り方が簡単でも、材料が近所で手に入るものじゃないとね。\nＭ:そうですね。メニューが変更になったら、参加者にも知らせます。"}, {"k": "1-5", "sec": 1, "q": 5, "f": "audio/B2018G/1-5.mp3", "s": "１ グループのリーダーを決める ２ 話し合う課題を選ぶ\n３ 意見をまとめて発表する ４ 自分の研究 テーマを紹介する\n学生の勉強会で、司会の人が話しています。\n参加者はこの後、まず何をしますか。\n今日は、大学合同勉強会にご参加いただき、ありがとうこざいます。\nこれから、世界が今抱えている諸問題についてグループ討論を 行 い、理解を\n深めていきます。\n皆さん、すでにグループに分かれてますね。お配りしてある名簿に丸のつい\nている人がグループのリーダーです。リーダーを中心 に、話 し合 いを進 めて\nいただきます。\n予 め、皆さんに選んでいただいた課題について議論し、どのような対応がで\nきるか、グループごとに意見をまとめて発表してください。\n本題に入る前に、自己紹介も兼ねて、皆さんが今取り組んでいる研究 テーマ\nについて話してください。\nリラックスしてから、話し合いに入りましょう。"}, {"k": "2-1", "sec": 2, "q": 1, "f": "audio/B2018G/2-1.mp3", "s": "１ 歴史的な事実を反映しているところ\n２ テーマに合った音楽が使われているところ\n３ 話 の展開に意外性があるところ\n４ 人物の気持ちが丁寧に表現 されているところ\n大学で映画サ一クルの 男 の学生と 女 の学生があるア二メについて話してい\nます。 女 の学生は、このアニメのどんなところに魅カを感じたと言っています\nか。\nＭ:桜映画祭 で金賞 を取 ったアニメ、見 たんだって。どうだった。３百年前 の\n日本が舞台になってるんでしょう。\nF:うん、歴史的な事実も丁寧に織ってるから。歴史好きの人にはそこが楽しめ\nるんじゃないかな。\nＭ:ふーん。\nF: 私 は、自分が音楽やってるせいか、いつもは、テーマ音楽に気を取られる\nんだけど。これ、物 語 の展開にインパクトがあってね。なんていうか、何度も\n予想を裏切られて、はらはらどきどきしっばなし。今までは、映画は音楽次第\nって思ってたんだけど。\nＭ:そうなんだ。\nF:新聞じゃ、登場人物の 心 の変化が丁寧に描かれてるって評価だよね。その\n見方は、 私 はよくわからなかったけど。"}, {"k": "2-2", "sec": 2, "q": 2, "f": "audio/B2018G/2-2.mp3", "s": "１ 使う予定の飛行機の到着が遅れているから\n２ チェックインカウンターが込んでいるから\n３ 飛行機の清掃に時間がかかっているから\n４ 飛行機の故障が見つかったから\n空港で 男 の人と係りの人が話しています。\n東京行きの飛行機の出発 時間が遅れている理由は何ですか。\nＭ:すみません、さっきの放送、よく聞こえなかったんですが、東京行きの便、\n出発 時間、変更になったんですか。\nF:はい。大変申し訳ございません。一時間遅れで、12時15分の出発 に変更と\nなりました。\nＭ:えっ、そんなに?\nF:申し訳ございません。東京便として使う予定の飛行機がまだこちらの空港に\n到着していないんです。雪で出発 が遅れまして。\nＭ:あ、そうなんですか。チェックインカウンターが込んでいたので、それで遅れ\nているのかと思ったんですが。\nF:本当に申し訳ございません。もう間もなく到着する予定でして、清掃が終わ\nり次第、東京行きのお客様をご案内いたします。\nＭ:わかりました。故障ってわけじゃないんですよね。だったらこれ以上遅れる\nってことはないですよね。\nF:はい。恐れ入りますが、もう少々 お待ちください。"}, {"k": "2-3", "sec": 2, "q": 3, "f": "audio/B2018G/2-3.mp3", "s": "１ 和菓子を作る職人になりたいから\n２ 日本の会社に就職 したいから\n３ 仕事をするのに十分 ではないから\n４ 日常生活で不自由を感じているから\n日本語の教室で 男 の人が話しています。\n男 の人はどうして、今、日本語を勉強 していますか。\n私 は来日 して三年 になります。和菓子 がきっかけで日本 に興味 を持 ち、\n日本語を学ぶようになりました。\n和菓子職人を目指 していた時期 もありましたが、昨年 、食品 メーカーに就職\nし、平日は仕事、週末は日本語教室に通う日々です。\n毎日の暮しの中で言葉で不自由を感じることはありませんが、職場ではまだ\nまだ 力 が足りないなあと感じる場面があり、日本語教室で学ぶことはたくさん\nあると感じています。"}, {"k": "2-4", "sec": 2, "q": 4, "f": "audio/B2018G/2-4.mp3", "s": "１ 土の水分が不足していること\n２ 温度の管理ができていないこと\n３ えさの量 が適切ではないこと\n４ ケースが小さすぎること\n女 の人と 男 の人が、虫の飼い方について話しています。\n男 の人は、 女 の人の虫の飼い方の何に問題があると言っていますか。\nF:あのう、田中さん、虫に詳しいって聞いたんだけど、ちよっと聞いてもいい?\nＭ:どうしたの?\nF:うちで子どもとかぶと虫を飼い始めたんだけど、最近元気がなくて、飼い方\nに問題があるのかなあ。\nＭ:飼い方で大事なのは土、温度管理、餌の量 、ケースの大きさだけど、何か\n気になることある?\nF:うーん、ケースは、3匹いるから、餌の取り合いにならないように、大きめの\nにしてるんだ。温度管理 は小型 の扇風機 もつけてるし、特 に日中 は温度 が\n30 度以上にならないように気をつけてて。土は潜りやすいように、できるだけ\nやわらかいのにしてるよ。\nＭ:あ、わかった。\nF:えっ?\nＭ:扇風機回すと土全体が乾燥しちゃうんだ。土の中にいるときに 体 から水分\nを吸 収 してるんだょ。\nF:そうなの?餌の量 が足りないのかなとか 考 えてたけど。ああ、だから元気が\nなかったのね。なるほど。"}, {"k": "2-5", "sec": 2, "q": 5, "f": "audio/B2018G/2-5.mp3", "s": "１ 会場が狭すぎたこと\n２ ポスターを張った場所が少なかったこと\n３ アンケートを実施しなかったこと\n４ 参加者に資料を配らなかったこと\n市役所で、 男 の職員と 女 の職員が話しています。\n女 の職員が講演会について反省していることは何ですか。\nＭ:斎藤さん、昨日の食事に関する講演会、どうだった?\nF:あ、課長、今ご報告に 伺 おうと思っていたところです。おかげさまで、会場\nの座席が全部埋まるほどの人で。ポスターを掲示する地域を拡大したのがよ\nかったんでしょうか。\nＭ:そうか。\nF:講演後 にアンケートを取 ったんですけど、参加者 の感想 からは、調理法 な\nど実践的な内容が 喜 ばれたことがわかりました。講演中も、熱心に、メモして\nいる方が何人かいたので、材料や作り方を書いたものをお配りしておけばよ\nかったと思います。\nＭ:今回資料は用意しなかったもんね。\nF:はい。それから、今回は 新 しい会場 を使ったんですが、先生の近くで 話 が\n聞けてよかったという声も多くいただきました。\nＭ:それはよかった。\nF:はい。会場の大きさって重要ですね。いろいろご意見いただけてよかったの\nで、アンケートは、次回もぜひ実施すべきだと思いました。"}, {"k": "3-1", "sec": 3, "q": 1, "f": "audio/B2018G/3-1.mp3", "s": "テレビでレポーターがある鉄道について話しています。\n私 は今山川鉄道の山川駅に来ています。\n屋根のない小さな駅なんですが、可愛らしい列車が一両発車を待っています。\n普段は静かな駅ですが、今日は朝から大変混雑しています。\nこの山川鉄道、今日の最終列車の運転を最後に一世紀近くの歴史に幕 を下\nろすことになりました。\n沿線にも、その 姿 を一目見ようと、カメラを持った大勢の鉄道ファンや観光客\nが集まっています。\nレポーターは山川鉄道の何について話していますか。\n1運転最終日の様子 2廃止される理由\n3利用客の増加 4観光客を集める工夫"}, {"k": "3-2", "sec": 3, "q": 2, "f": "audio/B2018G/3-2.mp3", "s": "テレビでアナウンサーが 女 の人にインタビューしています。\nＭ:今日はベットの服を作っている山田ミドリさんにお越しいただきました。\nF:よろしくお願いします。今日は飼い犬のシロと一緒に来ました。シ口が着て\nいるこの服、 私 が初めて作った服なんです。\nＭ:とっても素敵ですね。でも、おしゃれが目的だったわけじゃないんですよね?\nF:ええ、シ口は気温差に弱く、皮膚が弱い犬で、体調管理のために服が必要\nなんです。でも、市販の服 だとサイズがびったりとは合わないので、動 きにく\nいんでしょうね、着るのを嫌がって。それなら自分で作ろうと思いまして。柔ら\nかい生地で、動きを邪魔しないようなデザインにしたら、シ口も嫌がらずに着\nてくれたんです。\nＭ:そうですか。\nF:何枚か作ってるうちに、いろんな犬の服を作りたくなってきて、インターネツ\nトで販売を始めたら、どんどん注文 が入ってきたんです。お客様をお待たせし\nてしまっているのが現状ですが、一着一着 心 を込めて製作しています。\nＭ:シ口も愛情に包まれて 温 かそうですね。お 話 ありがとうこざいました。\n女 の人は何について話していますか\n1 ぺットの服を作る 難 しさ 2 ぺツトの体調管理の注意点\n3 ペツトの服を作り始めたきっかけ 4 ぺット用品が売れている理由"}, {"k": "3-3", "sec": 3, "q": 3, "f": "audio/B2018G/3-3.mp3", "s": "ラジオでアナウンサーが話しています。\n今日は天気雨の現象があちこちで観察されました。\n空に雲一つなく晴れているのに、突然雨が降るというこの現象 、どのように起\nきるのか、皆さん案外ご存じないんじゃないでしょうか。\n天気雨 は雨 の粒 が雨雲 から落 ちた後 に、雲 が消 えたり動 いたりしたために\n発生します。\n雨 の粒 が強 い風 で飛 ばされて、雲 から離 れたところに降 ることで発生 する\n場合もあります。\n出来れば、突然の雨は避けたいものですが、雨の粒に日の 光 が当たるのは\nきれいですよね。同様の現象は冬にも雪で見られるんですよ。\nアナウンサーは何について話していますか。\n1天気雨を予測する方法 2天気雨が降る仕組み\n3天気雨を避ける方法 4天気雨が多い季節"}, {"k": "3-4", "sec": 3, "q": 4, "f": "audio/B2018G/3-4.mp3", "s": "テレピでアナウンサーが話しています。\n今、若葉町の中央高校に来ています。\n去年からこちらの高校の校門の前で記念写真を取ろうという外国人の観光客\nがたくさん 訪 れるようになりました。\nそれは、この高校で映画『青 春 ストーリー』が撮影されたためです。この映画\nは 10年前に日本で公開され、大変話題になりました。\nこ の 映画 に 出 演 し て い た 俳優青木拓哉 さ ん が 去年別 の 映画 で 世界的 な\n映画賞を取ったことで、海外でもこの映画が注目されるようになったんだそう\nです。\n高校だけでなく、町のあちこちにこの映画が撮影された場所があり、ファンに\n大変人気があるとのことです。\nアナウンサーは何について話していますか。\n1海外からこの町を 訪 れる人が増えた理由\n2 この映画が日本で話題になった理由\n3 ある俳優が映画賞を取った理由\n4 この町で映画が撮影された理由"}, {"k": "3-5", "sec": 3, "q": 5, "f": "audio/B2018G/3-5.mp3", "s": "町の会議で議員が話しています。\n昨年度 の調査 によると、わが川中町 ではだれも住 んでいない空 き家 がこの\n十年 で二倍に増えていることが明らかになりました。\n空 き家 の増加 は地域 の防犯上 、深刻 な問題 です。火災 の発見 が遅 れたり、\n建物が古くなって崩れたりする危険もあります。\nそうした空き家は早急に取り壊すべきだという意見が出ていますが、再生させ\nる道を探るほうがいいのではないでしょうか。\n全国の例を調べてみますと、自治体が空き家を管理し、商業施設として再生\nさせているところもあり、人を呼び込むことにつながっている例もあります。\n議員が言いたいことは何ですか。\n1空き家の数を調べるべきだ 2空き家を早く取り壊すべきだ\n3空き家を活用すべきだ 4空き家が増えた理由を調べるべきだ"}, {"k": "4-1", "sec": 4, "q": 1, "f": "audio/B2018G/4-1.mp3", "s": "李さん、昨日のブレゼンで李さんを見直しちゃった。\n1 それじゃ、もうー度見直してみる 2 ええ、頑張ったんだけどな\n3 そう?ありがとう"}, {"k": "4-2", "sec": 4, "q": 2, "f": "audio/B2018G/4-2.mp3", "s": "うーん、この天気じゃあ、今日のお花見は中止にするしかないね。\n1残念だけど、しょうがないね 2 この天気でもやるの\n3中止にしなくてよかったね"}, {"k": "4-3", "sec": 4, "q": 3, "f": "audio/B2018G/4-3.mp3", "s": "お客様、館内での撮影はご遠慮いただけますか。\n1 あっ、お願いしていいですか 2 すみません、だめなんですね\n3 じゃあ、遠慮なく"}, {"k": "4-4", "sec": 4, "q": 4, "f": "audio/B2018G/4-4.mp3", "s": "今日はついてないなあ。\n1 だからつけてこなかったんだね 2 うまくいったんだ。よかったね\n3 えっ、なんかあったの"}, {"k": "4-5", "sec": 4, "q": 5, "f": "audio/B2018G/4-5.mp3", "s": "課長、次の企画のリーダー、引き受けた以上はしっかりやります。\n1引き受けるかどうか迷ってるの 2 うん、期待してるからね.\n3引き受けてほしかったなあ"}, {"k": "4-6", "sec": 4, "q": 6, "f": "audio/B2018G/4-6.mp3", "s": "今日の講演会、聞きに来た甲斐がありましたね。\n1貴重なお 話 が聞けましたね 2講演会聞けたらよかったですよね\n3確かに来る必要なかったですね"}, {"k": "4-7", "sec": 4, "q": 7, "f": "audio/B2018G/4-7.mp3", "s": "部長、出席者の皆さん、もう会場にお揃いです。まだ時間前ですが。\n1 そうですか。 私 もすぐ行きます\n2 じゃ、全員揃ったら教えてください\n3 そろそろ皆さんを会場にご案内してください"}, {"k": "4-8", "sec": 4, "q": 8, "f": "audio/B2018G/4-8.mp3", "s": "田中さん、皆の前で山田くんに注意すべきじゃなかったんじゃない?\n1 やっぱり言ってよかったってことだね 2 でも、必要だと思ったから\n3注意しろって言うならするよ"}, {"k": "4-9", "sec": 4, "q": 9, "f": "audio/B2018G/4-9.mp3", "s": "鈴木さん、午後の打ち合わせ、わたし抜きで始めといてもらえる。\n1何時頃いらっしゃいますか\n2 いらっしゃってから始めるんですね\n3途中で抜けられるということですか"}, {"k": "4-10", "sec": 4, "q": 10, "f": "audio/B2018G/4-10.mp3", "s": "この旅館、設備はともかく、サービスは満点だね。\n1 ほんと、設備もサービスも最高だね\n2設備もよければ文句ないのにね\n3 サービスさえよければいいんだけどね"}, {"k": "4-11", "sec": 4, "q": 11, "f": "audio/B2018G/4-11.mp3", "s": "青木さん、今回の新製品、青木さんの協力 なしには完成しなかった\nよ。\n1完成させられなくて、残念です\n2協力 できなくて、申し訳ありません\n3 お役に立てて、うれしいです"}, {"k": "5-1", "sec": 5, "q": 1, "f": "audio/B2018G/5-1.mp3", "s": "（自动语音转写，个别字可能有误）\n一番\n代理店\n女の人と店の人が話しています\n来月の\n十二日十三日に\n市に行くので泊まるところを予約したいんですが\n大学で会議があるので会場に近いところがいいんですが\n来月の千二百十三で\n大学の近くですね\n一万円くらいであるとうれしいです\nお待ちください\nご希望に合うところは\n四つあります\n一つ目は\n花館\n大学へは徒歩五分ぐらいですね\n一名様一万三千円ですが\n温泉があります\nあっ\n市って温泉が有名なんですよね\nせっかくだから温泉がある所がいいです\n二つ目はみどりホテルです\nこちらは大学まではバスで十分ぐらいですが\n前にバス停があります\nこちらも温泉があって\n九千円です\n大学まではバスですか\n三つ目は朝日旅館です\nこちらも\n大学へはバスで十分ほどです\n付き\n一万円です\nそうです\n最後は\n森山\nこちらは\n大学まで徒歩五分で\n八千円です\nやっぱり温泉がある方がいいな\n大学までバスで十分ぐらいならいっか\n少しでも安い方がいいから\nここ\nお願いできます\n女の人は\nどこを予約することにしましたか\n一\n花旅館\n二\nホテル\n三\n旅館\n四\n森山"}, {"k": "5-2", "sec": 5, "q": 2, "f": "audio/B2018G/5-2.mp3", "s": "（自动语音转写，个别字可能有误）\n二番\n地域の合唱サークルのリーダー\nがい\n最近あまり熱心に練習していない人が多いって一部のメンバーから苦情が出てるんですよ\nやってる人が多いから\n感がなくなってきてるのかもしれませんね\nよく知ってる歌を歌うことが多いですし\nそうですね\n場所を時々変えてみませんか\n大きめのホールとかに\n使用料は上がりますが\n音の響きもいいそうですよ\nそうね\n舞台に立ってる感じになるね\n今使ってる市民センター三か月後まで予約してあるから\nからは時々変えてみましょうか\nええ\n他の合唱サークルと合同練習を計画してみるとか\n練習に身が入るかもしれません\nなるほど\n一緒にやってくれるサークルを探すのが大変ね\nあの\n目標みたいなものを建てるのはどうですか\nやってなかっ\n私たちの歌を聴いてもらう機会を作るとか\nそうね\nまたは\nよりちょっと難しい曲にチャレンジするだけでもいいと思います\nって気持ちが起きるんじゃないですか\nコンサート\nメンバーのやる気は出そうですが\n準備が大変ですよね\nなら今度の練習からでも取り入れられそうですが\nそうね\nコンサートは一度みんなに相談してみましょう\n練習の場所を変えるにしても少し先のことになりそうだから\nすぐ始められることからやってみましょう\nこのサークルでは\nまず\n何をすることにしました\n一\n二\nサークルと合同で練習する\n三\n四\n難しい曲にチャレンジする"}, {"k": "5-3", "sec": 5, "q": 3, "f": "audio/B2018G/5-3.mp3", "s": "（自动语音转写，个别字可能有误）\n三番\nで男の人が話しています\n公園では\nきれいで過ごしやすい公園を目指して\nさまざまな作業をして下さるボランティアの方を募集します\n作業の内容によって\n四つのグループに分かれています\n一は\n手入れをします\n主に\n種をまいたり\n草取りをしたりします\n二\n手入れをします\n木の名前を書く板の作成\nなどして頂きます\n経験者の方には枝を切る作業もお願いする予定です\nグループ三は\n内のゴミ拾いや\n掃きなどの清掃が主な作業です\n四は\n公園で行う自然体験教室の手伝い\n小学生向けの自然観察会や\nミニ工作］\nとして参加して頂きます\n各グループの活動日や時間など\n詳細はホームページをご覧下さい\nあの公園\nきれいなのはボランティアの人たちのおかげなんだね\n私たちもやってみない\nいいね\n私子供が好きだから\n体験教室に参加したいけど\n苦手なんだよね\n正夫さんは器用だし\n工作とかも得意じゃない\n自分がするのは好きだけど\n相手はちょっとな\nそれより\nテレビで植木職人のドキュメンタリーを見て面白いと思ったんだ\n名前とかも覚えられるし\nそのグループがいいな\n私は\n見てる\nれな花壇に\n形で関わりたいな\nそれにしよっと\nいいんじゃない\n掃除は苦手だよね\nひどい\n［質問\n一\n男の人は\nどのグループのボランティアをしたいと言っていますか\n質問二\n女の人は\nどのグループのボランティアをしたいと言っていますか"}]}, {"id": "B2018L", "name": "2018年12月", "clips": [{"k": "1-1", "sec": 1, "q": 1, "f": "audio/B2018L/1-1.mp3", "s": "会社で 男 の人と 女 の人が話しています。\n男 の人は列車の席をどのように予約しますか。\nM：部長、今度の京都での会議、会長 もご一緒ですよね。\nF：はい。\nM：じゃ、京都へいらっしゃるのは全部で三名ですね。\nF：ええ、会長 と社長、それから 私 で三名ですけど。\nM：そうですよね。いまから京都行きの列車の切符を取ろうと思 ってるんです\nが、先日のミーティングの資料には四席取ることって書いてあったので。間違\nいでしょうか。\nF：あっ、いえ、それでいいんです。会長にはゆったり座っていただきたいので、\n隣 の席も取っておきたくて。このことは言ってませんでしたね。すみません。\nM：ああ、そういうことなんですか。じゃあ、席はどうしましょうか。前後のほうが\nいいでしょうか。それとも、通路を挟んで横一列で取りましょうか。\nF：そうですね、前後でお願いします。\nM：わかりました。\n問題一選択肢の設計\n1 已做的 た ている てある もう 済み\n2 要做的(正解) 頼み 命令 てください て てもらえる\n3 之后再做的 あと たら てから 次第\n4 不用做/说话人自己做的 ます型 原型"}, {"k": "1-2", "sec": 1, "q": 2, "f": "audio/B2018L/1-2.mp3", "s": "1 服をサイズ別に分ける 2 アイロンをかける\n3 値段のシールをはる 4 値段を確認する\nバザーの運営スタッフの 女 の人がバザーの準備について話しています。\n手伝いをする人は今日、何をしなければなりませんか。\n今日はお手伝いに集まってくださってありがとうございます。\nあさってのバザーで皆 さんに持 ってきていただいた洋服 を販売 しますが、\n今日はその準備をします。\nええと、お客 さんが選びやすいようにサイズ別に分類したいと思いますので、\n皆さんはその作業をお願いします。\nもし少し皺が気になるものがあっても、時間がありませんので、アイロンはか\nけずに、そのまま出します。\nなお、運営スタッフのほうで、100円から 500円の 間 で値段をつけて値段ごと\nに色の違うシールを貼っておきますので、販売するときは、間違いないように\nしてください。"}, {"k": "1-3", "sec": 1, "q": 3, "f": "audio/B2018L/1-3.mp3", "s": "１ 自分で大学に行って申し込む ２ 郵便で申し込む\n３ 代理の人に申し込みをたのむ ４ インターネットで申し込む\n電話で大学の係りの人と 男 の人が話しています。\n男 の人はどのように証明書を申請しますか。\nF：はい、東上大学です。\nM：あのう、卒業生 なんですが、卒業証明書を取りたい場合、どうすればいい\nですか。\nF：はい。証明書でしたら、大学に来て申請していただければ、その日にお渡\nしできます。その場合 は、ご本人 であることが確認 できるものをお持 ちくださ\nい。\nM：実は今、海外に住んでいて行けないんですが。\nF：そうですか、郵送での申請も受け付けていますが。事前にこちらに手数料\nを振り込んでいただきます。申し込みの際、身分証明の写しを同封してくださ\nい。あるいは、窓口 で代理 の方 に申 し込 んでいただくこともできます。その\n場合、ご本人との関係を確認するための書類が必要となります。\nM：そうですか。こちらから振り込むのはちょっと大変なんですよね。\nF：では、どなたかに窓口 に来 ていただくようお願 いそれではいかがでしょう\nか。\nM：じゃあ、そうします。あのう、ちなみに、大学のホームべ一ジから申し込む\nことはできないんですよね。\nF：すみませんが、インターネットでの申請は本人確認ができないので…\nM：そうですよね。わかりました。"}, {"k": "1-4", "sec": 1, "q": 4, "f": "audio/B2018L/1-4.mp3", "s": "１ 調査結果をぶんせきする ２ 指定された本を読む\n３ 商品開発の疑問点を問い合わせる ４ 新商品のきかくしよを書く\n会社で 男 の人と 女 の人が話しています。\n女 の人はこの後、研修 までに、何をしなければなりませんか。\nM：山本さん、来週、商品開発の社内研修、受けるよね。さっき研修 の担当者\nが来たんだけど。山本さん、席外してたから、資料を預かっておいたよ。\nF：ありがとうございます。\nM：この資料、去年よく売れた商品の開発前のアンケート調査の結果なんだっ\nて、当日までにデータの傾向を見て、それが示す意味をまとめてくるようにっ\nて言ってたよ。今仕事も大変だと思うけど、なんとか時間作って。\nF：わかりました。\nM：課題図書も出ていたよね。もう読んだ？\nF：はい。指定された本を読んで商品開発について、いろいろ疑問点や知りた\nい点が出てきました。\nM：そうか。じゃあ、研修 で質問したりして、しっかり議論してくるといいよ。\nF：はい。\nM：この研修会 では新商品の企画書を書くところまでするだろう。うまくいけば\n実際に商品化されることもあるから、いい企画書書けるよう、頑張 って。いい\n経験になると思うから。\nF：はい。"}, {"k": "1-5", "sec": 1, "q": 5, "f": "audio/B2018L/1-5.mp3", "s": "１ポスターのデザインを 考 える\n２みどり大学の担当者に連絡する\n３会場をさがす\n４作品の写真をとる\n大学で書道サークルの 女 の学生と 男 の部長が話しています。\n女 の学生は何をしなければなりませんか。\nF：展覧会まで後 4 ヶ月ですね。ポスターの準備とかそろそろ始めたほうがい\nいですか。\nM：うん、ポスターは二年生の渡辺さんにデザインを 考 えてもらおうかなと思\nってるんだ。\nF：いいですね。\nM：それでね、去年の展覧会 にみどり大学の書道 サークルの人たちが来 てく\nれて今度一緒に何かやりたいねって 話 になったの、覚えてる。\nF：そうでしたね。\nM：あっちの部長と連絡取 ったんだけど、今年は共同制作 とかやろうっていう\n話 になってるんだ。向 こうの担当者 の連絡先 を聞 いてるから、詳 しいことを\n相談してくれる？\nF：はい、じゃあ、会場も 広 いぼうがいいですよね。\nM：うん。今までは大学の中だったけど、今回は大学の外の施設を借りてみた\nらどうかなってと思って、いくつか候補を絞ったところなんだ。\nF：そうですか。\nM：それと、宣伝のために、ホームページに作品の写真 を載せとこうと思 うん\nだ。過去の展覧会に出したやつ、写真に撮って残してあるから。\nF：いいですね。"}, {"k": "2-1", "sec": 2, "q": 1, "f": "audio/B2018L/2-1.mp3", "s": "１ いつもどおり仕事をする ２ 一人でのんびり過ごす\n３ 仲間と地球を救う ４ 大切な人に会いに行く\n映画を見た後で、 女 の人と 男 の人が話しています。\n男 の人は今日が地球最後の日だと言われたら、どうすると言っていますか。\n男の人です。\nF ： あ あ 、 久 し ぶ り に 映画見 て 面白 か っ た 。 朝目 が 覚 め て 突然今日 が\n地球最後の日だって言われるなんて。主人公 は最後まで自分のお店 でいつ\nもと変わらずラーメン作り続けたけど…ねえ、高橋君もそういうタイプなんじゃ\nない。職人で、プロ意識高いから。\nM：いや。そうなったら、もううちで一人のんびりと好きな音楽聞いたり、DVD見\nたりして、いつもの休日 と同じようにしてるよ。仲間と地球をすくうために立ち\n上がったらかっこいいけど、現実はそうはいかないからね。\nF：まあ、そうだね。わたしだったら、家族とか友達とか自分の大切な人たちに\n会いに行って、感謝の気持ちを伝えたいなあ。\nM：なるほどね。\nF：ああ。おなかすいたね。なんか食べ行こう。"}, {"k": "2-2", "sec": 2, "q": 2, "f": "audio/B2018L/2-2.mp3", "s": "１ 仕事にやりがいを感じなかったから\n２ 収 入 に満足できなかったから\n３ 体力が続かなかったから\n４ 夜勤をしたくなかったから\nラジオでアナウンサーが高齢者の介護施設で 働 く 女 の人にインタビューをし\nています。女の人が以前仕事をやめたいと思ったのはどうしてですか。\nM：介護の仕事というと、体力的にも精神的にもハードというイメージがありま\nすが、実際はいかがですか。\nF：そうですね。ベッドから 体 を抱 えて 車 いすに乗 せたり、いろいろと大変 な\n仕事なんですが、人のお役に立ててると思うと、やりがいを感じます。\nM：そうですか。\nF：それでも、 働 き始めたころ、一度だけやめたいと思ったことがあります。や\nりがいは感じるし、それに生活のためには 収 入 が必要だって頑張ってはきた\nものの、そのときはもう体力の限界で。\nM：介護の仕事は夜勤もありますしね。\nF： 私 は当時夜勤はしてなかったんですけど、それでも…でも、今は経験やス\nキルによって無駄な動きがなくなったせいか、ずいぶん楽になりました。頑張\nって続けてきて本当によかったと思っています。"}, {"k": "2-3", "sec": 2, "q": 3, "f": "audio/B2018L/2-3.mp3", "s": "１ ほかのクラスと教室を変換するから\n２ 受講する学生の数が増えたから\n３ 道路に面していてうるさいから\n４ 教室の設備に問題があったから\n授業で先生と学生が話しています。\nどうして来週から授業が 行 われる教室が変わりますか。\nF：ええ、この現代文学の授業は今日が初回ですが、二回目の来週の授業か\nら、一階のこの教室ではなく、三階の 302 の教室で授業を行います。\nM：先生、教室が変更になるんですか。\nF：はい。302 で授業 をされている先生 が足 を骨折 されたとかで。ほら、この\n校舎エレベータ一がないから階段上るの大変でしょう。この時間一階 の教室\nは全部埋まってて、このクラスと入れ替わることになりました。受講生の数が\nだいたい同じなのでね。あのう、この教室と同じで 302 もどうろに面してないの\nで、静かで環境 は悪 くないですよ。えっと、ただ受講科目の登録変更 が来週\nまで可能なので、この後受講生の数が大幅に増えたり、教室の設備で困るこ\nとがあったりしたら、また別の教室に変更するかもしれません。とにかく来週、\n教室を間違いように。"}, {"k": "2-4", "sec": 2, "q": 4, "f": "audio/B2018L/2-4.mp3", "s": "１ 共通の話題を見付ける ２ 積極的に話しかける\n３ 相手の様子をよく観察する ４ 自分をよく見せようとしない\nコミュニケーションのセミナーで先生が話しています。\n先生はどのようにしたら、初めて会う人とうまく話せるようになったと言ってい\nますか。\n私 は以前初対面 の人と会話 をするのが苦手 でした。共通の話題 を見付 よう\nと、つい余計なことまで聞いてしまったり、積極的にと思い、一方的にしゃべり\nすぎて、後で落ち込んだり。\nあるとき人に言われたんです。自分のことをどう思われるか意識しすぎてるか\nら、緊張してあせるんじやないかって。そのとおりでした。\n相手によく見られたいという 考 えを捨てたら、自然にリラックスして、うまく話\nせないという悩みから解放されたんです。"}, {"k": "2-5", "sec": 2, "q": 5, "f": "audio/B2018L/2-5.mp3", "s": "１ 金曜日の 5000円のツアー ２ 金曜日の 8000円のツアー\n３ 土曜日の 5000円のツアー ４ 土曜日の 8000円のツアー\n男 の人と 女 の人がバスツアーについて話しています。\n二人はどのツアーに申し込むことにしましたか。\nM：金曜日の日帰りバスツアーのことなんだけど、さっき旅行会社に 8000円の\nツアーが空いてるかどうか確認してみたよ。\nF：ありがとう。どうだった？\nM：キャンセル待ちだって。5000円のもあってね。それならとれるんだけど。\nF：5000 円のツアーって、どうなの？\nM：8000 円のツアーとだいたい同じなんだけど、近代美術館の見学がついて\nないみたい。\nF：えっ、それが楽しみなのに…それだったら、やっぱりキャンセル待ちでいい\nから、申し込もう。\nM：う一ん。あのさ、金曜日じゃないと無理かな。土曜日ならまだ空席があるら\nしいんだけど。\nF：土曜日か？友達と約束してるんだよね。日にち変えてほしいって、言 いづ\nらいなあ。\nM：そっか。じゃあ、しかたがないね。君の都合に合わせるよ。\nF：うん、ありがとう。次はそっちの都合を優先させるから。"}, {"k": "3-1", "sec": 3, "q": 1, "f": "audio/B2018L/3-1.mp3", "s": "会社で 女 の人と 男 の人が話しています。\nF：最近パン作るのにこってるんだって？\nM：うん、パンを作る機械を買ったんだ。材料を入れて、スイッチを押して放っ\nておけば簡単にパンができちゃうんだ。焼き上げたときの香りとか、出来たて\nの味とかたまらないんだよ。\nF：へえ、お父さんがパンを作ってくれてお子さんも 喜 んでるんじゃない？\nM：うん、お店のパンみたいなのがいいって言って、あまり食べてくれないんだ\nよね。\nF：奥さんの反応はどう？\nM：妻は毎日同じパンだから厭きるって。\nF：そうなんだ。ごまとかフルーツとか、何かお子さんや奥さんの好きそうなも\nのを入れてみたら食べてもらえるんじゃない？\nM：そうだね。\n男 の人は機械で作ったパンについてどう言っていますか。\n1 自分は気に入っているが、家族の評判 は良くない。\n2 自分は気に入っていないが、家族の評判 はいい。\n3 自分も家族も気に入っている。\n4 自分も家族も気に入っていない。"}, {"k": "3-2", "sec": 3, "q": 2, "f": "audio/B2018L/3-2.mp3", "s": "大学の就職説明会で卒業生が話しています。\n皆 さ ん 、 ど ん な 分野 の 企業 で 働 き た い と 思 っ て い ま す か 。 私 は\n現在保険会社で 働 いていますが、実は就職活動を始めたときは自動車メー\nカーを志望していました。\n誰よりも早く情報を集め、頑張りました。でも受けた会社は全て不採用でした。\nそれで、それまでまったく 考 えていなかった会社にも応募してみたら、三社か\nら採用通知をもらえたんです。\n今 の仕事 は学 ぶことも多 く、やりがいもあります。あのとき、自動車 メーカ一\n以外の会社に目を向けてみてよかったと思っています。\n皆さんも就職活動 では範囲を広 げたほうが最終的に自分 にあった会社 が見\nつかるんじゃないかと思います。\n卒業生は就職活動についてどんなアドバイスをしていますか。\n1 特定の分野だけにこだわらないほうがいい\n2 早めに会社の情報を集めるべきだ\n3 入りたい会社は何度でも受けるべきだ\n4 興味のある仕事を選んだほうがいい"}, {"k": "3-3", "sec": 3, "q": 3, "f": "audio/B2018L/3-3.mp3", "s": "テレビでアナウンサーが話しています。\n最近、スーパーの 新 しい 形 として小型スーパ一が都心に次々と開店してい\nます。この種のスーパ一は都心を中心に出店 されているもので売り場面積が\nこれまでの平均的なスーパーの五分の一程度となっています。\n売 り場 では肉 や野菜 が 少量 ずつに分 けて販売 されています。都心部 には\nたか龄もの ひ と り ぐ ひと ぞ う か じ た く しょうりょう しょうひん か\n高龄者や一人暮らしの人が増加しており、自宅にちかく、少量 ずつ商品 が買\nえることから、こうしたスーパーが人気を集めているようです。\nアナウンサーは何をリポートしていますか。\n1 小型スーパーの問題点\n2 平均的なスーパ一の売り場面積\n3 新 しいタイブのスーバーの特徴\nこう龄しゃ た よ う\n4 高龄者への多様なサービス"}, {"k": "3-4", "sec": 3, "q": 4, "f": "audio/B2018L/3-4.mp3", "s": "テレビでレポ一タ一が話しています。\nここ村上町には以前は雑草が伸び放題の空き地がたくさんありました。\nそのような土地は手入れをしないと、大量の虫が発生しますし、見通しが悪く\nなって防犯上も良くないといった声もあり、町では数年前から対策が取られて\nきました。\n去年までは農薬を使って手入れをしていたそうですが、薬 の害を心配する町\nの人も多いことから、今年はヤギの 力 を借りることにしたそうです。\n空き地に二三頭を放すと、雑草をきれいに食べてくれ、人体や環境 への心配\nもないと 喜 ばれていて、今後も継続されるようです。\nレポ一ターは何について話していますか。\n1 ヤギのえさとなる草の育て方\n2 空き地の有効な利用の仕方\n3 環境 に害のない農薬の使用法\n4 ヤギを使った空き地の雑草の処理方法"}, {"k": "3-5", "sec": 3, "q": 5, "f": "audio/B2018L/3-5.mp3", "s": "ラジオで男の人が話しています。\nM：え、日本では生活 の西洋化 が進んで椅子 に座 ることが増 えてあまり正座\nをしなくなりました。\nただ、これがいま見直されつつあるんです。正座はとても健康的な座り方で、\n姿勢が悪くなりがちな現代人の悩みを解消してくれます。\nううん、例えば、体操のような効果があり、くびや肩、腰の痛みが良くなるんで\nすよ。また、胃が正常 な位置に固定されるため、食べ過ぎることがなく、胃や\n肌の調子も改善されます。\nこうした 体 の不調に悩み薬 を飲んでいた方が、すっかり痛みから解放された\nという声も聞かれます。\n男 の人が伝えたいことはなんですか。\n1 日本人の生活の変化\n2 正座の効果\n3 姿勢を良くする体操\n4 痛みによく効く薬"}, {"k": "4-1", "sec": 4, "q": 1, "f": "audio/B2018L/4-1.mp3", "s": "りさん、りさんのお住まいはどちらですか。\n1 みなみ銀行に勤めてます。\n2 うちはみなみ町 です。\n3 みなみ大学の出身です。"}, {"k": "4-2", "sec": 4, "q": 2, "f": "audio/B2018L/4-2.mp3", "s": "ねえ、作業をやりかけだから、まだこのパソコンつけといて。\n1 うん、そのままにしておく。\n2 じゃ、すぐにつけるよ。\n3 もう使わない？"}, {"k": "4-3", "sec": 4, "q": 3, "f": "audio/B2018L/4-3.mp3", "s": "あのう、この資料2、3日貸してもらえるとありがたいんだけど…\n1 えっ、よかったですね。\n2 どういたしまして。\n3 うん、かまいませんよ。"}, {"k": "4-4", "sec": 4, "q": 4, "f": "audio/B2018L/4-4.mp3", "s": "ねえ、ねえ、留学したことあるんだって？\n1 いい経験になるといいね。\n2 一か月だったんだけどね。\n3 うん、がんばってくるよ。"}, {"k": "4-5", "sec": 4, "q": 5, "f": "audio/B2018L/4-5.mp3", "s": "今から 新 しいソフトウェアの説明するけど、メモしとかないと忘れちゃうよ。\n1 ちゃんと書いておきます。\n2 メモしておけばよかったです。\n3 書いてくださって助かりました。"}, {"k": "4-6", "sec": 4, "q": 6, "f": "audio/B2018L/4-6.mp3", "s": "伊藤さん、今日のプレゼン、初めてのわりにはうまくまとめてたね。\n1 前回のほうがよかったでしょうか。\n2 そうですか。緊張してたんですけど。\n3 最初のところだけってことですね。"}, {"k": "4-7", "sec": 4, "q": 7, "f": "audio/B2018L/4-7.mp3", "s": "きのうそこのレス卜ランでステーキ定食頼んだら、食べきれなかったよ。\n1 そんなに量 が多かったの？\n2 切れないほど固かったの？\n3 じゃ、ぜんぜん足りなかったの？"}, {"k": "4-8", "sec": 4, "q": 8, "f": "audio/B2018L/4-8.mp3", "s": "総務課の田中さん、会社やめるのを思いとどまったんですって。\n1 会社やめた後、何するんだろう。\n2 考 えは変わらなかったんだね。\n3 誰かに引き留められたのかな。"}, {"k": "4-9", "sec": 4, "q": 9, "f": "audio/B2018L/4-9.mp3", "s": "転勤の 話 、嫌なら 断 ればよかったのに。\n1 せっかく 断 ったのにね。\n2 なかなかそうもいかなくて。\n3 うん、 断 って正解だったよ。"}, {"k": "4-10", "sec": 4, "q": 10, "f": "audio/B2018L/4-10.mp3", "s": "小田さん、小田さんのファッションは流行に左右されず、いつもおしゃれ\nですね。\n1 えっ、このデザインって流行してるんですか。\n2 今流行してるものを着たいですからね。\n3 流行にはあまり興味がないんです。"}, {"k": "4-11", "sec": 4, "q": 11, "f": "audio/B2018L/4-11.mp3", "s": "田中先生って 忙 しいから、講演頼んでも 断 られるに決まってるよ。\n1 本当にありがたい 話 ですね。\n2 それでは、決めてみましょうか。\n3 聞いてみないとわかりませんよ。"}, {"k": "5-1", "sec": 5, "q": 1, "f": "audio/B2018L/5-1.mp3", "s": "うちで 男 の人と 女 の人が市のホームページを見ながら話しています。\nM：ねえ、見 て、市 のホームページに地域 の公園 が紹介 されてるよ。大 きな\n公園いくつかあるみたいだから、今度行ってみない？\nF：うん、引っ越してきて 2週間になるけど、まだどこにも出かけてないもんね。\nM：どんなとこがいい？\nF：う一ん、綺麗な花が楽しめて、テニスができるとこってないかな。ここから 10\n分くらいでいけるとこ、自転車で。\nM：そうだな。東公園なら歩いて 10分で行けるよ。一面芝生が広がってて 緑\nが綺麗なんだって。運動施設はないみたいだけど。それから、西公園、テニス\nコードと野球場 もあるね。一年中 いろんな種類 の花 も楽 しめるって。距離 は\n東公園と同じくらい。\nF：へえ。\nM：それから南公園 。自転車で 10分くらいかな。スポーツ施設があって、あ、\n桜並木が綺麗なんだって。ここ良さそうじゃない？\nF：知ってる。そこって桜 で有名な公園 だよね。今の時期、花見で人 がいっぱ\nいなんじゃないかな。\nM：うん、あとは北公園。パーベーキュー広場 やテニスコードが充実 してるん\nだって。春はなのはな、夏はひまわりが畑 一 面 に咲くらしいよ。ここに行くなら\n車 だね。\nF：うん、やっぱり近いほうが行きやすいよね。久しぶりにラケットを振りたいし、\n花は楽しみたいけど、混雑は避けたいし、そうすると、ここね。\n女 の人はどの公園に行きたいと言っていますか。\n1東公園 2西公園 3南公園 4北公園"}, {"k": "5-2", "sec": 5, "q": 2, "f": "audio/B2018L/5-2.mp3", "s": "市役所で上司と職員二人が花火大会の混雑について話しています。\nA ： 今年 で 二回目 と な る 花火大会 で す が 、 去年会場 か ら 最寄 り 駅 ま で\n終了直後の混雑がひどかったので、なんとかしたいんです。何かいい案はあ\nりますか。\nM：会場からはすこし離れますけど、市役所の屋上からも見られますので、そ\nういった公共施設を開放するのはどうでしょうか。そうすれば、見物客 の利用\nする駅が一箇所に集 中 しないと思います。\nF：でもこの日 は施設 の警備 まで対応 できないと思 います。花火 のほうで\n手一杯で。\nA:そうですね。\nM：それが 難 しいなら、商業施設に協力 してもらうのはどうですか。屋上から\n快適に見られますし、商業施設にとってもお客 さんが増えていいと思います。\nA：なるほどね。\nF:でも、今から場所をピックアップするのはたいへんじゃないでしょうか。\nM：そうか。\nF：それより、花火終了後、会場 から一気に人が出て行かないように少し費用\nはかかりますが、会場 で何かイベント開催してはどうでしょうか。有名人を呼\nんだりして。\nA:イベントね。\nF：あと、去年 は花火大会 の最後 が盛 り上 がるように、大 きな花火 をラストで\n集 中 てきに打ち上 げましたが、今年 は二部構成 にして、盛 り上 がるところを\nニつ用意するのはどうですか。最後に打ち上げることになっている花火のうち、\n半分を前半の最後に持ってくるんです。お子さんがいる家族連れなど前半を\n見て会場を後にする人もいると思います。\nA:なるほど。やっぱり見物客 は近くから見たいでしょうから、場所で対策 を取\nるのは限界があるかもしれません。帰る時間に差が出きそうな方法がいいで\nすね。今から予算を増やすのは 難 しいから、予算に影響をしない案で行きま\nしょう。\n職員は問題を解決するためにどうすることにしましたか。\n1公共施設を見物客に開放する。\n2商業施設に場所の提供を依頼する。\n3花火終了後に会場でイベントをする。\n4花火のブログラムを一部と二部に分ける。"}, {"k": "5-3", "sec": 5, "q": 3, "f": "audio/B2018L/5-3.mp3", "s": "高校で先生が卒業した先輩たちを紹介しています。\n今日は将来の仕事について理解を深めるため、社会で活躍中の四人の先輩\nの 話 をそれぞれ分かれて 伺 います。ご紹介しますので、 話 を聞きたい先輩\nのところに移動してください。\nまず 、 小説家 の 石川悟 さ ん で す 。 石川 さ ん は 趣味 で 、 小説 を 書 き 始 め 、\n大学生のときに最初の本を出版 し、小説家としての道を歩き始めました。\n次 は中学 で数学 の教師 をしている 林 さんです。子供 の頃 からの夢 だった\n教員になって、熱心に子供たちの指導にあたっているそうです。\nそれから西田さんは、留学で身につけた語学力を活かして、貿易会社の海外\n事業部で 働 いています。\n最後、山内さんは出版社で編集 の仕事をしています。 忙 しいながらも充実し\nた毎日だそうです。\nF： 私 、読書 が趣味 だから、本 とか雑誌 を作 る仕事 につくのが子供 の頃 から\nの夢なんだ。\nM：へえ、読書が趣味なら、小説を書く方は？\nF：小説家なんて 考 えたこともなかったけど、それもおもしろいかも。鈴木くん\nは貿易会社 の先輩 のところ？去年留学 してたよね？語学力 を活 かした仕事\nをしたいって言ってたじゃない？\nM:うん、実は留学したての頃は授業についていけなくてね。でも、そこで出合\nった先生のおかげで、授業も分かるようになって、語学にも自信を持てるよう\nになったんだ。だから今は教える仕事につきたいと思ってて、なれるか分かん\nないけど、実際の仕事の 話 を聞きに行ってみるよ。\nF：へえ、そうなんだ。 私 はやっぱり前から 憧 れている仕事の 話 を聞きに行く\nことにするね。\n質問 1 男の生徒はどの先輩の話を聞きに行きますか。\n質問 2 女の生徒はどの先輩の話を聞きに行きますか。"}]}, {"id": "B2019G", "name": "2019年7月", "clips": [{"k": "1-1", "sec": 1, "q": 1, "f": "audio/B2019G/1-1.mp3", "s": "1 れいぞうこを友達にあげる 2 れいぞうこをそだいごみとして出す\n3 市役所で手続きをする 4 ひっこし会社に問い合わせる\n男 の人と 女 の人が話しています。 男 の人はこの後何をしますか。\nM:森さん、僕、来週 引っ越 すんだけど、今使ってる冷蔵庫 いらなくなるんだ。\nそれで、もらってくれる人を探してるんだけど、誰か知らない?\nF:うん。…ちよっと心当たりないなあ。\nM:そっか。冷蔵庫って、確か粗大ごみとしては出せないんだよね。\nF:うん、法律でいらなくなった冷蔵庫を出す時は、手続きをすることになってる\nよね。\nM:そっか。手続きって、どこでするの。\nF:市役所に連絡してもいいけど、引越し会社によっては、事前に言っとけば、\n手続きをしてくれて、引越し当日、冷蔵庫の回収 もしてくれるって聞 いたこ\nとあるよ。\nM:え。そうなんだ。.\nF:そのほうが簡単だから、聞いて見たら?来週まで、時間もないでしょう。\nM:わかった。ありがとう。\n問題一選択肢の設計\n1 已做的 た ている てある もう 済み\n2 要做的(正解) 頼み 命令 てください て てもらえる\n3 之后再做的 あと たら てから 次第\n4 不用做/说话人自己做的 ます型 原型"}, {"k": "1-2", "sec": 1, "q": 2, "f": "audio/B2019G/1-2.mp3", "s": "1 じこしょうかいを入れる 2 難 しい言葉に説明を加える\n3 文をつなぐ言葉を追加する 4 全体的に 短 くする\n日本語学校で、先生が話しています。\n学生はこの後、スピ一チの原稿をどう直しますか。\nF: 先週 提 出 し て も ら っ た ス ビ 一 チ の 原稿 を 返 し ま す 。 は じ め の と こ ろ に\n自己紹介 を入 れてもらいましたが、皆 さんよく書 けていました。スピ一チの\n内容もそれぞれとても面白かったです。授業で勉強 したように、 難 しい言葉\nには説明をつけて、分かりやすくしているのも良かったんですが、皆さん、文\nと文をつなぐ表現 がほとんど使われていませんでした、不自然に感じるので、\n今から見直して入れてみましょう。そのほかの点については、それぞれコメン\nトを入れました。全体的な長さは今は 考 えなくてもいいですよ。"}, {"k": "1-3", "sec": 1, "q": 3, "f": "audio/B2019G/1-3.mp3", "s": "1 内側に折り、ボタンで留める 2 内側に折り、糸で留める\n3 外側に折り、ボタンで留める 4 外側に折り、糸で留める\nデパ一トの洋服売り場で、店の人と 男 の人が話しています。\n店の人はズボンの裾をどのように仕上げますか。\n店の人:お客様、そちらのズボン、はいてみていかがですか。\nM:ああ、ちょうどいいです。ただズボンの裾が少し長いので、 短 くしてもらえま\nすか。\n店の人:かしこまりました。では、長さを確認いたします。\nM:あのう、今これは裾が内側に折ってあるんですけど、外側に折るよ
