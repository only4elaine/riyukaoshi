うにして\nもらえますか。売り場に飾ってあったのみたいに。\n店の人:あ、はい。\nM:できますか。よかった。で、売り場にあったのは、折ったところをボタンで留\nめるようになってましたが、糸で留めてもらいたいんです。\n店の人:ボタンですと、留めたりはずしたりしやすいので、汚れなどのお手入れ\nがしやすいですよ。\nM:うん、僕には必要ないかな。\n店の人:承知しました。では、そのように。"}, {"k": "1-4", "sec": 1, "q": 4, "f": "audio/B2019G/1-4.mp3", "s": "1 社長の予定をかくにんする 2 イベントのこうほびをだす\n3 会場を予約する 4 しょうたいする人のめいばを作る\n会社で、 女 の人と 男 の人が話しています。\n男 の人はこの後まず何をしなければなりませんか。\nF:田中さん、新製品の発売に合わせて 行 うイベント、あれ、やることが確定し\nたから、準備始めてくれる。\nM:はい、わかりました。\nF:今回は、社長に挨拶をお願いしてあるから、社長が来られる日じゃないとい\nけないの。秘書課に予定を聞いてくれる?イベントの候補日を絞らないとい\nけないから。\nM:はい、日にちが決まったら、会場を予約しますね。参加者は何人ぐらいにな\nるでしょうか。\nF:100 人ぐらいかな。営業部 が今 、招待客 の名薄 を作 ってるところなんだけ\nど。\nM:じゃ、会場を予約するのは名薄ができてからですね。\nF:うん。"}, {"k": "1-5", "sec": 1, "q": 5, "f": "audio/B2019G/1-5.mp3", "s": "1 ペンキぬりを手伝う 2 自転車置き場のそうじをする\n3 自分の自転車を駐車場に運ぶ 4 自転車のかぎを預ける\nアパ一トの入り口で、 男 の管理人と 女 の学生が話しています。\n女 の学生は明日の朝まず何をしなければなりませんか。\nM:あ、リンさん、おはようございます。掲示板にお知らせを貼 っておいたんで\nすけど、明日の土曜日、大丈夫ですか。\nF えっ、明日、何かあるんですか。すみません、掲示板ちゃんと読んでなくて。\nM:自転車置き場のペンキを塗りなおすんですよ。ついでに、自転車置き場の\n掃除もするんです。\nF:ああ、そうなんですか。すみません、明日はちょっと時間がなくて。\nM:ああ、いいえ。自転車をアパ一トの前 の駐車場 に移動 してほしいんです。\n今日 はまだ駐車場 が使 えないから、明日 の朝七時 から十時 の 間 にお願\nいします。\nF:ああ、一緒にペンキを塗るのかと思っちゃいました。\nM:はは、それはプロに頼んでありますよ。明日の朝、大丈夫そうですか。無理\nなら、 私 がやっておきますが。\nF:はい。出かける前にできます。\nM:お願 いします。動 かしたら、すみませんが、鍵 は 私 に預 けてください。\n自転車はこちらで戻しておきますから。\nF:わかりました。"}, {"k": "2-1", "sec": 2, "q": 1, "f": "audio/B2019G/2-1.mp3", "s": "1 写真がきれいにいんさつできるから\n2 インクの容量が大きいから\n3 いんさつのスピ一ドが速いから\n4 紙の書類を電子デ一タにできるから\n男 の人と 女 の人がプリンタ一について話しています。\n女 の人は今使っているブリンタ一を選んだ理由は何だと言っていますか。\nM:中山さん、この間プリンダ一買ったって言ってたよね、うちのプリンタ一、 急\nに壊れちゃって、 新 しいの買わないといけないんだけど、参考までにどうや\nって決めたのか教えてもらえない?\nF:そうだね。最近のプリンタ一は写真をすごくきれいに印刷できるし、インクの\n容量も大きいし、すごいなって思った。コピ一やファックスの機能も付いてた\nりして、便利になってるし。\nM:うん。\nF:私が買ったのは印刷スピ一トが速いっていうのが一番の特徴だったんだけ\nど。 私 は文字を取り込む機能があるのがいいなあって思ったんだ。\nM:文字を取り込む?\nF:うん。紙の書類を電子ファイルとして、パソコンに保存したい時ってあるでし\nょう。そんな時に便利なんだ。いちいち手で打ち直さなくていいし。\nM:えっ、そうなの。すごいね。"}, {"k": "2-2", "sec": 2, "q": 2, "f": "audio/B2019G/2-2.mp3", "s": "1 きかくした商品の売り上げが 1 位になったこと\n2 じょうしが自由に仕事をさせてくれたこと\n3 きかくした商品を知人がほめてくれたこと\n4次のきかくへの期待が高いこと\n会社で、 女 の人と 男 の人が話しています。\n男 の人は何が一番うれしいと言っていますか。\nF:田中さん、田中さんの企画した新商品、先月の売り上げ 1 位でしたね。おめ\nでとうございます。\nM:たまたまだよ。\nF:部長も 喜 んでらっしゃいましたよ。\nM:そう。企画の時から、自由にやらせてもらったからね。実は、この 間 、大学\n時代の友人と話してたら、この商品 のことをすごくいいねって言ってくれた\nんだよ。作ってる側からすると、知っている人からこう言ってもらえるのはど\nんな言葉よりうれしいよね。これからも頑張らなきゃって思うよ。\nF:よかったですね。次の企画も私たちみんな、期待しています。\nM:わ一。プレッシャ一大きいなあ。"}, {"k": "2-3", "sec": 2, "q": 3, "f": "audio/B2019G/2-3.mp3", "s": "1 この教室でボランティアをしたことがある人\n2 遊びを教えるのが上手な人.\n3 子どもの 話 を聞いてあげられる人\n4 勉強 を教えるのが上手な人\n放課後の子どものための教室で、 男 の学生と係りの人が話しています。\n係りの人はどんな人にボランティアに来てほしいと言っていますか。\nM:すみません、こちらの教室で夏休みの 間 のボランティアスタッフを募集して\nいるって聞いたんですが。この教室って、どんなことするんですか。.\nF:ああ、小学生の子どもたちが放課後、一緒に遊んだり、宿題をしたりするん\nです。夏休みは、普段より子どもが増えるので、募集してるんですが。ボラ\nンティアご希望ですか。\nM:興味あるんですが。こういうボランティアやったことないんです。大丈夫でし\nょうか。\nF:経験はないよりあったほうがいいですけど、まあ、子どもって、放っておいて\nも、自分で遊ぶものですからね。遊びを教えたりする必要もないですし。\nM:そうですか。\nF:それより、子 どもの 話 に耳 を 傾 けてくれる人 がいいんです。子 どもって\n自分の 話 を聞いてもらえたら、それだけでうれしいんですよ。\nM:へえー。\nF:算数とか国語とか、勉強 を教えられる人はほかにもスタッフいますから。よ\nかったら、一度ぜひ教室に来てみてください。\nM:はい。ありがとうございます。"}, {"k": "2-4", "sec": 2, "q": 4, "f": "audio/B2019G/2-4.mp3", "s": "1 店に入るとすぐ話しかけてきたこと\n2 買い物の 間 ずっとそばにいたこと\n3 言葉づかいが 難 しかったこと\n4 高い商品をすすめてきたこと\n日本語のクラスで、留学生 が日本での体験 についてスピ一チをしています。\n留学生はある店で買い物 をしたとき、店員のどんな対応がいやだったと言 っ\nていますか。\nF:先日、スニ一カ一を買いに行きました。店に入るとすぐ、店員さんが声をか\nけてくれました。それはうれしかったんですが、その後ずっと離れないんです。\n商品を見ようとするたび、丁寧な言葉で説明してくれましたが、近くにいられる\nと気になって、ゆっくり見られませんでした。 私 の国では、店員は挨拶はしま\nすが、客 が質問した時しか近くには来ないんです。ただ、 私 の国の場合、高\nい商品をすすめられることが多いんですが、この店では、そんなことはありま\nせんでした。"}, {"k": "2-5", "sec": 2, "q": 5, "f": "audio/B2019G/2-5.mp3", "s": "1 子どものためのきかくを増やす\n2 大人向けのイベントを夜も 行 う\n3 学習スぺ一スのせつびをよくする\n4 図書館のせんでんのしかたを工夫する\n図書館で、 女 の人と 男 の人が話しています。 男 の人は図書館へ来る人を増\nやすために、まずどんなことをしたらいいと言っていますか。\nF:ここ数年、うちの図書館を利用する人が減ってきてるんですが。\nM:そうだね一。少し前に、子供向けに絵本の読み聞かせの会とか図書館ツア\n一とかやってみたら、効果 があったよね。これから対象 を子供以外 にも広\nげていたらどうかな。\nF:大人向けのイベントなら、今までもやってましたよね。\nM:うん。ただ、これまでは昼間しかやってなかったでしょう。今度 は夜 の時間\nにもやってみるとか。これなら、すぐにできるし。\nF:そうですね。\nM:うん。とにかくやってみよう。後、将来的には、学習スぺ一スの設備を充実\nさせたり。\nF:設備?\nM:うん。 机 や椅子をいいものに変えて、快適にしたり、バソコンを使う人も多く\nなってるから、コンセントを増やしたり。\nF:なるほど。もしそうなったら、積極的に宣伝したいですね。\nM:そうだね。"}, {"k": "3-1", "sec": 3, "q": 1, "f": "audio/B2019G/3-1.mp3", "s": "就職 セ三ナ一で、ある航空会社の社員が話しています。\nF: 私 は飛行機の乗務員をしています。機内でお客様が快適で安全に過ごせ\nるように様々な仕事をします。この仕事は飛行機でいろいろな場所に行けて、\n魅力的だと思われているようで、就職 を希望する学生さんが多いのも事実で\nす。ただ、いい面 ばかりではありません。お客様 の荷物 の上 げ下 ろしのお\n手伝いや飲み物、食事 のサ一ビスなど休む間もないほどです。また、何 かト\nラブルが起これば、お客様への対応が求められます。外からはそういったこと\nはなかなか見えにくいと思いますが。\n社員は何について話していますか。\n1 この仕事の魅カ 2 この仕事の大変さ\n3 この仕事についた理由 4 この仕事に必要な体力"}, {"k": "3-2", "sec": 3, "q": 2, "f": "audio/B2019G/3-2.mp3", "s": "女 の人と 男 の人が 男 の人が買った車 について話しています。\nF:最近、 新 しい車 を買ったんだってね?\nM:うん、ずっと 憧 れてた 車 なんだ。有名なデザイナ一がデザインした 車 で、\n外見も中も洗練されてて、僕にとっては一流ホテルにいるのと同じような感\nじなんだ。\nF:へー\nM:ただ、買うかどうか最後まで悩む値段だったんだけどね。買ってから 驚 い\nたんだけど、乗ってて疲 れにくいんだ。視界のよさとか、操作 のしやすさと\nか、運転手 の負担 を最小限 に抑 える工夫 が効 いてて、安全運転 にもつな\nがるしね。その意味では安い買い物だったと思うよ。\n男 の人は買った車 についてどう言っていますか。\n1 値段も安かったし、いい車 で満足だ。\n2 値段は高かったが、いい車 で満足だ。\n3 安い車 なので、性能に不満がある。\n4 高級な車 だが、性能に不満がある。"}, {"k": "3-3", "sec": 3, "q": 3, "f": "audio/B2019G/3-3.mp3", "s": "ラジオで、料理研究家が話しています。\nF:料理を作ったら、食べた人に美味しいと言ってほしいとみんな思いますよね。\nところが、好みは人それぞれ、その好みを形成するものの一つは子供の頃か\nら毎日食 べていた家庭料理 の味 です。家庭 だけでなく、学生時代 によく通 っ\nていた食堂などの慣れ親しんだ味を美味しいと感じることが多いと言 われて\nいます。ほかにも暑 い地域 では、汗 をかいて体温 を下 げる効果 のある辛 い\n料理が好まれるといった気候によるものなどもあります。\n料理研究家は何について話していますか。\n1 おいしい料理を作る工夫 2 子供時代の食事の思い出\n3 家庭料理の味の特徴 4 味の好みを決める要素"}, {"k": "3-4", "sec": 3, "q": 4, "f": "audio/B2019G/3-4.mp3", "s": "テレビで、アナウンサ一が作家にインタビュ一をしています。\nF:今日は今話題 の作家山田はじめさんにお 話 を 伺 います。どうぞ、よろしく\nお願いいたします。山田さん、最近若い人の読書離れが進んでいると言わ\nれていますが。\nM:読書っていうのは人生を豊かにしてくれるので、若い人には本を読んでもら\nいたいですね。ただ個人的には一年に何冊本を読んだとか、そういうことは\nそれほど大切ではないと思います。\nF:と言いますと。\nM:わたしは若い頃、好きな本をよく汚れてぼろぼろになるまで読んでましたが、\n同じ本 でも読むたびに違 うことを感じで、 考 えが深まっていたのを覚 えて\nいます。最近は仕事や人間関係に役立つからといって、実用的な本ばかり\n宣伝 される傾向 がありますが、そいう本 は何回 も読 んだりしないですから\nね。\nF:ええ\nM:若い人にも自分が出会った一冊とじっくり向き合ってほしいですね。\n作家が言いたいことは何ですか。\n1 好きな本を繰り返し読んでほしい。\n2 なるべく多くの本を読んでほしい。\n3 すぐに役に立つ本を読んでほしい。\n4 宣伝を参考にして本を読んでほしい。"}, {"k": "3-5", "sec": 3, "q": 5, "f": "audio/B2019G/3-5.mp3", "s": "学校で校長先生が話しています。\nM:受験勉強やスポ一ツの練習 など大きな目標に向かっているとき、目標しか\n見えなくなっていることがあります。そこに向かう道はつらくても仕方がないと\nいやいや取り組んでいたりしませんか。目標を持つことはもちろん大事ですが、\nちよっと視点を変えてみましょう。学ぶこと運動すること自体にも 喜 びがあり、\n自分の成長 にながるはずです。最終的なゴ一ルは同じでも、そこにたどり着く\nまでにどう取り組むかによって、得られるものも変わってくるかもしれません。\n校長先生が伝えたいことはどのようなことですか。\n1 目標は自分に合ったものがよい。\n2 目標を持ち続けることが必要だ。\n3 目標に向かうプロセスにも意味がある。\n4 時々目標を見直すことが大事だ。"}, {"k": "4-1", "sec": 4, "q": 1, "f": "audio/B2019G/4-1.mp3", "s": "うん?会議の資料、この 机 の上に置いたはずなのに。\n1 えっ、ないんですか。\n2 助かります。ありがとうございます。\n3 あっ、 机 の上に置いてはいけなかったんですね。"}, {"k": "4-2", "sec": 4, "q": 2, "f": "audio/B2019G/4-2.mp3", "s": "森さん、勧めてくれたカメラ、買いましたよ。小型ながらなかなか高性能ですね。\n1 もっと小さいのがよかったんですね。\n2 小さいのに、すごいでしょう。\n3 小さいほうが性能がいいんですか。"}, {"k": "4-3", "sec": 4, "q": 3, "f": "audio/B2019G/4-3.mp3", "s": "今日の自習のレポ一ト明日出さなきやいけないなんて。\n1 明日までじゃなくてよかったね。\n2 本当、もっと時間ほしいよね。\n3 えっ、レポ一ト出さなくてもよくなったの。"}, {"k": "4-4", "sec": 4, "q": 4, "f": "audio/B2019G/4-4.mp3", "s": "あのう、佐藤さん、この椅子、運んでくださると、助かるんですが。\n1 運んでいただけるんですか。\n2 えっ、 私 、運んでませんよ。\n3 あっ、はい、どこへ運びましょうか。"}, {"k": "4-5", "sec": 4, "q": 5, "f": "audio/B2019G/4-5.mp3", "s": "鈴木さん、イベントの準備は 順 調 ?\n1 では、さっそく準備を始めます。\n2 中止になるなんて残念です。\n3 今のところうまく 行 ってます。"}, {"k": "4-6", "sec": 4, "q": 6, "f": "audio/B2019G/4-6.mp3", "s": "昨日愚痴を言っちゃったけど、聞かなかったことにしてくれない。\n1 ああ、わかった。忘れるよ。\n2 えっ、ちゃんと 間 いてたよ。\n3 もちろん、いつでも聞くよ。"}, {"k": "4-7", "sec": 4, "q": 7, "f": "audio/B2019G/4-7.mp3", "s": "今朝、もう少しでいつもの電車に乗り遅れるところだったよ。\n1 そうか、でも間に合ったならよかったね。\n2 ああ、いつものに乗れなかったんだ。\n3 えっ、電車が遅れたんだ。"}, {"k": "4-8", "sec": 4, "q": 8, "f": "audio/B2019G/4-8.mp3", "s": "伊藤さん、午後の会議の準備、一緒にやることになってたけど、ぼく一人でで\nきないこともないよ。\n1 それなら、一緒にやろうか。\n2 えっ、一人でやったの。\n3 じゃあ、お願いしてもいい。"}, {"k": "4-9", "sec": 4, "q": 9, "f": "audio/B2019G/4-9.mp3", "s": "藤田さん、スピ一チの練習 、付き合ってくださってありがとうございました。\n当日もうまく行くといいんですけど。\n1 うまく行ったんだ。頑張った甲斐があったね。\n2 仕方ないよ。そんなにがっかりしないで。\n3 きっと練習の成果を出せると思うよ。"}, {"k": "4-10", "sec": 4, "q": 10, "f": "audio/B2019G/4-10.mp3", "s": "サ一クルの打ち合わせ、5 番教室でやるって聞いたけど、教室は予約してか\nらでないと使えないよ。\n1 予約は必要ないですね。\n2 先週、予約しました。\n3 せっかく予約したのに使えないんですか。"}, {"k": "4-11", "sec": 4, "q": 11, "f": "audio/B2019G/4-11.mp3", "s": "森田さん、森田さんの企画書だけど、デ一タなしじゃ検討しようがないよ。\n1 すみません。すぐ用意します。\n2 あっ、検討していただけるんですね。\n3 ええ、ご理解ありがとうございます。"}, {"k": "5-1", "sec": 5, "q": 1, "f": "audio/B2019G/5-1.mp3", "s": "市の体育館の受付で 女 の人と 男 の職員が話しています。\nF:すみません。何か軽い体操でもはじめたいと思ってるんですが。こちらでそ\nういう教室はやってますか。\nM:はい。いろいろありますよ。時間や内容のご希望はございますか。\nF:ええと、平日の午前中で、運動が苦手な 私 でも続けられそうな教室がいい\nんですけど。通ってらっしゃる他の方とも親しくなれるような雰囲気の。\nM:そうですね。軽 い体操 というと。火曜九時半 からのボ一ル体操 。これは\n直径 50 センチぐらいのゴムボ一ルに座って体操をします。\nF:ああ。\nM:それから水曜10 時からの柔軟体操。 体 をゆっくり動かして、手足を伸ばします。\nこちらのクラスは時々参加者の皆さんで交流会をやってるみたいです。\nF:へえ、いいですね。\nM:それから、木曜 10 時からのリズム運動 。音楽 を流 してリズムに合 わせた\n運動をします。仲のいいクラスで、去年の秋には皆さんで近くにハイキング\nに出かけてましたよ。\nF:その教室 、この間 テレビで紹介 してましたよね。音楽 に合 わせて体操 する\nの、楽しそうでしたけど。皆さん、汗びっしょりでした。\nM:あっ、ご覧になったんですね。かなり 体 を動かすので、いい運動になりますよ。\nあとは、土曜の午前なんですが、筋肉トレ一ニングもあります。講師からいろ\nんなトレ一ニング器具の使い方を教わりながら、筋肉を鍛えるクラスです。\nF:迷いますね。でも、やっぱり週末 はあけておきたいんですよね。あんまり激\nしい運動だと、できるかどうか自信がないし、教室以外にも仲良くなる機会\nがあるほうがいいなあ。ええと、こちらの教室、見学できますか。\n女 の人はどの教室を見学したいと言っていますか。\n1 ボ一ル体操 2柔軟体操 3 リズム運動 4筋肉トレ一ニング"}, {"k": "5-2", "sec": 5, "q": 2, "f": "audio/B2019G/5-2.mp3", "s": "大学で、大学祭の 係 の学生三人が話しています。\nA:大学祭まであと一か月だね。去年の参加者のアンケ一トで、ごみ箱の場所\nがわかりにくかったっていう声が多かったけど。今年どうしたらいいかまだ\n決めてなかったね。\nM:あちこちにゴミが捨てられてたよね。来場者に配った会場案内のチラシにゴ\nミ箱の場所も書いておいたんだけど。チラシの数が足りなかったかなあ。\nF:チラシは余ってたよ。\nM:じゃあ、チラシが見にくかったかなあ。もう少し字を大きくして見やすくしたら\nどうかなあ。\nF:でも、お客 さんは食 べ物 や荷物 を持 って移動 するわけだよね。チラシまで\n見ながらって 難 しいんじゃない?\nA:それもそうだね。うん、去年は、会場内にゴミ箱はここですっていう看板も立\nてたよね。設置場所も問題なさそうだったけど。\nF:うん。看板の文字も大きくてかなり目立ってたはずなんだけど。\nM:込んでたからね。行列 もあちこちにできてたし。\nF:それで見えにくかったのかもしれないね。それなら、今年はもう少し高さがあ\nるものにしてみようか。目につきやすいように。\nA:うん。なるほど。それがいいね。\nM:で、チラシは今年はどうする。見てもらえないなら配るのをやめる?\nA:見る人は見るから、あったほうがいいと思う。去年の十分 見やすくできてた\nと思うから、あれを使おう。\n問題解決のために、何をすることにしましたか。\n1 チラシの文字を大きくする。\n2 配るチラシの数を増やす。\n3 看板の文字を大きくする\n4 看板の高さを高くする。"}, {"k": "5-3", "sec": 5, "q": 3, "f": "audio/B2019G/5-3.mp3", "s": "テレビでアナウンサ一が使われなくなった学校の校舎の再活用につい\nて話しています。\nA:生徒数が減り、廃止になった学校、その校舎の一部を有効活用する取り組\nみが各地で 行 われています。今日はその中から四つご紹介します。まず、山\nの中の小さな学校、東小学校 は、今宿泊施設として活用されています。豊か\nな 自然 の 中 で 山歩 き や 川遊 び を 楽 し め ま す 。 二 つ 目 の 西田市 に あ る\n西中学校は、地域のイベントやコンサ一ト、展覧会などに広く使われています。\n2階は映画館になっていて、昭和時代の雰囲気が残 っています。それから海\nに面 した南小学校 には、手作 りのパンやア一ト作品 の店 が並 んでいます。\n自分で作ったものを販売したいという若い人が集まってきています。ええ、四\nつ目 の農村地域 にある北中学校 は食堂 になっています。地元 でとれた新鮮\nな野菜をたくさん使ったメニュ一が人気です。\nM:今映ってた学校で、友達が今度作品を発表するんだ。\nF:へえ、友達、何か作って売ってるの。\nM:えっ、あ、その学校じゃなくて、その友達自分で映画を撮っててね。見に行く\nことになってるんだ。\nF:そうなんだ。 私 は一度 でいいから。学校 に泊 まってみたかったんだよね。\n今度の夏休みに山登りのサ一クルのみんなで行ってみない?\nM:えっ、夜の学校なんて真っ暗で怖そうじゃない?おいしいごはんを食べるん\nだったらいつでも 喜 んでいくけど。\nF:今は学校じゃないんだから大丈夫だよ。\n質問 1 男 の人は どの学校に行くつもりだと言っていますか。\n質問 2女の人は どの学校に行くつもりだと言っていますか。"}]}, {"id": "B2022G", "name": "2022年7月", "clips": [{"k": "1-1", "sec": 1, "q": 1, "f": "audio/B2022G/1-1.mp3", "s": "1.テーマを決める\n2.商店街の人に 話 を聞く\n3.クラスで話し合う\n4.町について調べる\n日本語の授業で先生が学生に話しています。\n学生は今日の授業で何をしますか。\nこの授業では、学期末にまとめとしてレポートを書いてもらいますが、先週 は\nそのテーマを「 私 たちの町」に決めましたね。\n次回の授業では、この町に長く住んでいる商店街の方から 昔 と今どう変わっ\nたかなどいろいろ話を聞いて、その内容についてクラスで話し合います。\nそのために、今回の授業は町の歴史などを各自図書館に行って、詳しく調べ\nてみましょう。しっかりやりましょう。\n問題一選択肢の設計\n1 已做的 た ている てある もう 済み\n2 要做的(正解) 頼み 命令 てください て てもらえる\n3 之后再做的 あと たら てから 次第\n4 不用做/说话人自己做的 ます型 原型"}, {"k": "1-2", "sec": 1, "q": 2, "f": "audio/B2022G/1-2.mp3", "s": "1.前回のアンケートをまとめる\n2.次回の申し込みの対応をする\n3.次回の資料を発送する\n4.前回の参加者にお礼のメールを送る\n会社で 女 の人と 男 の人が話しています。\n男 の人はこれからまず何をしなければなりませんか。\nF：山下さん、前回の会社説明会の参加者アンケートなんだけど、結果をまと\nめる作業は終わった？明日の会議で報告するんで、今日中に見ときたいんだ\nけど。\nM：え、今日中ですか。すみません。次回の説明会の申込みの対応と参加者\nへの事前資料の発送の準備で 忙 しくて。\nF：そう。うん。対応のほうは 私 がやるから、資料の発送のほうはまだ時間が\nあるから、今日じゃなくても大丈夫でしょう。とりあえず、結果のほうに 集 中 し\nてくれるかな。あ、そうだ。参加者へのお礼のメールはもう送った？\nM：あ、それはもう。\nF：そう。じゃ、よろしくね。\nM：はい。"}, {"k": "1-3", "sec": 1, "q": 3, "f": "audio/B2022G/1-3.mp3", "s": "1.商品名の文字の色を変える\n2.商品の厚さの数字を大きく書く\n3.以前の商品と比べた図を入れる\n4.性能の変更点を加える\n会社で 女 の人と課長が商品のポスターについて話しています。\n女 の人はポスタ一をどう直しますか。\nF：課長、今度発売するパソコンの宣伝用ポスターを作成したので、一度見て\nいただけますか。\nM：はい。商品名の文字の色があんまり目立たないようだけど。\nF：そうですか。\nM：ああ。全体のバランスを見ると、統一感があるんだね。今回の商品は今ま\nでで最 も 薄 がったっていうのがアピールボイントだから、それをもっと全面に\n出した方がいいね。厚さの具体的な数宇は大きく目立つように書 いてあるけ\nど、これだけでは厚さは分かりにくいね。\nF：そうですか。\nM：今までのものと図で比較するとか、そういう感じのほうがいいんじゃないか\nな。\nF：はい、そうします。\nM：前のモデルからの性能の変更点はわかりやすくまとめてあるし、他に付け\n加えるものはないね\nF：あ、ありがとうございます。\nM：それじゃ、その一点だけ直してみてよ。\nF：わかりました。"}, {"k": "1-4", "sec": 1, "q": 4, "f": "audio/B2022G/1-4.mp3", "s": "1.環境問題のアートを制作する\n2.活動をまとめた文献を読む\n3.かんきょう問題のイベントに参加する\n4.別の人に相談する\n大学で 女 の学生と 男 の学生が話しています。\n女 の学生はこれからまず何をしますか。\nF：先輩、卒論の発表 、お疲れさまでした。 私 も卒論に向けてそろそろ準備を\nと 考 えてるんですけど、どうしたらいいかわからなくて。\nM：そう。加藤さん、今度三年生になるんもんね。テーマとかは決まってるの？\nF：はい、先輩と同じように環境問題に興味があるので、環境 を守る活動につ\nいて書けたらって思ってはいるんですが。\nM：環境 を守る活動と言っても色々あるよね。例えば、文学作品やアートを通\nじて環境問題を 訴 えたりすることもあるしね。文献とかはもういくつか読 んで\nるの？\nF：まだ授業でテキストを一冊読んだぐらいで。\nM：そう、じゃ、まず活動についてまとめた文献を見てみて。それで、興味を感\nじるのがあったら、関連するイベントとかに参加してみて。\nF：はい。\nM：イベントとかに参加したら、具体的な問題点も見えてくると思うよ。そしたら、\nそれに関係のある研究 をしている友達も紹介できるかもしれない。\nF：そうですか。その時はまた相談させてください。\nM：うん。何があるか、知ることからだね。\nF：わかりました。ありがとうございます。"}, {"k": "1-5", "sec": 1, "q": 5, "f": "audio/B2022G/1-5.mp3", "s": "1.食品を 袋 につめる\n2. 机 の下に段ポール箱を置く\n3.食品を 机 の上にならべる\n4.学生が取った食品の数を確認する\n大学で職員が話しています。\nボランティアの参加者はこの後、まず何をしますか。\n学生へ食品を配るボランティア活動へのご参加、ありがとうございます。こち\nらの教室で準備をし、配ります。\nこれまでは食品 をまとめて 袋 に詰 めたものを学生 に渡 しておりましたが、\n一人当たりの数を決めて学生に自由に選んで持ち帰ってもらう方法に変更と\nなりました。\nええ、食品が入った段ボールをそれぞれの 机 の下に置いておきました。取り\nやすいように箱の中身を 机 の上に置いてください。\n配る際ですが、 袋 を持たずに来てしまった学生には 袋 の用意がないことを、\n食品 の数 を取 りすぎてしまった学生 がいた場合 は、数 に限 りがあることをお\n伝えいただけますでしょうか。それではよろしくお願いいたします。"}, {"k": "2-1", "sec": 2, "q": 1, "f": "audio/B2022G/2-1.mp3", "s": "1.面接中 は明るい顔をするようにする\n2.面接の前にメモを作る\n3.面接の最初にあいさつする\n4.日本人の友達と練習 をする\n大学で、 男 の留学生と 女 の留学生が話しています。\n女 の留学生は 男 の留学生に 新 しくどんなアドバイスをしましたか。\nM：ジョアンさん、この 間 、就職 の面接試験の相談に乗ってもらったじゃない、\nなのに面接うまくいかなかったんだ。\nF：え、どうしたの？\nM：最初はよかったんだけど、途中面接官の表 情 が気になり出したら、緊張し\nて口が動かなくなっちゃって、何か他に対策法あったら、教えてほしいんだけ\nど、ジョアンさん、もう就職試験いくつか受かってるから。\nF：心理学の本で読 んだんだけど、 表 情 を意識的 に変えると、それに合 わせ\nて気分も変わるんだって。だから、無理してでも笑顔で話してみたらどうかな。\nM：そうなんだ。\nF： 表 情 につられて、気持 ちも明 るくなって、緊張 も解 けるかもよ。面接官 も\n笑顔の学生 に、怖 い顔はできないだろうし。あ、話 したいことのメモは作 って\nから面接に行った？\nM：うん、メモを作るっていうアドバイス、役に立ったよ。それと、初めにきちん\nと挨拶するっていうのはちゃんとできたんだけど。\nF：そう！あ、事前に日本人の友たちとの練習 はこれまで通りやってね、その\n上でってことだよ。\nM：うん、それはわかってる、ありがとう。"}, {"k": "2-2", "sec": 2, "q": 2, "f": "audio/B2022G/2-2.mp3", "s": "1.音楽の専門学校の先生にすいせんされた\n2.駅前で音楽関係の人に声をかけられた\n3.音楽の事務所に歌の録音を送った\n4.音楽のコンテストで優勝した\nラジオでアナウンサーが歌手の 女 の人にインタピューしています。\n女 の人はどのようにしてプロの歌手になったと言っていますか？\nM：優花さんは小さい頃からプロの歌手になりたかったんですか？\nF：はい、小さい頃から歌手になるのが夢でした。それで、まずは有名な先生\nがいらっしゃる音楽の専門学校に入 って、それからプロを目指そうと 考 えて\nいました。\nでも親に大学は出たほうがいいと言われて、それで大学に通いながら駅前で\n歌っていました。音楽関係の人に声をかけられないかなと期待して、いろんな\n音楽事務所に自分の歌を録音したものを送ったりもしてたんです。\nその頃出た音楽のコンテストで優勝したことから、今の事務所に所属して歌を\n仕事にすることができました。"}, {"k": "2-3", "sec": 2, "q": 3, "f": "audio/B2022G/2-3.mp3", "s": "1.注文が遅れたこと\n2.数を間違って工場に依頼したこと\n3.問題が起こったときに課長に報告しなかったこと\n4.京都支店の小林部長に相談したこと\n会社で課長と 男 の人が話しています。\n課長は 男 の人の何が良くなかったと言っていますか？\nF：木下 さん、オフィスグリンの岡田様 から電話 があったんだけど、椅子 の\n納品、時間ぎりぎりだったんだって？\nM：あ、課長。すみません、 私 が数を間違って工場に依頼 してしまいました。\nそれで同じ商品を 扱 っている京都支店に連絡して、なんとか間に合わせまし\nた。\nF：そうだったの。まあ、ミスは誰 にでもあるけど、私聞 いてなかったから、\n岡田様と 話 が合わなくて、上司に一言も報告がなかったのはどうかな。\nM：本当にすみません。なんとかしなくちゃって焦ってしまって。\nF：そう。京都支店の小林部長には話通 ってるの。\nM：はい、ご相談しました。お礼の電話もしました。京都支店から借りていた分\nは、来週出来上がるので、工場から送ってもらうようにしています。\nF：そう、じゃあ大丈夫そうね。次からは気をつけてね。\nM：はい、すみませんでした。"}, {"k": "2-4", "sec": 2, "q": 4, "f": "audio/B2022G/2-4.mp3", "s": "1.お腹が空いたときに食べる\n2.決まった時間に 3食食べる\n3.手軽で冷たい物を食べる\n4.喉の通りがよい物を食べる\nテレビで医者が話しています。\n夏の熱い時の食事で大切なことは何だと言っていますか？\n毎日こう暑い日が続くと、食欲も 衰 えてしまいますね。\nお腹が空いたら食べるようでは 体 が食事を受け付けるリズムが掴めないの\nで、決まった時間に朝昼晩、毎日食べること。\n私 はこのことが熱い夏を健康に過ごすためには大切なことだと思います。\n暑いときは手軽で冷たいものや、喉の通りがいいものを好んで食べがちですが、\nそのようなものばかり食べていると、胃腸の 働 きが弱まってしまいますよ。"}, {"k": "2-5", "sec": 2, "q": 5, "f": "audio/B2022G/2-5.mp3", "s": "1.さくら駅に取りに行く\n2.森川駅に電話をかける\n3.警察署に問い合わせる\n4.西山駅で宅配便の手続きをする\n電話で、駅の係りの人と 女 の人が話しています。\n女 の人は落し物を受け取るために、どうしますか？\nM：はい、さくら駅、落し物センタ一です。\nF：すいません、昨日大学から帰 る時 に、定期券を森川駅 で落 としてしまった\nみたいなんですけど、落し物センターのあるそちらの桜駅に連絡してほしいっ\nて言われまして、問い合わせ番号は 1904 です。\nM：わかりました。咋日、17日の金曜日ですね。お調べしますので、少々 お待\nちください。はい、確かに、こちらに届 いております。定期券は貴重品 ですの\nで、こちらでは一時的にお預かりするだけで、明日には警察署に落とし物とし\nて届けることになってるんですが、本日お越しになれますか？\nF：え？今日はちょっと。うちから遠いんですよね。あの、ちなみに宅配便で送\nってもらうことも可能だと 伺 ったのですが。最寄り駅は西山駅ですが、宅配便\nの手続きできますか？\nM：はい、可能です。料金は千円程度、お日にちは二日ほどかかりますが。\nF：そうですが、二日もかかるのは困るので。何とか今日中にそちらに 伺 いま\nす。\nM：承知いたしました。"}, {"k": "2-6", "sec": 2, "q": 6, "f": "audio/B2022G/2-6.mp3", "s": "1.防災グッズに関心を持つこと\n2.防災グッズを買いそろえること\n3.防災グッズを使ってみること\n4.防災グッズを定期的に見直すこと\n防災教室で講師が話しています。\n講師は防災グッズに関して一番大切なことは何だと言っていますか？\n年々、人々の防災意識は高まっていると思います。非常食や簡易トイレなど、\n防災グッズにも関心を持つ方が増えているようです。\nそれはとてもいいことですが、防災グッズを買い揃えることが防災だと 考 える\n人が多く、普段の暮らしの中で実際に防災グッズを使ってみようと 考 える人\nは意外に少ないですね。\nでも、防災で一番大切なことは、実はこれで、防災グッズを定期的に見直すこ\nとは皆さん 頭 にあるんですが、災害の際にちゃんと使うことができて、初めて\n意味があることを忘れずにいってもらいたいです。"}, {"k": "3-1", "sec": 3, "q": 1, "f": "audio/B2022G/3-1.mp3", "s": "女の人と 男 の人が子供向けの絵本について話しています。\nF：子供の絵本も電子書籍がたくさん出てるけど、うちはあまり使ってないんだ\nよね。目に悪いかなって思って。吉田さんのうちはどう？\nM：うちは子供のお気に入りの本は紙と電子書籍の両方買ってるよ。病院 や\nレストランで待 ってる時間 とか、長 い移動 の時 は、電子書籍 が必需品 だな。\n何冊でも持っていけるし、紙の本だと重くなるから。あ、でも、家では紙だよ。\nだから全体的に見たら、紙の本を見てる時間のほうが長いんじゃないかな。\nF：うん、そうなんだ。\n男 の人は何について話していますか。\n1.電子書籍が目に与える影響\n2.電子書籍より紙の本のほうがいい理由\n3.子供が好きな電子書籍の特徴\n4.電子書籍と紙の本の使い分け"}, {"k": "3-2", "sec": 3, "q": 2, "f": "audio/B2022G/3-2.mp3", "s": "市民講座でポランティア団体の 男 の人が話しています。\n私 はここ、故郷の南 島 で十年前から海岸の清掃ボランティアを 行 っています。\n海岸にはいろんなゴミが落ちています。べットボトルやビニール 袋 などです。\n私 は、こういうゴミは島の外から流れてきて、ここに打ち上げられているとずっ\nと思っていたのですが、実は島の川から海に流れてきたものがほとんどなんで\nす。\n道端に捨てられたものとか、風で飛んでしまったものが川に落ちて、そして海に。\n多くは地元からっていうのはショックでしたし、皆さんに知ってもらいたいと思い\nます。\n海岸のゴミについて 男 の人が伝いたいことは何ですか？\n1.地元から出たものが多いこと\n2.量 が年々増えていること\n3.ポランティアが掃除していること\n4.種類ごとに分ける作業が大変であること"}, {"k": "3-3", "sec": 3, "q": 3, "f": "audio/B2022G/3-3.mp3", "s": "シンポジウムで専門家が話しています。\nすっかり子供の生活の一部に定着 したコンピュータゲームですが、暴力的な\n内容のものもあり、親としては心配になりますよね。\n確かにそういったゲームへの批判は新聞やテレビなどメディアでも取り上げら\nれますし、対策 を取 ろうという声 もありますが、暴力的 なシーンと子供 の\n攻撃性については、 必 ずしも関連性かあるとは限らないという研究結果も見\nられます。\n長時間一人 でゲームばかりしているのは問題 だと思 いますが、ゲームには\n友達と情報交換をしたり、遊び方 を教え合ったりと、人間関係 やコミュニケー\nション能力を育てる面もあると 考 えられています。\n専門家が伝えたいことは何ですか？\n1.暴力的なゲームを減らすための取り組み\n2.ゲームにはよい側面もあるということ\n3.ゲームをする子供が抱える問題点\n4.子供がゲームに夢中になる理由"}, {"k": "3-4", "sec": 3, "q": 4, "f": "audio/B2022G/3-4.mp3", "s": "ラジオでコックが話しています。\n私 はレストランで 働 きながら、出張料理サーピスにも登録して 働 いています。\n個人 のお客様 から指名 を受 けて、お客様 の家 のキッチンでご希望 に合 わせ\nた料理を作ります。\n店よりお客様との距離が近く、常にお客様から見られていて緊張もしますが、\n刺激的で楽しいです。\nお客様の反応が直にわかるので、レストランだけで 働 いていた頃よりやりが\nいがあります。これからも指名をいただける料理人を目指したいです。\nコックは何について話していますか？\n1.出 張 サービスに登録したきっかけ\n2.出張サービスの料理の店の料理との違い\n3.出張サ一ビスで指名を受ける方法\n4.出張サービスで 働 く魅力"}, {"k": "3-5", "sec": 3, "q": 5, "f": "audio/B2022G/3-5.mp3", "s": "講演会でアナウンサーの 男 の人と専門家が話しています。\nM：人工知能がどんどん発達し、社会に大きく影響すると思われますが、先生\nはどのようにお 考 えですか？\nF：お店 のレジ、ホテルの受付 やスポーツの審判 などはすでに人工知能 を\n活用した機械 がしているものもありますね。今後 、人 に代 わって人工知能 が\n行 う仕事はさらに増えていくでしょう。一方で、人間の仕事を奪うとか人間の\n能力 が下 がるといった不安 の声 を聞 かれますが、 私 が否定的 に 考 えずに\n別の側面を期待しています。\nM：とおっしゃいますと？\nF：例えば、将棋のプロの中には人工知能を利用したコンピュータとの対決を\n通 し、腕 を鍛 え、活躍 が 著 しい人 もいます。将棋 だけではなく、外国語 の\n能力を向上させるプログラムなども今後どんどん開発されるでしょう。能力の\n向上を目指す人はこれらを使わない手はないと思います。\n専門家は人工知能についてどう 考 えていますか？\n1.利点を積極的に活用すべきだ。\n2.人間の仕事を奪う恐れがある。\n3.使いすぎると人の能力が低下する。\n4.開発のスピードをもっと速めるべきだ。"}, {"k": "4-1", "sec": 4, "q": 1, "f": "audio/B2022G/4-1.mp3", "s": "明日、漢字のテストなんだけど、全部は覚え切れてないんだよね。\n1全部覚えたのは、すごいね。\n2 え？一つも覚えてないの？\n3多すぎて覚えるの大変だよね。"}, {"k": "4-2", "sec": 4, "q": 2, "f": "audio/B2022G/4-2.mp3", "s": "森さん、森さん担当の桜川の橋の建設は計画通りにいってないようだね。\n1 それは 順 調 に進んでるってことですね。\n2 はい、雨で工事が遅れまして。\n3 お陰様で、ありがとうございます。"}, {"k": "4-3", "sec": 4, "q": 3, "f": "audio/B2022G/4-3.mp3", "s": "映画館、平日の昼にしては、混んでたね。\n1 そう、いつも込んでるんだね。\n2休日でもないのに、人が多かったね。\n3平日だったら、もっと空いてたかもね。"}, {"k": "4-4", "sec": 4, "q": 4, "f": "audio/B2022G/4-4.mp3", "s": "昨日の休みは、一日だらだらしちゃったよ。\n1一日充実してたんだね。\n2 せっかくの休みなのに、 忙 しかったんだね。\n3 たまには何もしないのもいいんじゃない。"}, {"k": "4-5", "sec": 4, "q": 5, "f": "audio/B2022G/4-5.mp3", "s": "このコース料理、ちょっと物足りなくない？\n1何か追加で注文する？\n2満足したってこと？\n3量 が多くて、食べきれないね。"}, {"k": "4-6", "sec": 4, "q": 6, "f": "audio/B2022G/4-6.mp3", "s": "あ、アパートのエアコン、つけっぱなしで、出てきちゃった。\n1 あ、消してきたんだ。\n2 エアコン、付かなかったの？\n3 え、一度帰って、消してくる？"}, {"k": "4-7", "sec": 4, "q": 7, "f": "audio/B2022G/4-7.mp3", "s": "寒い時の旅行は温泉に限るよね。\n1温泉に行かないの？\n2温泉が一番だよね。\n3温泉は苦手なんだね。"}, {"k": "4-8", "sec": 4, "q": 8, "f": "audio/B2022G/4-8.mp3", "s": "さっきの映画、最後の音楽がすべてを台無しにしてたと思わない？\n1音楽のおかげで、最後まで映画が楽しめたね。\n2最後が、あの音楽じゃ、ちょっとね。\n3最後の音楽だけはよかったよね。"}, {"k": "4-9", "sec": 4, "q": 9, "f": "audio/B2022G/4-9.mp3", "s": "山田 さん、週末 の緑公園 でのイベントですが、雨 だった場合 に備 えて、\n予備日を設定しましょうか？\n1天気のことは 考 えなくていいですか？\n2 あらかじめ決めておくと安心ですね。\n3雨になってから、 考 えればいいんですね。"}, {"k": "4-10", "sec": 4, "q": 10, "f": "audio/B2022G/4-10.mp3", "s": "ここのアルバイトの募集、経験を問わずって書いてあるよ。\n1経験なくていいなら、応募してみようかな？\n2経験がないと、 難 しいんだね。\n3 え、どんな経験が必要？"}, {"k": "4-11", "sec": 4, "q": 11, "f": "audio/B2022G/4-11.mp3", "s": "うちのチームが優勝なんて、できっこないよね。\n1私 達 が勝つはずだって思ってる？\n2優勝できるとは、思わなかったよね。\n3 そんなこと言わないで、頑張ろうよ！"}, {"k": "5-1", "sec": 5, "q": 1, "f": "audio/B2022G/5-1.mp3", "s": "高校で演劇部の生徒二人と先生が話しています。\nM：あのう、先生 、明後日 の公演 の衣装 なんですが、主役 の山田 さんの衣装\nが汚れちゃったんです。\nA：すみません、さっき、ペンキがついちゃって、ここ胸のあたり、少しだけなん\nですが。\nF：茶色のペンキですか。白いドレスだから目立 ちますね。この衣装、主役 が\n最後までずっと着るものですよね。\nA：はい、洗剤で落とせるでしょうか。それか、大きめの花かなんかの飾りを縫\nいつけて、汚れを隠したらどうかと思うんですが。\nF：ああ、そうですね。\nM：この衣装は 諦 めて、去年の劇で使った青いドレスにするのはどうでしょう\nか。\nF：劇 のなかで、衣装 の白 い色 について話 すセリフが何箇所 かありましたよ\nね？今からセリフの変更は、しないほうがいいですねえ。\nM：じゃあ、僕の母、合唱サークルに入ってて、白いドレスも持ってると思うの\nで、聞いてみましょうか。\nA：お母さんのドレス、大事なものなんじゃない？もし汚しちゃったら、申し訳な\nいよ。\nF：そうですよ。やっぱり、ペンキが見えないように、なにか縫い付けるのがい\nいんじゃないですか。洗って、生地がダメになったら、困りますからね。\nA：わかりました、そうします。\n問題を解決するためにどうすることにしましたか？\n1汚れたところを洗剤で洗う 2飾りをつけて汚れを隠す\n3青いドレスに変更する 4 男 の生徒のお母さんのドレスを借りる"}, {"k": "5-2", "sec": 5, "q": 2, "f": "audio/B2022G/5-2.mp3", "s": "団体旅行で旅行会社の人の説明を開いて、男の人と女の人が話しています。\n明日は自由行動です。観光コースも四つご用意していますので、ご希望の方\nはご参加ください。どのコースも半日コースで、一日二回、午前と午後に 行 わ\nれます。\n一番のコースは市内の自然公園のハイキングです。きれいな 湖 の周りをガ\nイドと一緒に歩きます。\n二番のコースは、この街出身の作家の生まれた家や作品に登場する場所を\n自転車で巡ります。\n三番のコースは市内の神社や寺をバスで回り、この地域の歴史に触れるコー\nスです。\n四番のコースは市内 の筆作り工場 に行き、実際 に書道の筆 を作る体験 がで\nきます。\nM：どれも面白そうだね。午前と午後一つずつ選ぼうよ、明日は天気が良さそ\nうだから、外を歩いたり自転車に乗ったりするのにしない？\nF：うん、 湖 のコースはパンフレットに二時間近く歩くって書いてあったよ。ち\nょっと自信ないなあ。作家の家とかを回るほうならいいけど。\nM：じゃあ、午前中はそれにして、午後はどうする？お寺や神社にでも行く？\nF：今読 んでいる歴史小説 、主人公 が書道 の名人 っていう設定 で、筆 とかの\n道具の 話 もよく出てくるんだ。だからすごく興味があって、午後はそれがいい\nなあ。\nM：じゃあ、そうしょう。\n質問 1 明日の午前、二人はどのコースに参加しますか。\n質問 2 明日の午後、二人はどのコースに参加しますか。"}]}, {"id": "B2023G", "name": "2023年7月", "clips": [{"k": "1-1", "sec": 1, "q": 1, "f": "audio/B2023G/1-1.mp3", "s": "1.サークル活動 2.アルバイトの選び方\n3.勉強 の工夫 4.就職 のための準備\n大学で 女 の留学生と先生が話しています。\n女 の留学生は新入生のオリエンテーションで何の 話 を担当しますか。\nF：先生、新入生のオリエンテーションの件で 話 があるって聞きましたが。\nM：あ、ハンさん。そうなんですよ。ハンさん、新入生の時、先輩の留学生がオ\nリエンテーションに何人か来て、自分の体験を話してくれたの覚えてる？\nF：はい、先輩からサークルやアルバイトの 話 を聞いたのを覚えています。\nM：そうですか。で、実はね、優秀な成績だということでハンさんの勉強 の進め\n方やその工夫などについて紹介してほしいんです。アルバイトやサークルで\n忙 しい中でも勉 強 頑張っているみたいだし、新入生にも良い刺激になると思\nうから。\nF：わかりました。私でお役に立てるなら引き受けさせてもらいますが、新入生\nってサークルやアルバイト、それに就職 に興味あるんじゃないかなと思いま\nすけど。\nM：ええ。そのことについては、他の学生が担当してくれることになってるんです。\nF：わかりました。あ、今度、就職 についてご相談したいことがあるんですが、\nよろしいですか？\nM：もちろんです。\n問題一選択肢の設計\n1 已做的 た ている てある もう 済み\n2 要做的(正解) 頼み 命令 てください て てもらえる\n3 之后再做的 あと たら てから 次第\n4 不用做/说话人自己做的 ます型 原型"}, {"k": "1-2", "sec": 1, "q": 2, "f": "audio/B2023G/1-2.mp3", "s": "1.ねぎを収穫する 2.雑草をとる\n3.ほうれんそうの種をまく 4.土を 耕 す\n農家で農家の 女 の人とアルバイトの 男 の人が話しています。\nアルバイトの 男 の人はまずどんな作業をしますか。\nF：中村君、今日からよろしくお願いします。農作業はしたことがありますか？\nM：祖父が庭で野菜を作ってて、土を 耕 したり、種を蒔いたりするのは手伝っ\nたことがあります。\nF：じゃあ、 全 く初めてじゃないんですね。うちはいろんな野菜を栽培してるん\nだけど、今の時期、ネギの収穫をやっているんです。\nM：はい。\nF：ネギの 畑 の雑草を抜く作業やってもらえますか？\n収穫は明日機械でするんだけど、余計な草を抜いとかないと途中で機械に絡\nまっちゃって機械を止めないといけないんです。\nM：そうなんですか。\nF：大変だけど、大事な作業なんでお願いします。これが終わったら 隣 の 畑\nにほうれん草の種を蒔くから 私 と一緒にお願いできます？土を 耕 すのは済\nんでるから。\nM：わかりました。"}, {"k": "1-3", "sec": 1, "q": 3, "f": "audio/B2023G/1-3.mp3", "s": "1.ホームページから申し込む 2.振込み先を確認する\n3.銀行で受講料を支払う 4.クレジットカードを作る\n男 の学生と 女 の学生が話しています。\n男 の学生はこれからまず何をしますか。\nM：ビジネスの立ち上げ方のセミナーの申し込み、もうやった？\nF：うん、ホームページから申し込みしたよ。\nM：そっか。僕も申し込みたいんだけど、受講料の支払いってクレジットカード\nが必要じゃない？まだクレジットカード持ってないから……\nF：ホームページに振り込み先の銀行名と口座番号が書いてあるから振り込\nみでも払えるよ。確認してみて。\nM：え、そうなんだ？知らなかった。もう一度ホームページ見てみる。\nF：支払いが済んだ用紙の写真を添付すれば、ホームページから申し込みで\nきるって書いてあったよ。\nM：ありがとう。でもやっぱりクレジットカードがないと、こんな時、本当不便だ\nね。\nF：そうだね。\nM：今回のセミナーの申し込みにも間に合うかもしれないから、早速カード作ろ\nうかな。\nじ た く とど ２ しゅうかん もう\nF：だけど、クレジットカードは自宅に届くまで2 週間 くらいはかかるかも。申し\n込み、今週いっぱいだよ。\nM：そっか。じゃ、今回は間に合わないし、また今度にしよう。"}, {"k": "1-4", "sec": 1, "q": 4, "f": "audio/B2023G/1-4.mp3", "s": "1.照明器具の位置 2.照明器具のそざい\n3.照明の 光 の強さ 4.照明の明かりの色\n建築設計事務所で 女 の人と課長が照明の設計について話しています。\n女 の人はこれから何を変更しますか。\nF：課長、カフェ北山に提案する照明デザインなんですけど、案を見ていただ\nけましたか？\nM：うん、見たよ。この資料だよね。前回見せてもらった時は天井に大型の\n照明を1つ取り付けるってことだったけど、今回の案では天井から小さめの\n照明をいくつも並べてぶら下げることにしたんだね。\nF：はい。\nM：面白いと思うよ。天井からぶら下げる高さもよく 考 えてあるね。\nＦ しょうめいきぐ そ ざ い せい\nF：ありがとうございます。あの、照明器具の素材はガラス製のものにしたんで\nすが、どうですか？\nM：ガラスも悪くはないと思うけど、店の雰囲気から 考 えると和紙なんかも合\nうね。\nＦ かんが\nF：あ、 考 えていませんでした。そうですね、そうしてみます。\nM： 光 の強さについてはリラックスする空間にふさわしく抑えてあるね。明かり\nの色は白すぎず、 温 かみのある色になっているから案の通りで。\nF：はい、わかりました。"}, {"k": "1-5", "sec": 1, "q": 5, "f": "audio/B2023G/1-5.mp3", "s": "1. 机 といすをならべる 2.パソコンを設置する\n3. 机 に封筒を置く 4.来場者の案内をする\n説明会の会場で課長が部下の社員に話しています。\n部下の社員は今日この後、何をしますか。\nF：皆さん、暑い中、明日の新商品説明会の準備をありがとうございます。\nおかげさまで 机 、いすは準備が 整 い、パソコンやスクリーンの設置は当日行\nいますので、パンフレットが入った封筒を各机に置いて準備は完了となりま\nす。\n今回の説明会は規模がかなり大きいので当日は来場者の案内もよろしくお\n願いします。"}, {"k": "2-1", "sec": 2, "q": 1, "f": "audio/B2023G/2-1.mp3", "s": "1.地域の林業についての講義 2.山での基本作業の体験\n3.人工呼吸の練習 4.木材を使った工作\n男 の学生と 女 の学生が話しています。\n女 の学生が林業のイベントの中で 1 番興味があるのは何ですか。\nM：週末、予定ある？前、林業について興味あるって言ってたけど、 南 町 の\n林業センターで林業について学ぶっていうイベントを見つけたから一緒にどう\nかなあと思って。\nF：うん、行ってみたい。\nM：これ、パンフレット。地域の林業についての講義とか実際に近くの山で木を\n切り倒したり、林業の基本作業も体験できるよ。\nF：実際に木を切ったりする作業ができるってこと？面白そう!あ、人工呼吸の\n練習 もやるんだね。\nM：うん。林業は危険な作業もあるし、安全について学ぶ時間もあるみたいだ\nね。\nF：へぇ、もしもの時に役立つし、知ってて損はないよね。でも 私 はやっぱり\n作業が1番楽しみ。\nM：うん、僕はこの木材を使ってする工作、やってみたいなあ。\nF：吉田くん、物づくり好きだよね。"}, {"k": "2-2", "sec": 2, "q": 2, "f": "audio/B2023G/2-2.mp3", "s": ".\n1.パンの値段を下げる 2.閉店時間を早め\n3.ホームページを作る 4.ちらしに割引券をつける\nパン屋で店長と店員が話しています。\nこの店では客 を増やすためにどうすることにしましたか。\nM：最近、お客 さんの数が減ってきたね。\nF：近くに 新 しい店ができたせいでしょうかね。パンも売れ残るようになりまし\nたしね。\nM：どうにかしないとね。この辺は学生さんが多いからパンの値段を下げたい\nところだけど、原材料の価格が上がってて厳しいんだよね。\nF：そうですか。うーん、開店時間を早めて通勤通学の時間に店を開けるよう\nにするとかは？\nM：そうだね。朝が早いとアルバイトを見つけるのが 難 しいんだよね。\nF：そういえば、このお店ってホームページありませんよね。もっと宣伝に 力 を\n入れたらどうですか？\nM：うん、その方がいいのかな？前に近所の人にチラシを配った時は割引券\nを付けたけど、売り上げが伸びなかったんだけど。\nF：あー、まア、今はおいしいと聞けば、遠くでもお店の情報を検索して買いに\n行く人多いですし、早速やってみましょうよ。\nM：そうだね、やってみよう。"}, {"k": "2-3", "sec": 2, "q": 3, "f": "audio/B2023G/2-3.mp3", "s": ".\n1.ほかの保護者と知り合うことができる\n2.ちいきの役に立つことができる\n3.先生たちのことを知ることができる\n4.学校での子供の様子を見ることができる\n小学生の子供がいる 女 の人と 男 の人が話しています。\n男 の人が学校の手伝いを始めた理由は何ですか。\nF：あ、山本さん。あの、ちょっと 伺 いたいんですけど保護者として小学校のお\n手伝いの活動に参加されてますよね。\nM：ええ。息子が入学した頃、ちょうど仕事以外でも人間関係を広げたいと思\nっていたから他の保護者の皆さんと知り合えないかと思って。\nF：そうなんですね。先週 、桜 町 のお祭りに行ったんですが、お祭りも小学校\nの保護者が手伝ったりしているんですね。\nM：ええ。地域の行事に小学校の保護者も協力 するんですよ。地域に関われ\nるのが一番の魅力だとおっしゃる方もいらっしゃいます。あと、学校の先生方\nのことをよく知ることができていいという方も多いですよ。どうですか？加藤さ\nんも。\nF：ちょっと興味あるんですけど仕事も 忙 しいし……\nM： 短 い時間でできる活動もありますよ。前に、学校での子供の様子をもっと\n知りたいっておっしゃってましたよね。活動に参加するとそういったこともわか\nりますよ。\nF：はい、学校での様子は親として1番気になることだし、 考 えてみようかな。"}, {"k": "2-4", "sec": 2, "q": 4, "f": "audio/B2023G/2-4.mp3", "s": ".\n1.様々な値段から選ぶから\n２ ふる もの ふる かん\n2.古い物でも古さを感じさせないから\n３ おび こ も の く あ たの\n3.帯や小物との組み合わせが楽しめるから\n４ ちゅうもく あつ\n4.注目を集めることができる\n男 の人と 女 の人が着物について話しています。\n女 の人はどうして着物に夢中になったと言っていますか。\nM：着物、似合ってるね。よく着物着てるけど着物って高いんだよね？\nF：そんなことないよ。これ、全部で1万円ぐらい。今はフリーマーケットとかで\n昔 のものが安く買えるの。古い着物って今のと違って個性的な柄も多いし。\nM：へぇ。特に古い着物が好きなの？\nF：う一ん、そういうわけじゃないんだけど、 新 しい着物は学生には高いから\nね。\nM：そう、僕も結構興味あるんだけど、ちょっと 難 しそうで。帯と着物の色の合\nわせ方とか小物との組み合わせも 考 えるんだよね？\nF：うん、最初に着物を買ったお店の人が教えてくれたんだけとど、合わせるも\nので同じ着物とは思えないってくらい印象が変わるんだよ。 私 、そこから\n毎日着たいくらい大好きになっちゃった。\nM：そうなんだ。ねえ、着物ってやっぱり目立っちゃうよね。ジロジ口見られたり\nしない？\nF：それがうれしいって言ってる友達もいるけど、 私 は他の人の目は気になら\nないんだ。"}, {"k": "2-5", "sec": 2, "q": 5, "f": "audio/B2023G/2-5.mp3", "s": ".\n1.ウオーキングコンテストの実施\n2.体操動画の公開\n3.運動用品の支給\n4.食事のアドバイス\n会社の会議で課長が話しています。会社で今年度から始める健康のための\n取り組みは何ですか。今年度から始める取り組みです。\nM：我が社では三年前から社員の健康維持を目的とした取り組みを続けてい\nます。今年度は4つの取り組み。\n1ヶ月に歩いた距離の合計を競う、ウォーキングコンテストの実施、体操動画\nの公開、運動用品の支給、食事のアドバイスを 行 い、皆さんの健康を支えま\nす。\nこのうち、歩行距離を競うことは、昨年末の社員へのアンケート結果を受けて\n新たに採用になりました。食事に運動に、これからも健康第一で頑張りましょ\nう。"}, {"k": "2-6", "sec": 2, "q": 6, "f": "audio/B2023G/2-6.mp3", "s": ".\n1.海の深いところの温度を測ること\n2.海の表面 の温度を測る計測器を開発すること\n3.世界各国の協力 を得ること\n4.非常に多くのデータを分析すること\nシンポジウムで大学の先生が共同研究の 話 をしています。\n先生はこの研究 の中で何が1 番 難 しかったと言っていますか。\nF：気候の変化を正確に予測するためには海の温度を測ることが大切です。\nしかも多くの場所で海の表面 だけでなく、深さ1000メートルとか2000メートル\nのところの温度を測る必要があるのです。\nそのための計測器の開発が非常に 難 しかったんです。そして、さらに困難だ\nったのはいくつもの国から協力 してもらうこと。\nそれが実現して、ようやく世界中のデータを研究 のために使えるようになりま\nした。データは膨大な量 となり、分析には時間もかかりますが、かなり正確な\n予測が 行 われるようになりました。"}, {"k": "3-1", "sec": 3, "q": 1, "f": "audio/B2023G/3-1.mp3", "s": ". 大学で先生が授業の始まる前に学生に話しています。\nF：授業を始める前に聞いてもらいたいことがあります。えー、 私 は環境問題\nの解決に取り組んでいる団体のメンバーとして活動をしています。\n団体では月に1回程度、イベントを行なっているのですが、先週末に予定され\nていたイベントが天候の影響で来週の日曜日に延期になってしまいました。\nそのため、本来お手伝いいただこうと思っていたボランティアの方々の参加が\n難 しくなりました。もしこの中に環境問題のイベント運営に興味のある人がい\nたら授業の後にでもぜひ 私 に声をかけてください。\n先生は何について話していますか。\n1．ボランティア参加の呼びかけ\n2．環境問題を解決する大切さ\n3．イベント運営の 難 しさ\n4．授業内容の変更"}, {"k": "3-2", "sec": 3, "q": 2, "f": "audio/B2023G/3-2.mp3", "s": ". テレビで医者が話しています。\nF：夏になると 体 がだるい、食欲がないといった症状 が出やすくなります。\nこういった症状 は例えば、暑い屋外と冷えた室内を行き来することで体温\n調節 がうまくできなくなったり、また、汗をかくことで 体 の水分が不足気味に\nなったりすることで起こると 考 えられています。\nまた、寝苦しさによる睡眠不足でもそうした症状 が出やすくなります。\n医者は何について話していますか。\n１．夏に 行 うと良い運動\n2．夏の体調不良とその原因\n3．夏の睡眠不足を解消する方法\n4．夏を健康に過ごすための食事"}, {"k": "3-3", "sec": 3, "q": 3, "f": "audio/B2023G/3-3.mp3", "s": ".テレビで小学生の 女 の子と今宇宙にいる宇宙飛行士が話しています。\nF：こんにちは。今井はな、5年生です。\nM：こんにちは。宇宙飛行士の本田です。\nF：えっと、質問があります。宇宙は重力 がないと聞いたことかがありますが、\nどんな感じですか？\nM：はい、宇宙には重力 がありません。ですから 私 は今、無重力の中にいま\nす。 体 が床から浮きます。背骨の骨と骨がつながっているところが少し伸び\nて、1cmくらい背が伸びるんですよ。\nF：わー。 私 も宇宙飛行士になって、そういう体験してみたいです。\nM：ええ、ぜひなってください。それから、顔が丸くなるんですよ。地球では\n重力 で下に引っ張られて、下半身に行っていた血液などが上半身に行きや\nすくなるので。他には足の裏の皮が柔らかくなります。これは地面に足をつけ\nて歩かないからですね。\nF：へぇ、そうなんですね。\n宇宙飛行士は、何について話していますか。\n1．無重力の仕組み\n2．宇宙で 行 う実験\n3．宇宙飛行士の生活\n4．宇宙での 体 の変化"}, {"k": "3-4", "sec": 3, "q": 4, "f": "audio/B2023G/3-4.mp3", "s": ".高校の卒業生が集まる会で校長が話しています。\nM：本学園は再来年、創立100周年 を迎えるにあたり、社会の変化に対応した\n教育が 行 える新校舎の建設を予定しております。\n代々の卒業生の皆様には日頃からご支援いただいておりますが、学園の\n未来に対し、 改 めてご寄付という 形 でご協力 いただければ 幸 いです。\nご協力 いただけた方には 新 しい校舎1階の壁にお名前を入れさせていただ\nきます。ぜひ完成を皆様とお祝いできればと思います。\n校長の言いたいことは何ですか。\n1．社会と教育の変化\n2． 新 しい校舎のイメージ\n3．卒業生の活躍\n4．新校舎のための寄付の依頼"}, {"k": "3-5", "sec": 3, "q": 5, "f": "audio/B2023G/3-5.mp3", "s": ".市民向けのセミナーで鳥の専門家が話しています。\nM： 私 たちに身近な鳥、カラスですが、ゴミを荒らしたり、鳴き声がうるさいな\nど迷惑な存在で生き物としてはあまり関心を持てないかもしれませんね。\nそのカラスですが、カラスの仲間は世界に約40種類、そのうち主に2種が年間\nを通して日本各地で見られます。\nカラスの鳴き声を観察したところ、十数種類の鳴き方があり、鳴き合うことで\n同じ群れの仲間か確かめたり、相手との距離や飛んでいる方向を確認したり\nしてコミュニケーションを取っていることがわかりました。\nまた、連続して鳴く場合は食料 の場所を仲間に知らせていることが明らかに\nなりました。鳴き声を上手に使っているんですね。\n鳥の専門家はカラスの何について話していますか。\n1．種類によって鳴き方が違うこと\n2．鳴き声による被害と対策\n3．鳴き声を出す仕組み\n4．鳴き声に意味があること"}, {"k": "4-1", "sec": 4, "q": 1, "f": "audio/B2023G/4-1.mp3", "s": "このお皿、色はともかく、使いやすいんだよね。\n1．このお皿、完璧ってわけだね。\n2．そう、色も悪くないと思うけどね。\n3．君が好きな色だよね。"}, {"k": "4-2", "sec": 4, "q": 2, "f": "audio/B2023G/4-2.mp3", "s": "ジュンさん、ジュンさんの企画、予算の面で部長にひどく反対されたけど、\n諦 めることはないよ。\n1． 諦 めるしかないんですか。\n2．はい、もう一度見直してみます。\n3．直しても無駄だとおっしゃるんですか？"}, {"k": "4-3", "sec": 4, "q": 3, "f": "audio/B2023G/4-3.mp3", "s": "一人暮らしを始めてから野菜が不足しがちなんだよね。\n1．野菜を摂りたくないんだね。\n2．野菜十分足りてていいね。\n3．気をつけて野菜も食べないとね。"}, {"k": "4-4", "sec": 4, "q": 4, "f": "audio/B2023G/4-4.mp3", "s": "昨日テレビで歌手の小林ゆうとを見たけど、忘れられつつあるよね。\n1．ずっと人気あるよね。\n2．確かにあの人、よくテレビで見るね。\n3．ああ、そんな人いたね。"}, {"k": "4-5", "sec": 4, "q": 5, "f": "audio/B2023G/4-5.mp3", "s": "仕事、簡単に辞めるべきじゃなかったんじゃない？\n1．ちょっと後悔してるんだ。\n2．もっと早く辞めるべきだったってこと？\n3．辞めてよかったよね。"}, {"k": "4-6", "sec": 4, "q": 6, "f": "audio/B2023G/4-6.mp3", "s": "この 間 の花見、あいにくのお天気でしたね。\n1．お天気、よくなくて残念でしたね。\n2．よく晴れて気持ちよかったですね。\n3．期待通りの天気でしたね。"}, {"k": "4-7", "sec": 4, "q": 7, "f": "audio/B2023G/4-7.mp3", "s": "僕が勤めている会社、上司に意見を言いやすかったらいいのに。\n1．上司にいろんなことが話せていいね。\n2．上司に思ったことが言えない環境 なの？\n3．上司が意見をよく聞いてくれるんだ。"}, {"k": "4-8", "sec": 4, "q": 8, "f": "audio/B2023G/4-8.mp3", "s": "山田課長。佐藤さん転んで骨折したけど、入院 せずに済むそうです。\n1．入院 しなくていいですね。\n2．入院 するんですか、大変ですね。\n3．入院 するかどうかわからないんですね。"}, {"k": "4-9", "sec": 4, "q": 9, "f": "audio/B2023G/4-9.mp3", "s": "体 に悪いと知りつつ、夜中にお菓子食べるのをやめられないんだ。\n1． 体 に悪いって知らなかったの？\n2．わかっていてもやめられないことってあるよ。\n3．健康に良くないから我慢しているんだね。"}, {"k": "4-10", "sec": 4, "q": 10, "f": "audio/B2023G/4-10.mp3", "s": "昨日のイベント、予想に反してたくさんの人が来たね。\n1．もっとたくさん来ると思ってましたよね。\n2． 私 たちの予想通りでしたね。\n3．思っていたより多かったですね。"}, {"k": "4-11", "sec": 4, "q": 11, "f": "audio/B2023G/4-11.mp3", "s": "この子供用のなぞなぞの本やってみたんだけど、半分も解ければいい方だよ。\n1.大人でもそんなに 難 しいの？\n2.子どもにとっても易しいの？\n3.大人なら簡単に解けるの？"}, {"k": "5-1", "sec": 5, "q": 1, "f": "audio/B2023G/5-1.mp3", "s": "博物館で職員3人が小学生向けの科学教室の企画について話しています。\nA：次の子供科学教室、空気中で音が伝わる仕組みっていうテーマだったよ\nね？なかなかいい企画だけど、今のままだと時間をオーバーしそうだから\n内容を削りたいんだ。\nF：今の案では、前半で仕組みを説明して、後半で身近なもので楽器を作るっ\nていう工作をする構成になってますよね？ストローを使った笛と空き缶を使っ\nた太鼓。内容を削るなら工作を2つじゃなくて1つにしましょうか。\nM：え？何度も試作したんですよ？工作は両方残しましょうよ。\nF：じゃあ、前半の説明を 短 くするのはどうですか？\nM：説明のところ、もう十 分 短 くしてありますよね？\nA：そうだね。そこはこれ以上カットするとただの工作教室になっちゃうから\n企画とは合わないよね。\nM：工作は2つ紹介して、どちらかやりたいほうを子供が選んで作れるようにし\nたらどうですか？\nA：なるほどね。どっちにするか迷って時間がかからないように進行の仕方を\n検討する必要がありそうだけど…\nM：他にはストローとか空き缶とか、工作の材料をこちらで事前に切っておい\nて準備の時間を短縮するという手もありますが……\nF：それでそんなに時間が変わるでしょうか？\nA：そうだね。それに準備するところから子供たちに体験してもらいたいから。\nそうすると子供に選んでもらうさっきの案にしよう。\n3人は内容をどう変更することにしましたか。\n1．紹介する工作を 1 つにする 2．前半の説明を 短 くする\n3．作らせる工作を 1 つにする 4．工作の材料を切っておく"}, {"k": "5-2", "sec": 5, "q": 2, "f": "audio/B2023G/5-2.mp3", "s": "ラジオを聞いて女の学生と男の学生が話しています。\n来週から1週間 、山川市で桜映画祭が 行 われます。鑑賞の仕方が少し 珍 し\nい映画を4つご紹介します。\nまずは、アニメ映画の「白い雲」。映画を観ながら歌ったり手を叩いたりしても\nいいことになっているので賑やかに楽しめます。\nそれからミステリー映画の「 緑 の列車」。こちらはオーケストラが映像に合わ\nせて生で音楽を演奏します。\n恋愛映画「美 しい1日」の会場は、今回の映画祭唯一の屋外の会場です。\n山川公園に臨時でスクリーンが設置されます。今はいい季節だから気持ちが\nいいでしょうね。\n最後にミュージカル映画「旅の空」。会場のレストランで食事を楽しみながら\n鑑賞できます。\nF：今言ってた映画祭、2人用のチケットが2枚あるんだけど、一緒に見に行か\nない？2つ見られるから1つずつ選ぼう。\nM：え？いいの？うーん、僕、前に映画の音楽に合わせてみんなで歌ってもい\nいっていう映画を観に行ったことがあるんだけど、一体感があって楽しかった\nよ。\nF：へぇ、日本では静かに観ましょうっていう映画館のほうが多いけどね。\nM：うん。あの雰囲気をまた味わいたいな。\nF：いいね。1つはそれにしよう。 私 は、うーん、おいしい食事を楽しみながらっ\nていうのも魅力的だけど、開放感がある外で見てみたいな。\nM：じゃ、そうしよう。\n質問1． 男 の学生はどの映画を選びましたか。\n1.『白い雲』 2.『 緑 の列車』 3.『美 しい一日』 4.『旅の空』\n質問2． 女 の学生はどの映画を選びましたか。\n1.『白い雲』 2.『緑の列車』 3.『美しい一日』 4.『旅の空』"}]}];
window.DATA=window.DATA||{};DATA.tts={"ちりょう": "tts/91d3a81dd0.mp3", "歯医者に行って虫歯の治療を受けた。": "tts/bed4d597ee.mp3", "きそって": "tts/be569b82c7.mp3", "私たちはテストのたびに学年でトップを競っていた。": "tts/63428257ae.mp3", "ひひょう": "tts/48f5c0b6a3.mp3", "今月の雑誌に新しい映画の批評が掲載された。": "tts/0e3198f4e3.mp3", "おさめた": "tts/656b06c6c0.mp3", "期日までに入学金を納めた。": "tts/200ddaf0d3.mp3", "おとる": "tts/e91b46794b.mp3", "A社の製品は他社のものより品質が劣る。": "tts/6976480b27.mp3", "おさない": "tts/bbeaa64ba7.mp3", "青木さんってちょっと幼いところがあるよね。": "tts/aa64928137.mp3", "にぎって": "tts/237c9292cb.mp3", "しっかり握ってください。": "tts/df7c9d928e.mp3", "みっぺい": "tts/17a93e9915.mp3", "空気が入らないようにちゃんと密閉してください。": "tts/1b7242641d.mp3", "しぼった": "tts/7bb0053fcd.mp3", "かなりの時間をかけてテーマを絞った。": "tts/7cba6ba959.mp3", "すいちょく": "tts/3726765e31.mp3", "この線に対して垂直な線を引いてください。": "tts/96aba52b1d.mp3", "みだれて": "tts/50c27c3317.mp3", "きれいに整えた髪が乱れてしまった。": "tts/4cd4df5b13.mp3", "じゅうなん": "tts/65419f623d.mp3", "係員は柔軟に対応してくれた。": "tts/f8f7452e33.mp3", "つよび": "tts/76fd6e43ed.mp3", "表面を強火で焼いてください。": "tts/3e2fee06c5.mp3", "かかえる": "tts/b45a7d2542.mp3", "それを一人で抱えるのは大変そうだ。": "tts/1056ebb371.mp3", "きゅうじん": "tts/577aefff0b.mp3", "アルバイトの求人があったので、応募した。": "tts/639fbaaef0.mp3", "こわい": "tts/f383b67502.mp3", "私は少し怖いと思いました。": "tts/b24ad4e72a.mp3", "れいぞうこ": "tts/be165a8b4b.mp3", "この食品は冷蔵庫で保存してください。": "tts/66fbd22f6b.mp3", "そうがく": "tts/93cf12a0fd.mp3", "今年の支出は総額で約5300万円だった。": "tts/edcf769082.mp3", "しめって": "tts/1b4eef2246.mp3", "まだ湿っているから、もう少し待ちましょう。": "tts/7d01390db4.mp3", "ちゅうせん": "tts/16bbb3e502.mp3", "応募者には抽選でプレゼントが当たります。": "tts/71b3da73aa.mp3", "はなれて": "tts/a4651c82dd.mp3", "二人は離れて座った。": "tts/a2cfcc15e9.mp3", "きかく": "tts/85bac8c480.mp3", "何か良い企画はありますか。": "tts/d03fe742e6.mp3", "さいど": "tts/133a3f9b43.mp3", "再度確認をお願いします。": "tts/35fbbe692c.mp3", "なごやか": "tts/f9f31e87f3.mp3", "とても和やかなパーティーだった。": "tts/cbbe24e2c7.mp3", "しょり": "tts/482c1c68fb.mp3", "コンピュータでデータを処理した。": "tts/924f26d2b8.mp3", "にくんで": "tts/5b398415ad.mp3", "誰も憎んでなんていませんから、心配しないでください。": "tts/d4de087670.mp3", "ぐうぜん": "tts/8958357e1f.mp3", "偶然、駅で友達に会った。": "tts/e
