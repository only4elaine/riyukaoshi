DATA.sortzh={"so1": "学生：“接下来要介绍的，是我为了记新单词，反复琢磨有没有好办法之后想到的方法。”", "so2": "常听人说不擅长整理，但那绝不是性格或能力的问题，只是不知道方法而已，所以只要掌握了方法，一定能整理好。", "so3": "X市有两处为市民设立的文化设施，举办以音乐会为首的各种活动。", "so4": "明明并不饿，肚子却会叫，这是为什么呢？", "so5": "每次出差都住的Y酒店，从上周起因施工停业，所以这次决定住别的酒店。", "so6": "不管哪种运动，每天的练习固然是进步不可缺少的，但如果用错误的方法练习，花再多时间也很难进步。", "so7": "姐姐是歌手赤川圭的超级粉丝，说只要是关于她的事，再小的事也想知道。", "so8": "明天傍晚截止的报告还没写完。明天一整天都有课没有时间，所以今晚就算熬夜也得把它写完。", "so9": "听说田中先生好像很爱吃橘子，一旦吃起来就停不下来，所以冬天总是大量购买橘子。", "so10": "我从上初中时起逐渐对医学产生兴趣，上高中时就已决定将来要当医生。", "so11": "做菜有趣的地方在于，即使是便宜的食材，只要用心也能做出丰盛的大餐。", "so12": "田中：“昨天是我儿子高中的入学典礼。” 山田：“田中先生的儿子都已经是高中生了啊，真快。”", "so13": "按年龄层来看世界各国国会议员选举的投票率，可以发现年轻一代的投票率不只是我国，普遍有偏低的倾向。", "so14": "5岁的女儿说想和我一样当警察。将来是不是真的会当上先不说，她能这么说，我就很感动。", "so15": "输了比赛，本该很懊悔的选手们不知为何却神情开朗，据说是因为“越是艰难越要乐观”是教练的方针。", "so16": "每次听这首歌，我想起的都是高中时的朋友。他去卡拉OK必唱这首歌。", "so17": "昨天打工快迟到了，想着得赶紧，就打了出租车，结果道路堵车，反而更花时间，最后还是迟到了。", "so18": "下个月要结婚的朋友请我在婚礼上致辞。我不擅长在很多人面前讲话，所以很犹豫，但因为他说无论如何都要拜托我，我就答应了。", "so19": "政治家A先生前几天的发言太不负责任了。我认为他应该在好好考虑自己作为政治家的立场之后再发言。", "so20": "饮食、睡眠等生活习惯一旦乱了，就很难恢复，所以平时就要有意识地保持规律的生活，这很重要。", "so21": "要说过婚姻生活什么最重要，我认为是要有体贴对方的心。", "so22": "入职时买来、一直在用的包终于坏了，所以决定换一个新的。", "so23": "登山有一种不可思议的魅力。爬的时候觉得再也不想做这么辛苦的事，可下山过几天，却不知为何又想爬了。", "so24": "雕刻家川村武创作的动物雕塑，形状简单，却充满仿佛马上就要动起来的生命力。", "so25": "听朋友说这种点心做起来非常简单，就算是新手也几乎不会失败，我就想试着做做看。", "so26": "附近超市旁边有一家洗衣店。超市和洗衣店在我下班回家的时间也开着，买东西时顺便就能去取寄存的衣服，这点很方便。", "so27": "药如果不正确服用，不仅得不到应有的效果，还有使病情恶化的危险。", "so28": "明明是不管什么时候去都排着长队的拉面店，这次没怎么排队就进去了，是因为我事先确认了大概几点人少再去的。", "so29": "以山和植物摄影家而闻名的岩本正树先生的摄影展，将从15日起在ABC百货举办。", "so30": "小时候觉得一年很长，可随着年龄增长，反而觉得一年变短了，这是为什么呢？", "so31": "按什么顺序提供信息，会改变对方的理解方式，所以说话时有必要注意顺序。", "so32": "在日本，99岁的祝寿叫“白寿”。因为把“百”字去掉“一”就变成“白”字，所以这样称呼。", "so33": "讲师：“有没有这样的经历：一开始对某件商品完全没兴趣，但在广告等处看了几次之后，渐渐在意起来？”", "so34": "要好好理解这本书的内容，需要相应的知识，所以觉得难的人大概也很多。", "so35": "石油不仅被用作汽车、飞机等的燃料，也被用作制造塑料制品的原料。", "so36": "东铁道竹山线内的两处信号机发生故障，已查明可能引发重大事故的危险状态一直持续着。", "so37": "（采访中）“当上店长后的第一年很辛苦。虽说当了店长，可不懂的事情一大堆，我也烦恼过自己这样行不行。”", "so38": "对买房持否定态度的丈夫说，他讨厌一旦买了就不能轻易搬家。", "so39": "我和隔壁班的朋友吵了架，在学校走廊擦肩而过时，连对视都不再有了。", "so40": "这张沙发虽然有一定大小，但没有看上去那么重，所以一个人也能轻松搬动。", "so41": "朋友邀我去滑雪旅行。我想着得回复，但工作安排还没定下来，所以还没能回复。", "so42": "我在美术馆会借语音导览机，边听讲解边欣赏作品。因为知道该关注作品的哪里，就能更深入地品味那件作品。", "so43": "虽然在下雪，却没觉得那么冷，大概是因为几乎没有风吧。"};

;(function(){window.DATA=window.DATA||{};DATA.lqzh={"lq1": {"q": "女学生接下来要做什么？", "o": ["增加调查对象的数量", "把考察写得更详细", "改变结果的呈现方式", "改变分析方法"], "s": "大学里，一位男学生（学长）和一位女学生在谈话。\n男：铃木，你之前拜托我看的报告，我看完了。\n女：啊，学长，您已经看过了吗？\n男：嗯，重新调查之后对象的人数也增加了，变好了吧？考察也更有说服力了，读起来很有意思。\n女：真的吗，谢谢您。重新调查比想象的花了更多时间。不过，做了还是值得的。\n男：你很努力啊。既然这样，不如在结果的呈现方式上再下点功夫？不要光是表格，也放一点图表，让人一眼就能看明白。\n女：啊，好的。\n男：话说回来，这个分析方法很有意思啊，下次我也用用看。"}, "lq2": {"q": "女的接下来首先必须做什么？", "o": ["打印通知用的明信片", "制作收件人地址贴纸", "更新会员信息文件", "撰写邮件正文"], "s": "公司里，一位男的和一位女的在谈话。\n男：佐藤，该给会员发促销活动的通知了。\n女：好的。\n男：印刷厂已经把通知明信片做好送来了，你能做一下收件人地址的贴纸吗？会员信息汇总的文件你知道吧？用那个做。啊，不希望收邮寄件的客人会用邮件发送，所以那些人不需要贴纸。\n女：好的。会员信息文件已经更新了吗？\n男：嗯，更新过了。因为是个人信息，工作时要小心。\n女：好的。邮件那边也由我来发吗？\n男：邮件正文还没准备好，今天不用了。\n女：明白了。"}, "lq3": {"q": "女学生接下来要做什么？", "o": ["提交健康保险证的复印件", "准备穿在工作服里面的衣服", "买长筒靴", "提交体检证明"], "s": "大学里，一位女学生和一位男学生（学长）在谈话。\n女：学长，您去年暑假去过农业体验对吧？就是学校主办的那个，我下周起也要去一个月。有什么最好带去的东西吗？\n男：健康保险证。去年有人忘带了，很麻烦，连复印件都没带。像我们这种外行干农活，可能会意外受伤，所以别忘了。\n女：好的，我一直随身带着。\n男：嗯。还有，T恤最好多带几件。穿在工作服里面的，干活时出的汗比想象的多得多。工作服和长筒靴可以借，大概因为常有实习生来，各种尺码都有。\n女：太好了，我还以为得买长筒靴呢。T恤我想着有工作服就行了，只准备了居家服之类的。\n男：对对。其实去年我忘了做体检，差点没法参加。\n女：咦，那后来怎么办的？\n男：找了个能马上开诊断书的医院，总算赶上了。\n女：啊，所以今年的提交截止到上周为止啊。"}, "lq4": {"q": "男的接下来首先必须做什么？", "o": ["就材料跟讲师商量", "做材料清单", "查找可以替代的材料", "通知参加者菜单变更"], "s": "市政府的国际交流科里，一位男的和一位女的（科长）在谈话。\n男：科长，关于下个月的烹饪教室。\n女：啊，亚洲料理教室对吧。定的是“谁都能在家做”的菜单，菜单也已经定了吧？\n男：是的。我和讲师碰过面，拿到了材料清单。按规定由我按人数把材料统一备齐，但有些没听说过的材料，似乎得订购。\n女：请你去跟讲师商量一下，能不能用附近买得到的东西代替。如果不行的话，就改菜单。\n男：明白了。\n女：就算做法简单，材料也得是附近买得到的才行。\n男：是啊。如果菜单有变更，我也会通知参加者。"}, "lq5": {"q": "参加者接下来首先要做什么？", "o": ["决定小组组长", "选择要讨论的课题", "汇总意见并发表", "介绍自己的研究主题"], "s": "学生学习会上，主持人在讲话。\n今天感谢大家参加大学联合学习会。接下来我们将就世界目前面临的各种问题进行小组讨论，加深理解。大家已经分好组了吧。发下去的名单上画了圈的人就是小组组长，请以组长为中心推进讨论。请就大家事先选好的课题进行讨论，思考可以采取什么应对办法，并以小组为单位汇总意见后发表。在进入正题之前，也算自我介绍，请大家谈谈各自正在做的研究主题。放松之后，再进入讨论吧。"}, "lq6": {"q": "女学生说她觉得这部动画的魅力在哪里？", "o": ["反映了历史事实", "用了与主题契合的音乐", "故事发展出人意料", "细腻地表现了人物的心情"], "s": "大学里，电影社团的一位男学生和一位女学生在谈论一部动画。\n男：听说你看了在樱花电影节上拿了金奖的那部动画？怎么样？舞台是三百年前的日本吧。\n女：嗯，历史事实也刻画得很细致，喜欢历史的人可能会喜欢这一点。\n男：哦。\n女：我自己做音乐，所以平时总会被主题音乐吸引。但这部的故事发展很有冲击力，怎么说呢，一次次出乎我的预料，一直紧张刺激。以前我觉得电影成败取决于音乐。\n男：这样啊。\n女：报纸上评价说细腻地描写了登场人物内心的变化，对这种看法我倒不太懂。"}, "lq7": {"q": "男的为什么现在在学日语？", "o": ["想成为做和果子的工匠", "想在日本的公司就职", "因为（日语）还不足以胜任工作", "因为日常生活中感到不便"], "s": "日语教室里，一位男的在讲话。\n我来日本三年了。因为和果子对日本产生了兴趣，开始学日语。我也曾有一段时间想成为和果子工匠，但去年进了一家食品公司，现在是工作日上班、周末去日语教室的日子。日常生活中我并不觉得语言不方便，但在职场上还是有觉得能力不足的时候，所以觉得在日语教室能学到很多东西。"}, "lq8": {"q": "女职员对讲座反省的是什么？", "o": ["会场太小了", "贴海报的地方太少", "没有做问卷调查", "没有给参加者发资料"], "s": "市政府里，一位男职员（科长）和一位女职员在谈话。\n男：斋藤，昨天的饮食讲座怎么样？\n女：啊，科长，我正想去向您汇报。托您的福，会场的座位全坐满了。也许是扩大了张贴海报的地区起了作用。\n男：这样啊。\n女：讲座后做了问卷，从参加者的感想看，烹饪方法等实用的内容很受欢迎。讲座中也有几位参加者认真地做笔记，所以我觉得要是把材料和做法写成资料发给大家就好了。\n男：这次没准备资料呢。\n女：是的。另外，这次用了新会场，很多人说能近距离听老师讲很好。\n男：那很好。\n女：是的。会场大小真重要啊。收到了很多意见很好，所以我觉得问卷下次也一定要做。"}, "lq9": {"q": "播音员在谈论什么？", "o": ["预测太阳雨的方法", "太阳雨降下的原理", "避开太阳雨的方法", "太阳雨多发的季节"], "s": "广播里，播音员在讲话。\n今天各地都观察到了“太阳雨”现象。天上一朵云也没有，晴空万里，却突然下起雨来，这种现象是怎么发生的，大家恐怕出乎意料地并不了解吧。太阳雨是雨滴从雨云里落下之后，云消散或移动而产生的。也有的是雨滴被强风吹离，落在远离云的地方而产生。虽然希望能避开突然的雨，但阳光照在雨滴上很美对吧。类似的现象冬天下雪时也能看到哦。"}, "lq10": {"q": "播音员在谈论什么？", "o": ["从海外来这个镇上的人增加的原因", "这部电影在日本成为话题的原因", "某位演员获得电影奖的原因", "在这个镇上拍电影的原因"], "s": "电视里，播音员在讲话。\n我现在来到了若叶町的中央高中。从去年开始，有很多外国游客来到这所高中的校门前拍纪念照。这是因为电影《青春故事》就是在这所高中拍摄的。这部电影10年前在日本上映，成为很大的话题。据说，出演这部电影的演员青木拓哉去年在另一部电影中获得了世界性的电影奖，使得这部电影在海外也受到关注。不只是高中，镇上到处都有这部电影的拍摄地，非常受影迷欢迎。"}, "lq11": {"q": "议员想说的是什么？", "o": ["应该调查空房的数量", "应该尽快拆除空房", "应该利用空房", "应该调查空房增加的原因"], "s": "镇议会上，一位议员在讲话。\n根据去年度的调查，我们川中町没人居住的空房在这十年里增加了一倍。空房增加对地区防范治安来说是严重的问题，还有火灾发现晚、房屋老化倒塌的危险。有意见认为这样的空房应尽快拆除，但寻找让它们重生的路不是更好吗？调查全国的例子可以发现，有的地方由政府管理空房，将其改造成商业设施，也有招来人气的例子。"}, "lq12": {"q": "今天真倒霉啊。", "o": ["所以才没戴来啊", "做得很顺利啊，太好了", "诶，发生什么事了？"], "s": ""}, "lq13": {"q": "今天的讲座，真是不虚此行啊。", "o": ["听到了宝贵的内容呢", "要是能听到讲座就好了", "确实没必要来呢"], "s": ""}, "lq14": {"q": "部长，出席的各位都已经到会场了。虽然还没到时间。", "o": ["是吗。我也马上过去", "那么，人都到齐了请告诉我", "请差不多可以带大家去会场了"], "s": ""}, "lq15": {"q": "男的接下来首先必须做什么？", "o": ["汇总上次的问卷", "处理下次的报名", "寄出下次的资料", "给上次的参加者发感谢邮件"], "s": "公司里，一位女的和一位男的在谈话。\n女：山下，上次公司说明会的参加者问卷，结果汇总好了吗？明天的会议上要汇报，我想今天内看一下。\n男：诶，今天内吗？对不起，我正忙着处理下次说明会的报名和给参加者寄事先资料的准备。\n女：这样啊。嗯，报名的处理我来做，寄资料还有时间，不是今天也没关系吧。总之你先集中做问卷结果吧。啊，对了，给参加者的感谢邮件已经发了吗？\n男：啊，那个已经发了。\n女：好。那就拜托了。\n男：好的。"}, "lq16": {"q": "女的要怎么修改海报？", "o": ["改变商品名称文字的颜色", "把商品厚度的数字写大", "加入与以前商品对比的图", "添加性能的变更点"], "s": "公司里，一位女的和科长在谈论商品海报。\n女：科长，我做好了下次要发售的电脑的宣传海报，能请您看一下吗？\n男：好。商品名称文字的颜色好像不太显眼。\n女：是吗。\n男：不过看整体平衡，很有统一感。这次商品的卖点是“有史以来最薄”，所以应该更突出这一点。厚度的具体数字虽然写得很大很显眼，但光有这个，厚度还是不好懂。\n女：是吗。\n男：用图和以前的产品比较一下，那样会更好吧。\n女：好的，就这么改。\n男：与上一款相比性能的变更点已经总结得很清楚，没有别的需要补充了。\n女：谢谢。\n男：那你就只改这一点试试吧。\n女：明白了。"}, "lq17": {"q": "女学生接下来首先要做什么？", "o": ["创作环境问题的艺术作品", "阅读总结相关活动的文献", "参加环境问题的活动", "找别的人商量"], "s": "大学里，一位女学生和一位男学生（学长）在谈话。\n女：学长，毕业论文的发表辛苦了。我也想着该开始为毕业论文做准备了，却不知道怎么办才好。\n男：这样啊。加藤你马上要升三年级了嘛。主题定了吗？\n女：定了，和学长一样，我对环境问题感兴趣，所以想写保护环境的活动。\n男：说保护环境的活动，也有很多种啊。比如也有通过文学作品和艺术来呼吁环境问题的。文献之类的已经读了几本了吗？\n女：还只是在课上读过一本教材。\n男：那你先看看总结这些活动的文献。然后如果有感兴趣的，就去参加相关的活动。\n女：好的。\n男：参加了活动之类的，我想具体的问题点也会看出来。到时候也许可以介绍做相关研究的朋友给你。\n女：这样啊，到时候再请您商量。\n男：嗯。先从了解有什么开始。\n女：明白了，谢谢您。"}, "lq18": {"q": "志愿者参加者接下来首先做什么？", "o": ["把食品装进袋子", "把纸箱放在桌子下面", "把食品摆到桌子上", "确认学生拿走的食品数量"], "s": "大学里，一位职员在讲话。\n感谢大家参加向学生发放食品的志愿活动。我们在这间教室准备并发放。之前是把食品统一装袋后交给学生，现在改为确定每人的数量，由学生自由挑选带回。装着食品的纸箱已经放在各张桌子下面了，为了方便拿取，请把箱子里的东西放到桌子上。发放时，如果有学生没带袋子来，请告诉他们没有准备袋子；如果有学生拿多了，请告诉他们数量有限。那么就拜托大家了。"}, "lq19": {"q": "女留学生给男留学生提了什么新的建议？", "o": ["面试时尽量保持开朗的表情", "面试前做笔记", "面试一开始先打招呼", "和日本朋友练习"], "s": "大学里，一位男留学生和一位女留学生在谈话。\n男：乔安娜，前几天你帮我出主意应对求职面试，可是面试还是没成功。\n女：诶，怎么了？\n男：一开始还不错，但中途开始在意面试官的表情，就紧张得说不出话了。有没有别的对策可以告诉我？乔安娜你已经通过几家公司的考试了。\n女：我在心理学的书上读到，有意识地改变表情，心情也会随之改变。所以，哪怕勉强也试着笑着说话怎么样？\n男：这样啊。\n女：受表情带动，心情也会变开朗，紧张也许就缓解了。而且面试官对着笑脸的学生也不好板着脸吧。啊，你去面试前做了想说内容的笔记吗？\n男：做了，“做笔记”那个建议很有用。还有一开始好好打招呼，这个也做到了。\n女：对！啊，事先和日本朋友的练习要像以前一样继续做，在这基础上才行哦。\n男：嗯，这个我明白，谢谢。"}, "lq20": {"q": "科长说男的哪里做得不好？", "o": ["订货晚了", "把数量弄错了委托给工厂", "出了问题时没有向科长汇报", "找京都分店的小林部长商量了"], "s": "公司里，科长和一位男的在谈话。\n女：木下，办公室绿公司的冈田先生来电话了，说椅子的交货是卡着时间到的？\n男：啊，科长。对不起，是我把数量弄错了委托给工厂。所以联系了经营同样商品的京都分店，总算赶上了。\n女：这样啊。失误谁都会有，但我没听说，所以和冈田先生说话对不上，对上司一句也没有汇报，这就不太好了吧。\n男：真的很抱歉。我着急想办法解决，就慌了。\n女：是啊。京都分店的小林部长那边沟通好了吗？\n男：是的，已经商量过了，也打电话道了谢。从京都分店借的那部分，下周做好，会让工厂寄过去。\n女：好，那看来没问题了。下次要小心。\n男：好的，对不起。"}, "lq21": {"q": "他说夏天炎热时吃饭重要的是什么？", "o": ["饿了再吃", "在固定时间吃三餐", "吃方便又凉的东西", "吃容易下咽的东西"], "s": "电视里，医生在讲话。\n每天都这么热，食欲也会衰退呢。如果等饿了才吃，身体就抓不到接受食物的节奏，所以每天要在固定的时间吃早中晚三餐。我认为这是度过炎热夏天保持健康的重要一点。天热时，人往往喜欢吃方便、冰凉的东西或容易下咽的东西，但如果光吃这些，肠胃的功能会变弱哦。"}, "lq22": {"q": "讲师说关于防灾用品最重要的是什么？", "o": ["关注防灾用品", "买齐防灾用品", "试着使用防灾用品", "定期检查防灾用品"], "s": "防灾教室里，讲师在讲话。\n我认为人们的防灾意识逐年提高。应急食品、简易厕所等防灾用品，似乎也有越来越多的人关注。这是很好的事，但很多人认为买齐防灾用品就是防灾，而想到在日常生活中实际用用看的人出乎意料地少。可是，防灾最重要的其实就是这一点。大家虽然想到了定期检查防灾用品，但希望大家别忘了：灾害发生时能确实用上，才有意义。"}, "lq23": {"q": "关于海岸垃圾，男的想传达的是什么？", "o": ["很多是本地产生的", "数量逐年增加", "志愿者在打扫", "按种类分拣的工作很辛苦"], "s": "市民讲座上，志愿者团体的一位男的在讲话。\n我从十年前起，在故乡南岛做海岸清扫志愿活动。海岸上有各种各样的垃圾，比如塑料瓶、塑料袋等。我一直以为这些垃圾是从岛外漂来，被冲到这里的，但其实大部分是从岛上的河流入海的。丢在路边的东西，或被风吹走的东西掉进河里，然后流进海。很多来自本地，这让我很震惊，也希望大家知道。"}, "lq24": {"q": "专家想传达的是什么？", "o": ["减少暴力游戏的举措", "游戏也有好的一面", "玩游戏的孩子所面临的问题", "孩子沉迷游戏的原因"], "s": "研讨会上，专家在讲话。\n电脑游戏已经完全成了孩子生活的一部分，但也有暴力内容的，作为家长很担心吧。确实，对这类游戏的批评在报纸、电视等媒体上也被提到，也有人呼吁采取对策，但也有研究结果显示，暴力场面和孩子的攻击性并不一定有关联。长时间一个人光玩游戏是有问题，但游戏也有与朋友交换信息、互相教玩法等，被认为有培养人际关系和沟通能力的一面。"}, "lq25": {"q": "厨师在谈论什么？", "o": ["注册上门服务的契机", "上门服务做的菜与店里菜的区别", "在上门服务中获得指名的方法", "在上门服务工作的魅力"], "s": "广播里，厨师在讲话。\n我一边在餐厅工作，一边也注册了上门做菜服务。接受个人客人的指名，在客人家的厨房里按他们的要求做菜。与在店里相比，和客人的距离更近，总是被客人看着，会紧张，但很刺激，也很快乐。因为能直接知道客人的反应，比只在餐厅工作时更有成就感。今后也想做一名能被指名的厨师。"}, "lq26": {"q": "专家对人工智能怎么看？", "o": ["应该积极利用其优点", "有抢走人类工作的危险", "用得太多会使人的能力下降", "应该加快开发速度"], "s": "演讲会上，男播音员和一位女专家在谈话。\n男：人工智能不断发展，被认为会对社会产生很大影响，老师您怎么看？\n女：商店的收银、酒店前台、体育比赛的裁判等，已经有一些由使用人工智能的机器在做了。今后代替人来做的工作会越来越多。另一方面，也听到“会抢走人的工作”“会使人的能力下降”这样的担忧，但我不作否定的看法，而是期待它的另一面。\n男：您的意思是？\n女：比如，将棋职业棋手中，有人通过与使用人工智能的电脑对战锻炼了棋艺，表现十分突出。不只是将棋，提高外语能力的程序等今后也会不断开发出来。想提升能力的人，我认为没有理由不用这些。"}, "lq27": {"q": "昨天休息，我懒洋洋地过了一整天。", "o": ["一整天过得很充实啊", "难得休息，却很忙啊", "偶尔什么都不做也不错吧"], "s": ""}, "lq28": {"q": "这套套餐，是不是有点不够吃？", "o": ["要不要追加点什么？", "你是说满足了？", "量太大，吃不完呢。"], "s": ""}, "lq29": {"q": "刚才那部电影，你不觉得最后的音乐把一切都毁了吗？", "o": ["多亏了音乐，才能把电影看到最后呢。", "结尾配那样的音乐，有点那个啊。", "只有最后的音乐不错呢。"], "s": ""}, "lq30": {"q": "我们队怎么可能夺冠啊。", "o": ["你觉得我们应该会赢吗？", "没想到能夺冠呢。", "别这么说，加油吧！"], "s": ""}, "lq31": {"q": "他们决定怎么解决这个问题？", "o": ["用洗涤剂洗掉脏的地方", "加装饰遮住污渍", "改用蓝色礼服", "借男生母亲的礼服"], "s": "高中里，戏剧社的两名学生和老师在谈话。\n男生：那个，老师，后天演出的服装，主角山田同学的服装弄脏了。\n女生：对不起，刚才沾上了油漆，就在这里胸口附近，只有一点点。\n老师：棕色的油漆吗？因为是白色礼服，所以很显眼。这件服装是主角一直穿到最后的吧。\n女生：是的。能用洗涤剂洗掉吗？或者缝上大一点的花之类的装饰，把污渍遮住怎么样？\n老师：嗯，是啊。\n男生：放弃这件服装，改用去年戏里用的蓝色礼服怎么样？\n老师：戏里有几处谈到服装白色的台词吧？现在改台词还是不要比较好。\n男生：那我妈妈参加合唱团，我想她有白色礼服，要不要问问？\n女生：你妈妈的礼服应该很宝贵吧？万一弄脏了，会很过意不去。\n老师：是啊。还是缝点什么上去，让油漆看不见比较好吧。洗的话，万一布料坏了就麻烦了。\n女生：明白了，就这么办。"}, "lq32": {"q": "女的接下来首先必须做什么？", "o": ["确认到账", "发送商品", "准备新商品的样品", "联系青空公司"], "s": "电话里，一位女的和科长在谈话。\n女：您好，这里是山川工业。\n男：喂，我是田中。我现在在出差地。刚才青空公司的远藤先生打我手机联系了。\n女：好的。\n男：是关于昨天傍晚青空公司下单的商品，他说刚把货款汇到我们账户了，一确认到账，就马上发货好吗？好像很急，希望尽快寄出。\n女：明白了。我也一起寄上新商品的样品。\n男：那个以前已经寄过了。啊，发货完成后，也跟青空公司的远藤先生说一声。拜托了。\n女：好的。"}, "lq33": {"q": "女学生接下来要怎么做？", "o": ["改变故事的发展", "改变插画线条的粗细", "重画主角的外观", "减少稿子的页数"], "s": "漫画社里，一位女学生和一位男学生在谈话。\n女：山田，我要投稿给下下个月比赛的漫画草稿，你看了吗？\n男：嗯，故事发展构思得很好，真不愧是你。尤其是最后，是很好的那种出乎读者预料的发展。\n女：那里挺费劲的。那个，这次我整体上把线画得粗了一些，怎么样？\n男：嗯，有力量，和故事的世界观很搭。线条的强弱也用得很有效，在比赛中应该会被好评吧。\n女：嗯。\n男：不过，读之前一眼看到画的时候，我觉得主角的冲击力有点弱。发型和穿戴的东西，能不能再有点个性？\n女：嗯，我试试。\n男：啊，对了，稿子的页数确认过了吗？好像有限制吧。超出了会扣分，多了的话最好减一减。\n女：页数在规定范围内。\n男：是吗？那距离比赛还有一段时间，再加把劲吧。"}, "lq34": {"q": "男学生接下来要怎么修改资料？", "o": ["改成简单的话", "举出实用化的例子", "把图弄得更易懂", "增加向孩子们提的问题"], "s": "大学里，一位女老师和一位男学生在谈话。\n女：你发来的资料我看了。\n男：啊，谢谢老师。\n女：这是在小学交流会上发的，对吧？\n男：是的。是向孩子们讲自己的研究时发的。\n女：嗯，做得相当不错，也没用难词。\n男：是的，我尽量用了简单的话。\n女：嗯，不过内容比较抽象，孩子可能不明白在说什么吧？如果解释一下“这项研究被用在我们身边的这些地方”“对这样的事也有用”，不是更好吗？\n男：啊，原来如此。好的，我明白了。\n女：另外，这张图也很容易懂，没问题。希望孩子们能提出很多问题。\n男：谢谢老师，我马上改。"}, "lq35": {"q": "儿子隆的帽子是怎么回来的？", "o": ["捡到的人送到了百货商店", "捡到的人寄到了学校", "捡到的人寄到了家里", "捡到的人送到了派出所"], "s": "家里，妻子和丈夫在谈话。\n女：前几天隆去百货商店的时候，说把小学制服的帽子弄丢了，对吧。\n男：嗯，问了百货商店的服务台，没找到。\n女：我本来已经放弃了，可是世上有好心人。你看，帽子里面写着学校名和名字。\n男：诶？捡到的人特地送到学校来了？\n女：不是，是邮寄来的。\n男：哦。我也捡过东西送到派出所，但没做到这种地步。得好好谢谢人家才行。\n女：可是没写寄件人。只有一张“在百货商店附近捡到的”的便条。\n男：这样啊。也许是为了让我们不用在意道谢的事吧。"}, "lq36": {"q": "男的为什么不能延长借阅期限？", "o": ["已经过了归还日期", "借阅期内的延长已经是第二次", "因为有其他用户预约了", "因为是从其他图书馆调来的书"], "s": "电话里，图书馆的工作人员和一位男的在谈话。\n女：您好，这里是北山图书馆。\n男：喂，请问我现在借的书能延长归还期限吗？\n女：可以。如果没过归还日，借阅期间内可以延长一次，在图书馆柜台或网上都能办。不过，被其他人预约的书，或从其他图书馆调来的书，不能延长。\n男：是吗。\n女：您手边有图书馆的卡吗？如果知道右上角条形码下面的用户编号，我可以查一下能否延长。\n男：好的，麻烦了。编号是255127，书名是《相扑的历史》。\n女：啊，目前没有人预约，但借阅期限到昨天为止了。需要先归还一次……\n男：诶？对不起，我疏忽了。今天之内还。"}, "lq37": {"q": "根据调查，回答“为了什么而学习才艺”最多的是什么？", "o": ["为了提高技术", "为了换换心情", "为了挑战新事物", "为了增加熟人"], "s": "广播里，播音员在谈论成年人学才艺。\n现在以成年人为对象的才艺班很受欢迎，从外语到乐器、舞蹈，去各种学校学习的成年人在增加。今天早上的报纸刊登了“学才艺的目的是什么”的调查结果。我凭自己的经验以为最多的是掌握技术，但“为了换换心情”超过了“技术”，位居第一。排在这两项之后的是“挑战新事物”，“为了增加熟人”也很多，可以看出想拓宽自己世界的心情。"}, "lq38": {"q": "女学生为什么说不在二手店买东西？", "o": ["因为没有现在流行的东西", "因为商品质量不太好", "因为不想穿别人穿过的东西", "因为连不需要的东西也会买"], "s": "一位女学生和一位男学生在谈话。\n女：早。啊，那件夹克不错啊。\n男：加藤，早。这是在二手店发现的，一千日元，便宜吧。\n女：哦，和现在的流行不一样，但很有个性，不错。\n男：嗯，发现它的时候，我心想“太棒了”。加藤你好像也喜欢旧衣服，那家店东西很齐，质量也不像是二手的，下次去看看吧？\n女：嗯，我不去二手店。\n男：啊，果然是介意穿不认识的人穿过的东西吗？\n女：那倒不是。去了就会因为便宜而连多余的东西也买，然后后悔。以前有过好多次。二手店里有各种现在虽然不流行、但今天穿也很时髦的东西，看到那些，就忍不住想买。\n男：我好像能理解。"}, "lq39": {"q": "关于在职场播放音乐，男的有什么意见？", "o": ["能专心工作，所以赞成", "不能专心工作，所以反对", "可期待放松效果，所以赞成", "有些曲子反而不能放松，所以反对"], "s": "公司里，一位女的和一位男的在谈话。\n女：木村，我听部长说，现在作为改善职场环境的措施之一，正在考虑在上班时间在办公室里播放音乐。\n男：啊，在职场播放音乐能提高专注力、让人放松、工作效率也会提高，最近很受关注呢。\n女：我是想事情时有音乐就没法专心的类型，所以觉得在职场放有点不妥。而且有的曲子反而让人没法放松吧。\n男：不知道会放什么曲子。有没有放松效果我不清楚，不过我这个人太安静了反而会分心，所以能专心，我个人非常欢迎。\n女：是吗。那木村你的工作效率会大大提高了。\n男：喂，别抱这种期待。"}, "lq40": {"q": "女的在谈论什么？", "o": ["细嚼慢咽的重要性", "补充不足营养的重要性", "让即食食品更好吃的办法", "让饭菜更容易吃的办法"], "s": "地区讲座上，一位女的在讲话。\n在日本，最近几十年里，即食食品等已烹调食品不断普及。这类食品大多方便，但因为做得容易吃，人容易不好好咀嚼就咽下去，不少医生指出这对现代人的健康有很大的负面影响。常说“一口嚼30下”，已经明确，如果这样做，对保持身心健康有各种效果。"}, "lq41": {"q": "今天课的主题是什么？", "o": ["压力的危险性", "孩子感到不安的原因", "缓解紧张的新药的开发", "深信不疑对身体的影响"], "s": "心理学课上，老师在讲话。\n我小时候对压力很敏感，一感到不安就常常肚子痛。有一次，妈妈从医院拿回来一种说是能治肚子痛的药粉，从那以后，每当因不安而肚子痛，把这药放进果汁里喝，腹痛就止住了。可是上了初中的某一天，妈妈说：“那其实只是糖粉。没想到那么管用。”药本身没有作用，但喝下去产生的心情变化实际改变了身体的反应，成了很有效的药。今天的课就以这一点为主题，更详细地看一看。"}, "lq42": {"q": "这次家计调查的结果，支出与上次调查相比怎么样了？", "o": ["娱乐费和伙食费都增加了", "娱乐费和伙食费都减少了", "娱乐费增加，伙食费减少", "娱乐费减少，伙食费增加"], "s": "广播里，播音员在谈论家计调查的结果。\n前几天，政府公布了调查家庭收入和支出等的家计调查结果。看支出中娱乐费用和伙食费用这两项，娱乐费在所有项目里增长最为显著，这被认为是景气回升的影响。另外，伙食费自去年度的调查以来一直下滑，这次外食费用大幅增长，总体上已回到下滑之前的水平。"}, "lq43": {"q": "市长对垃圾处理场的建设是怎么说的？", "o": ["按以往计划建设", "需要重新审视计划，但要建设", "因为费用庞大，不建设", "因为居民反对，不建设"], "s": "市里的集会上，市长在讲话。\n我来谈谈垃圾处理场建设今后的方针。上个月的选举中，我击败了反对建设处理场的前任市长，我认为这说明市民各位在处理场建设问题上支持了我们。不过，围绕建设，由于候选地靠近住宅区，部分居民担心环境恶化，发出了强烈的反对声音，因此我们做出了重新审视候选地的判断。随之，工程日程会有延迟，但这是需要巨额建设费的重要事业，所以我想慎重推进。"}, "lq44": {"q": "外面好像很吵啊，怎么了？", "o": ["大概是吧。", "是不是发生什么事了？", "你怎么知道的？"], "s": ""}, "lq45": {"q": "这个柜子的抽屉，我明明锁上了的。", "o": ["啊，那样更好。", "那个有点做不到。", "诶？开着吗？"], "s": ""}, "lq46": {"q": "很突然，后天的出差你能代替小野去吗？", "o": ["小野他怎么了吗？", "和小野一起去就行吧？", "小野要和谁换？"], "s": ""}, "lq47": {"q": "听说森先生找工作不想用父母的关系。嗯，也不是不能理解。", "o": ["你稍微理解一下他啊。", "森先生有什么不明白的？", "嗯，那种心情我多少能理解。"], "s": ""}, "lq48": {"q": "啊，明天的牙医预约时间，应该记在记事本上的。", "o": ["看看记事本，确认一下几点？", "你不记得时间了吗？", "要写的话，我有笔。"], "s": ""}, "lq49": {"q": "已经到碰头会的时间了，但社长不来，也没法开始呢。", "o": ["已经要开会了吗？", "啊，是社长让开始的吧。", "嗯，只能等了呢。"], "s": ""}, "lq50": {"q": "女学生接下来首先必须做什么？", "o": ["分发职场体验的日程表", "重新设置密码", "写报告", "制作新的座位表"], "s": "公司里，一位女学生和一位男的在谈话。\n女：我是从今天起一个月来这里做职场体验、承蒙关照的原田，请多关照。\n男：请多关照。那么马上开始吧，这是原田你一个月的工作日程表，兼作打招呼，请发给大家。\n女：好的，明白了。\n男：发完之后，想请你设置一下原田用的电脑，密码在入职培训时已经听过了吧？\n女：是的，已经告诉我了。\n男：先用那个密码登录一次，然后重新设置密码。不这样的话，电脑上什么工作都做不了。\n女：好的。那个，每天都要写当天做了什么工作的报告吧？\n男：嗯，不用太长也可以。还有，这个房间的座位表，加上原田的名字，现在正在重做，明天交给你。\n女：好的，明白了。"}, "lq51": {"q": "蛋糕店的店长在拍摄日之前必须做什么？", "o": ["向店里的员工取得拍摄许可", "呼吁顾客在拍摄日来店", "想一句介绍蛋糕的话", "推出新的应季蛋糕"], "s": "电话里，电视台的人和蛋糕店店长在谈话。\n男：我是向日葵电视台的铃木。关于节目采访的事，离拍摄还有一周，所以打电话来。\n女：啊，您好，承蒙关照。\n男：嗯，如前几天碰头时所说，当天要拍蛋糕的制作现场、店里摆放的蛋糕，还有从外面拍整个店。店里的员工也会入镜，可以吗？\n女：啊，可以。已经取得了他们的同意。\n男：当天最好也有一定数量的客人，所以请通知一下常来的客人。\n女：啊，明白了。\n男：还有，要请您对推荐的蛋糕用一句话介绍一下。\n女：好的，已经准备好了。正好刚推出了应季蛋糕。\n男：是吗。那当天就拜托了。"}, "lq52": {"q": "女学生接下来首先做什么？", "o": ["减少问卷的问题数", "计时问卷的回答时间", "改变问卷的回答形式", "增加问卷的回答者人数"], "s": "大学里，一位女学生和老师在谈话。\n女：老师，我做好了报告用的问卷，能请您看一下吗？\n男：嗯，问题数有点多。回答这个大概要几分钟，你计过时间吗？\n女：没有。\n男：诶？如果时间太长，有时别人就不会认真回答，所以你先自己做一遍。本来最好让别人做，但日程已经紧了。\n女：啊，好的。\n男：根据花的时间，也要考虑改变回答形式，比如全部做成选择题。回答者大概有多少人？\n女：拜托了20人左右，是不是少？\n男：嗯，如果大家都认真回答就够了，不过如果有不能用于分析的，再增加就行。\n女：好的。"}, "lq53": {"q": "女的带便当来的理由是什么？", "o": ["因为顺便做孩子的便当", "因为想吃营养均衡的饭", "因为想有效利用午休时间", "因为想节省伙食费"], "s": "公司里，一位男的和一位女的在谈话。\n男：井上，你最近中午不去外面吃了呢。\n女：嗯，因为我做了便当带来。\n男：可是你以前不是说做便当很麻烦吗？\n女：嗯，那说的是孩子的便当。以前给孩子做便当时，要考虑营养均衡，而且想多放些他爱吃的东西，所以很费事，但只做自己的话……\n男：啊，原来如此。\n女：你看，午休去外面吃，很花时间吧。去店里、排队等。休息只有一个小时，我想做点运动、学习，有意义地利用时间。\n男：原来如此。我也想带便当来了，还能省伙食费。"}, "lq54": {"q": "这个动物园为什么最近客人增加了？", "o": ["因为能见到珍稀动物了", "因为能直接给动物喂食了", "因为能近距离看到动物走路的样子了", "因为能看到动物夜间的行为了"], "s": "电视里，记者在谈论某个动物园。\n女：今天我来到了现在备受关注的南动物园。这个动物园20年前开业，作为能见到珍稀动物的动物园，当时有很多人来。但是最近的新动物园还可以直接喂动物、体验喂食等，所以来客减少了。于是开始了能在眼前看到大象和企鹅在园内行走的活动，大受欢迎，来园人数大幅增长。据说现在为了让大家也能看到动物夜间的行为，正在考虑仅限周末的夜间营业。"}, "lq55": {"q": "播音员讲话的主题是什么？", "o": ["图书馆数量的变化", "使用图书馆的礼仪", "增加图书馆使用者的尝试", "图书馆使用者年龄层的变化"], "s": "电视里，播音员在讲话。\n女：据说读书的人少了，但实际上图书馆的使用者数量呈增加趋势。图书馆方面也在做各种以前没有过的尝试。比如，有的图书馆设了可以边喝茶边读书的空间，和使用者之间可以聊天的房间。这次采访中，还听到年轻人说，在图书馆和高龄使用者熟了之后，听他们讲各种事成了乐趣，所以常去，可见取得了一定效果。以前图书馆给人的印象是安静读书的地方，现在似乎在改变。"}, "lq56": {"q": "町长对设施的建设是怎么说的？", "o": ["居民强烈反对，不应建设", "虽然居民强烈反对，但应该建设", "居民反对少，但没有必要建设", "居民反对也少，应该建设"], "s": "町议会上，町长在讲话。\n男：计划明年建设的町综合文化设施，里面预定设有托儿所和图书馆等，这个设施建成后，毫无疑问会使町民的生活更方便。因为建设费高，町民之间也有很多反对意见。但是，从孩子到老人大家都能使用的这种设施，周边地区也没有，是独一无二的。也有意见说预定建设地离车站远、不方便，关于这点，包括从车站开巴士的可能性等，今后会研究。"}, "lq57": {"q": "播音员在谈论什么？", "o": ["关于明年景气的展望", "景气回升的契机", "企业为提高销售额所做的努力", "全年消费行为的趋势"], "s": "（原文开头缺失，从中间开始）\n据旅行社称，这次年末年初的旅行地，比起海外，国内旅游团更受欢迎，其中便宜又轻松参加的当日往返团尤其集中。据大型百货商店的调查，岁末礼品的销售战中，和去年一样，3000日元左右的东西卖得最好。可见消费者有抑制奢侈消费的倾向，因此认为要切实感受到景气回升，还需要时间。"}, "lq58": {"q": "那个，学长，这是毕业论文的概要。如果能给点意见就太感谢了。", "o": ["我现在有点忙，明天可以吗？", "你能读，帮大忙了。", "你收到了很多意见啊。"], "s": ""}, "lq59": {"q": "小林先生，前几天的复印机目录，您看过了吗？", "o": ["目录，什么时候给您看比较好？", "不，这几天忙得不可开交。", "您已经看过了啊。"], "s": ""}, "lq60": {"q": "台风要来了，明天的户外活动不得不取消了。", "o": ["按计划，加油办吧。", "这次也没办法呢。", "没有取消，松了口气。"], "s": ""}, "lq61": {"q": "吉田，你不觉得今天科长心情特别好吗？", "o": ["是不是碰到什么不愉快的事了？", "是不是有什么好事啊？", "心情能好转就好了。"], "s": ""}, "lq62": {"q": "我看了石田导演最新拍的电影，不怎么样。", "o": ["是迄今为止最好的啊。", "诶，我还打算去看呢。", "要是那么有意思，我去看看。"], "s": ""}, "lq63": {"q": "新来的加藤，明明是第一次做销售，业绩却提上来了呢。", "o": ["如果做过销售，那不是理所当然吗？", "没有经验，却做出了成绩呢。", "成绩下滑成那样，糟了呢。"], "s": ""}, "lq64": {"q": "部长说公司活动做什么好？", "o": ["烧烤", "保龄球", "捡垃圾活动", "在餐厅聚餐"], "s": "公司里，部长和一位女职员在谈论公司活动。\n男：岛田，每年8月办的公司活动的策划，我拜托你了吧。怎么样了？\n女：是的，因为一直是在餐厅聚餐，所以您说想要些新点子。\n男：嗯，忘掉工作、加深员工之间交流这个本来的目的不变。预算和往常一样，每人3000日元以内。\n女：好的。首先是烧烤的方案。可以在开车一小时的朝日公园办。材料费看来也能控制在预算内，大家在大自然中一起吃很开放，我想交流也会很热烈。\n男：开车一小时啊。\n女：是的。接下来是活动身体的活动。公司附近有保龄球馆吧？有面向团体、配套附近店里用餐的套餐。把保龄球做成分组对抗，和平时不说话的人的交流也会加深，凝聚力也会增强。不过会超预算。\n男：这样啊。\n女：还有，作为公司内活动，也有公司参加地区清扫活动。公司附近的公园也有捡垃圾活动。这与其说是员工之间，不如说是员工与当地居民的交流。\n男：原来如此。这也很新颖。\n女：另外就是平常的聚餐，如果换一家店，感觉会和以往不同。也有预算内能吃到美味料理的店。\n男：每个都不错。不过，还是下决心改变一下做的事吧。而且最好是预算内能做、又符合本来目的的。"}, "lq65": {"q": "男的说想把哪种票送给父亲？", "o": ["闪闪票", "笑眯眯票", "期待票", "怦怦票"], "s": "广播里，在介绍棒球观赛票。\n今天通知的是能让大家在暑假更尽兴享受职业棒球的优惠票。明星球场销售4种能更好享受观赛的特别票。第一种“闪闪票”，是比赛前能和人气选手一起拍纪念照的票，作为观赛的回忆怎么样？第二种“笑眯眯票”附带便当和加油用品，用品里有人气选手签名的球哦。第三种是能在俯瞰球场的餐厅窗边悠闲观赛的“期待票”，和家人朋友一起边用餐边加油怎么样？第四种“怦怦票”是能在靠近球场的前排特别席观赛的票，同样附带便当和饮料。\n男：我爸特别喜欢棒球。我正在找他的生日礼物，刚好合适。\n女：作为礼物，能一起拍照的怎么样？是很好的纪念。\n男：我爸不喜欢被拍照。选手签名球他应该更高兴，我就选那个。山田你们家常去看吧？大家一边吃饭一边看也很开心吧？\n女：嗯。我们说下个月去，但我想看得更近一点。我选能近距离看选手比赛的。\n男：球之类的说不定会飞过来呢。\n女：那就好了。"}, "lq66": {"q": "女的决定预订哪里？", "o": ["第一家旅馆（步行5分钟・13,000日元・有温泉）", "绿色酒店（乘巴士10分钟・9,000日元・有温泉）", "朝日旅馆（乘巴士10分钟・10,000日元）", "最后一家旅馆（步行5分钟・8,000日元・无温泉）"], "s": "（自动语音转写，已按内容整理）\n一位女的和店员在谈话。\n女：下个月12日、13日我要去市里，想预订住的地方。因为在大学有会议，最好靠近会场。\n店员：下个月12、13日，在大学附近对吧。\n女：如果有一万日元左右的就好了。\n店员：请稍等。符合您要求的有四家。第一家到花馆大学步行大约5分钟，一位13,000日元，有温泉。\n女：啊，市里的温泉很有名呢。难得来，有温泉的地方更好。\n店员：第二家是绿色酒店，到大学乘巴士约10分钟，但门口就有巴士站。这家也有温泉，9,000日元。\n女：到大学要坐巴士啊。\n店员：第三家是朝日旅馆，到大学同样乘巴士约10分钟，含早餐10,000日元。\n女：是吗。\n店员：最后一家是森山，到大学步行5分钟，8,000日元。\n女：还是有温泉的好啊……到大学乘巴士10分钟左右的话也行。而且越便宜越好，请帮我订这家。"}, "lq67": {"q": "这个社团首先决定做什么？", "o": ["改变练习的地方", "与其他社团联合练习", "策划音乐会", "挑战难的曲子"], "s": "（自动语音转写，已按内容整理）\n地区合唱社团的领导在与成员谈话。\n领导：最近有一些成员投诉，说很多人练习不太认真。\n成员：也许是做的人多了，新鲜感没了吧。而且常常唱的都是很熟的歌。\n领导：是啊。\n成员：要不要偶尔换换场地？比如大一点的礼堂，使用费会涨，但据说音响效果也好。\n领导：是啊，会有站在舞台上的感觉。现在用的市民中心已预订到三个月后，不过可以偶尔换。\n成员：嗯。也可以策划和其他合唱社团联合练习，也许会更投入。\n领导：原来如此。不过找愿意一起练的社团挺难的。\n成员：那个，设个目标之类的怎么样？比如创造让大家听我们唱歌的机会。\n领导：是啊。\n成员：或者，只是挑战一首稍难的曲子，也会激起干劲。开音乐会的话成员的干劲会上来，但准备很辛苦。那么，从下次练习起就能引入的是挑战难曲。\n领导：是啊。音乐会先跟大家商量一下吧。就算换练习场地，也是稍后的事了，所以先从马上能开始的做起吧。"}, "lq68": {"q": "男的说想参加哪个小组的志愿活动？", "o": ["第1组（花坛养护）", "第2组（树木养护・制作树木名牌）", "第3组（园内清扫）", "第4组（协助自然体验教室）"], "s": "（自动语音转写，已按内容整理）\n在公园里，一位男的在讲话。\n公园招募志愿者，大家要做各种工作，以建设漂亮、舒适的公园。根据工作内容分为四个小组。第1组负责花坛养护，主要是播种和除草。第2组负责树木养护，要制作写树名的牌子等；对有经验的人，还打算请他们做修剪树枝的工作。第3组主要工作是捡园内垃圾、扫地等清扫。第4组是协助在公园举办的自然体验教室，作为面向小学生的自然观察会和小手工的工作人员参加。各组的活动日和时间等详情请看主页。\n\n男女两人谈话：\n女：那个公园这么漂亮，多亏了志愿者们呢。我们也去做做看吧？\n男：好啊。\n女：我喜欢孩子，想参加体验教室，不过我不擅长手工。正夫你手巧，手工也拿手吧？\n男：自己做喜欢，不过面对别人有点……比起这个，我在电视上看了园艺师的纪录片，觉得很有意思。也能记住树名，那个组不错。\n女：我想以花坛的形式参与。\n男：就那个吧，不错啊。你不擅长打扫吧。\n女：真过分。"}, "lq69": {"q": "女的说想参加哪个小组的志愿活动？", "o": ["第1组（花坛养护）", "第2组（树木养护・制作树木名牌）", "第3组（园内清扫）", "第4组（协助自然体验教室）"], "s": "（与上一题同一段录音，翻译见上。）\n要点：女的先说喜欢孩子、想参加体验教室，但不擅长手工；最后说“想以花坛的形式参与”，所以选第1组（花坛养护）。"}, "lq70": {"q": "男的会成为哪种会员？", "o": ["幸运会员", "银会员", "蓝会员", "夜场会员"], "s": "（自动语音转写，已按内容整理）\n问题5先听较长的话，可以做笔记。第1题、第2题题目纸上没有印刷，请先听话，然后听问题和选项，从1到4中选最合适的一个。\n第1题，体育俱乐部。男的和前台在谈话。\n男：那个，我想……包括周六周日在内，每周在泳池游几次泳。\n前台：您是用泳池对吧。除了泳池，还希望使用健身房吗？\n男：嗯，如果在预算内的话想用，不过每月会费想控制在一万日元以内。\n前台：有四种。首先“幸运会员”，不只是泳池，健身房也可以在星期几都随时使用。然后“银会员”，所有设施每天全天都能使用，月会费是一万五千日元，但有专业指导员，是很受欢迎的方案。\n男：嗯，是吗。\n前台：只希望用泳池的客人，有“蓝会员”。不论星期几都可以随便用，会费八千日元。如果想用健身房，每次一千日元，所以如果每月用两次以下，比成为会员更划算。下班后使用的客人，推荐“夜场会员”，工作日（周末和节假日除外）晚上八点以后可用泳池，七千日元。\n男：啊，健身房也就是心血来潮时一个月用一次或不用，那就拜托你了。"}, "lq71": {"q": "为了活用屋顶，决定怎么做？", "o": ["建一个氛围明亮的庭院", "建儿童游乐场", "开咖啡馆", "举办面向家庭的活动"], "s": "（自动语音转写，已按内容整理）\n百货商店的会议上，上司和两位职员在谈话。\n上司：今天想听听大家关于屋顶使用方法的意见。现在是放了桌椅作为休息处开放，但使用者很少。如果有好的利用方式就好了。\n职员A：是啊，上班族和高龄顾客的比例比较高，为了让这样的客人能悠闲休息，建一个明亮的庭院怎么样？\n上司：明亮的庭院啊。\n职员B：我觉得建儿童游乐场好。放上各种游乐设施。我们店带孩子的亲子客人比例较少，如果以此吸引他们来，会带动销售额。\n职员A：我想珍惜现在来的顾客，开咖啡馆怎么样？在蓝天下喝咖啡别有风味。\n上司：原来如此。\n职员C：我觉得还是用能吸引带孩子的客人的利用方式更好吧。（别家）周末举办动画活动，我们也办适合全家一起享受的活动怎么样？\n上司：都是好主意。\n职员A：不过，定期策划、实施活动，对员工的负担太大了。另外，12层的餐厅街里有以露台景观为卖点的店，做同样的事也……\n结论：采用能期待吸引带孩子客人的方案——建儿童游乐场。（录音的结尾部分转写不全，答案以此推断。）"}};})();

;(function(){window.DATA=window.DATA||{};DATA.rdpzh={"p16c": "【留学生的作文】25点　罗贝兹·埃德加\n前几天，日本足球代表队在海外比赛，比赛在深夜通过电视直播。直播开始前，我想确认几点开播，就上网查了一下，结果大吃一惊。某个网站上写着“周五25点播出”。一天不是只有24小时吗？（50）\n向熟人打听后，才知道“周五25点”指的是周六凌晨1点。据说像“25点”这样的说法，在店铺的营业时间告示上也能看到。为什么要把凌晨1点说成“25点”呢？\n（51）最先使用这种说法的是电视台，这种说法比较有力。日本多数电视台在早上4点前后开始一天的播出，把此后的24小时算作一天。也就是说，对电视台来说，夜里0点不是一天的结束。22点、23点之后，下一个不是0点而是24点，凌晨1点就是25点。就这样，“25点”这种说法（52）。\n现代日本社会夜型化加剧，过了凌晨0点仍在活动的人很多。所以，过了凌晨0点，“今天”仍在继续。（53），如果认为“从起床到睡觉都是今天”，那么与其说是第二天凌晨1点，不如说成当天的25点更准确。我也觉得，周六凌晨1点看的节目，感觉像是周五晚上看的，所以当作周五25点似乎更贴近实际感受。生活的夜型化，以及“睡觉之前都是今天”的想法，让只有24小时的一天里有了“25点”。（54）", "p16_59": "信，是一种不可思议的传达手段。\n写信人的心情，几乎必然会出现在文字里。明明没有担心，却写出一副强行表示担心（注1）的信，是不行的。这样的心情在拆开信封（注2）的一瞬间，就会最先传到对方那里。这可以说是信最可怕的地方。\n爱对方的心情也许能传到，但同时那份幼稚、爱的肤浅、甚至性格的恶劣，也会传到对方那里。\n信，也是一种映照人心的镜子般的存在。\n（摘自辻仁成《代笔人》）\n（注1）强行表示担心：这里指让人觉得自己在担心　（注2）封：这里指信封", "p16_ehon": "以下是一篇谈论如何挑选绘本的文章。\n一个非常有效的方法是：看绘本时，用和孩子相同的方式，也就是不读文字，只靠图画来追着故事看。我拿到新书时，也一定会用这种方式看，这样一来，很多事情都能看得很清楚。\n不依赖文字只看图，会让我们的心不得不停留在单纯而具体的思维层面，当然也会增强我们在图画中探寻意义的心理活动。这样看下去，就会非常清楚地分出：有的图画本身就能向我们诉说什么，有的则必须读了文字才有意义，可以说只起装饰作用。不能向人诉说什么的图画，从真正意义上说不能称为绘本，所以这样看下去，就会发现外表是绘本，但①【不能称为绘本的东西】其实不少。（中略）\n另外，仔细只看图画的时候，我觉得比图文合起来看时，更能体会图画的气氛和基调。掌握了这些再去读文字，就能清楚地知道图画和文字的关系是否协调。人物的服装、背景等具体事实在文字和图画中不一致，当然不行；而图画整体的基调和氛围与故事不相称，作为绘本是②【大的缺陷】。\n（摘自松冈享子《绘本的世界，孩子的世界》）", "p16_shiwa": "长时间泡在水里，手指和脚趾上会出现很多“皱纹”。大概没有人没见过这种皱纹。我以前一直以为，这种皱纹只是皮肤吸水膨胀形成的，没有任何作用。但我读到一篇文章，说①不是这样的。据说它起着防滑的作用。\n这篇文章是根据某篇论文的实验结果写的。②【实验】是这样进行的：在一个容器里放入小玻璃珠，用手指捏起来移到另一个容器，测量所需的时间。装玻璃珠的容器准备了有水的和没水的两种。另外，手分为有皱纹和没有皱纹两种状态，分别测量所需时间。皱纹是通过把手浸在温水里产生的。结果如下。\n首先看有水无水的区别：从有水的容器里移，比从没水的容器里移要慢。接着在有水、没水的各个条件下，比较有无皱纹的结果：没水时，有没有皱纹差别不大；但有水时，有皱纹的更快。从以上结果，实验者认为，皱纹可能是为了在水中等潮湿环境里更容易抓住东西而形成的。\n可是，真是这样吗？如果是为了防滑，那么一进水就应该马上出现皱纹，否则不对劲吧？要弄清皱纹的作用，还得等新的实验。", "p16_keiei": "以下是一篇谈论企业经营的文章。\n制定各种规章和惩罚，把员工捆得紧紧的（束缚住），一味让他们干活——这种类型的经营者，虽然现在已经不多，但仍然有。我认为①【那种做法是错的】，是因为即使这样能在物理上把员工的劳动力100%榨出来，却会因此丢掉精神层面的劳动力。\n精神层面的劳动力，比如创意巧思（想出新点子）的能力。用强制（硬逼）的方式让人工作，是无法激发人的创意能力的。人的心在自由的时候才能发挥出本来的能力。快乐地、有兴趣地做某件事时，人会想出各种点子。（中略）\n而且，不管是什么工作，人所做的工作中，创意巧思的才能都起着重要作用，哪怕是一整天只是拧螺丝的工作。怎样才能减少次品，怎样才能提高作业效率。例如，正因为通过QC活动，建立起了让作业人员自己主动去思考②那些问题的体系，日本的制造业才能成为世界第一。\n而要激发这种能力，必须营造出这样的环境：对员工来说，在这里工作是真正对自己有益的。本人的幸福和公司的业绩一致，爱公司的精神自然就会培养起来。即使不强制，员工也会怀着自豪，发自内心地想为公司工作。", "p16_kofuku": "幸福是人生的目标。正因为如此，弄清究竟什么是“幸福”，作为追求幸福的前提，我认为是一个严肃的课题。有一次，一个年轻人一脸认真地问我：“幸福真的存在吗？”\n他说人的欲望（强烈想要的心情）是无限延续的，所以很难达到幸福感。确实也许可以这么说。如果人是不断进步的动物，就更是如此了。\n但是我认为幸福是存在的。以爱好为例，有人说是打棒球，有人说是读书、电影、音乐，各有各的主张；也会有人说是登山、钓鱼。像这样爱好因人而异，同样，对幸福的看法也是因人而异的。\n被问到“幸福是什么样的”，也许有人会回答“变得富裕”；也许有人认为“达到社会地位”就是幸福；反过来，也有人否定那些富裕和社会地位，认为成为“内心丰富的人”才是幸福。人的思想、感情，甚至生活方式都各不相同。对幸福的看法有差别，不也可以吗？（以下略）\n（摘自本田宗一郎《扬帆于所长》）", "p16_ryo": "【留学生宿舍 入住者招募说明】（东丘国际交流协会）\n1. 招募对象：2017年4月在东京都及周边大学本科就读的留学生\n2. 招募的房间\n宿舍名　房间类型　　　　　每月宿舍费（日元）　设施\n樱宿舍　单人间　　　　　　20,000　　　　　　8层楼・每间有浴室\n藤宿舍　单人间　　　　　　28,000　　　　　　6层楼・有停车场・每间有浴室\n藤宿舍　家庭间（最多四人）48,000　　　　　　（同上）\n堇宿舍　单人间　　　　　　15,000*　　　　　3层楼・每间有浴室\n堇宿舍　双人间　　　　　　10,000*　　　　　（同上）\n椿宿舍　单人间　　　　　　8,000　　　　　　3层楼・每间没有浴室\n注意：(1)带*的，宿舍费不含水电燃气费。(2)堇宿舍双人间的宿舍费是每人的金额。\n4. 入住开始日：2017年3月25日起（仅樱宿舍因在建设中，从4月15日起）", "p17c": "【老龄化社会中的运动】\n一位105岁的日本男性，在田径100米项目中创下了世界纪录。这是2015年举行的某项田径世界大赛上的事。\n被称为“大师赛”的（50）。在日本还不太为人所知，这是以“无论多大年纪都享受运动”为目的的赛事，田径、游泳、网球等各种项目的比赛在世界各地举办。田径比赛通常按每5岁分组，与同龄人竞争。因此，即使体力下降、不能像年轻时那样跑，也能公平竞争。也就是说，这位105岁男性创下的世界纪录，是他所参加的那一组里的世界纪录（51）。\n据某项调查，参加大师赛的老年人保持着身心健康。运动给心灵带来活力，“记录”这个目标能减少生活中感到的不安和压力。\n老年人身心都健康的社会，是老龄化社会的一个理想。参加大师赛的老年人越多，就越接近这个理想。（52）大师赛的存在所产生的影响，不仅限于参加者。参加者以外的老年人，看到同龄人朝着目标努力的身影，也一定能获得活动身体的契机和内心的活力。（53）有必要让大师赛广为人知。如果能增加在电视等处看到的机会就好了。\n能够一直身心健康（54）。为了实现那样的社会，期待大师赛今后的发展。", "p17_mail": "【寄到图书馆的邮件】\n村中市立南图书馆负责人：\n我是经常使用自习室的人，有件事想拜托，所以发了这封邮件。\n最近，一边大声说话一边做事的小组越来越多，我没法专心做自己的功课，很困扰。他们似乎是在利用图书馆的资料查东西，所以也没法提醒他们。能否请你们采取一些措施，比如另外设一间小组专用的自习室？\n拜托您考虑一下。\n铃木正子", "p17_hataraku": "说到底，工作就是“得到”吗？\n我们工作的时候，都承担着（拥有）某种社会角色，并被要求做出与这个角色相应的成果。而回应了期待之后得到的，才是报酬和自身的成长。也就是说，我们工作时，在“得到”之前，先要把被要求的东西“给予”出去。工作的本质不是得到，而是把自己被要求的东西给予他人，即“对人有用”。\n（摘自山藤贤《成为社会人》）", "p17_hou": "以下是一篇谈论中小学法律教育的文章。\n要从小学习所有的法律是不可能的，但只要掌握法律式的思维方式（legal mind），自己思考、调查、自己解决问题的能力就会大幅提高。\n一提到法律教育，人们往往会认为是“教法律”，但不用说，法律教育并不只是这样。全班同学一起找出班级的问题，讨论怎样才能解决，以及为了解决问题、为了不再发生，需要什么样的规则，大家以民主的方式制定规则——这本身也正是法律教育的一种形态。\n这样就能亲身体验到法的基本之处：各种规则（法）是民主地制定的，约定（契约）是经当事人合意而缔结的。另外，大量使用报纸、利用时事新闻的法律教育也有效果。修宪、选举问题、消费者问题等，如果只是单纯去教就很无聊，但换成用报纸等讲当下（现在正被热议的）话题，孩子们就容易产生兴趣。能否把它当作自己的事来思考，会让理解速度产生很大差距，而具体的、“现在”正成为问题的事例，在这一点上是很好的教材。\n（摘自二瓶裕史《人生必须知道的法律》）", "p17_image": "每个人都有“我是这样的人”的印象，这叫自我形象。见过某个人的人，会对那个人有一个印象，这叫他人形象。有了持续的人际关系后，对方的形象就会固定下来。如果自我形象和他人对自己的形象之间的背离（相距甚远）很大，人际关系就会出现障碍。自己认为自己沉默寡言，别人却觉得自己爱说话，这里就产生了误解，于是形成了被误解（误解别人）的人际关系。\n觉得“自己是容易被别人误解的人”的人，就是自我形象与他人形象之间有背离。误解为什么会产生呢？因为自己是凭自己的内心来判断自己，而他人是凭这个人的行为来判断的。（中略）\n对别人，只能凭外在能看到的东西来判断；而对自己，则是凭看得见的（行为）和看不见的（内心）两者来判断。所以，觉得自己容易被误解的人，是自己的行为与想法之间有背离，没能把想法原样付诸行动，有时甚至做出与想法相反的行为。\n想法没能变成行动时，不仅会被误解，还会积压压力。压力产生于想法没有传达出去，或者无法发泄（向外释放）的时候。要消除自我形象与他人形象之间的背离，要么采取与自己内心一致的行动，要么努力把行为当作“是因为自己想这样做才这样做的”。\n（摘自东山纮久《烦恼控制术》）", "p17_chizu": "人生总是被比作旅行。\n人在人生这条旅途上，是没有地图地走着的。每个人都是如此，这才是作为人的自然姿态。人生不可能有地图。可是人总是想拥有人生的地图，因为在黑暗中行走实在不安，不愿去想象迷路时的恐惧。\n于是在自己的地图上，作为人生的设计图，写着任性的行程：30岁之前结婚，35岁左右有两个孩子，40岁当上科长，50岁之前怎么也要升到部长。（中略）\n如果能照着人生地图上画的路走下去，那再轻松不过了。如果能一次也不走岔路、笔直地走下去，人就不用烦恼什么了。过这样人生的人，大概世上一个也没有。如果真有这样的人，那也不是那个人自己的人生。②【那样的人生】不过是别人给予的东西。\n“50岁时当上部长”，这是从“今天”这个现在位置出发看到的目标。有目标当然很重要。但是，抵达那个目标的路绝不止一条。站在50岁这个现在位置时，如果没当上部长，该怎么办？\n只有一张地图的人，或者绝不肯改写地图的人，会在那里迷失人生的现在位置。他们会陷入“我现在明明应该在这里，却来到了完全不同的地方”的想法，连该走的路也迷失了。\n如果没有地图的人生让人不安，那有一张地图就好。但不能拘泥于那一张地图。要不断确认现在位置，一路不停地改写地图。\n如果稍微走进了岔路，那就在岔路上走走看。勉强想回到原来的路，只会更加迷路。走着走着，也许不知不觉就回到了原来的路，也可能遇到另一条大路。要知道人生有数不清的路。\n只要牢牢认清自己现在所处的地方，人就能走上任何一条路。\n（摘自立松和平《人生的现在位置》）", "p17Lc": "【儿童杂志的问答】\n问：鸟为什么能飞？人类装上翅膀也能飞吗？（草太　小学3年级）\n答：要在天上飞，身体轻很重要。（50），会飞的鸟，相对于身体和翅膀的大小，身体做得非常轻。比如秃鹰这种鸟，翅膀长度（张开左右翅膀时两端之间的长度）有3米左右，体重却只有10～15公斤。鸟看起来很重，是因为羽毛蓬起来了，其实身体非常纤细。而且鸟的骨头很细，骨头里面像隧道一样是空心的，所以很轻。\n不过草太同学也许会想：“那样的话，人类只要根据体重装上大翅膀不就行了吗？”那么，翅膀要有多（51）呢？据一种说法，体重60公斤的人要飞，需要的翅膀长度约为34米，比3辆10米长的大巴排在一起还要长。（52）人是根本动不了的。鸟之所以能挥动相对身体来说很大的翅膀，是因为胸部肌肉非常发达。据说鸟的胸肌约占体重的35%，所以鸟才能有力地挥动翅膀。\n此外，鸟的身体表面羽毛光滑，形状不易受到空气阻力。（53），可见鸟不是单靠有翅膀就能飞，而是身体整体在很多方面都是最适合飞行的结构。鸟是为了飞而进化的。遗憾的是，人类只装上翅膀是（54）飞不起来的。", "p17L_sakubun": "作文经常会给出类似范文的东西，我认为这是无意义的（没有意义）。如果只是文章的形式方面还好，但连内容都涉及，规定“应该这样写”，或者“这样写就能得到好评”的写作手册，是大敌。\n因为这种手册有可能导致否定一切只有你才能写出的东西。要执着于自己看到的东西，执着于哪怕只是稍微与别人不同的东西。", "p17L_kirai": "以下是一位作家写的文章。\n对人有好恶的感情，谁都有，没必要否定。但是，只和喜欢的人来往来度过职场生活，说实话是不可能的。\n分析一下就会发现，喜欢的人就是聊得来的人，很多时候和自己想法相似；而讨厌的人，大多是想法合不来的人。讨厌的、或者说想法合不来的人，其想法与自己不同，仔细听他们说话，有时会告诉你有趣的看法和有魅力的发现。\n我自己在采访时，也遇到过起初觉得“这家伙让人不舒服”的人，聊着聊着却告诉了我“原来如此”的信息。这样一来，采访结束时我就会改变判断，觉得“这个人是个好人”，可见人的好恶感情实在是很随便的东西。\n第一次见面的人，要把好恶感情放一边，坦率地看人、听话，如果听到了有趣的话，就对对方产生共鸣。这样人就会变得谦虚。毕竟得到了对工作有用的启发，自然会尊敬对方。这样持续下去，人就会变成尊重遇到的对象、珍惜关系的人。成了那样的人，就会被他人信任、被亲近。", "p17L_enpitsu": "“明明是用铅笔画的，为什么擦不掉呢？”\n这是小学写生比赛时我想过的事：在图画纸上用铅笔打了底稿，涂上水彩颜料之后，想用橡皮擦掉底稿，却擦不掉。我一边觉得不可思议，一边因为画没能按想的那样完成而很沮丧。\n对这个疑问的答案，我最近在一个网页上找到了。那个网页首先说明了：为什么普通铅笔能用橡皮擦掉，而彩色铅笔却擦不掉。\n据说明，这是因为普通铅笔和彩色铅笔的笔芯材料不同。铅笔由石墨和黏土制成，彩色铅笔由颜料和蜡（油分）制成。石墨和颜料是颜色的来源。简单说明一下写在纸上的字迹状态：前者是被磨得很细的石墨附着在纸的表面，后者是颜料连同油一起渗进纸里。因此，只是附着在表面的石墨，用橡皮擦一擦就能从纸上分离；而渗进去的颜料则无法分离。\n最后还说明了，铅笔底稿在涂了水彩颜料之后擦不掉的原因：是因为溶解水彩颜料所用的水。这水起的作用，和彩色铅笔笔芯里的油分一样。水和油都容易渗进纸里。"};})();

;(function(){Object.assign(DATA.rdpzh,{"p17L_homeru": "A\n我认为养育孩子时，与其批评不好的地方，不如表扬好的地方。孩子很单纯，会把被表扬的事原样接受，对自己的行为和态度建立自信，而这会促进成长。\n不过，表扬时也需要注意。只表扬结果，比如“取得了好成绩，真了不起”，是不可取的。而应该这样表扬之前的努力：“每天练习汉字很努力，所以才取得了好成绩，真棒。”或者“今天的比赛虽然输了，但踢得很好，看得出练习的成果。”这样就能激发孩子的干劲。\nB\n人们常说“要用表扬来培养孩子”，但真正做起来相当难。如果想着做了特别的事才表扬，表扬的机会难免会变少。\n而且，对大人来说理所当然能做到的事，对处于成长过程中的孩子来说往往并非如此。所以，即使是孩子平时就在做的事，只要觉得好、是优点，就应该多多表扬。\n谁被表扬都会高兴，被表扬的事也会想继续做下去。作为父母，想让孩子发展的事，不管多小，积极地表扬都很重要。", "p17L_konnan": "美味的食物、美丽的景色，金钱、健康与爱。靠这些得不到的持久的幸福——获得它的必要条件是“困难”。没有困难的地方，就没有持久的幸福。\n请稍微想象一下，如果完全没有困难会怎样：想要的东西都能得到，想做的事都能做，所有欲望都毫不费力地被满足，讨厌的事一概不用做，一切如愿，而且所有事都很顺利。所以，“糟了，怎么办？”这样的想法一点也不会有。也就是说，问题完全不会发生……\n也许有人会想：“哇，真好，我想那样。”\n确实，短期内这样的处境也许不坏。但如果日复一日（今后一直）都这样呢？一定会感到无聊，而且最终会无法忍受。\n因为那里完全没有发挥自己能力的机会。没有任何需要发挥自己能力的事发生。没有比这更无聊的了。如果每天都这样，一定会无聊、无法忍受。\n是的，我们能发挥能力，是在遇到困难（问题）的时候。那时才第一次获得发挥能力的机会。\n而当我们能用自己的能力克服困难时，会感受到乐趣和喜悦。这不同于从什么地方被动得到的乐趣和喜悦，而是靠自己的力量获得的乐趣和喜悦。而且，它伴随着“成功了！”的成就感，以及“只要做就能做到”的感觉——“自我效能感”。\n这些不断积累，就带来生命的充实感和持久的幸福。\n持久的幸福，是在遭遇困难时，努力用自己的能力设法克服、这样活下去才能获得的。也就是说，能否获得持久的幸福，是生活方式的问题。", "p18c": "【杂志专栏】道路的秘密\n上班、购物、玩耍外出时，每个人必定会受到关照的东西，是（50）。它理所当然地存在，被很多人使用，但其中下了各种功夫，却不太为人所知。\n例如，高速公路和大马路大多被设计成雨水不容易积在路面上，这一点（51）。路面上有无数小孔，水会渗到铺装层下面。据说高速公路上以前雨天事故多发的地点，改用这种铺装后，雨天事故减少了约80%。\n（52），在寒冷地区，雪和冰导致的打滑事故频发。因此，开发出了具有粉碎冰雪功能的道路。把颗粒状橡胶等柔软的小材料埋进路面，靠车的重量使路面稍微变形来粉碎冰雪。如果把弯道、坡道等铺成这种路面，就能防止冰雪粘附在路面上，减少打滑的危险。\n降低路面温度（53）。道路被太阳晒热，夏天尤其容易变得很烫。于是在表面涂上防止吸收太阳光线的物质，抑制温度上升。这种铺装能让路面温度最多降低10度以上，非常适合人和宠物行走的公园和人行道。\n除此之外，各种功能的道路每天都在被开发、被使用。道路的差别从外表也许看不出来。但是，为了让人们生活得更安全、更舒适，在脚下（54）。", "p18_mail": "【寄到旅行社的邮件】\n主题：关于研讨班旅行的报价单（北山大学）\nBTB旅行　团体旅游负责人　木川友子女士：\n承蒙关照。我是北山大学的大村光一。\n您特意做了报价单，但有一点想请您更改。因为一些原因，8月6日（周一）无法出发了，能否把出发日改为8月20日（周一），重新制作报价单？费用请不要超过这次报价单的金额。酒店换了也没关系，但行程请仍按同样的1晚2天。\n拜托您了。\n北山大学　大村光一", "p18_koudou": "不用说（没必要特意说），深入思考的人比竞争对手处于有利地位。但请避免为了思考而停止行动。希望你知道，行动不会使你的思考停止，反而有加速、改善思考的效果。\n要在行动、在变化的状况中持续思考，实践起来相当需要勇气。也许会发生意料之外的事，也有风险。但正因为这样做，才能产生最快速的思考。", "p18_gokai": "大学老师给人的一般印象是什么样的呢？周围有人说：理科的话是穿白大褂、净说难懂话的人；文科的话是闷在研究室里读文学作品的人。确实有接近这样的人，但当然也有很多不是。这对政治家、警察、医生等也同样适用，我们总难免抱有先入之见（想当然），这就成了产生误解的原因。\n误解不只是对方的先入之见，也常常是自己造成的。其中很大的一种是说话时的省略。没有时间的时候等，总需要省略一部分内容来汇报。即使有时间，也不可能把所有信息都准确传达。这样一来，对方会用与自己意图不同的方式去补充，就导致了误解。\n（中略）\n省略较多的邮件尤其要注意，传达复杂（错综）的内容时，最好尽量当面见面。也许觉得见面耽误时间、麻烦，但这样反而问题能更快解决。\n另外，我也注意到了误解积极的一面：误解会使人们的想法自然产生多样性。存在各种意见，是健全（正常）社会的重要要素。误解一般被当作坏人，但如果把它看作制造多样性的机制（结构），看法或许会有些改变。", "p18_uta": "A\n我想有很多人觉得自己唱歌不好、没有自信，所以不想在人前唱歌。其实，这些人常常是把在电视和CD里听过、大概记住的歌，按自己随意的想象去唱。要有自信地唱歌，首先必须理解歌词、记住曲子。歌词多读几遍，就能理解想传达的信息；曲子反复听，细节也能听清，就能准确记住。这样牢牢记住歌词和曲子之后，剩下的就是怀着模仿歌手的心情，自信地唱。一上来就想唱出自己的风格，是失败的根源，最好不要。\nB\n怎样才能唱出打动人心的歌呢？常有人想像歌手那样唱得好而去模仿歌手，但我听这样的歌很少感动。对我来说，好歌首先是能传达出唱歌人心情的歌。\n那么怎样才能唱出让人感动的歌呢？这需要深入理解歌词。不仅是单词的意思，如果仔细体会所描绘的情境和感情，就会明白哪里重要、该强调哪里来唱。我认为，只要对歌词的理解足够充分，即使音唱错一点，信息也一定能传达给听众。", "p18_hyouka": "以下是一篇谈论公司评价的文章。\n在我们公司，常常收到这样的询问：来自那些报名（应聘）了却没能录用的学生——“我为什么落选了呢？”\n他们很多人笔试成绩优秀，面试时回答也很扎实。没通过，只是与其他应聘者相比，与本公司的契合度结果如此，并不是有什么重大问题。但在他们的脑子里，只有自己和没录用自己的本公司这一对关系，所以会想“落选是因为我自己有问题”而钻牛角尖。\n①这样的人即使进入社会也会吃苦。因为想象不到上司是在与其他员工比较后做出评价的，就把成绩更好的同事搁在一边，苦恼“我这么努力、做出了成绩，却得不到评价”。\n（中略）\n达到一定水平的应聘者并非全都能进公司。只要做出一定以上的业绩（工作成果），也并非谁都能得到高评价。不存在“我做出了这么多成绩所以没问题”这回事。只要有人做出了更大的成绩，自己的评价相对下降是理所当然的。重要的是与他人比较。道理很简单，但大家出乎意料地没有注意到②这个事实。\n要成长，首先请意识到“自己总是在被拿来与他人比较”。如果想提高自己在公司内的评价，就请主动把自己与同事比较。\n常说“人是人，我是我”。评价高的同事，也许和你的长处、活跃的领域不同。即便如此，如果有人在和你差不多的时期出生、确立了自己的擅长领域、崭露头角，请直面这个事实。然后站在上司的视角与自己比较，就能看出“自己缺少什么”“要被评价该做什么”。", "p19_hyou": "一般来说，表和图表相比，图表更容易立刻发现特征。但是，这样发现的特征是否真的有意义？是不是单纯的错觉（误会）？看了图表、产生先入之见（想当然）之后，就很难验证（调查、证明）了。\n正因如此，首先观察不易发现特征的表来分析数据，对提高数据读解能力很重要。这样磨练读取表中数据的能力，最终也能提高避免图表错觉的能力。", "p19_mail": "【某公司寄给订货方的邮件】\n主题：关于扬声器“8QPS1”的订单　日期：2019年6月5日 10:30\n玛弗克商会　营业部　大村成次先生：\n承蒙关照。\n感谢您此次订购扬声器“8QPS1”20台。该机型自4月发售以来销量持续超出预期，生产跟不上。目前海外工厂也在应对，但很难在您指定的日期（6月28日）交货。可交货的时间将于本月中旬再行通知。非常抱歉，请您谅解。\nOC Sound　销售部　川藤直广", "p19_sei": "不让上场比赛。和教练合不来，别的选手被偏袒（被喜欢而受到特别对待）……自己踢不好、在比赛中没有表现，是因为环境不好，是教练的错，和其他选手的配合对不上（配合不好）……\n自认为已经相当努力的选手，往往会不自觉地这样想。\n如果是为了变好而面对自己，那么周围的一切（完全）都无关。怪别人、怪东西很轻松，但在我看来，怪别人、怪东西就等于逃避。", "p19_hon": "读书，就是听曾经生活过的杰出人物的话，读本质上就是听人说话。\n学习的基本行为也是“听”。\n而且，如果把读书看作与活着的人类交谈，那么这种阅读会更加真实。例如，读本居宣长或歌德，如果能像他们就活在我们身边那样去读，就会像听到真实的声音，因此更加真实。\n所以，已经做好“聆听的姿态”的人，也能学得更好。\n反过来，如果没有聆听的姿态，就会被对方看成没有成长的人。换句话说，如果被认为“没有想听的意思”，无论在公司还是学校，都会被认为“这个人没有前途（可能性）”。就这样，学习的姿态与现实生活中我们根本的评价息息相关。\n学习，就是听杰出人物的话来修正自己，或者对那个人心生憧憬，通过那个人看到自己新的目标、决定该走的方向。然后，从书和人的话中获得具体的建议，在自己的生活中形成某种学习的习惯。正因如此，把读书作为学习的基础才好。\n不读书，就意味着可以说是被庞大数量的贤者们预先抛弃了。", "p19_washi": "纸在我们身边随处可见，日本除了一般使用的“洋纸”，还有自古使用的“和纸”。\n洋纸以价格便宜、能大量获得的针叶树和阔叶树去掉树皮的树干部分为原料。而和纸主要使用楮、三桠、雁皮等树木的皮的部分。另外，洋纸表面凹凸少，适合印刷；和纸表面不光滑，不适合印刷。不过，和纸也有结实、强韧、而且不易劣化（品质下降），所以能长期保存的优点。\n在日本，大约从六世纪起就使用和纸，但到了明治时代洋纸开始进口后，洋纸一下子普及开来。因为与靠手工制造的和纸相比，洋纸很早就实现了制造过程的机械化，通过大量生产能廉价且稳定地供应。结果，和纸无法与洋纸抗衡，和纸产业衰落了。不过，以此为契机，和纸的制造过程也推进了机械化。\n现在日本国内广泛使用的是洋纸，但在非和纸不可的领域，和纸得到了活用。不仅是书法和绘画，因为其美感受到好评，也用于壁纸、信纸、信封等，在海外其价值也得到认可。另外，利用其结实、不易损坏的优点，也用于美术作品等的修复保存。这是今后也想留存下去的传统文化。", "p19_bu": "正确的授权方式究竟是怎样的？\n理想的是：交给下属比其实力稍高一点水平的工作——下属凭自己的力量好歹能判断、执行，有时（视情况）会招致小失败的那种水平的工作。\n通过一边逐步提高水平一边交给下属①【那样的工作】，下属就会扎实地磨练工作能力。\n然而，即使给下属那样的工作，在日本的公司里，也常常借“报联商”（汇报・联络・商量）之名，上司一一干涉（做超出必要的介入）下属的工作。结果往往是，没能让下属靠自己的力量跨过障碍。\n比如，让下属做某份演示资料。日本公司的许多上司，不展示全貌，只含糊地命令下属“做这样的东西”，让他拿来。然后要求“这里这样改”，下属在不明白其意图的情况下按上司的指示修改。这样的事反复很多次。结果，下属学到的只是Excel和PowerPoint的操作方法。这样的话，自己思考并做出高水平演示资料的能力是练不出来的。\n不应该这样，而应该事先明确说明全貌：“这份资料，是出于这样的目的，为了对这样的对象这样说服而使用的。”在此基础上，给看样本，之后交给下属自己想办法，直到下属做出自己认为最好的资料之前不插嘴（什么也不说）。\n最终做出来的东西，也许与上司设想的不同。但是，如果掌握了制作这份资料的意图和全貌，就能明白为什么不行、哪里不好、怎么改会更好，对上司的修改指示也能信服，也能从中学到东西。（中略）\n再说一遍，“教育下属是上司的职责”这种说法是错的。培养下属的是“工作”本身，上司的职责是为做那份工作“提供场所”。"});})();

;(function(){DATA.rdqz={"rd1": {"q": "（50）处填入最合适的是哪个？", "o": ["是24小时吗（表疑问）", "不是24小时吗（反问）", "能说是24小时吗", "是24小时吧？（带推测）"], "s": ""}, "rd2": {"q": "（52）处填入最合适的是哪个？", "o": ["规定要出生", "假设出生了", "过去被说会出生", "似乎出生了"], "s": ""}, "rd3": {"q": "（53）处填入最合适的是哪个？", "o": ["只是／不过", "另一方面", "的确", "即便如此"], "s": ""}, "rd4": {"q": "作者认为信是怎样的东西？", "o": ["连写信人无意传达的东西也会传达出去", "只会突出写信人爱的深度", "写信人想传达的事传达不出去", "能按写信人所想原样传达心情"], "s": ""}, "rd5": {"q": "据作者说，不读文字、只靠图画看绘本会怎样？", "o": ["比读文字更感动。", "比读文字更能看懂故事。", "看着图画自由地编故事。", "试图从图画中找出意义。"], "s": ""}, "rd6": {"q": "①“不能称为绘本的东西”指什么样的东西？", "o": ["只看图画什么也传达不出来的东西", "没有图画就不懂文字意思的东西", "图画和文字的意思不一致的东西", "图画和文字一起看也不有趣的东西"], "s": ""}, "rd7": {"q": "②实验中花时间最长的是哪种情况？", "o": ["容器里有水、且手指有“皱纹”", "容器里有水、且手指没有“皱纹”", "容器里没水、且手指有“皱纹”", "容器里没水、且手指没有“皱纹”"], "s": ""}, "rd8": {"q": "①作者认为那种做法是错的，是为什么？", "o": ["因为员工不再产生创意", "因为员工的创意不被采用", "因为员工在物理上的劳动力被浪费", "因为员工会想辞职"], "s": ""}, "rd9": {"q": "年轻人问“幸福真的存在吗”，是为什么？", "o": ["因为至今无论做什么都没能达到幸福感", "因为对幸福有各种看法，不知道什么是幸福了", "因为人的欲望不会消失，认为永远得不到幸福感", "因为人的欲望各不相同，所以认为对幸福的看法也各不相同"], "s": ""}, "rd10": {"q": "迭戈是东京一所大学的三年级学生。他想从2017年4月起入住宿舍，把条件记在备忘里。符合他希望的宿舍是哪个？\n・宿舍费3万日元以下\n・宿舍费含水电燃气费\n・单人间，带浴室的房间\n・想在4月3日之前搬进去", "o": ["仅樱宿舍", "樱宿舍、藤宿舍", "仅藤宿舍", "藤宿舍、堇宿舍"], "s": ""}, "rd11": {"q": "（52）处填入最合适的是哪个？", "o": ["如果这样", "虽说如此", "而且／进一步", "像这样"], "s": ""}, "rd12": {"q": "（53）处填入最合适的是哪个？", "o": ["那样做的话", "变成那样的话", "即便如此", "为此（要做到这点）"], "s": ""}, "rd13": {"q": "（54）处填入最合适的是哪个？", "o": ["社会", "是社会", "所谓社会", "因为是社会"], "s": ""}, "rd14": {"q": "写这封邮件的人指出了自习室的什么问题？", "o": ["使用者以小组为单位查资料", "一边说话一边做事的小组很多", "没有恰当使用小组专用自习室", "有不用图书馆资料就做事的小组"], "s": ""}, "rd15": {"q": "据作者说，工作是怎么回事？", "o": ["履行社会所期待的角色", "把工作中得到的东西给予他人", "寻找自己的社会角色", "追求自身的成长"], "s": ""}, "rd16": {"q": "关于从小开展法律教育的好处，作者是怎么说的？", "o": ["会成长为守法的人。", "会对法律产生兴趣。", "能掌握解决问题的能力。", "理解学习内容的速度会变快。"], "s": ""}, "rd17": {"q": "与作者想法相符的是哪个？", "o": ["让自己的想法与行动一致，就不会积压压力。", "比起自己的想法更重视行动，就不会积压压力。", "做出与自己想法相反的行动时，压力最大。", "想把自己的想法付诸行动，就会积压压力。"], "s": ""}, "rd18": {"q": "②“那样的人生”是怎样的人生？", "o": ["不依赖地图、笔直走下去的人生", "照着地图走的人生", "走和别人一样的路的人生", "一边迷路一边走下去的人生"], "s": ""}, "rd19": {"q": "这篇文章中作者最想说的是什么？", "o": ["多备几张地图，人生就不用担心迷路。", "人生只要知道现在位置，就能走上新的路。", "人生只要定好目的地，就不会迷路，能靠自己的力量走下去。", "要拓宽人生的可能性，就应该走地图上没有的路。"], "s": ""}, "rd20": {"q": "（50）处填入最合适的是哪个？", "o": ["另一方面", "其实", "然而", "因为"], "s": ""}, "rd21": {"q": "（52）处填入最合适的是哪个？", "o": ["翅膀", "那么大的翅膀", "这边的翅膀", "像那样的大翅膀"], "s": ""}, "rd22": {"q": "（53）处填入最合适的是哪个？", "o": ["与此相对", "如开头所说", "这样看来", "从最后的结论来看"], "s": ""}, "rd23": {"q": "（54）处填入最合适的是哪个？", "o": ["看起来很难", "是因为很难", "据说变得困难起来了", "因为会变得困难"], "s": ""}, "rd24": {"q": "像范文这样的东西，可能会使作文变成怎样？", "o": ["容易得到谁都给的高评价。", "变得过分拘泥于文章形式。", "自己的视角和主张变得更易懂。", "写不出只有自己才能写的东西。"], "s": ""}, "rd25": {"q": "关于与讨厌的人交谈，作者是怎么说的？", "o": ["交谈之后，能获得与自己不同的看法和发现。", "随着交谈机会增多，想法会渐渐变得相似。", "有好恶感情是理所当然的，所以没有必要主动交谈。", "因为他们会指出自己想法的错误，所以应该交谈。"], "s": ""}, "rd26": {"q": "作者想说的是什么？", "o": ["以谦虚的态度来往，就会被对方尊敬。", "要被对方信任，需要坦率表现好恶感情。", "初次见面时最好对对方不带好恶感情。", "如果不重视初次见面时的感情，就无法与对方建立良好关系。"], "s": ""}, "rd27": {"q": "涂了水彩颜料之后，铅笔底稿为什么擦不掉？", "o": ["因为石墨被磨得很细，无法去除", "因为颜料使石墨附着在纸的表面", "因为水使石墨渗进了纸里", "因为石墨起着与油分相同的作用"], "s": ""}, "rd28": {"q": "关于表扬使孩子变成怎样，A和B是怎么说的？", "o": ["A和B都说会感受到父母的爱。", "A和B都说能理解努力的重要性。", "A说会有自信，B说会想把被表扬的事坚持下去。", "A说会坦率接受父母说的话，B说会积极地做事。"], "s": ""}, "rd29": {"q": "关于完全没有困难的状态，作者是怎么说的？", "o": ["即使是短期，也会厌倦生活。", "只要是短期，讨厌的事也会变得不讨厌。", "持续很久的话，会无法忍受无聊的生活。", "持续很久的话，会不知道自己想要什么。"], "s": ""}, "rd30": {"q": "（51）处填入最合适的是哪个？", "o": ["您知道（陈述）", "如您所知", "您知道吗？", "您大概知道吧"], "s": ""}, "rd31": {"q": "（53）处填入最合适的是哪个？", "o": ["可以说是用心之处", "也可以考虑用心", "被认为是用心之处", "也能看到用心"], "s": ""}, "rd32": {"q": "关于报价单，这封邮件委托的是什么？", "o": ["费用涨了也没关系，请更改出发日。", "请不要涨价，更改出发日。", "住宿地可以变，请更改出发日和天数。", "住宿地不要变，请更改出发日和天数。"], "s": ""}, "rd33": {"q": "与作者想法相符的是哪个？", "o": ["不停止行动、持续思考，思考会更加速。", "停止行动、深入思考也是必要的。", "在变化的状况中，加快行动很重要。", "只要持续思考，就能拥有更多勇气。"], "s": ""}, "rd34": {"q": "作者举大学老师的例子，说的是什么？", "o": ["对职业的一般印象与实际相符。", "持有与周围不同的印象会产生误解。", "误解产生于先入之见。", "谁都可能产生误解。"], "s": ""}, "rd35": {"q": "据作者说，误解的好处是什么？", "o": ["会产生各种想法。", "能注意到自己想法的错误  var fired=false;function fin(){if(fired)return;fired=true;if(done)done();}

 if(f){
  try{

 }
 browserSpeak(txt,fin);}

 try{speechSynthesis.cancel();speechSynthesis.resume();}catch(e){}
 var u=new SpeechSynthesisUtterance(txt);u.lang='ja-JP';u.rate=(S.rate||1.0)*0.95;
 var v=jaVoice||pickVoice();if(v)u.voice=v;

 speechSynthesis.speak(u);}

function TESTSAY(c){return (c.line&&window.DATA&&DATA.tts&&DATA.tts[c.line])?c.line:speakable(c);}

function cards(k,extra){
 var d=DECKS[k],t=dayNum(),due=[],nw=[],seen=[];
 d.list.forEach(function(c){var s=S.cards[k+':'+c.id];if(!s)nw.push(c);else{seen.push(c);if(s.due<=t)due.push(c);}});
 var batch=extra==='review'?seen.sort(function(a,b){return S.cards[k+':'+a.id].box-S.cards[k+':'+b.id].box;}).slice(0,NEW_PER_DAY):shuffle(due).concat(nw.slice(0,NEW_PER_DAY*(1+aheadN())));
 var BS=5,queue=[],total=batch.length,doneN=0;
 function front(c){return d.front(c);}
 function ans(c){return k==='read'?c.r:(c.zh||c.r||'');}
 function distract(c){
  if(k==='read')return shuffle(c.ds).slice(0,3);
  var pool=shuffle(d.list.filter(function(x){return x.id!==c.id&&ans(x)&&ans(x)!==ans(c);}));
  return pool.slice(0,3).map(ans);}
 var MORE="<p><a class=btn href=\"#/today\">回今日任务</a> <button id=m1 class=btn>再学 15 个新的</button> <button id=m2 class=btn>加练已学过的</button></p>";

  document.querySelector('.flash').appendChild(rp);

   var ok=b.getAttribute('data-v')===ans(c);
   [].forEach.call(document.querySelectorAll('.opt'),function(x){x.disabled=true;if(x.getAttribute('data-v')===ans(c))x.className+=' right';});
   if(!ok)b.className+=' wrong';
   var key=k+':'+c.id,s=S.cards[key]||{box:0,due:t};

   else{c._fail=true;c._n=(c._n||0)+1;s.box=0;if(c._n<2){s.due=t;list.splice(Math.min(3,list.length),0,c);}else{s.due=t+1;}}

   if(LISTEN){var fl=document.querySelector('.flash');fl.innerHTML=frontHtml(c);fl.appendChild(rp);}
   $('#fb').innerHTML=(ok?'<p class=ok>✔ 正确</p>':'<p class=ng>✘ 正确答案：'+esc(ans(c))+(c._n<2?'（稍后重测一次）':'（明天再出现）')+'</p>')+'<div class=ex>'+d.back(c)+'</div><button id=nx2 class=btn>继续</button>';
   $('#nx2').onclick=function(){ test(list,n); };
   if(!LISTEN)speak(speakable(c));
  };});}

   var t=dayNum();e.n=(e.n||0)+1;
   if(ok){e.box=Math.min((e.box||0)+1,INT.length-1);e.due=t+INT[e.box];right+=(fl[e.id]?0:1);}
   else{e.wr=(e.wr||0)+1;e.box=0;e.due=t+(fl[e.id]?1:0);if(!fl[e.id]){fl[e.id]=1;total++;q.splice(Math.min(3,q.length),0,e);}}
   save();done++;
   $('#vfb').innerHTML=(Q.t==='f'?'':(ok?'<p class=ok>✔ 正解</p>':'<p class=ng>✘ 正解：'+esc(Q.opts[Q.a])+(fl[e.id]&&!ok&&q.indexOf(e)>=0?'（稍后再出现一次）':'')+'</p>'))+
    '<div class=noteb><b>'+esc(e.w)+'</b>'+(e.r?'　【'+esc(e.r)+'】':'')+(e.m?'　'+esc(e.m):'')+'<br><span class=note>'+esc(e.ctx)+'</span>'+(e.tr?'<br><span class=note>译：'+esc(e.tr)+'</span>':'')+(e.src?'<br><span class=note>出处：'+esc(e.src)+'</span>':'')+'</div><p><button id=vsw2 class=btn>🔊 词</button> <button id=vsp class=btn>🔊 听句子</button> <button id=vnx class="btn good">下一个 →</button></p>';
   $('#vsw2').onclick=function(){speak(e.r||e.w);};$('#vsp').onclick=function(){speak(e.ctx);};$('#vnx').onclick=step;}
  if(Q.t==='f'){$('#vshow').onclick=function(){this.style.display='none';$('#vfb').innerHTML='<div class=noteb><b>'+esc(e.w)+'</b><br><span class=note>'+esc(e.ctx)+'</span></div><p><button id=vok class="btn good">想起来了</button> <button id=vng class="btn bad">没想起来</button></p>';$('#vok').onclick=function(){$('#vok').parentNode.innerHTML='';reveal(true);};$('#vng').onclick=function(){$('#vng').parentNode.innerHTML='';reveal(false);};};}
  else{[].forEach.call(document.querySelectorAll('.opt'),function(b){b.onclick=function(){var i=+b.getAttribute('data-i'),ok=i===Q.a;
   [].forEach.call(document.querySelectorAll('.opt'),function(x){x.disabled=true;if(+x.getAttribute('data-i')===Q.a)x.className+=' right';});if(!ok)b.className+=' wrong';reveal(ok);};});}
 }
 step();}
function vbView(){
 vbFill();
 var L=vbList().slice().sort(function(a,b){return b.add-a.add;}),due=vbDue();
 var h='<h1 data-nohl=1>生词本</h1><div data-nohl=1><p>共 <b>'+L.length+'</b> 个，今天到期 <b>'+due.length+'</b> 个。</p><p class=note>在听力原文、阅读文章或讲解里，用手指划选一个词/表达，底部会出现“加入生词本”。已加入的词会在文中划线。复习是选择题：选读音和选意思，交替出现；释义和读音都是自动补的，不对可点“改意思”。</p>';
 if(due.length)h+='<a class=btn id=vgo href="#">复习今天到期的（'+Math.min(due.length,20)+'）</a> ';
 if(L.length)h+='<a class=btn id=vall href="#">随机练习（最多20）</a>';
 h+='<div id=vlist>';
 L.forEach(function(e){h+='<div class=noteb><b>'+esc(e.w)+'</b>'+(e.r?'　【'+esc(e.r)+'】':'')+(e.m?'　'+esc(e.m):'')+'<br><span class=note>'+esc(e.ctx)+(e.tr?'<br>译：'+esc(e.tr):'')+(e.src?' · '+esc(e.src):'')+'</span><br><button class="btn small" data-s="'+e.id+'">🔊</button> <button class="btn small" data-m="'+e.id+'">改意思</button> <button class="btn small" data-d="'+e.id+'">删除</button></div>';});
 h+='</div></div>';
 if(!L.length)h+='<p data-nohl=1>还没有生词。</p>';
 render(h);
 if($('#vgo'))$('#vgo').onclick=function(ev){ev.preventDefault();vbReview(due);};
 if($('#vall'))$('#vall').onclick=function(ev){ev.preventDefault();vbReview(vbList());};
 [].forEach.call(document.querySelectorAll('[data-s]'),function(b){b.onclick=function(){var e=vbList().filter(function(x){return x.id===b.getAttribute('data-s');})[0];if(e)speak(e.r||e.w);};});
 [].forEach.call(document.querySelectorAll('[data-m]'),function(b){b.onclick=function(){var e=vbList().filter(function(x){return x.id===b.getAttribute('data-m');})[0];var v=window.prompt('「'+e.w+'」的意思：',e.m||'');if(v!==null){e.m=v.trim();save();vbView();}};});
 [].forEach.call(document.querySelectorAll('[data-d]'),function(b){b.onclick=function(){var id=b.getAttribute('data-d');if(window.confirm('删除这个生词？')){S.vb.list=vbList().filter(function(x){return x.id!==id;});save();vbView();}};});}

function route(){
 var p=(location.hash||'#/home').slice(2).split('/');
 var v=p[0];
 if(v==='cards'&&DECKS[p[1]])cards(p[1]);
 else if(v==='quiz'&&SETS[p[1]])quiz(p[1]);
 else if(v==='audio'){if(p[1])audioPaper(p[1]);else audioHome();}
 else if(v==='clip')clipView(p[1],p[2]);
 else if(v==='today')today();
 else if(v==='t')runTask(p[1]);
 else if(v==='wrong')wrongView();
 else if(v==='wrongquiz'){var ids=wrongDue();if(ids.length)quiz(null,ids);else wrongView();}
 else if(v==='wrongall'){var ids2=wrongOpen();if(ids2.length)quiz(null,ids2);else wrongView();}
 else if(v==='vb')vbView();
 else if(v==='lessons')lessonsView();
 else if(v==='lesson')lessonView(p[1]);
 else if(v==='settings')settings();
 else home();}
window.addEventListener('hashchange',route);
load();vbInit();route();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
