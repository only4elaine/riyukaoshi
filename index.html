"tts/a3d30bc831.mp3", "起きる   起こす": "tts/6dda2a6368.mp3", "朝早く起きる。／子どもを起こす。": "tts/a2483ebaed.mp3", "乾く   乾かす": "tts/f82d465c65.mp3", "洗濯物が乾く。／髪を乾かす。": "tts/f029ed82e6.mp3", "沸く   沸かす": "tts/586e765a17.mp3", "お湯が沸く。／お湯を沸かす。": "tts/90dc120b7e.mp3", "続ける・進む   進める": "tts/91755c869b.mp3", "計画が進む。／計画を進める。": "tts/c88a2e9871.mp3", "彼に頼らざるを得なかった": "tts/e14937d9f3.mp3", "人口は増える一方だ": "tts/05627d3de4.mp3", "買い物のついでに手紙を出した": "tts/2ea2300dfd.mp3", "この商品は2種類からしか選べない": "tts/a961be89ca.mp3", "無理に忘れようとしなくてもいい": "tts/c7c69ab40a.mp3", "休むわけにはいかない": "tts/b676d53baf.mp3", "その件はお答えしかねます": "tts/0b869359f7.mp3", "子どもは外で遊びたがる": "tts/ab18b914f5.mp3", "できるものなら、もう一度やり直したい": "tts/5b6aefdf8c.mp3", "疲れたなら、温泉にでも行ってみたら": "tts/57edf13807.mp3", "お客様がお待ちです": "tts/1fd16d9bd3.mp3", "お待ちしております": "tts/f2510b594f.mp3", "明日、お宅に伺います": "tts/327c47d439.mp3", "先生が本をくださいました": "tts/4c21f870ee.mp3", "先生に本をいただきました": "tts/a00c3c91b7.mp3", "私は田中と申します": "tts/48c3c75956.mp3", "どうぞ召し上がってください": "tts/dc6894dcf9.mp3", "何をお探しですか": "tts/a1bbb2c4af.mp3", "ドアが開いている": "tts/9968cde1ef.mp3", "ドアを開けておいた": "tts/e6c3729f64.mp3", "電気がついている": "tts/39dd6f31f7.mp3", "財布を落としてしまった": "tts/afce7d6a8f.mp3", "日程が決まりました": "tts/fcbe3fff10.mp3", "荷物が届きました": "tts/06082c94d9.mp3", "危うく電車に乗り遅れるところでした": "tts/428570ed3f.mp3", "お言葉に甘えて、お先に失礼します": "tts/260c49c32d.mp3", "忙しくて旅行どころではありません": "tts/954399c1fc.mp3", "行けないことはないんですが": "tts/f4cbf4b587.mp3", "手伝ってもらえると助かります": "tts/999727ccd0.mp3", "今日は早く帰らせていただけませんか": "tts/adbbe4535c.mp3", "連絡のしようがない": "tts/7a124defa5.mp3", "そんなことができるわけがない": "tts/12bfca1cd6.mp3", "疲れた時は寝るに限る": "tts/e65817c1bd.mp3", "雨にもかかわらず、試合は行われた": "tts/133f4384f1.mp3", "彼は英語ばかりか中国語も話せる": "tts/2fec2718a7.mp3", "景気は回復しつつある": "tts/df0bf29cf2.mp3", "冬は風邪を引きがちだ": "tts/a0c58dfe86.mp3", "ご利用に際しては、規約をお読みください": "tts/25b2769950.mp3", "生徒「これからご紹介するのは、私が新しい単語を覚えるのにいい方法はないかとあれこれ考えた末に思いついた方法です。」": "tts/43a9d7026b.mp3", "片付けが苦手という話をよく聞きますが、それは決して性格や能力の問題ではなくやり方を知らないだけなので、やり方を身につければ必ず片付けられるようになります。": "tts/3d2950eb5d.mp3", "X市には、市民のための文化施設が二つあり音楽コンサートをはじめとしたさまざまな催しを行っている。": "tts/490145bc29.mp3", "おなかがすいているわけでもないのにおなかが鳴るのはどうしてだろう。": "tts/bf30accf17.mp3", "出張に行くたびに泊まっているYホテルが先週から工事で休業中なので、今回は別のホテルに泊まることにした。": "tts/7489570baa.mp3", "どんなスポーツでも、日々の練習が上達に欠かせないのはもちろんだが間違った方法で行うと時間をかけてもなかなか上達しない。": "tts/7e23d35b90.mp3", "姉は歌手の赤川ケイの大ファンで、彼女のことならどんなに小さなことでも知りたいと言っている。": "tts/5fbd5984a5.mp3", "明日の夕方が締め切りのレポートがまだ終わっていない。明日は一日中授業があって時間がとれないので、今晩徹夜してでも終わらせてしまわないといけない。": "tts/7312baa5f6.mp3", "田中さんはみかんが好きらしく一度食べだすと止まらないほど、冬はいつもみかんを大量に買うそうだ。": "tts/817fdb3602.mp3", "私は、中学生になったころから次第に医学に興味を持ち始め高校に入ったときには将来医者になろうと決めていた。": "tts/0ebeb859b1.mp3", "料理の面白いところは、安い材料でも工夫次第で豪華なごちそうができるところです。": "tts/8c37152083.mp3", "田中「昨日は、息子の高校の入学式だったんですよ。」 山田「田中さんの息子さんももう高校生ですか。早いですね。」": "tts/7d3dc0f09e.mp3", "世界各国の国会議員選挙における投票率を世代ごとに見ると、若い世代の投票率は我が国に限らず相対的に低い傾向があることがわかる。": "tts/70cdeca2e2.mp3", "5歳の娘は、私と同じ警察官になりたいと言っている。本当に将来なるかどうかは別としてそんなことを言ってくれたことに感激した。": "tts/dd7d8f98e7.mp3", "試合に負けて本当は悔しいはずの選手たちがなぜか明るい表情だったのは、「つらいときこそ明るく」というのが監督の方針だからだそうだ。": "tts/adb7185345.mp3", "この歌を聞くたびに思い出すのは高校時代の友人のことだ。彼はカラオケに行くと必ずこの歌を歌っていた。": "tts/760c296d77.mp3", "昨日、アルバイトに遅刻しそうだったので急ごうと思ってタクシーに乗ったら道が渋滞していたせいでかえって時間がかかり結局遅刻してしまった。": "tts/819bb1213c.mp3", "来月結婚する友人に結婚式のスピーチを頼まれた。大勢の前で話すのは苦手なので悩んだのだがどうしてもと言われて、引き受けることにした。": "tts/79c2167962.mp3", "先日の政治家A氏の発言はあまりに無責任だ。政治家としての自分の立場をよく考えたうえで発言しなければならなかったと思う。": "tts/e78070affe.mp3", "食事や睡眠などの生活習慣は一度乱れてしまうと、戻そうとしてもなかなか戻せないので規則正しい生活を普段から意識することが大切だ。": "tts/b8128cb411.mp3", "結婚生活を送るうえで何が大切かといえば、相手への思いやりの気持ちを持つことだと思う。": "tts/aa6c4b9d3f.mp3", "就職したときに買って以来ずっと使っていたかばんがとうとう壊れたので、買い換えることにした。": "tts/4c0097146c.mp3", "登山には不思議な魅力がある。登っているときはこんなに苦しいことは二度としたくないと思うのに山を下りて何日かするとなぜかまた登りたくなる。": "tts/86359f6843.mp3", "彫刻家川村たけるが作る動物の彫刻作品は、形はシンプルながら今にも動き出しそうな生命力にあふれている。": "tts/efe9178548.mp3", "このお菓子はとても簡単に作れるから初心者でも失敗することはまずないという友人の話を聞いて、作ってみようと思った。": "tts/df26bf97f4.mp3", "近所のスーパーの隣にはクリーニング屋がある。スーパーもクリーニング屋も私が仕事から帰る時間でも開いていて買い物するついでに預けた服を取りに行けるのが助かる。": "tts/f1bf966d40.mp3", "薬は正しく飲まないと得られるはずの効果が得られないだけでなく状態を悪化させてしまう危険もある。": "tts/04115d729d.mp3", "いつ行っても長い行列ができているラーメン屋なのに今回あまり並ばないで済んだのは何時ごろがすいているか事前に確認してから行ったからだ。": "tts/b1f261e1c4.mp3", "山や植物の写真家として有名な岩本まさき氏の写真展が15日からABCデパートで開催される。": "tts/a7fc293518.mp3", "子供のころは、1年が長く感じられたのに、年をとるにつれて短く感じるようになるのはなぜだろうか。": "tts/bfccd7d50c.mp3", "情報をどのような順番で提示するかによって相手の受け止め方が変わってくるので、順番を意識して話す必要がある。": "tts/396dff0ef6.mp3", "日本では、99歳のお祝いを「白寿」と言います。「百」の字から「一」をとると「白」という字になることからそう呼ばれています。": "tts/9ba0414c4d.mp3", "講師「最初は全く興味がなかった商品なのにCMなどで何度か見ているうちに気になってくるということはありませんか。」": "tts/45b2489e55.mp3", "この本の内容をきちんと理解するにはそれなりの知識が求められるので難しいと感じる人も多いだろう。": "tts/6fc00258d4.mp3", "石油は、自動車や航空機などの燃料として使われるだけでなくプラスチック製品を作る原料としても利用されている。": "tts/4dc0034d58.mp3", "東鉄道竹山線内にある二つの信号機が故障しており、大事故が起きかねない危険な状態が続いていたことが明らかになった。": "tts/8a213f63e8.mp3", "（インタビューで）「店長になって最初の1年間は大変でした。店長になったといってもわからないことばかりで自分でいいのかと悩むこともありました。」": "tts/5a08d94221.mp3", "家を買うことについて否定的な夫は一度買ってしまうと簡単に引っ越せないのが嫌だと言っている。": "tts/ef7f7b4c5a.mp3", "隣のクラスの友達とけんかをしてしまい、学校の廊下ですれ違っても目を合わせることすらなくなってしまった。": "tts/2b0ff97ac5.mp3", "このソファーは、それなりの大きさはあるが、見た目ほどの重さはないため一人でも楽に動かせる。": "tts/aa03bda771.mp3", "友達にスキー旅行に誘われている。返事をしなければと思いながらも仕事の予定が決まっていなくてまだ返事ができていない。": "tts/acf589ec72.mp3", "私は、美術館では音声ガイドの機械を借りて、説明を聞きながら作品を鑑賞する。作品のどこに注目して鑑賞したらいいのかがわかるとその作品をより深く味わえるからだ。": "tts/293f8fbb22.mp3", "雪が降っているわりにそんなに寒く感じないのは風がほとんどないからだろう。": "tts/ea67a27dff.mp3", "急いでいたので、危うく電車に乗り遅れるところでした。": "tts/a3a928429d.mp3", "1番。間に合ってよかったですね。": "tts/a8602a8a24.mp3", "2番。じゃあ、次の電車ですね。": "tts/95f3a50508.mp3", "3番。どうして遅れたんですか。": "tts/9fa5277937.mp3", "あいにく、田中は今席を外しております。": "tts/333fcf169c.mp3", "1番。では、また後でかけ直します。": "tts/eba0a1b3f0.mp3", "2番。じゃあ、伝えておきます。": "tts/ec1fb114ba.mp3", "3番。席にいらっしゃいますか。": "tts/7b6a002132.mp3", "この仕事、手伝ってもらえると助かるんだけど。": "tts/9ceb2ab9bd.mp3", "1番。いいですよ、何をしましょうか。": "tts/8b4993d8fe.mp3", "2番。ありがとうございます。助かりました。": "tts/1483163f9c.mp3", "3番。手伝ってあげますよ、ありがとう。": "tts/cbf7e9b0ad.mp3", "ご要望にはお応えしかねます。": "tts/71521ec41d.mp3", "1番。そうですか、それは残念です。": "tts/6f5d1f0604.mp3", "2番。お応えいただけて助かります。": "tts/531911f761.mp3", "3番。ぜひお願いします。": "tts/7b2f7384b0.mp3", "お先にどうぞ。": "tts/0d96124eb1.mp3", "1番。では、お言葉に甘えて。": "tts/8df1f0c88d.mp3", "2番。いえ、結構です。お先にいらっしゃる。": "tts/51a4dd4886.mp3", "3番。お先に失礼です。": "tts/b972782587.mp3", "忙しくて、旅行どころじゃないんです。": "tts/f0eb528b06.mp3", "1番。それは大変ですね。": "tts/fa26f14d20.mp3", "2番。楽しんできてくださいね。": "tts/d833471b85.mp3", "3番。旅行はいつ行きますか。": "tts/6ae8bc195b.mp3", "行けないことはないんですが…。": "tts/16dd7fa330.mp3", "1番。無理なら、いいですよ。": "tts/dd2c017589.mp3", "2番。じゃあ、行けないんですね。": "tts/bb811980bf.mp3", "3番。では、絶対来てください。": "tts/9c3e334cc4.mp3", "今日は早めに帰らせていただけませんか。": "tts/58eee30661.mp3", "1番。ええ、いいですよ。": "tts/da0bfc4292.mp3", "2番。ありがとうございます。助かります。": "tts/21e28a6c16.mp3", "3番。今日は早く帰らないでください。": "tts/95040650da.mp3", "1番。ありがとうございます。いただきます。": "tts/de04687a94.mp3", "2番。コーヒーはいかがでしたか。": "tts/bfb3f72c45.mp3", "3番。コーヒーを飲んだことがありません。": "tts/09bfefd346.mp3", "連絡先が分からなくて、連絡しようがなかったんです。": "tts/9811305836.mp3", "1番。それは困りましたね。": "tts/f9576fcb80.mp3", "2番。じゃあ、連絡しなくてもいいですね。": "tts/e4aa476b9e.mp3", "3番。連絡先を教えてもらってください。": "tts/8dc96c0583.mp3", "無事に終わりました、おかげさまで。": "tts/2aa4c1f95d.mp3", "1番。それはよかったですね。": "tts/7f6df668c5.mp3", "2番。どういたしまして。": "tts/6ab23fff86.mp3", "3番。お大事に。": "tts/f04b7f6a2e.mp3", "痛いほどではないんですが、少し気になって。": "tts/6be62e4d49.mp3", "1番。念のため、診てもらったらどうですか。": "tts/d54284ad8a.mp3", "2番。それは大変ですね、すぐ救急車を呼びましょう。": "tts/0d2352e928.mp3", "3番。痛くないなら大丈夫ですね。": "tts/4325d6c5fd.mp3", "資料はもうコピーしてあります。": "tts/9e4e9bac9f.mp3", "まず資料をコピーしておいてください。": "tts/9ec05c764b.mp3", "コピーは会議が終わってからでいいですよ。": "tts/f56698da2c.mp3", "コピーはしなくても大丈夫です。": "tts/52f5443467.mp3", "予約は、さっき済ませました。": "tts/8759326d02.mp3", "予約は、とりあえず先にお願いします。": "tts/f9eaecafd0.mp3", "連絡は後回しにして、先に準備をしましょう。": "tts/cc0fd02c86.mp3", "それはこちらでやりますので、結構です。": "tts/42e7ae5f27.mp3", "報告書は昨日のうちに出しておきました。": "tts/aa7e60b1dd.mp3", "報告書は今日中に出してください。": "tts/cca767c6fc.mp3", "報告書はまた今度でかまいません。": "tts/8b6d93e3b3.mp3", "報告書は出さなくてもいいことになりました。": "tts/fb527ab616.mp3"};window.DATA=window.DATA||{};
DATA.expl={
so1:'先抓两个固定搭配：「動詞た形＋末に」（经过…之后）和「…か＋と考えた」。「覚えるのに」是“为了记”，后面接「いい方法はないか」（想的内容），再接「とあれこれ考えた」，最后「末に」连到「思いついた方法」。',
so2:'「決して〜ではなく」是固定呼应：决不是…。所以「決して」后面接要被否定的「性格や能力の問題」，再「ではなく」，最后是真正的原因「やり方を知らない」，后面接「だけ」。',
so3:'「AをはじめとしたB」=以A为首的B。「文化施設が二つあり」先说有两处，再说它们举办的活动：「音楽コンサートをはじめとしたさまざまな催しを」。',
so4:'「〜わけでもないのに」=并不是…可是。后面是疑问：「おなかが鳴るのは、どうして」，句尾「だろう」。“为什么…呢”的结构是「Nはどうしてだろう」。',
so5:'「Vるたびに」=每次…。「出張に行くたびに」修饰后面的「泊まっているYホテルが」（每次出差都住的Y酒店），「Yホテルが」做主语，对上后面“休業中”。',
so6:'先找「〜はもちろんだが」（…固然…但…）。「練習が上達に欠かせないのはもちろんだが」，后半转折「間違った方法で行うと…」。「Aに欠かせない」=对A不可缺少。',
so7:'「Nなら」=只要是N的话；「どんなに〜ことでも」=再…的事也。所以「ことなら、どんなに小さなことでも知りたい」。',
so8:'「Vてでも」=就算…也要；「Vてしまわないと（いけない）」=不做完不行。「徹夜してでも終わらせてしまわないと」。',
so9:'「みかんが好きらしく」（似乎很爱吃，并列到后面），「一度食べだすと」（一旦开始吃就…），「止まらないほど」（程度），再接「冬はいつも…大量に買う」。',
so10:'按时间顺序排：先「次第に医学に興味を持ち始め」（渐渐地），再「高校に入ったときには」，再「将来医者になろうと決めていた」。「次第に」是副词，放在被修饰动词前。',
so11:'「N次第で」=取决于N。「工夫次第で」后接「豪華なごちそう」（豪华的大餐），「豪華な」修饰「ごちそう」，最后「ができる」。',
so12:'「息子さんももう高校生ですか」：「も」表示“也”（我家也…），「もう」=已经。「息子さん＋も＋もう＋高校生」。',
so13:'「Nに限らず」=不仅限于N；「相対的に低い傾向がある」。主语「投票率は」先出现，再「我が国に限らず」，再「相対的に低い」，最后「傾向がある」，接「ことがわかる」。',
so14:'「〜かどうかは別として」=是否…先不说。「将来なるかどうかは別として」，后面的「そんなことを言ってくれたことに」是感激的对象。',
so15:'「悔しいはずの選手たちが」：「はずの」修饰「選手たち」（本该懊悔的选手们），然后「なぜか明るい表情」。',
so16:'这是“强调句”：「この歌を聞くたびに思い出すのは、高校時代の友人のことだ」。「Aのは Bのことだ」=A的是B。先「たびに」，再动词「思い出す」，再「のは」，最后「高校時代の友人の」接「ことだ」。',
so17:'按动作顺序：「急ごうと思って→タクシーに乗ったら→道が渋滞していたせいで→かえって時間がかかり」。「せいで」说明坏结果的原因，「かえって」=反而。',
so18:'「苦手なので悩んだのだが」（因为不擅长而犹豫过）→「どうしても〜と言われて」（被硬要求）→「引き受けることにした」。「ので」「のだが」「と言われて」依次接续。',
so19:'「政治家としての自分の立場」（作为政治家的自己的立场）是一个整体；「をよく考えたうえで」=好好考虑之后；最后「発言しなければならなかった」。注意「政治家としての」要放在「自分の立場」前面（我之前的顺序错了，已更正）。',
so20:'「戻そうとしても、なかなか戻せないので」（想恢复也很难恢复，所以），后面说该做的事：「規則正しい生活を普段から意識することが大切だ」。',
so21:'「〜うえで」=在…方面；「何が大切かといえば」=要说什么重要的话。顺序：「うえで→何が→大切か→といえば」，后面答案是“相手への思いやり”。',
so22:'「買って以来ずっと使っていたかばんが」：「以来」前接「買って」；「ずっと」是副词，在「使っていた」前；「使っていた」修饰「かばん」。',
so23:'「こんなに苦しいことは二度としたくないと思うのに」：「こんなに」后面接形容词性成分「苦しいことは」；「と思うのに」=明明想…却…，后面是转折「山を下りて何日かすると、またなぜか登りたくなる」。',
so24:'「Aながら」=虽然…却…。「シンプルながら今にも動き出しそうな生命力」：「今にも〜そうだ」=眼看就要…，「動き出し＋そうな」。',
so25:'「〜ことはまずない」=几乎不会。「失敗することはまずないという友人の話」：「という」引出话的内容，修饰「友人の話」。',
so26:'「Aのが助かる」结构：「仕事から帰る時間でも開いていて」（下班晚也开着）＋「買い物するついでに預けた服を取りに行けるのが」（顺便取衣服）。「ついでに」前接「Nの／Vる」。',
so27:'「Aないと、Bだけでなく、Cも」：「飲まないと、得られるはずの効果が得られないだけでなく、状態を悪化させる」。「だけでなく」=不仅…，「はずの」修饰「効果」。',
so28:'这也是强调句：「今回あまり並ばないで済んだのは、〜から行ったからだ」。「何時ごろがすいているか事前に確認してから行ったから」：先确认再去。',
so29:'「写真家として有名な岩本まさき氏の写真展」：「Nとして」=作为；「有名な」修饰「岩本まさき氏」；「の」连接到「写真展」。',
so30:'「Vるにつれて」=随着…。「年をとるにつれて、短く感じるようになるのは、なぜだろうか」。「のは」把前面整体名词化，「なぜ」放在句尾「だろうか」前。',
so31:'「どのような順番で提示するかによって」：「Nによって」=取决于；疑问词「どのような」放在最前，「提示するか」是疑问从句；「相手の受け止め方」是变化的对象。',
so32:'「Aをとると、Bという字になる」。「ことから」=由于…（说明名称由来）。「一」をとると「白」という字になることから、そう呼ばれています。',
so33:'「Vているうちに」=在…的过程中不知不觉。「全く興味がなかった商品なのに、CMなどで何度か見ているうちに、気になってくる」，「なのに」表示转折。',
so34:'「Aには」=为了…/要…：「理解するには」后面写条件「それなりの知識が求められるので」，再给结论「難しいと感じる人も多い」。',
so35:'「AだけでなくB」：「燃料として使われるだけでなく、プラスチック製品を作る原料としても」。「使われる」修饰「燃料として」。',
so36:'「起きかねない」=可能发生（坏事）。用它修饰「危険な状態が」，所以「大事故が起きかねない危険な状態が続いていたことが明らかになった」。',
so37:'「Aといっても」=虽说…，但…。「店長になったといっても、わからないことばかりで、自分でいいのかと悩んだ」。「ばかり」=净是。',
so38:'「Nについて」后面先放修饰「夫」的成分「否定的な」，再「夫は」，之后「一度買ってしまうと」（一旦买了就…）。',
so39:'「Nすらなくなった」=连N都没了。「すれ違っても目を合わせることすらなくなってしまった」：「ことすら」，意思“擦肩而过连对视都没有”。',
so40:'「見た目ほどの重さはないため」：「Nほど〜ない」=没有N那么…；「ため」表示原因；「一人でも楽に」=一个人也轻松。',
so41:'「Vなければと思いながらも」=虽然想着得…，但…。「しなければ」前接「返事を」，后面「仕事の予定が決まっていなくて」是没能回复的原因。',
so42:'「どこに注目して鑑賞したらいいのか」：「Vたらいい」=…就好；「かが」把疑问句作主语；「わかると」=一旦知道。',
so43:'「V ているわりに」=虽然在…却…（和预期不符）。「雪が降っているわりに、そんなに寒く感じないのは、風がほとんどないからだろう」。',
qg1:'「ざるを得ない」接「ない形」去掉「ない」：行く→行か→行かざるを得ない。选项里「ざるをえる」「なければならなかった」接法不对。',
qg2:'「V辞書形＋一方だ」=一直在…（只往一个方向变化），多接「増える/減る/悪化する」等表变化的动词。',
qg3:'「Nのついでに」=顺便做…。「Nのついでに＋另一个动作」。',
qg4:'「からしか選べない」=只能从…里选。「から」表示选择的范围，「しか…ない」=只。',
qg5:'「〜(よ)うとしなくてもいい」=不必刻意去…。「忘れよう」是意志形，加「とする」表示努力，「しなくてもいい」表示不需要。',
qg6:'「Vます形＋かねる」=难以…（委婉拒绝）。注意接「ます形」去ます：決め→決めかねます。',
qg7:'「わけにはいかない」=（因为情理/立场）不能…，前接辞书形。',
qg8:'「Vたがる」用于第三人称（孩子、他/她），第一人称用「Vたい」。',
qg9:'「V可能形＋ものなら」=如果能…的话（几乎不可能）。',
qg10:'「Nにでも」=比如…之类的（随口提议）。',
qg11:'「にもかかわらず」=尽管…，前接名词/普通形。',
qg12:'「AばかりかB」=不仅A而且B，B比A更进一层。',
qg13:'「わけがない」=不可能…；「わけにはいかない」是“不能”，「わけではない」是“并非”，别混。',
qg14:'「AどころかB」=别说A，连B都…（B比A更不可能）。',
qg15:'「Vつつある」=正在逐渐…，书面语，表示变化正在进行。',
qg16:'「Vます形＋がちだ」=容易…（多指不好的倾向）。',
s1:"「ざるを得ない」接ない形去ない：頼る→頼らざるを得ない。「なかった」放最后表示过去。",
s2:"「Vる＋一方だ」=一直…。主语「人口は」，动词「増える」，再接「一方だ」。",
s3:"「Nのついでに」=顺便…；先名词「買い物」+「の」+「ついでに」，再接要顺便做的事。",
s4:"「から」表示选择范围，「しか＋否定」=只。「2種類からしか選べない」。",
s5:"「忘れよう（意志形）＋と＋しなくても＋いい」=不必刻意去忘记。",
s6:"「Vる＋わけにはいかない」=情理上不能…。",
s7:"「お答え＋しかねます」=难以回答。「かねる」接ます形去ます。",
s8:"第三人称的愿望用「Vたがる」：遊びたがる。",
s9:"「できるものなら」=如果可能的话，后面接愿望「やり直したい」。",
s10:"「Nにでも」=…之类的；「行ってみたら」=去看看怎么样（建议）。",
s11:"对方在等=尊敬语「お待ちです」（お＋Vます形＋です）。",
s12:"我在等对方=谦让语「お待ちしております」。",
s13:"我去对方家=谦让「伺う」，「伺います」。",
s14:"对方给我=「くださる」，主语是老师，用「が」。",
s15:"我从老师那里得到=「いただく」，老师用「に」。",
s16:"自我介绍=「申す」，「と申します」。",
s17:"对方吃=尊敬「召し上がる」，「召し上がってください」。",
s18:"店员对客人=「お探し＋ですか」（尊敬），不用「お探しして」。",
s19:"「ドアが」+自动词「開いている」=门是开着的状态。",
s20:"「ドアを」+他动词「開けておいた」=有人事先把门打开了。",
s21:"「電気が」+自动词「ついている」=灯亮着。",
s22:"「財布を」+他动词「落としてしまった」=自己弄丢了；「落ちて」是自动词，主语应是「財布が」。",
s23:"「日程が」+自动词「決まりました」=定下来了。",
s24:"「荷物が」+自动词「届きました」=到了。",
s25:"「Vるところだった」=差点…（结果没发生）。",
s26:"「お言葉に甘えて」=接受对方的好意；后面接要做的事。",
s27:"「Nどころではない」=哪有心思做N。",
s28:"「Vないことはない」=也不是不…；后面常接「んですが」表保留。",
s29:"「Vてもらえると助かる」=你能…的话帮大忙了，用来礼貌请求。",
s30:"「Vさせていただけませんか」=能否允许我…（请求许可）。",
s31:"「Vようがない」=无法…；「連絡のしようがない」。",
s32:"「V＋わけがない」=不可能…，「ができる」前面的「が」接「そんなこと」。",
s33:"「Vる＋に限る」=…最好。",
s34:"「Nにもかかわらず」=尽管…；后面接事实「試合は行われた」。",
s35:"「AばかりかB」=不但A而且B；A是英语，B是更进一层的汉语。",
s36:"「Vつつある」=正在逐渐…；前接ます形。",
s37:"「Vます形＋がちだ」=容易…；引く→引き＋がち。",
s38:"「Nに際して」=在…之际；「ご利用」是名词，「に際しては」后接要求。",
qk1:"客人是动作主体→尊敬：お待ちです；「お待ちしております」是我等对方。",
qk2:"我去对方家=谦让「伺う」；「いらっしゃる」「召し上がる」「おっしゃる」都是尊敬。",
qk3:"「くださる」=对方给我（主语是对方），「いただく」是我得到。",
qk4:"我从老师处得到=「いただく」。看清谁是动作主语：我→谦让。",
qk5:"「お＋Vます形＋になる」=尊敬语，对象是部长。",
qk6:"对老师说“您知道吗”=「ご存じですか」，「存じる」只能用于自己。",
qk7:"我做的事=谦让「ご＋汉语词＋する」。",
qk8:"请对方吃=「召し上がってください」，「いただく」是自己吃。",
qk9:"店员对客人=「お探しですか」。",
qk10:"「です」的郑重形是「でございます」。",
qk11:"自我介绍=「申します」，「おっしゃる」是别人说。",
qk12:"老师看=尊敬「ご覧になる」，「拝見」是我看。",
qk13:"「お待ちください」=请您等，是固定敬语请求。",
qk14:"社长来了=尊敬「いらっしゃる」；「参る」「伺う」是我方动作。",
qk15:"我在公司=谦让「おる」；「いらっしゃる」是尊敬。",
qk16:"我问对方=谦让「お伺いする」。",
qj1:"「窓が」+自动词「開いて」，「開けて」要加「を」。",
qj2:"「電気を」+他动词「消す」，「消えて」是自动词。",
qj3:"「荷物が」+自动词「届く」。",
qj4:"「水を」+他动词「止める」。",
qj5:"「財布を」+他动词「落とす」。",
qj6:"「日程が」+自动词「決まる」。",
qj7:"「お湯が」+自动词「沸く」；「お湯を」才用「沸かす」。",
qj8:"「鍵を」+他动词「かける」；自动词是「かかる」（鍵がかかる）。",
qj9:"「子どもを」+他动词「起こす」；自己起床是「起きる」。",
qj10:"「ご飯が」+自动词「炊ける」（饭煮好了）；他动词是「炊く」。",
qj11:"「洗濯物を」+他动词「乾かす」；「乾く」是自己干。",
qj12:"「Nに会う」，「に」前面是对方，和自他动词无关，别被「を」干扰。"
};
window.DATA=window.DATA||{};DATA.orig=[{"id": "o1", "src": "2016.7 #13", "sec": "語彙", "q": "この土地は、国の管理（　）に置かれている。", "o": ["属", "付", "下", "限"], "a": 2, "pick": 4, "e": "「管理下に置く」=置于管理之下。「〜下」表示在…影响/控制之下（支配下・影響下・監視下）。"}, {"id": "o2", "src": "2016.7 #16", "sec": "語彙", "q": "その話が本当かどうか分からないのに、確認もしないで（　）信じてしまった。", "o": ["率直に", "安易に", "柔軟に", "短気に"], "a": 1, "pick": 1, "e": "「安易に」=不动脑筋、轻率地。率直=坦率，柔軟=灵活，短気=急性子，都不能修饰“信じてしまった”。"}, {"id": "o3", "src": "2016.7 #18", "sec": "語彙", "q": "先週は忙しかったので、週末は家で本を読んで（　）過ごした。", "o": ["だぶだぶ", "がらがら", "ぐっすり", "のんびり"], "a": 3, "pick": 3, "e": "「のんびり過ごす」=悠闲度过。ぐっすり只搭配“眠る”，不能搭配“過ごす”。"}, {"id": "o4", "src": "2016.7 #27", "sec": "言い換え", "q": "高橋さんは、そんな【ひきょう】なやり方はしませんよ。", "o": ["危ない", "ずるい", "厳しい", "しつこい"], "a": 1, "pick": 1, "e": "「卑怯な」=不光明正大、耍滑 ≒「ずるい」。"}, {"id": "o5", "src": "2016.7 #32", "sec": "用法", "q": "【生じる】", "o": ["海外の生活では、習慣の違いから誤解が生じることがある。", "この果物は温暖な気候の地域を中心に生じている。", "新しい技術が生じたおかげで、生産量が大幅に増加した。", "この大学からは有名な研究者が多く生じている。"], "a": 0, "pick": 2, "e": "「生じる」用于问题、误会、变化等“产生/发生”。果实“产”用「とれる」，“出现新技术”用「開発される」，“培养出”用「輩出する」。"}, {"id": "o6", "src": "2016.7 #33", "sec": "文法", "q": "この国で、卵、牛乳（　）3番目に多い食物アレルギーは、小麦アレルギーだ。", "o": ["についで", "に沿って", "に代わって", "にしたがって"], "a": 0, "pick": 3, "e": "「Nに次いで」=仅次于N（排第几）。"}, {"id": "o7", "src": "2016.7 #35", "sec": "文法", "q": "私は漫画ばかり読んでいると思われているようだが、そんなことはない。たまには小説を読むこと（　）ある。", "o": ["なんて", "だって", "のほかにも", "のほうが"], "a": 1, "pick": 3, "e": "「Vることだってある」=也有…的时候（「だって」=也）。"}, {"id": "o8", "src": "2016.7 #36", "sec": "文法", "q": "私は、進学するか就職するか迷ったが、家族や先生と何日も（　）、進学を選んだ。", "o": ["話し合った末に", "話し合って以来", "話し合ったきり", "話し合って初めて"], "a": 0, "pick": 3, "e": "「Vた末に」=经过…之后（最终）。「きり」后面接否定，「以来」是持续到现在。"}, {"id": "o9", "src": "2016.7 #38", "sec": "文法", "q": "実家の押し入れを片付けていたら、祖父母の結婚式の写真が出てきた。よくこんな昔の写真が今まで残っていた（　）。", "o": ["わけだ", "ものだ", "だろうか", "のではないか"], "a": 1, "pick": 1, "e": "「よく〜ものだ」=（感叹）居然…。表示惊讶、感慨。"}, {"id": "o10", "src": "2016.7 #39", "sec": "文法", "q": "今回の戦略が有効であったかどうかは、まだ結果が出ていない現時点では（　）。", "o": ["判断すべきだ", "判断しかねる", "判断したにすぎない", "判断せざるを得ない"], "a": 1, "pick": 4, "e": "结果没出，所以“现在难以判断”=「判断しかねる」。「せざるを得ない」是“不得不判断”，语义不合。"}, {"id": "o11", "src": "2016.7 #42", "sec": "文法", "q": "自分のアドバイスが相手の人生を大きく変える（　）、誰でも慎重になるだろう。", "o": ["かもしれない一方で", "しかない一方で", "かもしれないとしたら", "しかないとしたら"], "a": 2, "pick": 4, "e": "「かもしれないとしたら」=假如可能…的话。「一方で」是“另一方面”，不合逻辑。"}, {"id": "o12", "src": "2016.7 #43", "sec": "文法", "q": "近所の図書館によく行くが、人気の本が貸し出し中で読めないことが多いので、もっと数を増やして、たくさんの人が読める（　）。", "o": ["ようにしてほしい", "ようになりたい", "ようにすることができる", "ようになろうとしている"], "a": 0, "pick": 2, "e": "「Vようにしてほしい」=希望（别人）做到…。主语不是说话人本人，所以不能用「なりたい」。"}, {"id": "o13", "src": "2016.7 #44", "sec": "文法", "q": "（店で）客「この携帯電話を解約したいんですが。」店員「かしこまりました。差し支えなければ、解約の理由を（　）。」", "o": ["お聞きしませんか", "お聞きになりますか", "お聞きしてもよろしいでしょうか", "お聞きになったらいかがですか"], "a": 2, "pick": 1, "e": "店员问客人=谦让「お聞きする」；「Vてもよろしいでしょうか」是礼貌征求许可。「お聞きになる」是对方的动作。"}, {"id": "o14", "src": "2017.7 #8", "sec": "表記", "q": "私たちの団体は傷ついた動物を【すくう】活動をしています。", "o": ["治う", "助う", "救う", "療う"], "a": 2, "pick": 2, "e": "「救う」=救助。「助ける」才写“助”。"}, {"id": "o15", "src": "2017.7 #9", "sec": "表記", "q": "CDの売れ行きは【こうちょう】だ。", "o": ["好調", "快調", "好長", "快長"], "a": 0, "pick": 4, "e": "「好調」=（业绩、行情）顺利。「快調」多用于身体/机器状态好。"}, {"id": "o16", "src": "2017.7 #10", "sec": "表記", "q": "この機械は【えいきゅう】に動くわけではない。", "o": ["延久", "永遠", "永久", "延遠"], "a": 2, "pick": 2, "e": "「永久」=永久（えいきゅう）；「永遠」读えいえん。"}, {"id": "o17", "src": "2017.7 #12", "sec": "造語", "q": "今の社長は（　）社長より15歳も若い。", "o": ["先", "前", "昨", "去"], "a": 1, "pick": 1, "e": "「前社長」=前任社长。「先」用于先月・先週，不用于人的前任。"}, {"id": "o18", "src": "2017.7 #15", "sec": "造語", "q": "前の席の人は石川さんのような気がするが、（　）後ろからでは顔が見えない。", "o": ["本", "正", "真", "完"], "a": 2, "pick": 2, "e": "「真後ろ」=正后方（真上・真横・真後ろ）。「正面」才用「正」。"}, {"id": "o19", "src": "2017.7 #17", "sec": "語彙", "q": "今週は、暑くも寒くもなく、強い風も吹かず、（　）天気が続いている。", "o": ["柔らかな", "穏やかな", "滑らかな", "緩やかな"], "a": 1, "pick": 1, "e": "「穏やかな天気」=平稳温和的天气。"}, {"id": "o20", "src": "2017.7 #19", "sec": "語彙", "q": "雑誌に新しい広告を出して、わが社の商品の良さを消費者にもっと（　）したい。", "o": ["アピール", "インストール", "チャージ", "セット"], "a": 0, "pick": 4, "e": "「アピールする」=宣传、展示魅力。"}, {"id": "o21", "src": "2017.7 #22", "sec": "語彙", "q": "あの二人はさっきから（　）話しているが、他人に聞かれては困る話なのだろうか。", "o": ["ぐっすり", "うろうろ", "ひそひそ", "ばっさり"], "a": 2, "pick": 2, "e": "「ひそひそ話す」=小声说悄悄话。"}, {"id": "o22", "src": "2017.7 #24", "sec": "言い換え", "q": "もし資料に【あやまり】があったら知らせてください。", "o": ["読みにくいところ", "汚れているところ", "わかりにくいところ", "間違っているところ"], "a": 3, "pick": 3, "e": "「誤り」=错误 ≒「間違い」。"}, {"id": "o23", "src": "2017.7 #26", "sec": "言い換え", "q": "高橋さんなら【とっくに】帰りましたよ。", "o": ["ずっと前に", "一人で", "あわてて", "何も持たずに"], "a": 0, "pick": 2, "e": "「とっくに」=早就（≒ずっと前に）。"}, {"id": "o24", "src": "2017.7 #27", "sec": "言い換え", "q": "あの自転車は弟に【ゆずりました】。", "o": ["貸しました", "もらいました", "あげました", "借りました"], "a": 2, "pick": 2, "e": "「譲る」=转让给别人（≒あげる）。方向是“我→弟弟”。"}, {"id": "o25", "src": "2017.7 #28", "sec": "用法", "q": "【頂上】", "o": ["この星は、夏の夜12時頃、空の頂上のあたりに見える。", "山に登り始めて5時間ぐらいして、ようやく頂上に着いた。", "この家の2階の部屋は、頂上にも窓がついているので、とても明るい。", "本棚がいっぱいになってしまい、本棚の頂上にも本を置いている。"], "a": 1, "pick": 4, "e": "「頂上」=山顶/最高点（山の頂上）。天空最高处是「真上」，书架顶是「上」。"}, {"id": "o26", "src": "2017.7 #30", "sec": "用法", "q": "【分解】", "o": ["機械の調子が悪かったので、分解して部品の点検をした。", "すいかを買ってきたが、大きくて冷蔵庫に入らなかったので、四つに分解した。", "細かいお金がなかったので、近くの店で千円札を分解してもらった。", "急ぎの仕事が入ったので、三人で分解して進めることにした。"], "a": 0, "pick": 2, "e": "「分解」=拆开成零件/成分。切西瓜=「切る」，换零钱=「両替」，分担工作=「分担」。"}, {"id": "o27", "src": "2017.7 #34", "sec": "文法", "q": "時間のある学生時代に、もっと本を読んだり、海外旅行に行ったりしておけばよかった。あのころに戻れる（　）戻りたい。", "o": ["かわりに", "とすると", "ものなら", "にしたって"], "a": 2, "pick": 1, "e": "「戻れるものなら戻りたい」=如果能回去的话真想回去（几乎不可能）。"}, {"id": "o28", "src": "2017.7 #35", "sec": "文法", "q": "転校する友人からの手紙に「たとえ遠く（　）、私たちの友情は変わらない」と書いてあった。", "o": ["離れても", "離れなくて", "離れるけれど", "離れなければ"], "a": 0, "pick": 4, "e": "「たとえ…ても」=即使…也，是固定呼应。"}, {"id": "o29", "src": "2017.7 #36", "sec": "文法", "q": "祖母は、留学中の私のことが（　）らしい。", "o": ["心配どおり", "心配でならない", "心配すべき", "心配してもしかたない"], "a": 1, "pick": 1, "e": "「Nでならない」=…得不得了（情感自然涌出）。接情感类词：心配でならない。"}, {"id": "o30", "src": "2017.7 #38", "sec": "敬語", "q": "（おもちゃ屋で）店員「お客様、何か（　）、ご案内いたしますが。」", "o": ["お探しでしたら", "探してくださいましたら", "お探ししましたら", "探させていただきましたら"], "a": 0, "pick": 3, "e": "店员对客人：「お探しでしたら」（对方的动作用尊敬）。「お探しする」是谦让，用于自己。"}, {"id": "o31", "src": "2017.7 #39", "sec": "文法", "q": "A「夏休みのキャンプ、楽しみだね」B「うん。早く夏休みに（　）。」", "o": ["なるかな", "ならないかな", "なるんだな", "ならないんだね"], "a": 1, "pick": 4, "e": "「ないかな」=真希望…（期待）。「早くなってほしい」的口语说法。"}, {"id": "o32", "src": "2017.7 #40", "sec": "文法", "q": "課長「特に急ぎじゃないので、来週（　）お願いします。」", "o": ["になら", "にでも", "でなら", "ででも"], "a": 1, "pick": 1, "e": "「Nにでも」=…之类的时候也行（缓和语气）。"}, {"id": "o33", "src": "2017.7 #44", "sec": "文法", "q": "情報化や国際化が進む現代において、学校の教育がこれまでと（　）。コンピュータなどの新しい教育内容が取り入れられるのも当然の流れだと思う。", "o": ["同じでいいはずがない", "同じというだけではない", "同じならいいに違いない", "同じにならないことはない"], "a": 0, "pick": 2, "e": "「はずがない」=不可能…；「同じでいいはずがない」=不可能和以前一样就行（要变化）。"}, {"id": "o34", "src": "2017.12 #10", "sec": "表記", "q": "全力で走ったので、息が【あらく】なった。", "o": ["暴く", "激く", "荒く", "雑く"], "a": 2, "pick": 4, "e": "「荒い」=粗、剧烈（息が荒い）。「暴く」读あばく。"}, {"id": "o35", "src": "2017.12 #11", "sec": "造語", "q": "駅の北側には、住宅（　）が広がっている。", "o": ["枠", "界", "面", "街"], "a": 3, "pick": 3, "e": "「住宅街」=住宅区；商店街・住宅街。"}, {"id": "o36", "src": "2017.12 #14", "sec": "造語", "q": "スーツを着た会社員（　）の人に道を尋ねられた。", "o": ["風", "類", "状", "式"], "a": 0, "pick": 2, "e": "「N風」=像N的样子（会社員風・外国人風）。"}, {"id": "o37", "src": "2017.12 #15", "sec": "造語", "q": "日本は（　）外国から資源を輸入している。", "o": ["多", "種", "諸", "複"], "a": 2, "pick": 1, "e": "「諸外国」=各国、许多外国。"}, {"id": "o38", "src": "2017.12 #19", "sec": "語彙", "q": "電車に遅れそうだったが、（　）間に合って何とか乗れた。", "o": ["ばったり", "ぐっすり", "ぎりぎり", "がらがら"], "a": 2, "pick": 1, "e": "「ぎりぎり」=勉勉强强（赶上）。ばったり=偶然遇见，がらがら=空荡荡。"}, {"id": "o39", "src": "2017.12 #24", "sec": "言い換え", "q": "中村さんは【不平】ばかり言っている。", "o": ["文句", "冗談", "うそ", "自慢"], "a": 0, "pick": 4, "e": "「不平」=牢骚、不满 ≒「文句」。"}, {"id": "o40", "src": "2017.12 #27", "sec": "言い換え", "q": "今回の件は、【まれ】な例です。", "o": ["複雑な", "よくある", "ほとんどない", "単純な"], "a": 2, "pick": 1, "e": "「まれ」=稀有 ≒「ほとんどない」。"}, {"id": "o41", "src": "2017.12 #30", "sec": "用法", "q": "【いっせいに】", "o": ["卒業の日に撮った記念写真には、同じクラスの生徒がいっせいに写っている。", "公園で小さな子どもたちがいっせいに遊んでいる様子は、とてもかわいらしい。", "明日は家族でいっせいにめいの結婚式に招待されているので、とても楽しみだ。", "演奏が終わると、観客は舞台に向かっていっせいに大きな拍手を送った。"], "a": 3, "pick": 3, "e": "「いっせいに」=同一时刻一齐做同一动作（短时间内）。“一起玩”“一起被邀请”都不是“同时开始”。"}, {"id": "o42", "src": "2017.12 #35", "sec": "文法", "q": "（テレビ番組で）森「ありがとうございます。（　）受賞できるとは思わなかったので、すごくうれしいです。」", "o": ["たとえ", "まさか", "せめて", "かりに"], "a": 1, "pick": 1, "e": "「まさか〜とは思わなかった」=万万没想到。"}, {"id": "o43", "src": "2017.12 #36", "sec": "文法", "q": "毎朝体操を（　）、硬かった体が柔らかくなった。", "o": ["続けるうちに", "続けるからには", "続けるとすると", "続けるかというと"], "a": 0, "pick": 3, "e": "「Vているうちに」=在…的过程中（不知不觉变化）。"}, {"id": "o44", "src": "2017.12 #39", "sec": "敬語", "q": "客「『山の中で』っていう本を探しているんですけど。」店員「はい、新刊コーナーに（　）。ご案内します。」", "o": ["いたします", "おります", "ございます", "なさいます"], "a": 2, "pick": 1, "e": "店员说“有”=「ございます」（ある的郑重语）。「おります」是“人在”。"}, {"id": "o45", "src": "2017.12 #41", "sec": "文法", "q": "先生「海や川に落ちてしまったときは、無理に（　）、仰向けになって、浮かんで助けを待つことが大切です。」", "o": ["泳げなくなると", "泳ごうとしないので", "泳げなくなって", "泳ごうとしないで"], "a": 3, "pick": 2, "e": "「Vないで、〜」=不…而…（并列/附带）。这里是建议：不要勉强游，而是仰面漂着。"}, {"id": "o46", "src": "2017.12 #43", "sec": "文法", "q": "妻「このスープ、味、薄くない？もう少し塩を（　）。」夫「ううん、ちょうどいいよ。」", "o": ["入れたことはよかったね", "入れたからよかったなあ", "入れたほうがよかったかな", "入れたところがよかったよね"], "a": 2, "pick": 1, "e": "「Vたほうがよかったかな」=是不是应该…（后悔/担心）。"}, {"id": "o47", "src": "2017.12 #44", "sec": "敬語", "q": "X高校野球部の南選手は「監督やコーチが私たち一人一人に毎日熱心に指導を（　）。監督やコーチのためにも、優勝したいです。」と述べた。", "o": ["いらっしゃいました", "してくださいました", "まいりました", "していただきました"], "a": 1, "pick": 4, "e": "监督、教练给“我们”做指导=「してくださる」（对方为我做）。「していただく」是我得到对方做，主语要变。"}, {"id": "o48", "src": "2018.7 #7", "sec": "表記", "q": "このセミナーの目標は、「自分で考える力」を【やしなう】ことです。", "o": ["得う", "築う", "育う", "養う"], "a": 3, "pick": 3, "e": "「養う」=培养、养成。"}, {"id": "o49", "src": "2018.7 #8", "sec": "表記", "q": "ガラスの【はへん】を踏まないように気をつけてください。", "o": ["破片", "被片", "破辺", "被辺"], "a": 0, "pick": 3, "e": "「破片」=碎片。"}, {"id": "o50", "src": "2018.7 #10", "sec": "表記", "q": "時間がないので、詳しい説明は【はぶき】ます。", "o": ["略きます", "除きます", "省きます", "抜きます"], "a": 2, "pick": 1, "e": "「省く」=省略。"}, {"id": "o51", "src": "2018.7 #14", "sec": "造語", "q": "大臣の下に二人の（　）大臣がいるのが一般的です。", "o": ["補", "助", "次", "副"], "a": 3, "pick": 3, "e": "「副大臣」=副部长；副〜表示副职。"}, {"id": "o52", "src": "2018.7 #17", "sec": "語彙", "q": "料理本を見ながら、自分の好みに合うように味付けを（　）する。", "o": ["コメント", "デザイン", "アレンジ", "ケア"], "a": 2, "pick": 2, "e": "「アレンジする」=改编、调整。"}, {"id": "o53", "src": "2018.7 #20", "sec": "語彙", "q": "クイズの答えがわからなくて（　）答えたのに、正解だった。", "o": ["でたらめに", "わがままに", "ぎざぎざに", "ごちゃごちゃに"], "a": 0, "pick": 2, "e": "「でたらめに答える」=瞎答。"}, {"id": "o54", "src": "2018.7 #22", "sec": "語彙", "q": "来月の結婚式に向けて準備が（　）進んでいる。", "o": ["着々と", "慎重に", "いちいち", "ぐんぐん"], "a": 0, "pick": 3, "e": "「着々と進む」=稳步推进。ぐんぐん多用于成长、快速上升。"}, {"id": "o55", "src": "2018.7 #24", "sec": "言い換え", "q": "その作家は【あわれな】人生を送った。", "o": ["退屈な", "おかしな", "かわいそうな", "不安な"], "a": 2, "pick": 2, "e": "「あわれな」=可怜的 ≒「かわいそうな」。"}, {"id": "o56", "src": "2018.7 #25", "sec": "言い換え", "q": "【当分】は使わない予定です。", "o": ["これから", "全部", "今回", "しばらく"], "a": 3, "pick": 3, "e": "「当分」=暂时、一段时间 ≒「しばらく」。"}, {"id": "o57", "src": "2018.7 #27", "sec": "言い換え", "q": "テストの前日になって【じたばた】してもしかたない。", "o": ["慌てても", "心配しても", "緊張しても", "悩んでも"], "a": 0, "pick": 3, "e": "「じたばたする」=手忙脚乱地挣扎 ≒「慌てる」。"}, {"id": "o58", "src": "2018.7 #32", "sec": "用法", "q": "【きっぱり】", "o": ["めがねをかけると、遠くの物もきっぱり見えるようになる。", "このラーメンはもう何度も食べたので、きっぱり飽きてしまった。", "鈴木さんは石川さんからのデートの誘いをきっぱり断った。", "むかしのことはなかなかきっぱり思い出せない。"], "a": 2, "pick": 1, "e": "「きっぱり」=干脆、断然（断る・言う・やめる）。看得清楚是「はっきり」。"}, {"id": "o59", "src": "2018.7 #33", "sec": "文法", "q": "昨日泊まったホテルの部屋は、シングルルーム（　）広かった。", "o": ["ばかりか", "をとわず", "にしては", "かというと"], "a": 2, "pick": 1, "e": "「NにしてはA」=作为N来说算…（与预期相反）。"}, {"id": "o60", "src": "2018.7 #37", "sec": "文法", "q": "散歩が大好きなうちの犬が、今日は散歩に（　）。具合でも悪いのだろうか。", "o": ["行きたがらなかった", "行かなければよかった", "行ってほしくなかった", "行きたくなかった"], "a": 0, "pick": 3, "e": "第三人称（狗）的愿望/不愿意=「Vたがらない」。「行きたくなかった」只能用于说话人自己。"}, {"id": "o61", "src": "2018.7 #39", "sec": "敬語", "q": "社長「社を代表して、私から一言ごあいさつ（　）。」", "o": ["されます", "うかがいます", "申し上げます", "おっしゃいます"], "a": 2, "pick": 1, "e": "我（社长）致辞=谦让「ご＋汉语词＋申し上げる」。「されます」是别人的动作。"}, {"id": "o62", "src": "2018.7 #42", "sec": "文法", "q": "母：タカシ、寝る前に必ず明日の準備を（　）。朝慌てて準備すると絶対忘れ物するから。", "o": ["してあるんだよ", "しておきなさいよ", "してあるんじゃないの", "しておいたの"], "a": 1, "pick": 1, "e": "「Vておきなさい」=事先做好（命令/叮嘱）。「してある」是已经做好的状态，和“还没做”矛盾。"}, {"id": "o63", "src": "2018.7 #44", "sec": "文法", "q": "石川「それも面白そうですが、私はアンケートの分析方法を（　）。」", "o": ["取り上げようとするでしょうか", "取り上げるようになるでしょうか", "取り上げたいのだろうと思います", "取り上げてみてはどうかと思います"], "a": 3, "pick": 3, "e": "向大家提议=「Vてみてはどうか」。说话人自己的想法不能说「たいのだろう」。"}, {"id": "o64", "src": "2018.12 #17", "sec": "語彙", "q": "今日の海は波が高く、船が揺れたせいで、気分が悪くなる人が（　）した。", "o": ["続行", "続出", "持続", "継続"], "a": 1, "pick": 3, "e": "「続出する」=接连出现（病人、问题）。"}, {"id": "o65", "src": "2018.12 #19", "sec": "語彙", "q": "私は大学を卒業したら、（　）に戻って実家の近くで就職したいと思う。", "o": ["地元", "根元", "土台", "立場"], "a": 0, "pick": 2, "e": "「地元」=本地、家乡。"}, {"id": "o66", "src": "2018.12 #22", "sec": "言い換え", "q": "青木さんはしばらく黙って【うつむいて】いた。", "o": ["遠くを見て", "目を閉じて", "下を向いて", "腕を組んで"], "a": 2, "pick": 2, "e": "「うつむく」=低头 ≒「下を向く」。"}, {"id": "o67", "src": "2018.12 #23", "sec": "言い換え", "q": "この犬は、本当に【利口な】犬ですね。", "o": ["かわいい", "頭がいい", "元気な", "かっこいい"], "a": 1, "pick": 4, "e": "「利口」=聪明 ≒「頭がいい」。"}, {"id": "o68", "src": "2018.12 #24", "sec": "言い換え", "q": "もう少し【用心した】ほうがいいんじゃないですか。", "o": ["落ち着いた", "がんばった", "よく考えた", "気をつけた"], "a": 3, "pick": 3, "e": "「用心する」=小心提防 ≒「気をつける」。"}, {"id": "o69", "src": "2018.12 #25", "sec": "言い換え", "q": "説明が【くどくて】すみません。", "o": ["つまらなくて", "下手で", "複雑で", "しつこくて"], "a": 3, "pick": 3, "e": "「くどい」=啰嗦 ≒「しつこい」。"}, {"id": "o70", "src": "2018.12 #27", "sec": "用法", "q": "【鈍い】", "o": ["私は数学が苦手で、計算がとても鈍い。", "今日は仕事が暇で、時間がたつのが鈍く感じられた。", "彼は仕事が鈍いが、その分丁寧だ。", "疲れているのか、彼はいつもより動きが鈍い。"], "a": 3, "pick": 2, "e": "「鈍い」=动作/反应迟钝、不灵敏。计算慢=「遅い」，时间慢=「遅く」。"}, {"id": "o71", "src": "2018.12 #29", "sec": "用法", "q": "【多彩】", "o": ["高橋氏は、小説家や画家として多彩な活動を行っている。", "今夜は空に星が多彩に輝いていて、とてもきれいです。", "文章にあいまいな表現を使うと、読者が多彩な理解をするだろう。", "木村さんには生活全般において多彩にお世話になりました。"], "a": 0, "pick": 4, "e": "「多彩」=丰富多彩（活动、才能、色彩种类多）。"}, {"id": "o72", "src": "2018.12 #32", "sec": "文法", "q": "さっき、買い物（　）、コンビニに寄ってATMでお金を下ろしてきた。", "o": ["の場合", "にしては", "のついでに", "というのは"], "a": 2, "pick": 2, "e": "「Nのついでに」=顺便。"}, {"id": "o73", "src": "2018.12 #35", "sec": "文法", "q": "12月に入り、インフルエンザの患者数は増える（　）。", "o": ["ほどだ", "までだ", "一方だ", "次第だ"], "a": 2, "pick": 4, "e": "「Vる一方だ」=持续不断地…（单向变化）。"}, {"id": "o74", "src": "2018.12 #36", "sec": "文法", "q": "わが国は、石油や石炭などのエネルギー資源がほとんどないため、多くを海外からの輸入に（　）。", "o": ["頼らざるを得ない", "頼るわけにはいかない", "頼らないに違いない", "頼ることにほかならない"], "a": 0, "pick": 2, "e": "「Vざるを得ない」=不得不…。"}, {"id": "o75", "src": "2018.12 #37", "sec": "敬語", "q": "（会社で）受付「A社の山下様が受付で（　）。」", "o": ["お待ちです", "待っております", "お待ちください", "待っていただけますか"], "a": 0, "pick": 2, "e": "山下先生是客人，在等=尊敬语「お待ちです」。「待っております」是我方在等。"}, {"id": "o76", "src": "2018.12 #38", "sec": "文法", "q": "レストランハヤマのランチは、AランチかBランチの2種類（　）選べないが、安くてとてもおいしい。", "o": ["にしか", "にだけ", "からしか", "からだけ"], "a": 2, "pick": 1, "e": "「から選ぶ」，所以用「からしか選べない」。"}, {"id": "o77", "src": "2018.12 #41", "sec": "文法", "q": "A「別れた彼のことがなかなか忘れられなくて…」B「忘れられないなら、そんなに無理に（　）と思うよ。」", "o": ["忘れてしまいたくない", "忘れようとしているんだ", "忘れてしまうんだろう", "忘れようとしなくてもいい"], "a": 3, "pick": 2, "e": "「Vようとしなくてもいい」=不必勉强去…。"}, {"id": "o78", "src": "2019.7 #6", "sec": "表記", "q": "私の【しゅみ】はピアノをひくことだ。", "o": ["趣味", "興味", "好味", "習味"], "a": 0, "pick": 2, "e": "「趣味」=兴趣爱好；「興味」=兴趣、关心。"}, {"id": "o79", "src": "2019.7 #16", "sec": "語彙", "q": "彼は（　）な返事をしていたから、パーティーに来るかどうかわからない。", "o": ["地味な", "かすかな", "あいまいな", "鈍感な"], "a": 2, "pick": 4, "e": "「あいまいな返事」=含糊的回答。"}, {"id": "o80", "src": "2019.7 #20", "sec": "語彙", "q": "次の社長に最も（　）人は、経験豊富な鈴木さんでしょう。", "o": ["ふさわしい", "等しい", "ありがちな", "当たり前な"], "a": 0, "pick": 3, "e": "「ふさわしい」=适合、相称。"}, {"id": "o81", "src": "2019.7 #21", "sec": "言い換え", "q": "この辺りも【物騒に】なってきた気がする。", "o": ["きれいじゃなくなってきた", "うるさくなってきた", "安全じゃなくなってきた", "さびしくなってきた"], "a": 2, "pick": 2, "e": "「物騒」=治安差、不安全。"}, {"id": "o82", "src": "2019.7 #22", "sec": "言い換え", "q": "その話を聞いて【落ち込んだ】。", "o": ["緊張した", "びっくりした", "がっかりした", "心配した"], "a": 2, "pick": 4, "e": "「落ち込む」=情绪低落 ≒「がっかりする」。"}, {"id": "o83", "src": "2019.7 #24", "sec": "言い換え", "q": "その話を聞いて、みんな【同情した】。", "o": ["しかたないと思った", "うらやましいと思った", "なつかしいと思った", "かわいそうだと思った"], "a": 3, "pick": 1, "e": "「同情する」=同情 ≒「かわいそうだと思う」。"}, {"id": "o84", "src": "2019.7 #27", "sec": "用法", "q": "【初歩】", "o": ["3年前に英語を初歩から始め、今では自由に話せるようになった。", "バスケットボールの試合で、初歩から大量の点を取られた。", "今日の暑さはまだほんの初歩で、これからますます暑くなっていくだろう。", "兄とのけんかの初歩は、くだらないことだった。"], "a": 0, "pick": 4, "e": "「初歩」=入门阶段（学习、技能）。比赛开头是「序盤」，起因是「きっかけ」。"}, {"id": "o85", "src": "2019.7 #28", "sec": "用法", "q": "【だらしない】", "o": ["昨日作ったスープは塩が足りなかったのか、とてもだらしない味だった。", "この公園は管理する人がいないので、あちこちに草がだらしなく生えている。", "知識がだらしなかったせいで、間違ったことを人に教えてしまった。", "先月までは、仕事もしないで遊んでばかりのだらしない生活をしていた。"], "a": 3, "pick": 3, "e": "「だらしない」=邋遢、散漫（生活、服装、态度）。"}, {"id": "o86", "src": "2019.7 #29", "sec": "用法", "q": "【即座に】", "o": ["私が駅に着くと即座に友人たちも来た。", "さっきまで晴れていたのに、即座に雲が出てきた。", "先生は学生からの質問に即座に答えた。", "一月になってから即座に仕事が忙しくなった。"], "a": 2, "pick": 1, "e": "「即座に」=当场、马上（对提问、要求立刻回应）。"}, {"id": "o87", "src": "2019.7 #30", "sec": "用法", "q": "【尽きる】", "o": ["あしたで定期券の期限が尽きるので、新しいのを買いに行った。", "森さんと会うのは久しぶりだったので、いくら話しても話が尽きなかった。", "木村選手は、けがのせいで連続出場の記録が尽きてしまった。", "この作家の絵が好きなので、展示会が尽きないうちにもう一度見に来たい。"], "a": 1, "pick": 1, "e": "「尽きる」=用尽、没有了（話・力・お金）。期限=「切れる」，记录=「途切れる」，展览=「終わる」。"}];window.DATA=window.DATA||{};
DATA.rdp={"p16c": "【留学生の作文】25時　ロベズ エドガー\n先日、サッカーの日本代表が海外で試合を行い、その試合が深夜にテレビで生中継された。生中継が始まる前に、放送は何時からか確認しようとインターネットで調べて驚いた。あるサイトに「金曜25時放送」と書いてあったのだ。一日は（ 50 ）。\n知人に聞いて、「金曜25時」というのは土曜の午前1時のことだと知った。「25時」のような表現は、店の営業時間の掲示などでも見るという。なぜ、午前1時を「25時」と表現するのだろうか。\n（ 51 ）表現を使い始めたのはテレビ局だとする説が有力だ。日本の多くのテレビ局では、朝4時前後に一日の放送が始まり、そこからの24時間を一日と考える。つまり、テレビ局にとっては、夜の0時が一日の終わりではない。22時、23時ときたら、その次は0時ではなく24時で、午前1時は25時なのである。このようにして「25時」という表現が（ 52 ）。\n現代の日本社会は夜型化が進み、午前0時を過ぎても活動している人が多い。だから、午前0時を過ぎても「今日」は続く。（ 53 ）、「起きてから寝るまでが今日」だと考えれば、翌日の午前1時ではなく、その日の25時と表現したほうが的確かもしれない。私も、土曜の午前1時に見た番組は金曜の夜に見たという感じがするので、金曜25時と考えたほうが実際の感覚に近い気もする。生活の夜型化と「寝るまでが今日」という考え方が、24時間しかない一日に「25時」を（ 54 ）。", "p16_59": "手紙というものは、不思議な伝達手段である。\n書いている人間の気持ちは必ずといっていいほど文面に出る。心配もしていないのに、心配を押し売りする（注1）ような手紙を書いてはいけない。そのような気持ちは封（注2）を開いた瞬間に、真っ先に相手に届いてしまう。それが手紙の一番に恐ろしいところと言えよう。\n愛している気持ちは届くかもしれないが、同時にその幼稚さや、愛の浅さや、性格の悪さまでもが相手に届いてしまう。\n手紙というものは、人間の心を映す鏡のような存在でもある。\n（辻仁成『代筆屋』による）\n（注1）心配を押し売りする：ここでは、心配していると思わせる　（注2）封：ここでは、封筒", "p16_ehon": "以下は、絵本の選び方について述べた文章である。\nたいへん有効な一つの方法は、絵本を見るとき、子どもと同じやり方、つまり、字は読まず、絵だけで物語を追っていくというやり方で、絵本を見ていくことです。わたしも、新しい本を手にしたときは、かならずこのやり方で見ることにしていますが、そうすると、いろんなことが、とてもよくわかってきます。\n字にたよらず絵だけ見ることは、わたしたちの心を、必然的に、単純で具体的な考え方のレベルにとどめてくれますし、当然のことながら、絵の中に意味をさぐろうとする心の働きを強めてくれます。そうして見ていくと、絵それ自体が何かを語りかけてくれる場合と、文を読んでからでなければ何の意味ももたない、いわば装飾的な働きしかしていない場合とが、実にはっきりしてきます。絵が何かを語りかけてくれないものは、ほんとうの意味では絵本とはいえないので、こうして見ていくと、体裁は絵本でも、①【絵本とは呼べないもの】が少なくないことがわかってきます。（中略）\nまた絵だけを丹念に見ていると、絵のもつ雰囲気も調子も、文と合わせ見るときより、よくわかる気がします。そして、それをつかんだあとで文を読むと、絵と文の関係がしっくりいっているかどうかが、はっきりわかります。登場人物の服装とか、背景とかの具体的な事実が、文と絵で違っていることがいけないのはもちろんですが、絵全体の調子やムードが、物語のそれと合わないのは、絵本としては、②【大きな欠点】です。\n（松岡享子『えほんのせかい こどものせかい』による）", "p16_shiwa": "長い間水の中にいると手足の指にたくさん「しわ」ができる。このしわを見たことがない人はいないだろう。私はこれまで、このしわは単に皮膚が水分を吸収し膨らんでできたもので、何の役割もないと思っていた。ところが、①そうではないという記事を読んだ。滑り止めの役割を果たしているというのだ。\nこの記事は、ある論文の実験結果をもとに書かれていた。②【実験】は次のように行われた。ひとつの容器に小さなガラス玉を入れ、それを指でつかんで別の容器に移し替えるのにかかる時間を計る。ガラス玉が入っている容器には、水入りのものと水なしのものが準備された。また、手はしわがある状態とない状態で、それぞれのかかる時間が計測された。しわは、ぬるま湯に手を浸すことで発生させた。結果は次のようなものである。\nまず水の有無について見てみると、水入りの容器から移し替えるより、水なしの容器から移し替えるほうが速い。次に水入り、水なしの各条件において、しわの有無の違いによる結果を見てみると、水なしの場合、しわがあってもなくても大した差はない。しかし、水入りの場合、しわがあるほうが速い。以上の結果から、実験者は、しわは水中などぬれた環境で物をつかみやすくするためにできるようになった可能性があると述べているそうだ。\nしかし、どうなのだろうか。滑り止めのためであれば、水に入れたらすぐにしわができないとおかしいのではないだろうか。しわの役割を知るためには、新たな実験を待たなければならない。", "p16_keiei": "以下は、企業の経営について書かれた文章である。\nいろんな規則や罰則を作って、社員をがんじがらめにして（縛って）ひたすら働かせるというタイプの経営者も、まあ今時は少ないとは思うが、まだいることはいる。①【そういうやり方が間違っている】と思うのは、たとえそれで社員の労働力を物理的に100パーセント引き出すことができたとしても、そのかわり精神面での労働力を捨てることになるからだ。\n精神面での労働力というのは、たとえば創意工夫する（新しいアイデアを考え出す）能力だ。強制的に（無理やり）仕事をさせるやり方では、人の創意工夫の能力を引き出すことはできないのだ。人間の心は、自由なときにその本来の能力を発揮する。楽しんで、興味を持って何かをしているとき、人はいろんなアイデアを思いつく。（中略）\nそして、どんな仕事であろうとも、人間のする仕事には、この創意工夫の才能が重要な役割を果たす。一日中、ひたすらネジを締める仕事であっても、だ。どうすれば不良品を減らせるか、どうすれば作業効率を上げられるか。たとえばQC活動を通して、作業する人が自分たちで②そういうことを積極的に考えるようになるシステムを創り上げたからこそ、日本の製造業は世界一になれたのだ。\nそしてそういう能力を引き出すためには、従業員にとって、そこで働くことが本当の意味で自分のためになるという環境を作ることが欠かせない。本人の幸せと会社の業績が一致すれば、愛社精神なんてものは自然に育つ。強制なんかしなくても、従業員はプライドを持って心から会社のために働こうと思う。", "p16_kofuku": "幸福は人生の目標である。それだけに一体どういうものが「幸福」なのか知るのは、それを追求する前提として深刻な課題であると思う。あるとき、若い人が、私に向かって「幸福というのはあるのか」と深刻そうな顔をして聞いたことがある。\n彼は人間の欲望（欲しいと強く望む気持ち）というのは無限に続くものであるから、幸福感まではなかなか到達しないのではないかというのだ。なるほどそういえるかもしれない。人間が進歩する動物であるならばなおさらのことだ。\nでも、私は幸福は存在すると思っている。趣味に例をとっても、ある人は野球することをあげ、他の人達は読書や映画、音楽とそれぞれに主張する。登山や魚釣りという人もいるだろう。このように趣味は人によってさまざまだが、同様に幸福についても人によっては考え方がまちまちだと思う。\n「幸福とはどのようなもの？」と聞かれたら「裕福になること」と答える人もいるのだろう。また、「社会的な地位に到達する」のを幸福だと考えているかもしれない。逆にそのような裕福とか社会的地位を否定して、「心の豊かな人」になることが幸福だと思っている人もいると思う。思考や感情、さらには生活様式さえ異なる人間のことだ。幸福についての考え方に、差があってもいいのではないか。（以下略）\n（本田宗一郎『得手に帆あげて』による）", "p16_ryo": "【留学生寮 入居者募集案内】（東丘国際交流協会）\n1. 募集対象者：2017年4月に東京都およびその周辺の大学の学部に在籍する留学生\n2. 募集している部屋\n寮名　　部屋種類　　　　一ヶ月寮費（円）　設備\nさくら寮　一人用　　　　20,000　　　　　　8階建て・各室風呂あり\nふじ寮　　一人用　　　　28,000　　　　　　6階建て・駐車場あり・各室風呂あり\nふじ寮　　家族用（四人まで）48,000　　　　（同上）\nすみれ寮　一人用　　　　15,000*　　　　　3階建て・各室風呂あり\nすみれ寮　二人用　　　　10,000*　　　　　（同上）\nつばき寮　一人用　　　　8,000　　　　　　3階建て・各室風呂なし\n注意：(1) *がついている場合、寮費には光熱費が含まれません。(2) すみれ寮二人用の寮費は、一人当たりの金額です。\n4. 入居開始日：2017年3月25日から（さくら寮のみ建築中のため4月15日から）", "p17c": "【高齢化社会におけるスポーツ】\n105歳の日本人男性が、陸上競技の100メートルで世界記録を出した。2015年に行われたある陸上の世界大会でのことだ。\n「マスターズ」と呼ばれる（ 50 ）。日本ではまだあまり知られていないが、スポーツをいくつになっても楽しむことを目的とする大会で、陸上、水泳、テニスなど様々な競技の大会が世界中で開催されている。陸上の大会では通常5歳ごとに分けられたクラスで同年代と競う。そのため、体力が落ちて若いころのように走れなくても対等に競うことができる。つまり、105歳の男性が出した世界記録は、彼が参加したクラスにおける世界記録（ 51 ）。\nある調査によると、マスターズに参加している高齢者は心と体の健康を維持しているという。運動は心に活気を生み、記録という目標は生活の中で感じる不安やストレスを少なくするそうだ。\n心も体も元気な高齢者の多い社会は、高齢化社会の一つの理想である。マスターズに参加する高齢者が増えれば、この理想に近づくことができる。（ 52 ）マスターズの存在が影響を与えるのは、参加者にとどまらない。参加者以外の高齢者も、同年代が目標を目指す姿を目にすることで、体を動かすきっかけや心の活力が得られるに違いない。（ 53 ）マスターズが広く知られる必要がある。テレビなどで目にする機会が増えるといい。\nいつまでも心身ともに元気でいられる（ 54 ）。その社会の実現に向けて、マスターズの今後の発展が期待される。", "p17_mail": "【図書館に届いたメール】\n村中市立南図書館 ご担当者様\n自習室をいつも利用している者ですが、お願いがあってメールしました。\n最近、大声で話しながら作業をしているグループが増えており、自分の調べものに集中できず困っています。図書館の資料を利用して調べものをしているようなので、注意することもできません。グループ用の自習室を別に作るなどの対処をしていただくことはできないでしょうか。\nご検討どうぞよろしくお願いいたします。\n鈴木正子", "p17_hataraku": "そもそも働くとは「得る」ことなのでしょうか。\n私たちは働くとき、何らかの社会的役割を担って（持って）いて、その役割に応じた結果が求められます。そして、期待に応えたときに得られるものが報酬や自身の成長です。要するに、私たちは働くとき「得る」前に求められているものを「与える」ことになります。仕事の本質は得ることではなく、自分に求められているものを人に与える、すなわち「人の役に立つ」ことなのです。\n（山藤賢『社会人になるということ』による）", "p17_hou": "以下は、小中学校での法教育について書かれた文章である。\nすべての法律を小さいころから学習していくことは不可能なことですが、法的な考え方（リーガルマインド）を身につけることで、自分で考え・調べ、自分で解決する能力は格段に高まります。\n法教育というとどうしても、「法律を教える」と考えがちですが、それだけが法教育ではないのは、言うまでもありません。クラスのみんなで、クラスの問題点を洗い出し、どうすれば解決できるのか。そして、それを解決するため、また、再発させないためにはどのようなルールが必要か、ということを話し合い、みんなで民主的にルールを作っていくこともまさに法教育の一つの姿です。\nさまざまなルール（法）は民主的に作られ、約束事（契約）は当事者の合意により締結されるといった、法の基本的なところを身をもって体験することができます。また、新聞を多用し、時事的なニュースを使った法教育も効果があります。憲法改正、選挙の問題、消費者問題などは、それだけを教えようとするとつまらないものですが、新聞などを使った旬の（今話題になっている）話になると、子供たちの興味も惹きやすくなります。自分自身のことと考えることができるかどうかは、理解のスピードに大きな差を生みますが、具体的な「今」問題となっている事例は、その点、すぐれた教材となります。\n（二瓶裕史『これだけは知っておきたい 人生に必要な法律』による）", "p17_image": "人間はみんな「自分はこのような人間だ」というイメージを持っています。これを自己イメージといいます。ある人に会った人は、その人のイメージを持ちます。これを他者イメージと言います。継続的な人間関係があると、相手のイメージが固定してきます。自己イメージと他者からの自分に対するイメージに乖離（離れていること）が大きいと、人間関係に障害が生じます。自分は無口だと思っているのに、他人からはおしゃべりだと思われていたら、そこには誤解が生じているので、誤解した（された）人間関係が生まれるのです。\n「自分は他人から誤解されやすい人間だ」と感じる人は、自己イメージと他者からのイメージに乖離があるのです。誤解はどうして生じるかというと、自分の方は自分の心の持ち方で判断しているのに対して、他者はその人の行動から判断しているからです。（中略）\n他人のことは、外から見えることでしか判断できませんが、自分のことは、見えること（行動）と見えないこと（心の内）とによって、判断しているのです。誤解されやすいと感じている人は、だから、自分の行動と思いに乖離があるのです。思いをそのまま行動に移せていないのです。ときには、思いと反対の行動をしていることさえあるのです。\n思いが行動に移せていないときは、誤解されるだけでなく、ストレスが溜まります。ストレスは思いが伝わらなかったり、発散（外へ出すこと）できなかったりする時に生じるのです。自己イメージと他者からのイメージの乖離を解消するには、自分の心に一致した行動を取るか、行動の方を自分がしたいからそうしているのだと努めることです。\n（東山紘久『悩みのコントロール術』による）", "p17_chizu": "人生はいつも旅になぞらえられる（たとえられる）。\n人は人生という旅路を、地図もなく歩いている。誰しもそうだし、それが人間としては自然な姿である。人生に地図などあるわけがない。なのに人は、人生の地図をもとうとするのが常だ。暗闇の中を歩くのが不安で仕様がないのだ。迷ってしまった時の恐怖を想像したくないからだ。\nそして自分の地図には、人生の設計図としてわがままな道程が記されている。三十歳までには結婚し、三十五歳頃には二人の子どもをもつ。四十歳には課長になり、五十歳までには何とか部長に昇進する。（中略）\n人生の地図に描かれた道を、その通りに歩むことができるなら、そんなに楽なことはない。一度も脇道にそれずに、ただまっすぐに歩くことができるのなら、人は何も悩まなくても済むだろう。そんな人生を送る人間は、おそらくこの世に一人もいない。もしそういう人間がいるのだとしたら、それはその人間の人生ではない。②【その人生】は他人から与えられたものに過ぎない。\n五十歳の時には部長になっている。これは今という現在地から見た目標であろう。目標をもつことはもちろん大切なことだ。しかし、その目標へ辿り着く道は決して一本ではない。五十歳という現在地に立った時、もし部長になっていなければどうするのか。\n一枚の地図しか持っていない人、あるいは決して地図を書き変えようとしない人は、そこで人生の現在地を見失ってしまうだろう。「今、自分はこの場所にいるはずなのに、全く違う所に来てしまった」と、そんな思いにとらわれてしまい、行くべき道も見失ってしまうのである。\n地図をもたない人生が不安であるならば、地図をもてばいいだけのことだ。しかし、その一枚の地図にこだわってはならない。常に現在地を確認しながら、どんどん地図を書き変えていくことだ。\n少し脇道に入ってしまったのなら、その脇道を歩いてみればいい。無理をして元の道に戻ろうとしても、余計に迷うだけだ。脇道を歩いているうちに、いつの間にか元の道に戻ることもあるだろうし、また別の大通りに出会うこともあるだろう。人生には数え切れないほどの道があることを知っておいたほうがいい。\n今いる場所さえしっかりと認識できていれば、人はどんな道だって歩いていくことができるものだ。\n（立松平和『人生の現在地』による）", "p17Lc": "【子供雑誌の質問と回答】\n質問：鳥はなぜ飛べるのですか。人間も翼をつけたら、飛べますか。（草太 小3）\n回答：空を飛ぶためには体が軽いことが大切です。（ 50 ）、空を飛ぶ鳥は、体や翼の大きさのわりには、体がとても軽くできているのです。例えば、コンドルという鳥は、翼の長さ（左右の翼を広げたときの翼の先から先までの長さ）が3mほどもありますが、体重は10～15kgしかありません。鳥が重そうに見えるのは、羽が膨らんでいるからで、本当はとても細い体をしています。そして、鳥の骨は細く、骨の中はトンネルのような空洞の状態になっているため、軽いのです。\nでも草太君は、もしかしたら「それなら人間は、体重に合わせて大きい翼をつければいい。」と思うかもしれませんね。では、翼はどのくらいの（ 51 ）。ある説によると、体重60kgの人間が飛ぶのに必要な翼の長さは、約34mだそうです。長さ10mの大型バスを3台並べたときの長さよりも長いわけです。（ 52 ）は人間にはとても動かせませんよね。鳥が体のわりに大きな翼を動かせるのは、胸の筋肉が大変発達しているからです。鳥の胸の筋肉は、体重の約35％を占めると言われています。そのため、鳥は翼を強く動かすことができるのです。\nそのほかにも、鳥の体は表面の羽がなめらかで、空気の抵抗を受けにくい形になっています。\n（ 53 ）、鳥は、単に翼があるから飛べるのではなく、いろいろな点で体全体が飛ぶのに最適な構造になっていることがわかりますね。鳥は飛ぶために進化してきたのです。残念ながら、人間は、翼をつけただけでは飛ぶのは（ 54 ）。", "p17L_sakubun": "しばしば作文にはお手本のようなものが示されることがありますが、私は、これはナンセンス（意味がないこと）だと思います。文章の形式的なことならばともかく、内容にまで触れて、このように「書くべき」とか、このように書けば評価されるというマニュアルは大敵です。\nなぜなら、マニュアルには、あなたにしか書けないことをすべて否定してしまうことにつながる可能性があるからです。自分に見えるもの、少しでも人とは違って見えるもの、それにこだわりましょう。", "p17L_kirai": "以下は、ある作家が書いた文章である。\n人に対して好き嫌いの感情を持つことは誰にもあることだ。それを否定することはない。だが、好きな人とばかりつきあってビジネス生活を送ることははっきり言って不可能なのである。\n分析してみると、好きな人とはつまり話が合う人で、自分と考え方が似ているケースが多い。そして、嫌いな人とは考え方が合わない人がほとんど。嫌い、もしくは考え方が合わない人は、自分とは違う発想をしているわけで、じっくり話を聞いてみると、面白い見方、魅力ある発見を教えてくれることがある。\n私自身、取材をしていて、最初は「感じ悪いな、こいつは」と思った人物が話をしていくうちに、「なるほど」といった情報を教えてくれたことがある。そうすると、取材が終わったころには、「この人はいい人だ」と判断を変えてしまうのだから、人間の好悪の感情なんて実にいい加減なものだ。\n初めての人に会ったときは好き嫌いの感情を抜きにすること。素直に人を見て、話を聞いて、そして、面白い話を聞くことができたら相手に共感する。そうすると人は謙虚になっていく。なんといっても仕事に役立つヒントをもらったわけだから、相手を尊敬するようになる。それが続くうちに人は出会った相手を尊重し、関係を大切にする人間に変わっていく。そういった人間になってしまえば、他人からも信頼されるし親しまれるだろう。", "p17L_enpitsu": "「鉛筆でかいたのになぜ消えないの。」\n小学校の写生大会で、画用紙に鉛筆で下書きをし、水性絵の具で色をぬった後、下書きを消しゴムで消そうとしたのに消えなかったときに思ったことだ。不思議だと思うと同時に、絵が思ったように仕上げられずがっかりした。\nこの疑問に対する答えを、最近、あるホームページで見付けた。そのページには、まず普通の鉛筆は消しゴムで消せるのに、なぜ色鉛筆は消せないのかという説明が書いてあった。\nその説明によると、それは普通の鉛筆と色鉛筆の芯の材料が異なっているためだそうだ。鉛筆は黒鉛と粘土から、色鉛筆は顔料とロウ（油分）からできている。黒鉛と顔料は、色の元になるものである。紙に書かれた文字の状態をそれぞれ簡単に説明すると、前者は細かくくだかれた黒鉛が紙の表面にくっついている状態であり、後者は顔料が紙の中に油とともにしみ込んでいる状態だそうだ。したがって、表面にくっついているだけの黒鉛は、消しゴムでこすることで、紙から引き離すことができる。一方、しみ込んだ顔料は引き離すことができない。\nそして最後に、鉛筆の下書きが水性絵の具で色をぬった後に消せない理由が説明されていた。鉛筆の下書きが消せないのは、水性絵の具を溶かすのに使う水のせいだそうだ。この水が、色鉛筆の芯の油分と同じ役割を果たすという。水も油も紙にしみ込みやすいのだ。", "p17L_homeru": "A\n子どもを育てるときは、悪いところをしかるのではなく、よいところをほめるほうがいいと思います。子どもはすなおですから、ほめられたことをそのまま受け入れ、行動や態度に自信を持つことができます。そしてそれが成長につながっていくのです。\nただし、ほめるときにも注意が必要です。「いい成績をとって、偉いね。」と結果だけをほめるのは好ましくありません。そうではなく、「毎日漢字の練習をしてがんばったから、いい成績がとれたんだね。すごいね。」とか「今日の試合は負けてしまったけど、いいプレーをしていたね。練習の成果が見られたよ。」というように、それまでの取り組みをほめるようにすると、子どものやる気を引き出すことができます。\nB\nよく「子どもはほめて育てよう」と言われるが、実行するのはなかなか難しい。特別なことができたらほめようと思っていると、どうしてもほめる機会が少なくなってしまう。\nそれに、大人にとってはできるのが当たり前だということでも、成長過程にある子どもにとってはそうではないことも多い。だから、子どもが普段からしていることでも、よいと思ったことや長所はどんどんほめるようにしたほうがいい。\n誰でもほめられるとうれしいし、ほめられたことは続けていこうと思うものだ。親として伸ばしてあげたいと思うことは、どんな小さいことでも積極的にほめることが大切だ。", "p17L_konnan": "美味しい食べ物や美しい景色。お金や健康や愛。そういったものでは得られない持続的幸せ――。それを得るための必要条件は、「困難」です。困難のないところに、持続的幸せはないのです。\n困難というものがまったくなかったらどうなるか、ちょっと想像してみて下さい。欲しいものは何でも手に入る。したいことは何でもできる。すべての欲求が何の苦もなく満たされる。嫌なことは一切しなくていい。すべてが思い通り。そして、あらゆることが順調にいく。だから、「困ったな、どうしたらいいだろう？」と思うことなど、皆無。つまり、問題はまったく起こらない……\n「わ、いいな。そうなりたい」と思う人もいるかもしれません。\n確かに、短期間ならこういう境遇もわるくないかもしれません。しかし、来る日も来る日も（この先ずっと）そうだったとしたら？まちがいなく、退屈するようになるでしょう。そして、やがて耐えられなくなるはずです。\nなぜなら、そこには自分の能力を発揮する機会がまったくないからです。自分の能力を発揮すべきことが、何も起こらないのです。これほどつまらないことはない。それが毎日続いたら、まちがいなく退屈し、耐えられなくなるでしょう。\nそう、私たちが能力を発揮できるのは、困難（問題）に出会ったときです。そのときはじめて、能力を発揮する機会が与えられる。\nそして、自分の能力で困難を乗り越えることができたとき、面白さやよろこびを感じるのです。それは、何かからただ受動的に得られる面白さ・よろこびとは異なり、自分の力で獲得する面白さ・よろこびです。また、それは、「やった！」という達成感と、さらに、「自分にはやればできる力があるんだ」という感覚――「自己効力感」――をともなった面白さ・よろこびです。\nこれが積み重なって、生の充実感と持続的幸せがもたらされる。\n持続的幸せは、困難にぶつかりながら、自分の能力で何とかそれを乗り越えようと努力しながら生きていくことによって得られるものなのです。つまり、持続的幸せが得られるかどうかは、生き方の問題なのです。", "p18c": "【雑誌のコラム】道路のひみつ\n仕事、買い物、遊びに行くとき、誰でも必ずお世話になるものがある。（ 50 ）だ。当たり前のように存在し、多くの人に利用されているが、様々な工夫がされていることはあまり知られていない。\n例えば、高速道路や大きな道路の多くで雨水が道路上にたまりにくい設計になっていることは（ 51 ）。道路表面に小さな無数の穴があり、水が舗装の下に抜けるという仕組みだ。高速道路で雨の日に事故が多かった地点も、この舗装にした後、雨の日の事故が約80％減少したという。\n（ 52 ）、寒い地域では雪や氷が原因でスリップ事故が多発する。そのため、雪や氷を砕く機能をもった道路が開発されている。粒状のゴムなど、柔軟性のある小さな素材を道路に埋め込み、車の重さで道路をわずかに変形させて雪や氷を砕く。カーブや坂道などをそういう舗装にすれば、道路に雪や氷が密着するのを防ぐことができ、スリップの危険性が減る。\n道路表面の温度を下げる（ 53 ）。道路は太陽に熱せられ、夏は特に熱くなりやすい。そこで、太陽光線の吸収を防ぐ物質を表面に塗ることで温度上昇を抑えている。この舗装により、道路の温度は最大10度以上も下がる。人やペットが歩く公園や歩道にぴったりだ。\nこれら以外にも、様々な機能の道路が日々開発され、利用されている。道路の違いは見た目にはよくわからないかもしれない。しかし、人々はより安全で快適に暮らせるよう、足元で（ 54 ）。", "p18_mail": "【旅行会社に届いたメール】\n件名：ゼミ旅行の見積書について（北山大学）\nＢＴＢ旅行 団体ツアー担当 木川友子様\nお世話になっております。北山大学の大村光一です。\nせっかく見積書を作成していただいたのですが、変更をお願いしたい点がございます。諸事情により、8月6日（月）に出発することができなくなってしまったので、出発日を8月20日（月）に変更して、再度見積書を作成していただけないでしょうか。料金は今回の見積書の金額を超えないようにお願いいたします。ホテルは変更になってもかまいませんが、同じ1泊2日の日程でお願いいたします。\nどうぞよろしくお願いいたします。\n北山大学 大村光一", "p18_koudou": "言うまでもなく（わざわざ言う必要もないが）、深く思考した者は競争相手より有利な立場に立てる。しかし行動を止めてまでして考えるのは避けよう。行動があなたの思考を止めることはない。むしろ思考を加速させ、改善させる効果があることを知ってほしい。\n行動し、変化する状況の中で考えつづけることを実践するのはかなり勇気が要るだろう。予期しないことが起こるかもしれない。リスク（危険）もある。しかし、そうすることで、最速の思考が生み出されるのだ。", "p18_gokai": "大学の先生のイメージとは、一般的にはどのようなものだろうか。理系だと白衣を着て難しい話ばかりする人、文系だと研究室に閉じこもって文学作品を読んでいる人、という声が周囲から聞こえてきた。確かにそれに近い人はいるのだが、もちろんそうでない人も多い。これは政治家、警察官、医者などにも当てはまることであり、私たちはどうしても先入観（思い込み）を持ってしまうため、それが誤解を生む原因になるのだ。\n誤解は相手の先入観だけでなく、自分が原因であることも多い。その大きなものが、話す際の省略である。時間がないときなど、どうしても内容を一部省略して報告する必要がでてくる。時間があってもすべての情報をきちんと伝えるのは無理であろう。そうなると相手は自分の意図とは異なる形で補うために誤解につながっていくのだ。\n（中略）\n省略が多くなるメールは特に注意が必要で、込み入った（複雑な）内容を伝える場合はできるだけ直接会った方がよい。会うのは時間をとられて面倒だと感じるかもしれないが、その方が結局、問題が早く片付くこともあるのだ。\nまた、誤解のプラスといえる面にも気が付いた。それは誤解によって人々の考えに自然に多様性が生まれるということだ。さまざまな意見があることは、健全な（正常な）社会のための重要な要素である。誤解は一般的には悪者扱いであるが、多様性をつくる仕掛け（しくみ）だと思えば少し見方も変わってくるのではないだろうか。", "p18_uta": "A\n自分は歌がうまくないとか、自信がないから人前で歌を歌いたくないと思っている人は多いと思う。実は、そういう人たちはテレビやCDで聞いて何となく覚えた歌を、自分の勝手なイメージで歌ってしまっていることが多い。自信を持って歌を歌うには、まず歌詞を理解して曲を覚えることが必要だ。歌詞は何度もよく読むことで、伝えたいメッセージが理解できる。曲も繰り返し聞けば、細かい部分まで聞き取れるようになり、正確に覚えることができる。このようにして歌詞と曲をしっかり覚えたら、あとは歌手のまねをするような気持ちで、自信を持って歌うことだ。いきなり自分らしく歌おうとするのは、失敗のもとなのでやめたほうがいい。\nB\nどうしたら人の心に響くような歌が歌えるようになるのだろうか。よく歌手のようにうまく歌いたいと思って歌手のまねをして歌っている人がいるが、私はそのような歌を聞いても感動することは少ない。私にとって上手な歌というのは、何よりも歌う人の気持ちが伝わってくる歌だからだ。\nではどうすれば人を感動させる歌が歌えるのか。それには歌詞を深く理解することが大切だ。単語の意味はもちろん、描かれている状況や感情を丁寧に読み込んでいけば、どこが大切か、どこを強調して歌えばいいかがわかってくるはずだ。歌詞の理解さえ十分にできていれば、多少音を間違えたとしても、メッセージは必ず聞き手に伝えられると思う。", "p18_hyouka": "以下は、会社における評価について書かれた文章である。\n私たちの会社では、志願して（応募して）くれたのに、採用できなかった学生から、こんな問い合わせを受けることがよくあります。「なぜ、自分は落ちたのでしょうか」と。\n彼らの多くは、筆記試験の成績も優秀で、面接での受け答えのしっかりした学生。合格しなかったのは、単に当社との相性を他の志願者と比べた結果であって、重大な問題があったわけではありません。しかし、彼らの頭の中には、自分と採用しなかった当社との関係しかない。だから、「落ちたのは自分に問題があるから」と考え込んでしまうのでしょう。\n①こういう人は社会に出ても苦労します。上司が他の社員と比べて評価を下していることまで想像が及びませんから、より結果を出している同僚を棚に上げ、「自分はこんなに頑張って、成果を上げているのに評価されない」と悩んでしまう。\n（中略）\n一定の水準を満たした志願者全員が、入社できるわけではありません。一定以上の業績（仕事の成果）を上げれば、誰でも高い評価が得られるわけでもない。「自分はこれだけ成果を出したから大丈夫」ということはありません。より大きな成果を出した人がいれば、自分の評価が相対的に下がるのは当たり前。大事なのは他者との比較です。単純な話ですが、皆、意外なほど、②この事実に気づいていない。\n成長するためにはまず、「自分は常に他者と比較されている」ということを意識してください。もし、社内での自分の評価を上げたければ、同僚と自分を積極的に比較しましょう。\nよく「人は人、自分は自分」と言います。評価の高い同僚は、あなたとは強みも活躍する領域（分野）も違うかもしれません。それでも、同じような時期に生まれ、自分の得意分野を確立し、頭角を現している人がいるなら、その事実に向き合ってください。そして、上司の視点で自分と比べてみる。「自分に足りないもの」や「評価されるには何をすべきか」といったことが見えてくるはずです。", "p19_hyou": "一般的に、表とグラフでは、グラフのほうがすぐに特徴をみつけやすいといえます。だからといって、そうしてみつけた特徴が本当に意味がある特徴かどうか。単なる錯覚（勘違い）ではないのか、グラフをみたことで先入観（思い込み）をもってしまったあとでは、検証（調べて、証明すること）がむずかしいでしょう。\nだからこそ、まずは、特徴を見つけにくい表をながめてデータ分析をすることが、データ読解力を高めるうえでは大切です。そうして表のデータを読む力を磨くことで、やがてグラフでの錯覚を避ける能力も高まります。", "p19_mail": "【ある会社が製品を注文してきた相手に出したメール】\n件名：スピーカー「8QPS1」のご注文につきまして　日時：2019年6月5日 10:30\nマフフク商会 営業部 大村成次様\nお世話になっております。\nこのたびは、スピーカー「8QPS1」20台をご注文いただきありがとうございました。同機は4月の発売以来、予想以上の売れ行きが続き、製造が追いついておりません。現在、海外の工場でも対応しておりますが、ご指定の期日（6月28日）での納品は難しい状況です。納品可能時期は今月中旬に改めてお知らせいたします。たいへん申し訳ございませんが、ご理解くださいますようお願いいたします。\nオーシーサウンド 販売部 川藤直広", "p19_sei": "試合に出してももらえない。監督やコーチと相性が悪い、他の選手のほうが贔屓（気に入って特別に扱うこと）されている……。自分がうまくできない、試合で活躍できないのは、環境が悪いからだ。監督のせいだ。他の選手とプレーがかみ合わない（うまく合わない）……\n自分がある程度頑張っているつもりの選手は、つい、こう考えてしまうものです。\nうまくなるためには自分自身と向き合っているとすれば、そこに周りは一切（全く）関係ありません。人のせい、物のせいにするのはラク、私から言わせれば、人のせい、物のせいにするのは、逃げていることと同じです。", "p19_hon": "本を読むことは、かつて生きた優れた人の言葉を聞くということ、読むとは、基本的に人の話を聞くことです。\n学ぶことの基本行為も「聞くこと」です。\nしかも、本を読むことが生きている人類から話を聞くことと同じとらえられれば、その読みは一層リアルになるはずです。例えば、本居宣長を読むのでもゲーテを読むのでも、僕らが生きているかのようにして読める人の方が、生の声として聞こえてくるからより一層リアルです。\nですから、「聞く構え（姿勢）」ができている人は、より良く学べることにもなります。\n逆に、聞く構えがないと、相手から成長がない人と見られてしまいます。言い換えれば、「聞く気がない」と受け取られてしまうと、会社でも学校でも「この人は見込み（可能性）がない」と思われてしまうのです。こんなふうに、学ぶ姿勢は現実の生活において、私たちの根本的な評価に関わってきます。\n学ぶことは、優れた人の話を聞いて自分を修正していくこと、あるいは、その人に憧れを持ち、その人によって自分の新たな目標が見え、歩むべき方向性が決まることです。そして、本や人の話の中から具体的なアドバイスを得て、自分の生活の中にある種の学びの習慣をつくっていく。だからこそ、読書を学びの基本にするとよいのです。\n本を読まないということは、いわば膨大な数の賢者たちから、あらかじめ見放されてしまっているということです。", "p19_washi": "紙は私たちの身の回りにあふれているが、日本には一般的に使われている「洋紙」のほかに、古くから使われている「和紙」がある。\n洋紙は、安い価格で多量に手に入る針葉樹や広葉樹の、皮を取り除いた幹の部分を原料とする。一方和紙は、主に楮、三椏、雁皮という木の、皮の部分を使用する。また、洋紙は表面に凹凸が少なく印刷に適しているが、和紙は表面が滑らかでなく印刷には向かないという違いがある。しかし、和紙には丈夫で強く、さらに劣化（品質が低下すること）しにくいので長期間保存ができるという利点もある。\n日本では六世紀ごろから和紙が使用されていたが、明治時代になり洋紙が輸入され始めると洋紙が一気に広まった。手作業で製造されていた和紙に対し、洋紙は早くから製造過程が機械化され、大量生産による安価で安定した供給が可能であったためである。その結果、和紙は洋紙に対抗できなくなり、和紙産業は衰えた。しかし、これをきっかけに和紙の製造過程も機械化が進められた。\n現在日本国内で広く用いられているのは洋紙だが、和紙は和紙でなければならない分野で活用されている。書道や絵画だけでなく、その美しさが評価されて壁紙や便箋、封筒などにも利用されており、海外でもその価値が認められている。また、丈夫で傷みにくいという利点を生かして美術作品などの修理保存にも使われている。今後も残していきたい伝統文化である。", "p19_bu": "正しい仕事の任せ方というのは、一体どのようなものだろうか。\n理想的なのは、部下の実力よりも少し上のレベルの仕事――部下が何とか自分の力で判断・実行することができ、ときには（場合によっては）小さな失敗を招くであろうレベルの仕事を任せることだ。\n①【そういう仕事】を、段階的にレベルを上げながら与えていくことで、部下は着実に仕事力を磨いていくのだ。\nところが、そのような仕事を部下に与えたとしても、日本の会社では、「ホウ・レン・ソウ」（報告・連絡・相談）などといって、上司がいちいち部下の仕事に干渉し（必要以上に関わり）がちだ。そして結局は、部下に自分の力でハードル（障害）を乗り越えさせないことが多い。\nたとえば、あるプレゼン資料を部下につくらせるとする。日本の会社の多くの上司は、全体像を示さず、ただ「こういうものをつくれ」と部下に曖昧に命じ、持ってこさせる。そして「ここをこう直せ」と要求し、部下はその意図がわからないまま上司の指示通りに修正をする。そんなことを何度も繰り返す。その結果、部下に身につくのは、エクセルやらパワーポイントの操作法だけ、ということになる。これでは、レベルの高いプレゼン資料を自分で考え、つくり上げる力はつかないだろう。\nそうではなく、「この資料は、こういう目的で、こういう相手に対して、このように説得するために使用するものだ」という全体像を事前に明確に説明すべきだ。その上で、見本を見せて、あとは部下の創意工夫に任せ、部下に最善だと思う資料ができるまで口出しはしない（何も言わない）ことだ。\n結果的に出来上がるものが、上司の想定するものと違うこともあるだろう。しかし、その資料をつくる意図、全体像がつかめていれば、なぜいけないのか、どこが悪いのか、どう修正すればよくなるのかがわかるし、上司からの修正指示に納得もできるし、学ぶこともできる。（中略）\n繰り返すが「部下を教育するのが上司の役目」というのは間違っている。部下を育てるのは「仕事」そのものであり、その仕事をするための「場を与える」のが上司の役目なのである。"};
DATA.rd=[{"id": "rd1", "src": "2016.7 #50", "sec": "读解·完形", "p": "p16c", "q": "（ 50 ）に入れるのに最もよいものはどれか。", "o": ["24時間なのか", "24時間ではないのか", "24時間といえるか", "24時間だっただろうか"], "a": 3, "pick": 2, "e": "「金曜25時」を見て驚いた→自分の知識への軽い疑いで「一日は24時間だっただろうか」。「〜だっただろうか」=想起確認（我记得是24小时来着？）。", "blank": "50", "wx": ["“一天是24小时吗？”若用「なのか」是单纯发问，语气太硬；这里是对自己原有认知的轻微怀疑", "「24時間ではないのか」=“难道不是24小时吗？”是反问/质疑别人，你选的这个意思变成了“一天不是24小时”，与全文不合", "「24時間といえるか」=能否说是24小时，文章讨论的不是这个", "✔ 「〜だっただろうか」=“(我记得)是24小时来着吗？”，对自己已有知识的回想式怀疑"]}, {"id": "rd2", "src": "2016.7 #52", "sec": "读解·完形", "p": "p16c", "q": "（ 52 ）に入れるのに最もよいものはどれか。", "o": ["生まれることになっている", "生まれたとしよう", "生まれるといわれていた", "生まれたらしい"], "a": 3, "pick": 1, "e": "前文「〜とする説が有力だ」＝まだ確定していない話。伝聞・推定の「生まれたらしい」。「ことになっている」是规定，「としよう」是假设，都不合适。", "blank": "52", "wx": ["「ことになっている」=按规定如此，这里是有力的“说法”，不是规定", "「としよう」=假设，文中是在介绍原因的说法", "「といわれていた」=过去一直被说，但后文用的是现在的“有力な説”", "✔ 「らしい」=据说/推测，符合“〜とする説が有力だ”"]}, {"id": "rd3", "src": "2016.7 #53", "sec": "读解·完形", "p": "p16c", "q": "（ 53 ）に入れるのに最もよいものはどれか。", "o": ["ただ", "一方", "確かに", "それでも"], "a": 2, "pick": 4, "e": "「確かに、〜と考えれば…的確かもしれない」＝先承认/让步（「かもしれない」呼应）。前面刚说“0点后“今天”还在继续”，后面顺着展开，不是转折，所以不是「それでも」「ただ」「一方」。", "blank": "53", "wx": ["「ただ」=只是（补充限制），前后不是限制关系", "「一方」=另一方面，对比，这里是顺着说", "✔ 「確かに〜かもしれない」让步，呼应后面的「的確かもしれない」", "「それでも」=尽管如此，前文并没有不利条件，不需要逆接"]}, {"id": "rd4", "src": "2016.7 #59", "sec": "读解", "p": "p16_59", "q": "筆者は手紙をどのようなものだと考えているか。", "o": ["書き手の意図しないことまで伝わってしまうもの", "書き手の愛の深さだけが目立ってしまうもの", "書き手の伝えたいことが伝えられないもの", "書き手の心を思いどおりに伝えられるもの"], "a": 0, "pick": 4, "e": "「その幼稚さや愛の浅さや性格の悪さまでもが相手に届いてしまう」＝想传达的以外的东西也传到了。「だけ」(2)、「伝えられない」(3)、「思いどおり」(4)都与原文不符。", "wx": ["✔ 文末“幼稚さ、愛の浅さ、性格の悪さまでも届いてしまう”＝连没想传达的也传到了", "“只有爱的深度突出”：原文是连幼稚、爱的浅薄也传达", "“传达不了”与“气持ちは必ず文面に出る”相反", "“思い通りに传达”与“不想让人知道的也会传达出去”相反"]}, {"id": "rd5", "src": "2016.7 #60", "sec": "读解", "p": "p16_ehon", "q": "筆者によると、字を読まないで絵だけで絵本を見るとどうなるか。", "o": ["字を読むより感動できる。", "字を読むより物語がよくわかる。", "絵を見て自由に物語を作ろうとする。", "絵の中から意味を見つけようとする。"], "a": 3, "pick": 2, "e": "「絵の中に意味をさぐろうとする心の働きを強めてくれる」＝4。2的“物語がよくわかる”原文没说，说的是能看出绘本的好坏。", "wx": ["原文没有说“比读字更感动”", "原文只说能看出图文是否合拍，没说“比读字更懂故事”", "不是“自己编故事”，而是“在图里找意义”", "✔ 「絵の中に意味をさぐろうとする心の働きを強めてくれる」"]}, {"id": "rd6", "src": "2016.7 #61", "sec": "读解", "p": "p16_ehon", "q": "①絵本とは呼べないものとは、どのようなものか。", "o": ["絵だけでは何も伝わってこないもの", "絵がないと、文の意味がわからないもの", "絵と文の意味が合っていないもの", "絵と文を一緒に見ても、面白くないもの"], "a": 0, "pick": 2, "e": "「絵が何かを語りかけてくれないものは、ほんとうの意味では絵本とはいえない」＝只看画什么都传达不出来的东西。2正好说反了（是“文がないと絵の意味がわからない”才是）。", "wx": ["✔ 「絵が何かを語りかけてくれない」=只看图什么也传达不出的，不算真正的绘本", "你选的：“没有图就看不懂文字”原文没说；原文是“没有文字图就没意义”（装饰性插图）才不算绘本", "“图文意思不合”是第二个下划线（欠点）说的，不是①", "“不有趣”文中没提"]}, {"id": "rd7", "src": "2016.7 #64", "sec": "读解", "p": "p16_shiwa", "q": "②実験で最も時間がかかったのはどの場合か。", "o": ["容器に水があり、「しわ」がある場合", "容器に水があり、「しわ」がない場合", "容器に水がなく、「しわ」がある場合", "容器に水がなく、「しわ」がない場合"], "a": 1, "pick": 1, "e": "①水あり＞水なしで遅い。②水あり同士では「しわがある方が速い」。だから最も遅い＝水あり＋しわなし。水なしはしわの有無で大差なし。", "wx": ["水有，且有皱纹→这是最快的组合（水入りでしわあり＞しわなし）", "✔ 水有＋无皱纹，是水中最慢的；水中整体又比无水慢", "无水时有无皱纹差别不大，都比有水快", "无水时都比有水快"]}, {"id": "rd8", "src": "2016.7 #66", "sec": "读解", "p": "p16_keiei", "q": "①そういうやり方が間違っていると思うのはなぜか。", "o": ["社員からアイデアが生まれなくなるから", "社員のアイデアが採用されなくなるから", "社員の物理的な労働力が無駄になるから", "社員が会社を辞めたいと思うようになるから"], "a": 0, "pick": 3, "e": "「物理的な労働力は100％引き出せても、精神面での労働力（創意工夫）を捨てることになる」。創意工夫＝新しいアイデア。3は“物理的”を逆に読んだ誤答。", "wx": ["✔ 精神面の労働力＝創意工夫＝アイデアが出なくなる", "不是“想法不被采用”，而是“想法根本出不来”", "“物理的な労働力は100％引き出せる”，所以并不浪费", "文中没说想辞职"]}, {"id": "rd9", "src": "2016.7 #71", "sec": "读解", "p": "p16_kofuku", "q": "若い人が「幸福というのはあるのか」と聞いたのはなぜか。", "o": ["今まで何をしても幸福感に到達することができなかったから", "幸福についての考えにはいろいろあり、何が幸福かわからなくなったから", "人間の欲はなくならないので、いつまでも幸福感が得られないと考えたから", "人間の欲はそれぞれ異なるので、幸福についての考え方も異なると考えたから"], "a": 2, "pick": 2, "e": "「人間の欲望は無限に続くものであるから、幸福感までなかなか到達しない」→3。“考え方が人それぞれ”は筆者自身の意見（若者の質問の理由ではない）。", "wx": ["文中没说他有过什么经历", "“考え方がいろいろ”是筆者自己对幸福的看法，不是年轻人提问的理由", "✔ 欲望无限→永远得不到幸福感", "“欲望各不相同”不是理由，“欲望無限に続く”才是"]}, {"id": "rd10", "src": "2016.7 #74", "sec": "读解·信息检索", "p": "p16_ryo", "q": "ジエゴさんは東京の大学の3年生である。2017年4月から寮に入居したいと思い、メモにまとめた。希望に合う寮はどれか。\n・寮費は3万円以下\n・寮費に光熱費が含まれている\n・1人用で、風呂がある部屋\n・4月3日までに引っ越したい", "o": ["さくら寮のみ", "さくら寮、ふじ寮", "ふじ寮のみ", "ふじ寮、すみれ寮"], "a": 2, "pick": 4, "e": "逐条筛：さくら＝4/15から入居→×；すみれ＝15,000*（*=光熱费不含）→×；つばき＝没有风呂→×；ふじ一人用28,000円・无*・有风呂・3/25から→○。所以只有ふじ寮。", "wx": ["さくら寮：4/15才能入住，不能4月3日前搬", "含さくら寮，而さくら寮4/15才能入住，赶不上4月3日", "✔ ふじ寮：28,000円、无*（含光热费）、一人用有风呂、3/25起可入住", "すみれ寮：15,000*，*=不含光热费，不满足条件；所以4也不行（你选的）"]}, {"id": "rd11", "src": "2017.7 #52", "sec": "读解·完形", "p": "p17c", "q": "（ 52 ）に入れるのに最もよいものはどれか。", "o": ["とすると", "とはいえ", "さらに", "このように"], "a": 2, "pick": 4, "e": "前面讲“对参加者的好处”，后面讲“影响不止参加者”→添加递进「さらに」。", "blank": "52", "wx": ["「とすると」=如果这样的话，前后不是假设关系", "「とはいえ」=虽然如此（逆接），这里是顺着补充", "✔ 「さらに」=更进一步（对参加者之外的影响）", "「このように」=像这样总结，后面不是总结而是追加新观点"]}, {"id": "rd12", "src": "2017.7 #53", "sec": "读解·完形", "p": "p17c", "q": "（ 53 ）に入れるのに最もよいものはどれか。", "o": ["そうやって", "そうなったら", "それでも", "それには"], "a": 3, "pick": 3, "e": "「（そのためには＝）それには、マスターズが広く知られる必要がある」＝为了实现这一点，需要…。「それには」=为此（目的→必要条件）。", "blank": "53", "wx": ["「そうやって」=那样做之后，后面是“必要だ”，不通", "「そうなったら」=如果那样，句子的“必要がある”接不上", "「それでも」=即便如此，没有让步关系（你选的）", "✔ 「それには〜必要がある」=要做到这点需要…"]}, {"id": "rd13", "src": "2017.7 #54", "sec": "读解·完形", "p": "p17c", "q": "（ 54 ）に入れるのに最もよいものはどれか。", "o": ["社会", "社会だ", "社会とは", "社会だから"], "a": 0, "pick": 2, "e": "「元気でいられる社会。その社会の実現に向けて」＝体言止め（名词结句）后面再用「その社会」承接。「社会だ」「社会とは」「社会だから」都会使句子变成别的意思，且后一句“その社会”就不顺了。", "blank": "54", "wx": ["✔ 体言止め：“社会。その社会の実現に向けて”承接自然", "你选的「社会だ」：句子本身没错，但下一句「その社会」是承接前一句名词的写法，选名词结句更自然；「だ」让语气变成断定", "「社会とは」=“所谓社会”，句子未完", "「社会だから」=因为…，后面没有结论"]}, {"id": "rd14", "src": "2017.7 #56", "sec": "读解", "p": "p17_mail", "q": "このメールを書いた人は、自習室のどのような問題を指摘しているか。", "o": ["利用者がグループで調べものをしていること", "話しながら作業しているグループが多いこと", "グループ用の自習室を適切に使用していないこと", "図書館の資料を使わずに作業しているグループがあること"], "a": 1, "pick": 3, "e": "「大声で話しながら作業をしているグループが増えており、集中できず困っています」＝2。グループで調べること自体は問題にしていない（1）；グループ用自習室はまだ無い（3）；資料は使っている（4）。", "wx": ["“グループで調べること”本身不是问题，是“大声で话す”", "✔ 「話しながら作業しているグループが増えている」", "“グループ用自習室を適切に使用していない”：现在还没有这种房间", "“没用图书馆资料”：邮件说他们在用资料"]}, {"id": "rd15", "src": "2017.7 #59", "sec": "读解", "p": "p17_hataraku", "q": "筆者によると、働くとはどういうことか。", "o": ["社会から期待された役割を果たすこと", "仕事で得たものを人に与えること", "自身の社会的役割を探すこと", "自身の成長を求めること"], "a": 0, "pick": 3, "e": "「仕事の本質は…自分に求められているものを人に与える、すなわち人の役に立つこと」。求められている＝期待された役割。2“得たものを与える”は原文と違う（得る前に与える）。", "wx": ["✔ 「自分に求められているものを人に与える」=履行被期待的角色", "「得たものを人に与える」，原文是“得る前に与える”", "“找角色”原文没有", "“求成长”只是回报之一，不是“働く”的本质"]}, {"id": "rd16", "src": "2017.7 #62", "sec": "读解", "p": "p17_hou", "q": "小さいころから法教育をすることの利点について、筆者はどのように述べているか。", "o": ["法を守る人間に育つ。", "法律に興味を持つようになる。", "問題を解決する能力が身につけられる。", "勉強の内容を理解するスピードが速くなる。"], "a": 2, "pick": 4, "e": "第1段落「法的な考え方を身につけることで、自分で考え・調べ・解決する能力は格段に高まる」。4是新闻例子里提到的“理解的速度”，不是法教育的利点本身。", "wx": ["“守法”没提", "“对法律产生兴趣”没提", "✔ 「自分で考え・調べ・解決する能力が格段に高まる」", "“理解速度”是新闻教材的好处，不是法教育的利点"]}, {"id": "rd17", "src": "2017.7 #68", "sec": "读解", "p": "p17_image", "q": "筆者の考えに合うものはどれか。", "o": ["自身の思いと行動を一致させれば、ストレスが溜まらない。", "自身の思いより行動を大切にする方が、ストレスが溜まらない。", "自身の思いと反対の行動をしたときに、ストレスが最大になる。", "自身の思いを行動に移そうとすると、ストレスが溜まる。"], "a": 0, "pick": 4, "e": "「思いが行動に移せていないときは…ストレスが溜まる」「乖離を解消するには、自分の心に一致した行動を取る」→1。4是反过来（想付诸行动→有压力）。", "wx": ["✔ 思いと行動を一致させる→乖离を解消→ストレス減", "“重视行动胜过想法”原文没这么说", "“最大”文中没有比较级", "你选的反了：“思いが行動に移せていない時”才有压力；想付诸行动本身不会累积压力"]}, {"id": "rd18", "src": "2017.7 #72", "sec": "读解", "p": "p17_chizu", "q": "②その人生とは、どのような人生か。", "o": ["地図に頼らずにまっすぐに歩む人生", "地図通りの道を歩む人生", "他人と同じような道を歩む人生", "道に迷いながら歩んでいく人生"], "a": 1, "pick": 3, "e": "「その人生」＝前文「人生の地図に描かれた道を、その通りに歩む（脇道にそれずにまっすぐ歩く）人生」。“他人から与えられたもの”是评价，不是“和别人走一样的路”。", "wx": ["“不靠地图笔直走”不是；这里“地图通りに歩む”才是", "✔ 「その人生」=按照人生地图描绘的路、毫无偏离地走的人生", "你选的：“和别人走一样的路”原文没有；“他人から与えられたもの”是评价", "“迷着走”是筆者推荐的人生"]}, {"id": "rd19", "src": "2017.7 #73", "sec": "读解", "p": "p17_chizu", "q": "この文章で筆者が最も言いたいことは何か。", "o": ["たくさんの地図を用意しておけば、人生で道に迷う心配がない。", "人生は現在地さえわかっていれば、新たな道を進むことができる。", "人生は行き先を決めれば、道に迷わずに自身の力で歩んでいける。", "人生の可能性を広げるには、地図にない道を進むべきだ。"], "a": 1, "pick": 4, "e": "结尾「今いる場所さえしっかりと認識できていれば、人はどんな道だって歩いていける」＝2。筆者并没有主张“应该走地图以外的路”（4）。", "wx": ["“准备很多地图”不是主旨，主旨是“别拘泥于一张地图”", "✔ 「今いる場所さえしっかり認識できていれば、どんな道だって歩いていける」", "“决定目的地就不会迷路”与文意相反", "筆者没说“应该走没有地图的路”，说的是要常确认现在位置、改地图"]}, {"id": "rd20", "src": "2017.12 #50", "sec": "读解·完形", "p": "p17Lc", "q": "（ 50 ）に入れるのに最もよいものはどれか。", "o": ["一方", "実は", "ところが", "なぜなら"], "a": 1, "pick": 3, "e": "前句“飞行需要身体轻”→后句“（实际上）飞鸟的身体做得非常轻”。「実は」引出实情。「ところが」是转折，但前后并不矛盾。", "blank": "50", "wx": ["「一方」=另一方面，前后不是对比", "✔ 「実は」=其实（引出实情）：飞鸟体重很轻", "「ところが」=没想到/可是，前后并不矛盾（你选的）", "「なぜなら」=因为，前后不是原因关系"]}, {"id": "rd21", "src": "2017.12 #52", "sec": "读解·完形", "p": "p17Lc", "q": "（ 52 ）に入れるのに最もよいものはどれか。", "o": ["翼", "そんなに大きな翼", "こっちの翼", "あのような大きな翼"], "a": 1, "pick": 4, "e": "前文刚说了“34米的翅膀”，对话中承接对方刚听到的内容用「そんな（に）」。「あのような」是指双方都远处/已知的东西，不合适；「翼は」单独不够具体。", "blank": "52", "wx": ["光说「翼は」没有承接“34米那么大”的含义", "✔ 「そんなに大きな翼」承接对方刚听到的内容“那么大的翅膀”", "「こっちの翼」=这边的翅膀，不对", "你选的「あのような」指双方记忆里的远处事物，这里应该承接刚说的内容用「そんな」"]}, {"id": "rd22", "src": "2017.12 #53", "sec": "读解·完形", "p": "p17Lc", "q": "（ 53 ）に入れるのに最もよいものはどれか。", "o": ["これに対して", "最初に述べたように", "こうして見てみると", "最後の結論から"], "a": 2, "pick": 1, "e": "前面列举了好几点→总结「こうして見てみると、〜ことがわかりますね」。", "blank": "53", "wx": ["「これに対して」=与此相对，前后无对比", "「最初に述べたように」文中前面没有提过结论", "✔ 「こうして見てみると」=这样看来（总结）", "「最後の結論から」不通"]}, {"id": "rd23", "src": "2017.12 #54", "sec": "读解·完形", "p": "p17Lc", "q": "（ 54 ）に入れるのに最もよいものはどれか。", "o": ["難しそうです", "難しいからです", "難しくなってきたらしいです", "難しくなってしまうためです"], "a": 0, "pick": 3, "e": "「人間は、翼をつけただけでは飛ぶのは難しそうです」＝根据前面说明得出的判断（样态）。「からです／ためです」要有主句，不通；「なってきた」时间变化也不对。", "blank": "54", "wx": ["✔ 「難しそうです」=根据前面的说明判断“看起来很难”", "「難しいからです」=理由句，缺少前面的主句", "你选的「難しくなってきたらしい」=变得越来越难，没有时间变化", "「難しくなってしまうため」=因为变难，前后不通"]}, {"id": "rd24", "src": "2017.12 #56", "sec": "读解", "p": "p17L_sakubun", "q": "お手本のようなものによって、作文はどのようになる可能性があるか。", "o": ["誰からも高い評価を得られやすくなる。", "文章の形式にこだわりすぎたものになる。", "自分の視点や主張がわかりやすくなる。", "自分にしか書けないことが書けなくなる。"], "a": 3, "pick": 3, "e": "「マニュアルには、あなたにしか書けないことをすべて否定してしまうことにつながる可能性がある」。", "wx": ["“容易得到高评价”文中没有", "“过于拘泥形式”：文中说形式没问题，内容才是问题", "“视角更易懂”，反了", "✔ 「あなたにしか書けないことをすべて否定してしまう」"]}, {"id": "rd25", "src": "2017.12 #63", "sec": "读解", "p": "p17L_kirai", "q": "嫌いな人と話すことについて、筆者はどのように述べているか。", "o": ["話してみると、自身とは違う見方や発見を得られる。", "話す機会が増えるにつれて、だんだん考え方が似てくる。", "好き嫌いの感情を持つのは当然なので、積極的に話す必要はない。", "自身の考え方の間違いを指摘してくれるので、話したほうがいい。"], "a": 0, "pick": 4, "e": "「自分とは違う発想をしているわけで、じっくり話を聞いてみると、面白い見方、魅力ある発見を教えてくれることがある」＝1。“間違いを指摘”は書かれていない。", "wx": ["✔ 「違う発想→面白い見方、魅力ある発見」", "“想法会变得相似”文中没有", "筆者鼓励“要听”，并不是“不用特意说”", "“指出自己错误”没有说"]}, {"id": "rd26", "src": "2017.12 #65", "sec": "读解", "p": "p17L_kirai", "q": "筆者の言いたいことは何か。", "o": ["謙虚な態度でつきあっていれば、相手から尊敬されるようになる。", "相手から信頼されるには好き嫌いの感情を素直に表すことが必要だ。", "初対面のときは相手に好き嫌いの感情を持たないほうがいい。", "初対面のときの感情を大切にしなければ、相手といい関係を築けない。"], "a": 2, "pick": 1, "e": "「初めての人に会ったときは好き嫌いの感情を抜きにすること」が主張。尊敬するのは“自分が相手を”尊敬するようになる（1は主体が逆）。", "wx": ["你选的：主体反了，是“自己尊敬对方”，不是“被尊敬”", "“好恶を素直に出す”正是应避免的", "✔ 「初めての人に会ったときは好き嫌いの感情を抜きにする」", "“初印象を大切に”与主旨相反"]}, {"id": "rd27", "src": "2017.12 #68", "sec": "读解", "p": "p17L_enpitsu", "q": "水性絵の具で色をぬった後に、鉛筆の下書きが消せないのはなぜか。", "o": ["黒鉛が細かくくだかれていて取り除けないから", "絵の具で黒鉛が紙の表面にくっついたから", "水によって黒鉛が紙にしみ込んだから", "黒鉛が油分と同じ働きをしていたから"], "a": 2, "pick": 4, "e": "「水性絵の具を溶かすのに使う水のせい。この水が色鉛筆の芯の油分と同じ役割を果たす（＝紙にしみ込ませる）」。油分と同じ働きをしたのは“水”であって黒鉛ではない（4是主语搞错）。", "wx": ["“黑铅被磨细”是橡皮擦的情况，不是原因", "“颜料让黑铅附着在表面”文中没有", "✔ 水が（油分と同じように）黒鉛を紙にしみ込ませる", "你选的：“油分と同じ役割をした”的是水，不是黑铅"]}, {"id": "rd28", "src": "2017.12 #70", "sec": "读解", "p": "p17L_homeru", "q": "ほめることで子どもはどのようになると、AとBは述べているか。", "o": ["AもBも、親の愛情を感じるようになると述べている。", "AもBも、努力の大切さを理解できるようになると述べている。", "Aは自信を持つようになると述べ、Bはほめられたことを続けようとすると述べている。", "Aはすなおに親の言うことを受け入れるようになると述べ、Bは積極的に物事に取り組むようになると述べている。"], "a": 2, "pick": 2, "e": "A「ほめられたことをそのまま受け入れ、行動や態度に自信を持つことができる」；B「ほめられたことは続けていこうと思うものだ」＝3。", "wx": ["“感受到亲情”两篇都没提", "“努力的重要”两篇都没提", "✔ A自信、B继续被夸过的事", "A后半对，B“积极地做事”文中没有，B说的是“想继续被夸的事”"]}, {"id": "rd29", "src": "2017.12 #71", "sec": "读解", "p": "p17L_konnan", "q": "困難がまったくない状態について、筆者はどう述べているか。", "o": ["短期間であっても、生活に飽きてしまうだろう。", "短期間であれば、嫌なことも嫌でなくなるだろう。", "長く続くと、退屈な生活に耐えられなくなるだろう。", "長く続くと、欲しいものが何なのかわからなくなるだろう。"], "a": 2, "pick": 4, "e": "「短期間ならわるくないかもしれません。しかし、来る日も来る日もそうだったら、退屈して、やがて耐えられなくなる」＝3。", "wx": ["短期可以接受，“飽きる”是长期的", "“短期嫌なことも嫌でなくなる”无依据", "✔ 長く続くと退屈して耐えられなくなる", "“不知道想要什么”文中没有"]}, {"id": "rd30", "src": "2018.7 #51", "sec": "读解·完形", "p": "p18c", "q": "（ 51 ）に入れるのに最もよいものはどれか。", "o": ["ご存じだ", "ご存じのように", "ご存じだろうか", "ご存じなのだろう"], "a": 2, "pick": 2, "e": "「〜ことは（ご存じだろうか）。〜という仕組みだ」＝向读者提问→再解释。「ご存じのように」后面要接句子，但这里「ことは」后面已经没有接续了；「ご存じだ/なのだろう」不能对读者这样说。", "blank": "51", "wx": ["「ご存じだ」是断定，用在读者身上不自然", "你选的「ご存じのように」后面要接内容，这里“ことは”之后已经结束，句子接不上", "✔ 「ことは、ご存じだろうか。」=反问读者，引出下文说明", "「ご存じなのだろう」=推测别人知道，不能用来对读者发问"]}, {"id": "rd31", "src": "2018.7 #53", "sec": "读解·完形", "p": "p18c", "q": "（ 53 ）に入れるのに最もよいものはどれか。", "o": ["工夫だと言える", "工夫も考えられる", "工夫だと思われる", "工夫も見られる"], "a": 3, "pick": 2, "e": "这一段是第三个例子，“…工夫“も”見られる”＝还可以看到这样的设计（「も」承接前两例）。「考えられる」是“可以想到”，而后文说的是已实际使用的技术（「抑えている」）。", "blank": "53", "wx": ["「工夫だと言える」多用于总结论点", "你选的「工夫も考えられる」=也可以想到这样的设计，但下文讲的是已经实际使用的技术", "「思われる」同上，偏主观推测", "✔ 「工夫も見られる」=还能看到这样的设计（第三个例子）"]}, {"id": "rd32", "src": "2018.7 #55", "sec": "读解", "p": "p18_mail", "q": "見積書について、このメールで依頼していることは何か。", "o": ["料金が上がってもいいので、出発日を変更してほしい。", "料金を上げずに、出発日を変更してほしい。", "宿泊先は変わってもいいので、出発日と日数を変更してほしい。", "宿泊先は変えずに、出発日と日数を変更してほしい。"], "a": 1, "pick": 1, "e": "「料金は今回の見積書の金額を超えないように」「ホテルは変更になってもかまわない」「同じ1泊2日」→出发日变，价格不超，日数不变。", "wx": ["“料金は超えないように”，不能涨价", "✔ 料金不超、日期改、日数同样1泊2日", "“日数も変更”不对，仍是1泊2日", "“宿泊先は変えずに”不对，酒店可以变"]}, {"id": "rd33", "src": "2018.7 #57", "sec": "读解", "p": "p18_koudou", "q": "筆者の考えに合うのはどれか。", "o": ["行動を止めずに考えつづけることで、思考はより加速する。", "行動を止めて、深く思考することも必要だ。", "変化する状況の中で、行動を加速することが大切だ。", "考えつづけていれば、さらに勇気が持てるようになる。"], "a": 0, "pick": 4, "e": "「行動を止めてまで考えるのは避けよう。行動はむしろ思考を加速させる」＝1。勇気が要るとは言っているが、勇気が持てるようになるとは言っていない（4）。", "wx": ["✔ 「行動はむしろ思考を加速させる」", "“停下来深入思考”被筆者否定", "“加速行动”不是重点，加速的是“思考”", "“有勇气”只是实践时需要的，并非结果"]}, {"id": "rd34", "src": "2018.7 #60", "sec": "读解", "p": "p18_gokai", "q": "大学の先生の例を挙げて、筆者が述べていることは何か。", "o": ["職業の一般的なイメージは実態と合っている。", "周囲と違うイメージを持つと誤解が生まれる。", "思い込みから誤解が生まれる。", "誰でも誤解をしてしまうことがある。"], "a": 2, "pick": 1, "e": "例を出した直後「私たちはどうしても先入観（思い込み）を持ってしまうため、それが誤解を生む原因になる」。", "wx": ["“职业形象与实际相符”：文中说“也有不是的人”", "“与周围不同的形象会产生误解”文中没有", "✔ 「先入観（思い込み）が誤解を生む原因」", "你选的：“谁都会误解”太笼统，举大学老师的例子是为了说明“先入观”"]}, {"id": "rd35", "src": "2018.7 #62", "sec": "读解", "p": "p18_gokai", "q": "筆者によると、誤解のよい点はどのようなことか。", "o": ["いろいろな考え方が生まれることになる。", "自分の考えの誤りに気付くことができる。", "人に対する間違った見方が考えられる。", "多様な考えを自然に受け入れられるようになる。"], "a": 0, "pick": 3, "e": "「誤解によって人々の考えに自然に多様性が生まれる」＝1。4は“受け入れられるようになる”で、人々の考えの多様性とは主体が違う。", "wx": ["✔ 「人々の考えに自然に多様性が生まれる」", "“发现自己的错”没有", "“有错误的看法”不是优点", "你选的：“能接受多样想法”主体不对，原文是“考えに多様性が生まれる”"]}, {"id": "rd36", "src": "2018.7 #70", "sec": "读解", "p": "p18_uta", "q": "歌を上手に歌うために、AとBはどのようなことが必要だと述べているか。", "o": ["AもBも、歌手のまねをするような気持ちで歌うことだと述べている。", "AもBも、歌の強調したいところを意識して歌うことだと述べている。", "Aは歌を正確に覚えてから歌うことだと述べ、Bは気持ちを伝えるように歌うことだと述べている。", "Aは自分らしく歌おうとしないことだと述べ、Bは自信を持って歌うことだと述べている。"], "a": 2, "pick": 2, "e": "A＝歌詞と曲をしっかり正確に覚えてから歌う；B＝歌手のまねではなく、歌う人の気持ちが伝わる歌。1はBが否定している。", "wx": ["B否定“模仿歌手”", "“强调的地方”只有B提到", "✔ A=正确记住再唱，B=传达感情", "A“不要自分らしく”对，但B说的是“传达心情”，不是“有自信”"]}, {"id": "rd37", "src": "2018.7 #73", "sec": "读解", "p": "p18_hyouka", "q": "筆者によると、会社内で高く評価されるにはどうすればいいか。", "o": ["評価の高い同僚をよく観察し、その行動をまねる。", "評価の高い同僚と比べて、自分がすべきことを考える。", "同僚とは比べず、自分の得意分野で高い成果を出す。", "同僚と比べて自分に何が足りないのかを上司から教えてもらう。"], "a": 1, "pick": 4, "e": "最終段落「上司の視点で自分と比べてみる。『自分に足りないもの』『何をすべきか』が見えてくる」＝自分で比べて考える。上司に教えてもらう（4）とは言っていない。", "wx": ["“观察、模仿”文中没有", "✔ 与同事比较，思考“自己缺什么/该做什么”", "“不比较”与主旨相反", "你选的：不是“让上司教”，而是“站在上司的视角自己比”"]}, {"id": "rd38", "src": "2019.7 #53", "sec": "读解", "p": "p19_hyou", "q": "筆者によると、データ分析の力をつけるにはどうすればいいか。", "o": ["特徴がみつけやすいので、先に表をみるようにしたほうがいい。", "思い込みが避けられるので、先に表をみるようにしたほうがいい。", "思い込みに気づきやすいので、先にグラフをみるようにしたほうがいい。", "意味のある特徴がみつけられるので、先にグラフをみるようにしたほうがいい。"], "a": 1, "pick": 4, "e": "グラフは特徴が見つけやすい反面、先入観・錯覚を生みやすい。だから「まずは、特徴を見つけにくい表」を見る。表のほうが特徴を見つけにくい（1は逆）。", "wx": ["“表更容易发现特征”错了，表更难发现", "✔ 先看表：避免先入观、错觉", "“先看图”会产生先入观", "你选的：“先看图能发现有意义的特征”，筆者说图会带来错觉，所以要先看表"]}, {"id": "rd39", "src": "2019.7 #56", "sec": "读解", "p": "p19_mail", "q": "このメールで最も伝えたいことは何か。", "o": ["「8QPS1」の納品日が今月中旬になること", "「8QPS1」の納品が可能かどうかを今月中旬に知らせること", "「8QPS1」を指定の納品日に納品できないこと", "「8QPS1」が予想以上に売れていて、注文を受
